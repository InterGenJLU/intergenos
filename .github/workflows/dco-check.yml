#
# DCO enforcement: every commit on a pull request must carry a
# Signed-off-by: trailer (Developer Certificate of Origin, see DCO.md).
# Decided 2026-07-18: the contributing guide documented this gate before
# it existed — the gate now matches the documentation.
name: DCO Check

on:
  pull_request:
    branches: [master, dev]

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by on every PR commit
        run: |
          set -euo pipefail
          RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          MISSING=0
          while read -r sha; do
            if ! git log -1 --format='%(trailers:key=Signed-off-by,only,valueonly)' "$sha" | grep -q '.'; then
              echo "MISSING Signed-off-by: $(git log -1 --oneline "$sha")"
              MISSING=1
            fi
          done < <(git rev-list --no-merges "$RANGE")
          if [ "$MISSING" -ne 0 ]; then
            echo
            echo "One or more commits lack a Signed-off-by: trailer."
            echo "Amend with: git commit --amend -s (or git rebase --signoff), then force-push."
            echo "See DCO.md for what the trailer certifies."
            exit 1
          fi
          echo "DCO check passed: all commits carry Signed-off-by."
