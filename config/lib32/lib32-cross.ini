#
# config/lib32/lib32-cross.ini — THE lib32 build profile (G2), as a meson
# CROSS FILE plus a pinned per-tool binary map (RT-7, GE gate-tooling).
#
# WHY a cross file and not env vars: PKG_CONFIG_LIBDIR/CC="-m32" env
# profiles govern pkg-config consumers only — llvm-config, sdl2-config,
# krb5-config, and CMake find_library all ignore them and silently answer
# with the 64-bit world (the RT-7 leakage class). A meson cross file pins
# every tool the build may consult. The reference multilib distro (Arch)
# migrated lib32-mesa from a native-file/env approach to a true
# `--cross-file lib32` specifically because the RUST target cannot be
# retargeted any other way — and our lib32-mesa driver list includes NVK,
# which is Rust. Verified 2026-07-02 (ge-arc-onboarding.md §3.5).
#
# BINARY MAP CONTRACT: every config-tool a lib32 package's build system
# consults MUST be pinned here (or in the package's own cross-file
# fragment) to a 32-bit-answering binary. lib32-llvm is respec'd to ship
# /usr/bin/llvm-config32 (the 32-bit build interface: llvm-config, headers,
# cmake files — the Arch lib32-llvm packaging shape) alongside its runtime
# libs; a runtime-libs-only lib32-llvm would leave lib32-mesa's feature
# probes answering from the 64-bit llvm-config hours into the most
# expensive build (the RT-7 killer case).
#
# TIME64 (RT-8): -U_TIME_BITS scrubs any inherited definition; the
# archive-time build-log assertion (igos-build/time64audit.py) is the
# enforcement half. VERBOSE LOGGING is MANDATORY for every elf_class-32
# package (the F2-a re-cert finding): the log assertion REFUSES a log with
# no visible compile lines, so silent-rules/quiet-ninja builds fail the
# gate by design. Autotools recipes pass --disable-silent-rules (or V=1);
# meson builds run `ninja -v` (the builder's lib32 path enforces this when
# the multilib build phase lands).
#
# This file is the DESIGN ARTIFACT for the multilib build phase — no lib32
# package exists yet; the first one builds against exactly this profile.
# Fields below are pinned where verified today; entries marked AUTHORING
# are derived at multilib-phase recipe authoring (research-first applies).

[binaries]
c = ['gcc', '-m32', '-U_TIME_BITS']
cpp = ['g++', '-m32', '-U_TIME_BITS']
ar = 'ar'
strip = 'strip'
nasm = 'nasm'
# Rust: the NVK forcing function — must be a genuine cross target.
rust = ['rustc', '--target', 'i686-unknown-linux-gnu']
# pkg-config isolation: pkgconf's upstream personality mechanism — the
# core/pkgconf package ships /usr/bin/i686-igos-linux-gnu-pkg-config (a
# pkgconf symlink) + the i686-igos-linux-gnu.personality file pinning
# DefaultSearchPaths to /usr/lib32/pkgconfig:/usr/share/pkgconfig, so this
# tool answers EXCLUSIVELY from the 32-bit world — never the bare host
# pkg-config. (Landed with the Wave-2 infra; kept in lockstep with
# scripts/lib32-env.sh's PKG_CONFIG_LIBDIR.)
pkg-config = 'i686-igos-linux-gnu-pkg-config'
# The 32-bit LLVM build interface (lib32-llvm respec — see header).
llvm-config = '/usr/bin/llvm-config32'
# AUTHORING: add per-tool pins as lib32 packages introduce config-tool
# consumers (sdl2-config, krb5-config, cups-config, ...). A lib32 package
# whose build consults an UNPINNED config tool is a recipe defect — the
# tool answers 64-bit and the ELF-class audit catches the result at
# archive time, but the pin here is what makes the build CORRECT rather
# than merely caught.

[built-in options]
libdir = 'lib32'
prefix = '/usr'
c_args = ['-m32', '-U_TIME_BITS']
c_link_args = ['-m32']
cpp_args = ['-m32', '-U_TIME_BITS']
cpp_link_args = ['-m32']

[properties]
# CMake consumers resolve through the toolchain-file TWIN of this profile:
# config/lib32/lib32-cmake-toolchain.cmake (landed with lib32-llvm, the
# first lib32 cmake package). Keep the two files in LOCKSTEP — compilers,
# -m32 -U_TIME_BITS, i686 identity, the pkg-config personality, and the
# llvm-config32 pin are defined in both, once per build system.
#
# MESON'S CMAKE DEPENDENCY-FALLBACK IS FAIL-CLOSED BY OMISSION (verified
# GE-01 L14, meson-log: "CMake binary missing from cross or native file
# ... Default target is not allowed for cross use" -> Found CMake: NO):
# in cross mode meson REFUSES to run a default cmake for dependency()
# fallbacks unless `cmake` is pinned in [binaries] — so every fallback
# probe misses, which is the safe posture. Do NOT "helpfully" pin cmake
# in [binaries]; if a future twin genuinely needs the fallback, pin
# cmake AND keep the toolchain property below so the fallback resolves
# 32-bit instead of native. (The actual L14 leak was NOT this path — it
# was builder.py exporting the 64-bit PKG_CONFIG_LIBDIR, which pkgconf
# lets OVERRIDE the personality's DefaultSearchPaths; fixed width-aware
# in builder.py the same cycle.)
cmake_toolchain_file = '/mnt/intergenos/config/lib32/lib32-cmake-toolchain.cmake'
#
# BINDGEN TARGETS THE 32-BIT ABI (GE-01 L19): meson's rust.bindgen()
# module runs the rust-bindgen host tool with clang args that do NOT
# inherit the cross [binaries]/c_args — without this property NVK's
# generated bindings asserted 64-bit struct layouts (_IO_FILE 216 vs the
# 32-bit 120; pointers 8 vs 4) and libcompiler.rlib died at E0080
# compile-time layout assertions. bindgen_clang_arguments is the
# documented cross-file knob for exactly this. Third member of the
# in-cross-file tool-isolation closure: pkg-config personality + cmake
# toolchain property + THIS.
bindgen_clang_arguments = ['-m32', '-U_TIME_BITS']

[host_machine]
system = 'linux'
cpu_family = 'x86'
cpu = 'i686'
endian = 'little'
