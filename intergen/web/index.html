<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050810">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>InterGen — AI Assistant</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <!-- ── Header Bar ── -->
  <header id="header">
    <div id="header-left">
      <button id="sidebar-toggle" class="icon-btn" title="Sessions">☰</button>
    </div>
    <div id="header-hud">
      <span id="hud-model" class="hud-stat"><span class="hud-label">model</span><span class="hud-value">--</span></span>
      <span id="hud-tier" class="hud-stat"><span class="hud-label">tier</span><span class="hud-value">--</span></span>
      <span id="hud-context" class="hud-stat"><span class="hud-label">ctx</span><span class="hud-value">--</span></span>
      <span id="hud-uptime" class="hud-stat"><span class="hud-label">up</span><span class="hud-value">--</span></span>
      <span id="connection-status" class="hud-dot" title="Disconnected">●</span>
    </div>
    <div id="header-right">
      <button id="btn-governance" class="icon-btn" title="Governance dashboard">⚖</button>
      <button id="btn-metrics" class="icon-btn" title="Performance metrics">📊</button>
      <button id="btn-health" class="icon-btn" title="System health">🫀</button>
      <button id="btn-escalation" class="icon-btn" title="Escalation configuration settings">📞</button>
    </div>
  </header>

  <!-- ── Main Layout ── -->
  <div id="main-container">
    <!-- ── Session Sidebar ── -->
    <aside id="sidebar">
      <div id="sidebar-header">
        <span id="sidebar-title">Sessions</span>
        <button id="btn-new-session" class="icon-btn" title="New session">+</button>
      </div>
      <div id="session-list"></div>
    </aside>

    <!-- Drag handle: adjust the sidebar width (double-click to reset) -->
    <div id="sidebar-resizer" title="Drag to resize · double-click to reset"></div>

    <!-- ── Chat Area ── -->
    <main id="chat">
      <div id="messages"></div>
      <div id="streaming-container" class="hidden">
        <div class="message assistant">
          <span class="sender">InterGen</span>
          <div id="streaming-content" class="content"></div>
          <span class="streaming-cursor">█</span>
        </div>
      </div>
      <div id="thinking-indicator" class="hidden">
        <span class="thinking-pulse" aria-hidden="true">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </span>
        <span class="thinking-text">InterGen is thinking…</span>
      </div>
    </main>
  </div>

  <!-- ── Input Area ── -->
  <footer id="input-area">
    <div id="input-toolbar">
      <button id="btn-paste" class="icon-btn" title="Paste text">📋</button>
      <button id="btn-file" class="icon-btn" title="Load file">📄</button>
      <input type="file" id="file-input" style="display:none">
      <button id="btn-image" class="icon-btn" title="Attach image for vision analysis">🖼</button>
      <input type="file" id="image-input" accept="image/*" style="display:none">
      <button id="btn-screenshot" class="icon-btn" title="Take screenshot">📸</button>
      <span id="buffer-indicator" class="hidden">📎 <span id="buffer-tokens">0</span> tokens</span>
      <span id="image-indicator" class="hidden" style="margin-left:4px">🖼 <span id="image-name"></span> <button id="image-clear" class="icon-btn" style="font-size:12px;padding:0 4px">✕</button></span>
    </div>
    <div id="input-row">
      <textarea id="user-input" placeholder="Ask InterGen..." rows="1"></textarea>
      <button id="btn-send" class="primary-btn" title="Send message" aria-label="Send message" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9 Z"/></svg></button>
    </div>
    <!-- The model attribution the payload license requires. The server
         replaces the comment below with the rendered line, and leaves it a
         comment when no attribution is owed. -->
    <div id="model-attribution"><!--INTERGEN_ATTRIBUTION--></div>
  </footer>

  <!-- ── Modals ── -->
  <div id="modal-overlay" class="hidden">
    <div id="modal-box">
      <div id="modal-header">
        <span id="modal-title"></span>
        <button id="modal-close" class="icon-btn">✕</button>
      </div>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- ── Announcement Banners ── -->
  <div id="banner-container"></div>

  <script src="app.js?v=2"></script>
</body>
</html>
