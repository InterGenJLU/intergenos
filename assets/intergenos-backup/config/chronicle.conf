# chronicle.conf — Chronicle backup configuration (see chronicle.conf(5)).
#
# This is user-tunable POLICY. Runtime state the engine owns (the monotonic
# sequence, the adopted target details, the pin set) lives in
# /var/lib/chronicle/state.json, NOT here.
#
# Every key below is OPTIONAL: an absent or partial file yields a usable
# default policy, and a malformed value for one key falls back to that key's
# default without aborting the engine. All keys live under the [chronicle]
# section. The values shown are the built-in defaults; edit and uncomment to
# override.

[chronicle]

# -- Working hours / off-peak window (spec §5) ------------------------------
# Large captures are deferred out of working hours; off-peak is the complement
# of [work_start, work_end). An overnight working span (start > end) is
# supported. HH:MM, 24-hour.
#work_start = 09:00
#work_end = 18:00

# -- Off-peak deferral threshold (spec §5) ----------------------------------
# A capture whose estimated change size exceeds the SMALLER of an absolute
# floor and a fraction of target free space is held for the off-peak window;
# smaller changes capture immediately.
#size_floor_bytes = 1073741824      # ~1 GiB
#free_fraction = 0.05               # ~5% of target free space

# -- Target volume (spec §4, addendum) --------------------------------------
# The engine adopts a target interactively (chronicle target ...); these keys
# pin a preference. Use EITHER a whole-volume device OR a size-capped
# directory on an existing POSIX volume (the directory class), not both.
#target_device = /dev/disk/by-uuid/XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX
#target_directory = /mnt/backup
#target_size_cap_bytes = 274877906944   # cap for the directory class (~256 GiB)

# -- Target encryption (spec §9) --------------------------------------------
# Recommend a LUKS2 container on the target so a lost/stolen backup drive is
# not a data breach. Set false only for an already-trusted volume.
#target_encryption = true

# -- User-data scope + excludes (spec §2.1) ---------------------------------
# Comma-separated. Excludes are fnmatch globs; caches and trash are excluded
# by default (they are reproducible churn, not user data worth versioning).
#user_data_paths = /home
#exclude_globs = */.cache/*, */.local/share/Trash/*, */.thumbnails/*
