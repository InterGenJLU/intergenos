# InterGenOS — the Chronicle backup engine's access group.
#
# `chronicle` is an ACCESS group, not a service account: nothing runs as it and
# it owns no files. It decides one thing — who may open the engine socket
# /run/chronicle/engine.sock, which the engine creates root:chronicle mode 0660.
#
# It is the floor under Chronicle's two polkit actions. Polkit answers "may this
# user do this thing", and it can only answer that after the caller has already
# connected; the group answers "may this process reach the daemon at all", in
# the kernel, before a byte is read. Until 2026-08-04 the socket was mode 0666
# and every local process could connect, which meant any of them could also make
# an administrator password dialog appear in the logged-in session at will.
#
# Membership is granted in two places, both at account-creation time:
#   * the installer, for the account it creates (installer/backend/users.py)
#   * the live image's user, at image build time (scripts/create-image.sh)
#
# The id is unpinned. Nothing is chowned to this group at build time and the
# engine resolves it by name at runtime, so there is nothing a fixed number
# would protect — and an unpinned id cannot collide with a future systemd or
# BLFS assignment.
#
# Type Name        ID  GECOS
g  chronicle   -   -
