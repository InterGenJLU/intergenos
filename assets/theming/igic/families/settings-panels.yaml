# Family manifest — GNOME Settings panel icons (ICON_CATEGORIES.md §5 + §6.2 + §11). 44 foreground
# symbolics; each `stem` = the exact reverse-DNS GTK name. `badges` = corner-anchored marks; occlusion
# is the badge DEFAULT (§11.7); the `sil` footprint (clip-path) clears the base under the whole badge
# so nothing reads through (§11.8). Decided 2026-07-14.
schema_version: 1
family: settings-panels
category: apps
kind: symbolic
template: none
glow: none
pulse: none
export:
  svg: true
  png: [16, 24, 32, 48]
