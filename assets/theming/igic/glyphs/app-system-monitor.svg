<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- System Monitor (org.gnome.SystemMonitor) — a monitor panel with a live
       activity graph. Per VISUAL_LANGUAGE §8 the system monitor "may use a
       pulse as its primary shape"; drawn as a MULTI-peak activity trace (a data
       graph, not the single asymmetric brand spike — so it never reads as the
       InterGen mark) over a baseline axis. -->
  <g class="glyph">
    <rect x="42" y="54" width="172" height="148" rx="16"/>
    <polyline points="66,164 66,92"/>
    <polyline points="66,168 190,168"/>
    <polyline points="72,150 92,150 106,118 122,158 138,96 156,140 176,120 192,120"/>
  </g>
</svg>
