<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- states base: battery-gauge — the runtime battery-level family (GNOME Shell top-bar
       PRIMARY; ICON_CATEGORIES §6.3.2). Same body + terminal nub as battery-body (always-on),
       but a PROPORTIONAL fill <g class="gauge"> (one reference rect = the 100% fill; the
       generator scales its width by the state's level 0..100 -> the decile gauge) instead of
       the discrete 4-segment ladder, since the runtime family is 11 deciles. Three overlays:
       a charging bolt (accent), a full-charged check (accent), and a NEW plugged-in plug
       (accent) — the PENDING_CHARGE / charge-threshold state. No slash (missing is not a
       runtime level state). -->
  <g class="glyph">
    <rect x="60" y="100" width="124" height="56" rx="8"/>
    <rect x="184" y="116" width="12" height="24" rx="3"/>
    <g class="gauge">
      <rect x="72" y="110" width="100" height="36" rx="4"/>
    </g>
    <g class="overlay bolt accent">
      <!-- R5-6: the old squiggle retired corpus-wide -> the canonical R5-2 power symbol,
           FILLED (a small embedded overlay; an outline closes at status sizes). R7-1 re-derived to the example (7 vertices, both-side notches incl. the mid-left concave cut-in). Box (108,101,40,54). -->
      <g class="fill"><path d="M 122.3 101.0 L 147.6 101.0 L 133.6 118.7 L 146.8 120.7 L 111.0 155.0 L 121.0 132.5 L 108.1 130.6 Z"/></g>
    </g>
    <g class="overlay check accent">
      <path d="M 112 128 L 122 140 L 144 112"/>
    </g>
    <g class="overlay plug accent" stroke-width="0.9">
      <path d="M 60 128 L 110 128"/>
      <g class="fill"><rect x="110" y="114" width="28" height="28" rx="3"/></g>
      <path d="M 138 122 L 156 122"/>
      <path d="M 138 134 L 156 134"/>
    </g>
  </g>
</svg>
