<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Disks (org.gnome.DiskUtility) — matches the drive-harddisk device glyph (device-drive):
       a clean top-down HDD, portrait — rounded-rect chassis, two-circle platter (outer ring +
       spindle), actuator arm from a lower-left pivot. Same geometry as the device mark; the
       app-mark presentation (intergen-blue line-forward + signature glow) comes from the
       core-gnome-apps family manifest. Absolute coords (canvas-bound gate). -->
  <g class="glyph">
    <rect x="74" y="57" width="108" height="142" rx="12"/>
    <circle cx="128" cy="109" r="44"/>
    <circle cx="128" cy="109" r="4"/>
    <circle cx="94" cy="167" r="5"/>
    <path d="M 94 167 L 142 123"/>
  </g>
</svg>
