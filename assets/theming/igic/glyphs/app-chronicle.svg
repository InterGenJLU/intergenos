<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Chronicle (intergenos-backup) — a stopwatch inside a broken rewind ring:
       two counter-clockwise arcs, each ending in a solid arrowhead (down at the
       west end, up at the east end). Rewind/restore-through-time semantics; the
       arcs double as the stopwatch case rim, which is why the ring is drawn
       broken rather than as a separate circle.
       PROPORTIONS ARE MEASURED FROM THE SOURCE CONCEPT, not eyeballed: the
       concept's ring (centre 440.5,485.5 r 296.5 in its own 891 px canvas)
       scales to r 68 here by 0.2294, and every element below is that scale
       applied to its measured counterpart — crown stem 13 wide, cap 31x13,
       case buttons 19 wide spanning r 68-84 at 57.5 and 122.5 deg, arrowheads
       26 wide x 28 long, hand 40 long at 66 deg, pivot r 7. The heads are
       SWEPT-BACK (a notch at the base centre, wings pulled behind it) rather
       than flat-based: at the detailed stroke a flat base flares 5x the line
       width in one step and reads as a slab pasted onto the ring — the notch
       lets the arc flow into the head at both stroke weights.
       Crown stem and buttons ROOT ON THE ARC ITSELF (r 68, the rim centre line)
       and grow outward only — no part of either enters the dial face at EITHER
       stroke weight, which the arc centre line is the only radius to guarantee:
       the rim's inner edge is 65.5 at the detailed stroke and 60 at the simple
       one, so any root inside 68 clears one variant and not the other. Rooting on
       the centre line still buries the inner end 2.5 units inside the detailed
       band, so the join carries no seam. This is where the source concept roots
       them (measured: its buttons and stem both start at r 271 against a rim band
       of 271-322 — on the band, never through it into the face).
       BOTH arcs are segments of ONE circle: centre (128,136), r 68. Each arc
       runs past its head's base line so the stroke terminates INSIDE the solid
       triangle — a stroke ending flush on the base leaves an anti-alias seam
       that reads as a break in the ring at large sizes.
       Dial ticks are omitted: the concept draws them at 0.35x its rim weight,
       and a single-weight language has no thinner stroke to draw them with; at
       the <=48 simple variant (6% stroke) they fuse with the rim and the hand.
       Distinct from `clock` / `app-clocks` (plain dial + two hands, no ring, no
       crown) and from `rotate-allowed` (chevron heads, device slab). -->
  <g class="glyph">
    <path d="M 183.70 96.99 A 68 68 0 0 0 60.37 143.11"/>
    <path d="M 75.90 179.70 A 68 68 0 0 0 195.63 128.89"/>
    <line x1="128" y1="136" x2="144.30" y2="99.50"/>
    <line x1="128" y1="136" x2="119.70" y2="150.90"/>
  </g>
  <g class="fill">
    <rect x="121.5" y="55" width="13" height="13"/>
    <rect x="112.5" y="42" width="31" height="13" rx="5"/>
    <path d="M 156.53 73.55 L 165.12 60.06 L 181.14 70.26 L 172.55 83.75 Z"/>
    <path d="M 99.47 73.55 L 90.88 60.06 L 74.86 70.26 L 83.45 83.75 Z"/>
    <path d="M 60 162 L 47 134 L 60 142 L 73 134 Z"/>
    <path d="M 196 110 L 209 138 L 196 130 L 183 138 Z"/>
    <circle cx="128" cy="136" r="7"/>
  </g>
</svg>
