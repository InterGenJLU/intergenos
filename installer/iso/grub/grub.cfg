# InterGenOS ISO — ESP-side grub.cfg
#
# Loaded by the standalone signed GRUB binary (packages/core/grub/embedded-grub.cfg)
# after it self-locates the ESP via $cmdpath (the device it was booted from).
# This is the user-facing 3-entry menu.
#
# Path on ESP: /EFI/InterGenOS/grub.cfg
# Companion UKIs (all signed by InterGenOS CA, all on the ESP):
#   /EFI/InterGenOS/igos-live.efi         — live GNOME desktop
#   /EFI/InterGenOS/igos-install-gui.efi  — Forge GUI installer
#   /EFI/InterGenOS/igos-install-tui.efi  — Forge TUI declarative-builder
#
# Each menu entry chainloads the appropriate UKI. The boot-mode is encoded
# in each UKI's sealed `.cmdline` section (igos.mode=...), NOT in this
# grub.cfg — so an attacker editing this config cannot switch a user from
# `live` to `install-tui` or otherwise alter boot behavior. The UKI
# signature covers the cmdline.

# Set $root to the ESP so absolute paths in this config resolve correctly.
# Self-locate via $cmdpath (the device this grub binary was loaded from),
# matching embedded-grub.cfg — NOT a `search --label IGOS_ESP`, which RACES
# between the live-ISO ESP and a previously-installed InterGenOS ESP (both
# labeled IGOS_ESP) when an install USB boots a machine that already has
# InterGenOS installed. $cmdpath is preserved across `configfile`, so the
# same device-binding the embedded config used is available here. Falls back
# to the label search only if $cmdpath is unset (firmware that doesn't
# populate it); single-medium boots are unaffected either way.
# Capture the bare device (e.g. hd0,gpt2) WITHOUT parens, matching what
# `search --set=root` produces, so bare-`/path` resolution works.
if ! regexp -s root '^\((.*)\)' "$cmdpath"; then
    search --no-floppy --label IGOS_ESP --set=root
fi
# VALIDATE the $cmdpath-derived $root: it must actually carry our EFI tree.
# Some firmware (e.g. VirtualBox EFI booting the El-Torito image) sets $cmdpath
# to the ISO9660 optical device (cd0), which holds /live but NO /EFI — trusting
# it blindly makes EVERY absolute /EFI/InterGenOS/* path fail: both the
# chainloader (UKI "not found") AND `loadfont` (so gfxterm never engages and the
# menu degrades to the unthemed text console). When $root doesn't hold our tree,
# re-locate by a file UNIQUE to LIVE media: igos-live.efi exists ONLY on the live
# ISO's ESP — an installed system's ESP carries EFI/Linux/intergenos-<kver>.efi,
# never igos-live.efi — so `search --file` is race-free vs the IGOS_ESP-label
# collision (live-ISO ESP vs already-installed ESP) the $cmdpath design avoids.
# search_fs_file + regexp are baked into the standalone binary
# (scripts/build-grub-standalone.sh:80,97). A last-resort label search remains.
if [ ! -e ($root)/EFI/InterGenOS/igos-live.efi ]; then
    search --no-floppy --file /EFI/InterGenOS/igos-live.efi --set=root
fi
if [ ! -e ($root)/EFI/InterGenOS/igos-live.efi ]; then
    search --no-floppy --label IGOS_ESP --set=root
fi

# Menu timeout. 2 seconds was shorter than the hardware needs: USB keyboards
# on the machines evaluated take about 3.8 seconds from power-on to being able
# to deliver a keystroke, so the menu had already timed out and booted the
# default before the user's first key could register — they could not choose a
# boot entry at all. 10 seconds leaves roughly 6 seconds of usable interaction
# after the keyboard comes up, and matches GRUB_TIMEOUT=10, the value the
# installer writes for installed systems (installer/backend/config.py), so the
# live medium and the installed system behave the same way.
#
# This value is outside the signature chain and changing it cannot alter what
# boots or what is verified: each menu entry chainloads a UKI whose boot mode
# lives in its own sealed .cmdline section, covered by the UKI signature (see
# the header of this file). Only how long the menu waits changes.
set timeout=10
set default=0

# Theme + resolution-aware GRUB background scaffold (K1 closure 2026-05-21;
# operator-authored design). Ships via packages/desktop/intergenos-grub-theme/.
# Mirrors the installed-system pattern in /etc/grub.d/06_intergenos_multi_background.
if [ -e /EFI/InterGenOS/themes/intergenos/theme.txt ]; then
    set theme=/EFI/InterGenOS/themes/intergenos/theme.txt
fi

# Load gfx + font support for the theme (required for gfxmenu rendering).
# Belt-and-suspenders (2026-06-01): only switch to gfxterm if the font actually
# loads. If unicode.pf2 is ever missing, an unconditional `terminal_output
# gfxterm` activates gfxterm with no glyphs and renders the whole menu as
# missing-glyph "?"/"@" TOFU blocks (install attempt #21). Guarding it degrades
# gracefully to the readable text console instead. The font itself is now
# guaranteed present — grub's build produces unicode.pf2 (freetype-grub + unifont
# in Ch8) and the build HALTS if it doesn't — so this guard is a safety net.
#
# The font is read from the memdisk INSIDE this grub binary, not from the ESP
# (2026-08-20). GRUB opens fonts as GRUB_FILE_TYPE_FONT, and the built-in
# shim_lock verifier does not skip that type, so under Secure Boot every read of
# /EFI/InterGenOS/fonts/unicode.pf2 was refused with "prohibited by secure boot
# policy" on the boot console — once per boot — and the menu fell back to grub's
# built-in font. Memdisk reads are exempt from verification because the image
# holding them is itself verified, so this load is both silent and covered by
# the signature. scripts/build-grub-standalone.sh bakes the font in at this path
# and refuses to produce a binary without it. The ESP copy still ships; nothing
# in the boot path reads it any more.
if loadfont (memdisk)/fonts/unicode.pf2; then
    insmod gfxterm
    insmod png
    terminal_output gfxterm
fi

# Resolution-aware background_image fallback for the brief window mid-
# chainload where the gfxmenu theme unloads before the next-stage UKI
# takes over. The active menu's background is rendered via theme.txt's
# desktop-image directive (with desktop-image-scale-method=stretch);
# this background_image call only takes effect during the unload flash.
#
# Extends the installed-system pattern in
# /etc/grub.d/06_intergenos_multi_background (the two robustness fixes
# landed there 2026-05-26 install #18 first-boot are lifted here, plus
# explicit grub_background.png fallbacks at every path because the
# live-ISO has no equivalent of 05_debian_theme as a prior-fallback-
# provider — without these fallbacks the non-resolution-specific cases
# would leave no background image at all):
#
#   1. -m stretch matches the theme's desktop-image-scale-method, so the
#      unload-flash background renders at the negotiated gfxmode rather
#      than at the PNG's native resolution (avoids off-center flash).
#   2. $gfxmode can be set as "WxH" (e.g. 1366x768) or "WxHxC" (e.g.
#      1366x768x32) depending on firmware/driver path (vbe / efifb / gop).
#      The bare ${gfxmode}.png lookup misses on the WxHxC form because we
#      ship PNGs named WxH only. The regexp module extracts the WxH
#      prefix robustly across both forms (regexp added to the standalone
#      GRUB binary's module list at scripts/build-grub-standalone.sh).
#
# Steam-hardware-survey-grounded set of resolution-specific PNGs ships
# under /EFI/InterGenOS/themes/intergenos/backgrounds/. Falls back to
# grub_background.png (1920x1080) if no resolution-specific PNG matches.
if [ -n "$gfxmode" ]; then
    insmod regexp
    if regexp -s 1:igos_res '^([0-9]+x[0-9]+)' "$gfxmode"; then
        if background_image -m stretch /EFI/InterGenOS/themes/intergenos/backgrounds/${igos_res}.png; then
            true
        elif background_image -m stretch /EFI/InterGenOS/themes/intergenos/backgrounds/grub_background.png; then
            true
        fi
    elif background_image -m stretch /EFI/InterGenOS/themes/intergenos/backgrounds/grub_background.png; then
        true
    fi
elif background_image -m stretch /EFI/InterGenOS/themes/intergenos/backgrounds/grub_background.png; then
    true
fi

menuentry "Try InterGenOS" --class igos --class live {
    chainloader /EFI/InterGenOS/igos-live.efi
}

menuentry "Install InterGenOS (Graphical)" --class igos --class install-gui {
    chainloader /EFI/InterGenOS/igos-install-gui.efi
}

menuentry "Install InterGenOS (Text)" --class igos --class install-tui {
    chainloader /EFI/InterGenOS/igos-install-tui.efi
}

submenu "Advanced options" {
    menuentry "Boot from first hard disk" {
        exit
    }
    menuentry "UEFI firmware setup" --class efi-firmware {
        fwsetup
    }
}
