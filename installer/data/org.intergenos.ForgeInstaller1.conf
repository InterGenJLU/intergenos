<!-- D-Bus system-bus policy for the Forge installer backend service. -->
<!-- Installs to /usr/share/dbus-1/system.d/. -->
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root may own the service name (this is the backend itself). -->
  <policy user="root">
    <allow own="org.intergenos.ForgeInstaller1"/>
    <allow send_destination="org.intergenos.ForgeInstaller1"/>
    <allow receive_sender="org.intergenos.ForgeInstaller1"/>
  </policy>

  <!-- Members of `wheel` may send to the interface. That admits the message,
       not the act: off the install medium the backend does not start and
       refuses every method, and on the medium each acting method asks
       polkit, per call, for org.intergenos.forge.install. -->
  <policy group="wheel">
    <allow send_destination="org.intergenos.ForgeInstaller1"
           send_interface="org.intergenos.ForgeInstaller1"/>
    <allow receive_sender="org.intergenos.ForgeInstaller1"/>
  </policy>

  <!-- polkitd answers those per-call checks. The backend makes them on the
       connection that owns its name, and polkitd runs as its own account,
       neither root nor in `wheel`, so the default deny below would refuse it
       the call and every install would be refused. This admits polkit's own
       Authority interface from the backend and nothing else: the backend's
       signals, which carry an install's result and recovery key, stay with
       root and `wheel`. -->
  <policy user="polkitd">
    <allow receive_sender="org.intergenos.ForgeInstaller1"
           receive_interface="org.freedesktop.PolicyKit1.Authority"/>
  </policy>

  <!-- Default-deny for everyone else. -->
  <policy context="default">
    <deny send_destination="org.intergenos.ForgeInstaller1"/>
    <deny receive_sender="org.intergenos.ForgeInstaller1"/>
  </policy>
</busconfig>
