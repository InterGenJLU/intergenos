name: lib32-expat
version: "2.7.4"
release: 1
content_hash: cdff0ff9f02d053a
description: XML parser library (32-bit multilib runtime)
license: MIT
homepage: https://libexpat.github.io/
tier: core
build_style: custom
install_func: do_install
lib32_source: expat
elf_class: "32"
# Mirror-only (D-W0-7: only lib32-glibc is ISO-resident).
iso_include: false
source:
- url: https://github.com/libexpat/libexpat/releases/download/R_2_7_4/expat-${version}.tar.xz
  sha256: 9e9cabb457c1e09de91db2706d8365645792638eb3be1f94dbb2149301086ac0
dependencies:
  build:
  - lib32-glibc
  host: []
  runtime:
  - lib32-glibc
verify_paths:
  - /usr/lib32/libexpat.so.1
  - /usr/lib32/pkgconfig/expat.pc

# Build inputs from the repository tree: declared here so an edit to one
# moves this package's content fingerprint and a targeted build rebuilds it
# (igos-build/content_hash.py arm (c)), and in sources_extra below so the
# published source archive carries them.
source_tree:
- scripts/lib32-env.sh

# Build inputs composed from the repository tree (declared so the published
# source archive carries every input the build consumes — the corresponding-
# source rule the kernel config fragments established; survey 2026-08-11).
sources_extra:
- scripts/lib32-env.sh
