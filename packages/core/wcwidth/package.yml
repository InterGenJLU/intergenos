name: wcwidth
version: "0.7.0"
release: 2  # r2: pip install adds --ignore-installed — populated-chroot rebuild empty-archive class sweep (DFB-01/02, 2026-07-19).
description: Measure the rendered width of East Asian characters
license: MIT
homepage: https://github.com/jquast/wcwidth
tier: core
build_style: custom
install_func: do_install
source:
- url: https://files.pythonhosted.org/packages/2c/ee/afaf0f85a9a18fe47a67f1e4422ed6cf1fe642f0ae0a2f81166231303c52/wcwidth-0.7.0.tar.gz
  sha256: 90e3a7ea092341c44b99562e75d09e4d5160fe7a3974c6fb842a101a95e7eed0
dependencies:
  build:
  # The pinned sdist's [build-system] names hatchling.build, provided by
  # hatchling. build.sh builds with --no-build-isolation, which installs nothing
  # for the build, so hatchling must already be present; declaring it here is
  # what orders it ahead of this package.
  - hatchling
  - setuptools
  - wheel
  host: []
  runtime: []
verify_paths:
  - /usr/lib/python3.14/site-packages/wcwidth
