name: apparmor
version: "3.1.7"
release: 4  # r4: the package installs the userspace tools that READ the policy back, and it no longer ships a profile for a program nothing installs. (1) The upstream binutils component is compiled and installed, so an installed machine has aa-status with its apparmor_status compatibility name, aa-enabled, aa-exec and aa-features-abi; until now only the parser was installed and a machine could not report its own enforce/complain split at all - measured on an ordinary R001.2 install on 2026-09-22, the tool built from this same tarball read 169 profiles loaded, 68 in enforce and 101 in complain, and nothing already on the machine could read any of it. The two new programs are named in verify_paths at file level, because the directories exist either way. (2) The profile for a local assistant daemon is removed: no recipe in this repository installs a binary of that name, so it attached to nothing, confined no process, and was still counted in every summary of the loaded policy, which makes the policy look wider than it is. A new test refuses any profile in this package that names a program no recipe in the tree installs, and refuses package documentation that names a profile file the package does not ship. # r3: the recipe's post_install profile-load loop removed. pkm's canonical apparmor-reload hook already loads the same top-level /etc/apparmor.d profiles, in one parser invocation, under the same chroot and absent-interface guards — and it is critical, so a fatal parse now flags the operation for rollback instead of printing a WARNING and continuing. Coverage widens with it: the hook fires for profiles shipped by any package, the loop only ever ran when apparmor itself was installed.
content_hash: 0b19ea4a78f7343f
description: AppArmor MAC framework — libapparmor, parser, and profile set
license: GPL-2.0-only
homepage: https://gitlab.com/apparmor/apparmor
# Tier moved from core → desktop in Build #6 Halt #7b fix (f190f1c):
# apparmor was declared as a build dep of systemd-pass2 (Build #5 audit fix
# 04e36a7) but never wired into chroot-build-ch8.sh or
# chroot-build-core-extra.sh, so tier:core meant "supposed to be already-
# built in core phase, but isn't." tier:desktop lets the Python builder
# pick it up via topological sort and build it before systemd-pass2.
#
# Halt #8 fix (this commit): the previous build.sh was a profile-only stub
# that never compiled libapparmor.so — which is what systemd-pass2's
# `Dependency "libapparmor" not found` actually surfaced. The new build.sh
# compiles libraries/libapparmor (autotools), parser/ (Makefile), and
# installs upstream substrate profiles + Debian-derived extras + IGOS-
# specific custom profiles. See packages/core/apparmor/README.md.
tier: core
build_style: custom
source:
- url: https://gitlab.com/apparmor/apparmor/-/archive/v${version}/apparmor-v${version}.tar.gz
  sha256: 64494bd99fa6547a9cbdb4fc6bc732451a02dd19e6eb70eab977b239632151eb
- url: https://deb.debian.org/debian/pool/main/a/apparmor-profiles-extra/apparmor-profiles-extra_1.35.tar.xz
  sha256: 31d0a65d2c1c0c8dc91d87437020bf4341b6bb1c8d324944628d6fc629039165
dependencies:
  # autoconf/automake/libtool/bison/flex/gettext/pkg-config/perl-core are
  # all in the chroot by desktop-phase entry (built in core / core-extra).
  #
  # `which` is the one explicit build-dep we have to declare: apparmor's
  # common/Make.rules uses `$(shell which awk)` to locate awk, and if
  # `which` is not in PATH when make runs, the shell call returns empty,
  # AWK is undefined, and Make.rules:40 bails with the misleading
  # "awk utility required for build but not available" error. Build #9
  # halted on this in 2026-05-12 because topo-sort placed apparmor
  # before which; the explicit dep here pins the ordering.
  build: [which]
  host: [perl-core, python, bash]
  runtime: []

verify_paths:
  # Strengthened 2026-05-23 22:00 CDT after silent-loss incident: prior
  # paths (the parent dirs only) PASSED on a broken build that produced
  # a 44-entry manifest with NO libapparmor.so or apparmor_parser — the
  # gate didn't catch it because the directories themselves existed (from
  # other in-package files) even though the load-bearing artifacts were
  # absent. Explicit file-level entries below catch the class.
  - /usr/lib/libapparmor.so.1
  - /usr/sbin/apparmor_parser
  # The policy-reading tools, added 2026-09-22. Named at file level for the
  # same reason the two above are: the directories exist either way, so only
  # an explicit file catches a build that produced no tool.
  - /usr/sbin/aa-status
  - /usr/bin/aa-enabled
  - /usr/lib/pkgconfig/libapparmor.pc
  - /usr/lib/apparmor
  - /usr/lib/systemd/system
  - /usr/share/intergenos-apparmor
