name: ncurses-core
ships_as: ncurses  # ch8 dual-name twin — the driver archives this recipe under the ship name (chroot-build-ch8.sh run_package arg 2; runtime deps elsewhere may name 'ncurses')
version: '6.6-20261010'
release: 4  # r4: ship /usr/lib/pkgconfig/tinfo.pc as a link onto ncursesw.pc, completing r2's libtinfo links for pkg-config: readline 8.3 built against those links writes "Requires.private: tinfo" into readline.pc, and without a tinfo.pc every pkg-config consumer of readline failed (libxml2's meson on the R001.3 build, 2026-10-12). HAND bump: this recipe builds a sha-pinned upstream tarball, so the release auto-bump tool does not track it.  # r3: update to the ncurses 6.6-20261010 snapshot.  # r2: ship /usr/lib/libtinfo.so.6 and /usr/lib/libtinfo.so as compatibility links onto the wide library, so prebuilt binaries whose dynamic section asks for libtinfo.so.6 load on an installed system (this build has no --with-termlib, so libncursesw.so.6 exports the terminfo symbols). Decided 2026-09-18. The bump is by hand: this recipe builds a sha-pinned upstream tarball, so the release auto-bump tool does not track it.
description: Terminal handling library
license: MIT
source:
- url: https://invisible-island.net/archives/ncurses/current/ncurses-${version}.tgz
  sha256: 00a1d10c51c3aa1b4dae9ea4421aec2dd227fa4724e645850ed43fd6fc0a56ec
dependencies:
  build: []
  host: []
  runtime: []
tier: core
build_style: custom
verify_paths:
  - /usr/bin/ncursesw6-config
  - /usr/bin/captoinfo
  - /usr/lib/libcurses.so
  - /usr/lib/libtinfo.so.6
  - /usr/lib/pkgconfig/tinfo.pc
