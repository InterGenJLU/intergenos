name: versioneer
# Upstream latest stable. Build dependency of pandas (native/compute wave).
version: "0.29"
release: 1
description: Easy VCS-based management of project version strings
license: Unlicense
homepage: https://github.com/python-versioneer/python-versioneer
tier: core
build_style: custom
install_func: do_install
source:
- url: https://files.pythonhosted.org/packages/32/d7/854e45d2b03e1a8ee2aa6429dd396d002ce71e5d88b77551b2fb249cb382/versioneer-0.29.tar.gz
  sha256: 5ab283b9857211d61b53318b7c792cf68e798e765ee17c27ade9f6c924235731
dependencies:
  build:
  - setuptools
  host: []
  # The [toml] extra's only dep is tomli, gated python_version<3.11 (stdlib tomllib
  # on python3.14). No runtime dep on this target.
  runtime: []
verify_paths:
  - /usr/lib/python3.14/site-packages/versioneer.py
  - /usr/lib/python3.14/site-packages/versioneer-0.29.dist-info/METADATA
