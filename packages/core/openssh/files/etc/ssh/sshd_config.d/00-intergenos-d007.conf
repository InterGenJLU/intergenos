# InterGenOS — D-007 SSH posture (decided 2026-05-18)
#
# SSH is enabled for the user account only. Root SSH is not permitted
# on any lane (live ISO, qcow2, installed system). This drop-in ships
# as a STATIC FILE in /etc/ssh/sshd_config.d/ so it lands in the
# openssh package archive and reaches every Forge-installed target.
# (Previously generated by build.sh post_install() — that path only
# affected the build-VM chroot and never reached installed targets;
# 2026-05-27 install #28 follow-up.)

PermitRootLogin no
