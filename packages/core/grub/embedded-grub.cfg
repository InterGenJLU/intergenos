# Embedded grub.cfg for InterGenOS standalone GRUB EFI binary
#
# This config is baked into grubx64.efi at build time via
# `grub-mkstandalone --modules='...' "boot/grub/grub.cfg=embedded-grub.cfg"`.
#
# Purpose: bootstrap GRUB just far enough to find and load the real grub.cfg
# from the ESP. The real menu (3-entry: Try / Install-GUI / Install-TUI) lives
# at /EFI/InterGenOS/grub.cfg on the ESP and is shipped via the ISO assembly
# pipeline (installer/iso/grub/grub.cfg).
#
# Why two configs: the embedded one is signed-into-the-binary and immutable
# post-MS-sign. Loading the ESP-side cfg means we can iterate on menu content
# without re-signing GRUB. The shim_lock module enforces signature chain on
# whatever GRUB chains to next (the UKI), so the trust chain stays intact.

set timeout=0

# Self-locate the ESP via the device THIS grubx64.efi was actually loaded
# from ($cmdpath) rather than a label search.
#
# Why not `search --label IGOS_ESP`: the live-ISO ESP AND a previously-
# installed InterGenOS ESP are BOTH labeled IGOS_ESP (the installer formats
# the target ESP with `mkfs.fat -n IGOS_ESP`, installer/backend/disks.py).
# When an install USB is booted on a machine that already has InterGenOS
# installed, `search --label IGOS_ESP` returns whichever of the two devices
# the firmware enumerates first — a nondeterministic boot RACE. On the losing
# draw it finds the *internal* ESP (which carries no /EFI/InterGenOS/grub.cfg
# — the installed system's grub-install binary uses /boot/grub/grub.cfg on
# the root fs), the configfile check below fails, and we drop to a grub>
# prompt. $cmdpath is the device + directory the firmware (via shim) loaded
# this binary from, so it deterministically identifies THIS boot medium.
#
# This binary is ISO-only: the installer generates its own grub-install
# grubx64.efi for the target (MOK-signed, root-fs-uuid prefix), so this
# self-locate change affects the live ISO exclusively. The `regexp` module
# is baked into the standalone binary (scripts/build-grub-standalone.sh).
# Capture the bare device specifier (e.g. hd0,gpt2) WITHOUT its parens —
# matching what `search --set` produces — so `($esp)/path` and bare-`/path`
# resolution against $root both work (a paren-inclusive capture would
# double-wrap as `((hd0,gpt2))/path`).
if regexp -s espdev '^\((.*)\)' "$cmdpath"; then
    set esp=$espdev
    set root=$espdev
fi

if [ -e ($esp)/EFI/InterGenOS/grub.cfg ]; then
    configfile ($esp)/EFI/InterGenOS/grub.cfg
else
    # Fallback 1: $cmdpath was empty/unparseable on this firmware. Fall back
    # to the label search (pre-self-locate behavior). Single-medium boots —
    # the common case — are unaffected since only one IGOS_ESP is present.
    search --no-floppy --label IGOS_ESP --set=esp
    if [ -e ($esp)/EFI/InterGenOS/grub.cfg ]; then
        configfile ($esp)/EFI/InterGenOS/grub.cfg
    else
        # Fallback 2: try common ESP locations if label search also fails
        set root=(cd0)
        if [ -e /EFI/InterGenOS/grub.cfg ]; then
            configfile /EFI/InterGenOS/grub.cfg
        else
            echo "InterGenOS GRUB: cannot find /EFI/InterGenOS/grub.cfg on ESP."
            echo "Boot media may be damaged. Press any key to drop to GRUB prompt."
            read
        fi
    fi
fi
