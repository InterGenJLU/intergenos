name: lib32-zlib
version: "1.3.2"
release: 1
content_hash: c8655fbab24f2545
description: Compression library (32-bit multilib runtime)
license: Zlib
homepage: https://zlib.net/
tier: core
build_style: custom
install_func: do_install
lib32_source: zlib
elf_class: "32"
# Mirror-only (the lib32 set ships via the gaming meta; ONLY lib32-glibc is
# ISO-resident, per D-W0-7). tier:core defaults iso_include true — declared
# false explicitly.
iso_include: false
source:
- url: https://zlib.net/fossils/zlib-${version}.tar.gz
  sha256: bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16
dependencies:
  build:
  - lib32-glibc
  host: []
  runtime:
  - lib32-glibc
verify_paths:
  - /usr/lib32/libz.so.1
  - /usr/lib32/pkgconfig/zlib.pc

# Build inputs from the repository tree: declared here so an edit to one
# moves this package's content fingerprint and a targeted build rebuilds it
# (igos-build/content_hash.py arm (c)), and in sources_extra below so the
# published source archive carries them.
source_tree:
- scripts/lib32-env.sh

# Build inputs composed from the repository tree (declared so the published
# source archive carries every input the build consumes — the corresponding-
# source rule the kernel config fragments established; survey 2026-08-11).
sources_extra:
- scripts/lib32-env.sh
