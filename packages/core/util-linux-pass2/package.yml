name: util-linux-pass2
version: "2.41.3"
release: 2  # r2: runtime deps renamed to shipped namespace (F25 gate wave 2026-07-21)
description: Miscellaneous system utilities (pass 2 — rebuild with libcap-ng-backed setpriv)
license: GPL-2.0-or-later
source:
- url: https://www.kernel.org/pub/linux/utils/util-linux/v2.41/util-linux-${version}.tar.xz
  sha256: 3330d873f0fceb5560b89a7dc14e4f3288bbd880e96903ed9b50ec2b5799e58b
dependencies:
  build:
  - libcap-ng
  host: []
  runtime:
  - ncurses
  - readline
  - zlib
  - libcap-ng
tier: core
build_style: custom
supersedes:
  - util-linux-core
# Pass 2 of the 2-pass util-linux build, following the dbus-pass2 /
# libxml2-pass2 idiom. Pass 1 (util-linux-core, LFS 13.0 §8.82) is
# book-exact and the book passes --disable-setpriv: libcap-ng is not
# part of LFS, so setpriv cannot be built there. Nothing beyond the
# book ever rebuilt util-linux, so no installed system carried setpriv
# at all. First victim: the build orchestrator's toolchain launcher
# (which uses setpriv for privilege drop without cgroup migration)
# on the first self-hosted build host, 2026-07-17. This pass rebuilds
# with libcap-ng present and flips exactly that one flag to an explicit
# --enable-setpriv (fail-closed: configure aborts if libcap-ng is
# absent, rather than silently skipping the tool).
verify_paths:
  - /usr/bin/setpriv
  - /usr/bin/mount
  - /usr/lib/libblkid.so
