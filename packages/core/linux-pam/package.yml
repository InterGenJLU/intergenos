name: linux-pam
version: "1.7.3"
release: 4  # r4: update Linux-PAM to 1.7.3 and use its documentation directory.  # hook-contract wave: full PAM/security config set moved post_install -> do_install (owned payload)
description: Pluggable Authentication Modules
license: GPL-2.0-or-later
homepage: https://github.com/linux-pam/linux-pam
tier: core
build_style: custom
install_func: do_install

source:
  - url: https://github.com/linux-pam/linux-pam/releases/download/v${version}/Linux-PAM-${version}.tar.xz
    sha256: 2ce4765fd49df6693771ef2941f81e33d8ee14b94a81a5c7b369aa3b137b85a5

dependencies:
  build:
    - meson
    - ninja
    - shadow
    - systemd
    - libtirpc
    - docbook-xml
    - docbook-xsl-nons
    - libxslt
  host: []
  runtime:
    - systemd
    - libtirpc

# Silent feature losses formally accepted in InterGenOS's posture.
# Each entry below is a dep that linux-pam's configure probes for and
# does NOT find at build time, BY DESIGN — InterGenOS does not integrate
# it. Rationale comment on each line documents WHY.
silent_loss_accepted:
  - libnsl   # NIS / NIS+ authentication (Sun Yellow Pages). Deprecated
             # since glibc 2.32; security risk (cleartext network auth;
             # no transport encryption; vulnerable to network attacks).
             # InterGenOS auth chain uses local /etc/passwd + /etc/shadow
             # via pam_unix; no NIS clients. libnsl exists in tier:base
             # (built post-ch8) for other consumers (samba, exim) that
             # need RPC support; not consumed here.

tests:
  enabled: true
  failure_policy: known_failures
  reason: "Linux-PAM test suite requires real /etc/shadow + /etc/passwd entries, working setuid binaries, a controlling tty, and audit/loginuid kernel facilities that are not available inside the build chroot. BLFS 13.0 confirms tests fail without a fully provisioned auth stack."
verify_paths:
  - /etc/security/faillock.conf
  - /etc/security/pwquality.conf
  - /etc/security/limits.d/00-intergenos.conf
  - /etc/pam.d/system-account
  - /etc/pam.d/system-auth
  - /etc/pam.d/system-session
  - /etc/pam.d/systemd-user
  - /etc/pam.d/system-password
  - /usr/sbin/faillock
  - /usr/lib/libpam.so
