name: wpa_supplicant
version: '2.11'
release: 2  # r2: ship a wireless-hardware condition only for the nl80211 template; generic D-Bus and wired authentication remain available. The drop-in is declared in verify_paths.
content_hash: a6bb92dadc70e7c4
description: WPA/WPA2/IEEE 802.1X supplicant
license: BSD-3-Clause
homepage: https://w1.fi/wpa_supplicant/
tier: core
build_style: custom
install_func: do_install
source:
- url: https://w1.fi/releases/wpa_supplicant-${version}.tar.gz
  sha256: 912ea06f74e30a8e36fbb68064d6cdff218d8d591db0fc5d75dee6c81ac7fc0a
dependencies:
  build:
  - libnl
  - openssl
  - readline
  - dbus
  host: []
  runtime:
  - libnl
  - openssl
  - readline
  - dbus
verify_paths:
  - /usr/sbin/wpa_supplicant
  - /usr/sbin/wpa_passphrase
  - /usr/lib/systemd/system/wpa_supplicant-nl80211@.service.d/10-hardware.conf
