name: ca-certificates
version: "2026.04.30"
release: 3  # r3: ship the TLS trust updater and its manual with a declared p11-kit dependency.
content_hash: 703301d27f5fed88
description: Mozilla CA root certificate bundle (PEM) for OS-level TLS verification
license: MPL-2.0
homepage: https://curl.se/docs/caextract.html
tier: core
build_style: custom
install_func: do_install
source:
- url: file:///ca-certificates-${version}.tar.gz
  sha256: a38cf629d846eb61f14c7fc27fb8b32611ca28f982ec907a04aee03ddeed9369
dependencies:
  build: []
  host: []
  runtime:
    - p11-kit

verify_paths:
  - /usr/bin/update-ca-trust
  - /etc/ssl/cert.pem
  # the consolidated bundle build.sh installs and the /etc/ssl symlinks
  # resolve to — consumed directly by python-certifi's shim.
  - /etc/ssl/certs/ca-certificates.crt
  - /etc/pki/tls/certs
  - /etc/pki/ca-trust/source/anchors
