name: intergenos-default-settings
version: "1.0.0"
release: 18  # r18: no shipped-content change: the gsettings override sources this recipe installs from (config/gsettings) are now declared in source_tree, so editing one moves this package's content fingerprint and a targeted build rebuilds it instead of shipping the previously built archive. The installed files are byte-identical to r17.  # r17: the image ships defaults for the shell blur extension it default-enables. That extension is in the enabled-extensions list for every new user, and until now the tree shipped no settings for it at all, so every default of a default-enabled component came from the vendored third-party bundle and could move on any version bump with nothing here recording what was intended. The new dconf fragment /etc/dconf/db/local.d/02-intergenos-shell-effects pins static blur off for the two surfaces that capture a monitor index when it is on — the panel, which is blurred for every user on the default layout, and the dock, which is opt-in but takes the identical code path. Read from the component sources rather than the key name: with static blur on, each surface builds a background group at width 0 / height 0 and creates a real background manager bound to a monitor index captured while the display set is still being assembled; with it off the same surface takes a live blur effect with no manager and no monitor binding, so the blur is present either way and this selects an implementation rather than removing a feature. dconf rather than a gschema override for the same reason as the dock defaults beside it: the extension reads its own bundled schema, which a system gschema override cannot reach. Not locked, so a user who wants the static variant keeps it. # r16: the greeter database also turns enable-fingerprint-authentication off. Same defect as the smartcard key beside it: the upstream default is true and the shipped gdm-fingerprint PAM stack requires pam_fprintd.so, which no recipe here builds — authenticating against it with a correct password returns 28, "Module is unknown". It has not bitten because nothing answers the fprintd bus name today, which is a dependency on an absence rather than a fix. # r15: the greeter database turns enable-smartcard-authentication off. The upstream default is true, and with the smartcard stack shipped an inserted token made the greeter select a login path with no PAM module behind it. This is the second of two independent layers — the gdm recipe separately makes the PAM stack itself incapable of naming an uninstalled module — so neither has to be correct for password login to work. r14: neutral-language sweep of comments and printed text: decisions are recorded as "decided <date>" instead of being credited to a person or project role, development-host shorthand is replaced by a plain description, and the citations of a repository that is not published are replaced by what they were pointing at. Comments and strings only — no rule, path, flag, threshold or code path changed. The public-content scanner now carries detectors for all three classes (scripts/check-public-content.py), so the classes cannot return silently; tests/preflight/test_public_language_detectors.py proves each detector in both directions. r13: /etc/environment now ships a PATH instead of being an empty stub. It was shipped with header comments only, so a user session inherited a PATH without /usr/sbin or /sbin and installed administrative tools (ip, nft, fdisk, parted, dmesg) reported as "command not found" — the system stating that a present tool is absent. Most visible on the live medium, where diagnosing a machine is the whole purpose. /etc/environment is the right home rather than a /etc/profile.d drop-in: pam_env reads it for every login session including the display manager's, and systemd's user manager reads it through the /usr/lib/environment.d/99-environment.conf symlink this package already ships, whereas a profile.d script reaches shells only and would leave a graphical session still broken. build.sh now HALTS if the file it is about to ship has no /usr/sbin on PATH, because an empty /etc/environment looks identical to a correct one from the outside.
content_hash: 0debed6d3ce36ba2
description: InterGenOS canonical SSoT for GNOME desktop defaults — gschema-overrides + /etc/skel libadwaita bridge + burn-my-windows per-user profile + GDM greeter dconf customization (Tier 2 2026-05-22). Per D-006 requirement. Release 12 (2026-07-23) flips the default icon theme Papirus-Dark -> InterGenOS (the first-party theme, promoted to default at 1.4; 90_intergenos.gschema.override — the config lives outside the content-hash walk, hence the manual release bump forcing the rebuild). Release 11 (2026-07-14) disables greeter idle-suspend on AC via the gdm.d dconf fragment (sleep-inactive-ac-type='nothing') — a fresh install left at the login screen suspended after ~20 min (gnome-settings-daemon default) with no pre-login way to adjust the policy; the battery-power default (suspend) is retained deliberately. Release 10 (2026-07-10, HiDPI arc Tier 1) enables mutter fractional scaling + XWayland native scaling by default (92_intergenos-desktop.gschema.override experimental-features — both keywords verified against the pinned mutter 49.4 schema; the config lives outside the content-hash walk, hence the manual release bump forcing the rebuild). Release 8 (2026-06-19) adds the HiDPI greeter fix — a gdm.service ExecStartPre that forces a readable 2x greeter scale on >=4K displays exposing no EDID (virtual GPUs / panels with absent EDID, where GNOME's DPI auto-scale can't trigger); EDID and sub-4K displays untouched. Release 6 (2026-06-11) adds the GNOME app-overview "InterGenOS" folder (collects every X-InterGenOS-tagged app). Release 5 (2026-05-22) removes the duplicate-wordmark bandaid — the wordmark referenced by the GDM logo key is now provided by the intergen-mark package (theming-arc Item C closure).
license: GPL-3.0-or-later
homepage: https://github.com/InterGenJLU/intergenos
tier: core
build_style: custom
source: []
dependencies:
  build: []
  host:
    - coreutils-core
    # dconf is NOT a host-dep here: dconf is tier:desktop (builds after
    # core) and this package is tier:core. post_install runs
    # `dconf update 2>/dev/null || true` so missing dconf at install-time
    # is graceful; the GDM dconf db gets compiled when dconf installs
    # in phase_desktop or at first boot.
  runtime:
    - intergen-mark
    - glib2
verify_paths:
  - /usr/share/glib-2.0/schemas/90_intergenos.gschema.override
  - /usr/share/glib-2.0/schemas/91_intergenos-extensions.gschema.override
  - /usr/share/glib-2.0/schemas/92_intergenos-desktop.gschema.override
  - /usr/share/glib-2.0/schemas/93_intergenos-app-folders.gschema.override
  - /etc/skel/.config/gtk-4.0/gtk.css
  - /etc/skel/.config/burn-my-windows/profiles/1775735161994164.conf
  - /etc/dconf/db/gdm.d/00-intergenos-greeter
  # The build script asserts this fragment in DESTDIR; this asserts it on the
  # installed system, which is a different layer and the one that decides
  # whether a user's session actually reads the defaults.
  - /etc/dconf/db/local.d/02-intergenos-shell-effects
  - /usr/lib/intergenos/igos-greeter-hidpi.sh
  - /usr/lib/systemd/system/gdm.service.d/10-intergenos-greeter-hidpi.conf
  - /etc/environment
  - /etc/gnupg/scdaemon.conf

# Build inputs from the repository tree: declared so an edit to one moves
# this package's content fingerprint and a targeted build rebuilds it
# (igos-build/content_hash.py arm (c)).
source_tree:
- config/gsettings
