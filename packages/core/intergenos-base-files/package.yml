name: intergenos-base-files
version: '1.0.0'
release: 16  # r16: the systemd enable-preset gains logrotate.timer and switcheroo-control.service so the install-time preset-all pass enables both instead of the 99- catch-all default-disable reverting them — the same failure shape the preset file already records for pkm-check-updates.timer. Preset file only; no code, no accounts, no skeleton change.  # r15: neutral-language sweep of comments and printed text: decisions are recorded as "decided <date>" instead of being credited to a person or project role, development-host shorthand is replaced by a plain description, and the citations of a repository that is not published are replaced by what they were pointing at. Comments and strings only — no rule, path, flag, threshold or code path changed. The public-content scanner now carries detectors for all three classes (scripts/check-public-content.py), so the classes cannot return silently; tests/preflight/test_public_language_detectors.py proves each detector in both directions. r14: seed-account-skel.sh header names its effective caller — pkm's canonical account-skel-seed hook, which runs it ahead of the first systemd-sysusers pass; the installer config-phase call is documented as the idempotent belt it now is. Comment-only change to the shipped helper; the create-only contract is unchanged. r13: account databases are no longer deploy-target bytes. passwd/group/shadow/gshadow move from files/etc/ to files/usr/share/intergenos-base-files/account-skel/ and reach /etc only via the new usr/lib/intergenos/seed-account-skel.sh (create-only, never overwrites) or the installer's config phase, which must run before the users phase's useradd --root. Shipping them as ordinary payload meant a first install on a system that never had this package deployed the pristine skeleton over the live databases and lost every real account row (root-caused 2026-07-23); pkm config protection refuses that overwrite now, and this split removes the bytes that made it possible. do_install HALTS if any account database reappears under etc/ in the payload. verify_paths re-pointed at what the package actually produces. r10: release-only bump — the content_hash recompute (7523e0dc→cbfbca63) landed without a release bump; same-version republish is invisible to pkm upgrade (monotonic-advancement rule), so the changed bytes need r10 to reach installed systems. r9: ship /var/run -> ../run + /var/lock -> ../run/lock compat symlinks (no archive carried them; first var/run/-bearing archive mkdir'd a REAL dir on installs -> split-brain runtime dirs; base-files installs first so the symlinks land before any offender extracts). r7: merged-usr compat skeleton ownership handoff (L27). base-files is now the SOLE archive shipping the bin/lib/sbin -> usr/* compat symlinks + the lib64 dir to installed systems: dev 866838c1 makes BOTH builders PRUNE the seed-state skeleton from every OTHER package's staging tree before capture (the 908/913-archive over-capture that let evicting a mirror-only package delete the chroot's compat symlinks WAS L27), and base-files as the Class-11 canonical owner (build-rules 2.7) is EXEMPT + must ship them explicitly. files/ gains the three git-native symlinks; do_install creates the empty real /lib64 (x86_64; glibc owns the loader inside) plus a fail-closed assertion that HALTS the build if a compat symlink is missing/mis-targeted or /lib64 is not a real dir — a files/-tree regression can no longer ship a skeleton-less base-files (the L27 harm inverted). verify_paths gains /bin /lib /sbin /lib64 (checked against the full chroot at squashfs Step 4.5, where usr/{bin,lib,sbin} are populated + /lib64 holds the loader). The prune 866838c1 + this r7 are the two halves of one ownership move; both in-tree before any ISO, the burn proves the pair. r6: ship the full FHS/LFS-7.5 directory skeleton (PI-Z22) — /media, /usr/local/{bin,lib,sbin}, /etc/opt, /var/{local,opt}, /mnt etc. were absent on installed systems because no archive carried them (chroot-build.sh §7.5 builds them only in the chroot). build.sh changed bytes.
content_hash: 59eb70c429a5f0aa
description: InterGenOS canonical /etc + FHS-skeleton + systemd-preset + tmpfiles ownership (Fedora setup + Arch filesystem analog)
license: GPL-3.0-or-later
homepage: https://github.com/InterGenJLU/intergenos
tier: core
build_style: custom
source: []
dependencies:
  build: []
  host: []
  runtime: []

# Class 11 chroot-state-not-packaged canonical owner. Every /etc/* file
# this package ships was previously written by chroot-build.sh or
# chroot-config-ch9.sh or scripts/create-image.sh as a heredoc-emit;
# install attempt #21 surfaced the structural defect that none of that
# content landed on Forge install targets (Forge ships ~half the
# /etc/* rows the build chroot does). Cross-distro prior-art research
# 2026-05-27 confirms every mainstream distro uses a single foundational
# package (Fedora setup, Debian base-files + base-passwd, Arch
# filesystem, Void base-files, Gentoo baselayout). intergenos-base-files
# is our equivalent. Plan v2 + bilateral peer-review APPROVE-clean
# 2026-05-27.

verify_paths:
  # Account databases ship as REFERENCE data here, never as /etc payload
  # (r13, 2026-07-24) — /etc/{passwd,group,shadow,gshadow} are created by
  # the installer's config phase (or the seed helper below), so this package
  # no longer produces them and must not claim to.
  - /usr/share/intergenos-base-files/account-skel/passwd
  - /usr/share/intergenos-base-files/account-skel/group
  - /usr/share/intergenos-base-files/account-skel/shadow
  - /usr/share/intergenos-base-files/account-skel/gshadow
  - /usr/lib/intergenos/seed-account-skel.sh
  - /etc/profile
  - /etc/bashrc
  - /etc/bash.bashrc
  - /etc/inputrc
  - /etc/shells
  - /etc/issue
  - /etc/motd
  - /etc/os-release
  - /etc/lsb-release
  - /etc/igos-release
  - /etc/skel/.bashrc
  - /etc/skel/.bash_profile
  - /etc/profile.d/prompt.sh
  - /etc/systemd/system/getty@tty1.service.d/noclear.conf
  - /etc/systemd/coredump.conf.d/maxuse.conf
  - /etc/systemd/system/dbus.service.d/intergenos-capabilities.conf
  - /etc/systemd/system/systemd-tpm2-setup.service.d/intergenos-tss2-loglevel.conf
  - /etc/systemd/system/systemd-pcrextend.service.d/intergenos-tss2-loglevel.conf
  - /etc/systemd/resolved.conf.d/no-mdns.conf
  - /etc/systemd/user/wireplumber.service.d/restart.conf
  - /etc/modprobe.d/igos-dirty-frag-mitigation.conf
  - /etc/modprobe.d/disable-algif.conf
  - /etc/gdm/custom.conf
  - /usr/bin/lsb_release
  - /usr/lib/systemd/system-preset/80-intergenos-enable.preset
  - /usr/lib/systemd/system-preset/99-intergenos-default-disable.preset
  - /usr/lib/tmpfiles.d/00-intergenos.conf
  - /root
  # FHS/LFS-7.5 skeleton (PI-Z22) — representatives of the class that was
  # absent on installed systems until base-files began shipping it.
  - /media/cdrom
  - /usr/local/bin
  - /var/opt
  # Merged-usr compat skeleton (L27 handoff, r7) — base-files is now the SOLE
  # archive shipping these after the 866838c1 seed-prune; checked against the
  # full chroot at squashfs (Step 4.5), where usr/{bin,lib,sbin} are populated
  # and /lib64 holds glibc's loader.
  - /bin
  - /lib
  - /sbin
  - /lib64
