name: intergenos-base-files
version: '1.0.0'
release: 26  # r26: enable the shipped ModemManager service so its D-Bus activation alias and desktop mobile-broadband support are available (R001.3 row 20; the daemon's own unit drop-in keeps it off the boot target, so the preset creates only the activation alias).  # r25: ships /etc/modprobe.d/panic-record-retention.conf, which turns the kernel's EFI pstore backend on so a kernel panic leaves a record the next boot can read (R001.3 row 45). The backend is built here (CONFIG_EFI_VARS_PSTORE=m) but the kernel's own default switches it off (CONFIG_EFI_VARS_PSTORE_DEFAULT_DISABLE=y), so on every installed system to date the module loaded, declined to register and recorded nothing. Two panics have been seen on this project's hardware; the first left a record and could be explained, the second left none and cannot be. systemd-pstore.service drains the records to /var/lib/systemd/pstore on the next boot and clears the firmware store, which is what bounds the variable-storage cost; its enablement is upstream systemd's preset, as this package's enable-preset header already records. record_size is left at the upstream default. verify_paths gains the file. Proven: the option resolves and the backend registers under it. Not proven: a real panic recorded and read back after a reboot — the loaner leg, which is deconflicted with the seat holding that machine.  # r24: the systemd enable-preset's job-scheduler section records that one of the two schedulers is no longer part of the shipped install set and states why its disable line is kept — it is what holds that daemon off by default on a machine where someone installs the package from the mirror later. Preset text only; no unit default changes and no code, accounts or skeleton change.  # r23: the account-database seed helper invokes /usr/bin/install by absolute path, and its package-manager hook binds /usr/bin/bash; PATH can no longer select either root child. r22: ships /usr/lib/sysctl.d/60-intergenos-hardening.conf, the kernel hardening floor (R001.3 row 23): kernel.kptr_restrict 1, kernel.randomize_va_space 2, strict reverse-path filtering, ICMP redirects neither accepted nor sent (IPv4 and IPv6), martian packets logged — each on all, default and the interface glob so it wins over systemd's 50-default.conf, which sets the reverse-path filter loose through the same glob. kexec_load_disabled is deliberately not set (lockdown integrity and signed-kexec enforcement already refuse an unsigned image); SMT stays on. verify_paths gains the file. Proven on an installed R001.2-03 machine as root: applied, every value read back at the floor on every interface, a fresh ssh connection under strict filtering, the new installed gate green on every sysctl arm, then restored identical. Not proven: this archive built and installed — the R001.3 cycle. The kernel half (COMPAT_BRK off) is linux-kernel r2.  # r21: the shipped release identity moves to the R001.2 point release. /etc/os-release VERSION, VERSION_ID and PRETTY_NAME, /etc/lsb-release DISTRIB_RELEASE and DISTRIB_DESCRIPTION, /etc/igos-release and the /etc/issue banner now state R001.2 (Revival); the codename is unchanged. Identity files only; no code, no accounts, no skeleton change. The two R001.2 images minted on 2026-09-02 still said R001.1 because this file was not moved before the build; measured on an installed system, corrected here.  # r20: ships /etc/modprobe.d/pcspkr-alias-owner.conf, which decides which of the two PC-speaker drivers keeps the platform:pcspkr alias. The kernel builds both (CONFIG_INPUT_PCSPKR and CONFIG_SND_PCSP) and both register under the same platform-driver name, so the module index maps that one alias to both and every boot logs "Error: Driver 'pcspkr' is already registered, aborting..." while snd_pcsp fails to load. The console-bell driver keeps the alias and the ALSA PC-speaker driver is blacklisted, which also stops soundcore, snd, snd-timer and snd-pcm being pulled in on every boot for a card that then fails to register. blacklist, not install /bin/false, so loading it by name still works. verify_paths gains the new file and rtw88-aspm.conf, which had never been listed. Recipe and authoring-time tests prove the staged policy; a freshly built and installed image was not proved in this change.  # r19: the enable-preset's rtkit entry flips disable->enable (decided 2026-08-19): the D-Bus activation starts the daemon on first audio use regardless of the flag, so the written default now states what the machine actually does instead of reading disabled beside a running unit. Preset file only; no code, no accounts, no skeleton change.  # r18: the systemd enable-preset gains a written decision for six services whose default nothing stated. cups, avahi, rtkit, atd and fcron are now explicitly disabled and NetworkManager-wait-online explicitly enabled, each with the survey, the security note, the socket or D-Bus activation posture and the consequence of reverting it. None of the six changes what a fresh install resolves to — the catch-all already disabled five of them and NetworkManager.service's own Also= already enabled the sixth — but each was previously the unstated consequence of a catch-all or a side effect of another unit's Install section, while the recipes for the same units called systemctl enable and were overruled. Preset file only; no code, no accounts, no skeleton change.  # r17: the shipped release identity moves to the R001.1 point release. /etc/os-release VERSION, VERSION_ID and PRETTY_NAME, /etc/lsb-release DISTRIB_RELEASE and DISTRIB_DESCRIPTION, /etc/igos-release and the /etc/issue banner all now state R001.1 (Revival); the codename is unchanged. VERSION_ID is written lower-case (r001.1) because the os-release specification limits that field to 0-9 a-z . _ and -. These files are now the ONLY place the identity is authored: the installer no longer writes a second hand-maintained copy (see the forge release of the same date), which is what let the shipped LOGO=intergenos line go missing from every installed system.  # r16: the systemd enable-preset gains logrotate.timer and switcheroo-control.service so the install-time preset-all pass enables both instead of the 99- catch-all default-disable reverting them — the same failure shape the preset file already records for pkm-check-updates.timer. Preset file only; no code, no accounts, no skeleton change.  # r15: neutral-language sweep of comments and printed text: decisions are recorded as "decided <date>" instead of being credited to a person or project role, development-host shorthand is replaced by a plain description, and the citations of a repository that is not published are replaced by what they were pointing at. Comments and strings only — no rule, path, flag, threshold or code path changed. The public-content scanner now carries detectors for all three classes (scripts/check-public-content.py), so the classes cannot return silently; tests/preflight/test_public_language_detectors.py proves each detector in both directions. r14: seed-account-skel.sh header names its effective caller — pkm's canonical account-skel-seed hook, which runs it ahead of the first systemd-sysusers pass; the installer config-phase call is documented as the idempotent belt it now is. Comment-only change to the shipped helper; the create-only contract is unchanged. r13: account databases are no longer deploy-target bytes. passwd/group/shadow/gshadow move from files/etc/ to files/usr/share/intergenos-base-files/account-skel/ and reach /etc only via the new usr/lib/intergenos/seed-account-skel.sh (create-only, never overwrites) or the installer's config phase, which must run before the users phase's useradd --root. Shipping them as ordinary payload meant a first install on a system that never had this package deployed the pristine skeleton over the live databases and lost every real account row (root-caused 2026-07-23); pkm config protection refuses that overwrite now, and this split removes the bytes that made it possible. do_install HALTS if any account database reappears under etc/ in the payload. verify_paths re-pointed at what the package actually produces. r10: release-only bump — the content_hash recompute (7523e0dc→cbfbca63) landed without a release bump; same-version republish is invisible to pkm upgrade (monotonic-advancement rule), so the changed bytes need r10 to reach installed systems. r9: ship /var/run -> ../run + /var/lock -> ../run/lock compat symlinks (no archive carried them; first var/run/-bearing archive mkdir'd a REAL dir on installs -> split-brain runtime dirs; base-files installs first so the symlinks land before any offender extracts). r7: merged-usr compat skeleton ownership handoff (L27). base-files is now the SOLE archive shipping the bin/lib/sbin -> usr/* compat symlinks + the lib64 dir to installed systems: dev 866838c1 makes BOTH builders PRUNE the seed-state skeleton from every OTHER package's staging tree before capture (the 908/913-archive over-capture that let evicting a mirror-only package delete the chroot's compat symlinks WAS L27), and base-files as the Class-11 canonical owner (build-rules 2.7) is EXEMPT + must ship them explicitly. files/ gains the three git-native symlinks; do_install creates the empty real /lib64 (x86_64; glibc owns the loader inside) plus a fail-closed assertion that HALTS the build if a compat symlink is missing/mis-targeted or /lib64 is not a real dir — a files/-tree regression can no longer ship a skeleton-less base-files (the L27 harm inverted). verify_paths gains /bin /lib /sbin /lib64 (checked against the full chroot at squashfs Step 4.5, where usr/{bin,lib,sbin} are populated + /lib64 holds the loader). The prune 866838c1 + this r7 are the two halves of one ownership move; both in-tree before any ISO, the burn proves the pair. r6: ship the full FHS/LFS-7.5 directory skeleton (PI-Z22) — /media, /usr/local/{bin,lib,sbin}, /etc/opt, /var/{local,opt}, /mnt etc. were absent on installed systems because no archive carried them (chroot-build.sh §7.5 builds them only in the chroot). build.sh changed bytes.
