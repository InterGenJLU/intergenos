name: intergenos-base-files
version: '1.0.0'
release: 35  # r35: ships /usr/share/applications/mimeapps.list, the distribution-level default-application list, naming Celluloid for video/webm, audio/mpeg, audio/flac, audio/ogg and audio/x-wav (measured 2026-09-20: GNOME's desktop-level list names Showtime and Decibels, which this system does not ship, so WebM opened in the web browser and MP3 in Audacity); decided 2026-09-20, exactly these five types; verify_paths gains the file. r34: the enable-list preset decides the scanning daemon — saned ships disabled (its socket would offer this machine's scanner to the network on tcp/6566), with the template unit it starts per connection explained rather than listed; r32: the enable-list preset decides the two printing daemons — cups-browsed ships disabled (it creates print destinations from what the network advertises, so it follows the Welcomer's Print Services AND Network Discovery choices), and ipp-usb is written down as having no enablement state at all because its unit carries no [Install] section; r31: content hash re-recorded on the composed chain (the weekly-discard preset comment r30 composed on the panic-screen fragment r29); no change to this package's own content beyond those already noted. r30: the shipped preset policy states why weekly discard is not decided in it. fstrim.timer is the one unit whose default cannot be written down in a static list: whether an installed machine should tell its drive which blocks its filesystem no longer uses depends on how the disk was laid out, and the layout is known only while an install is running. The explicit-enable file now carries the rule and names where it is applied (installer/backend/users.py:configure_fstrim_timer, from the layout the partitioner returned, after the preset pass) — unencrypted enables it, encrypted leaves it off, because which blocks a filesystem is using describes that filesystem and an encrypted disk exists to keep that from the hardware. Comment only: no unit, no preset line and no resolved state changes, and the timer resolves to disabled through the same catch-all it always did. Without the note the unit reads here as an oversight, which is the misreading the explicit default-off block in the same file exists to prevent. # r29: ships /etc/kernel/cmdline.d/31-panic-screen.conf, which selects the kernel's kernel-log panic screen (drm.panic_screen=kmsg) so a panic shows the kernel's own record of what failed instead of three lines that name nothing. This is the SCREEN half of the panic work and stands beside the RECORDER half r27 configured, replacing neither: the recorder needs the reservation in the image, the recorder registering, and a NEXT BOOT that reads the region back; the screen is drawn from inside the panic handler on a display that is already lit, so a photograph carries the trace even from a machine that never boots again or was installed before the recorder shipped. The kernel's default formatter prints 'KERNEL PANIC!', 'Please reboot your computer.' and the one-line reason and nothing else; the kmsg formatter draws the tail of the kernel log — the panic string, the instruction pointer, the call trace, the tainted line and the loaded modules. Measured 2026-09-18: a machine running this system took a fatal exception in interrupt context, showed the three-line screen, and carried no recorder either, so the failure was unrecorded twice over. The QR-code formatter is deliberately not used: CONFIG_DRM_PANIC_SCREEN_QR_CODE has been asked for by this tree's kernel fragments since 2026-07-08, it depends on RUST, no fragment enables CONFIG_RUST, and the option is absent from the produced configuration of every kernel built here — and a command line selecting it falls back to the three-line screen with nothing said. verify_paths gains the file. Proven: the kernel source for the version this tree builds (tarball sha256 matching this tree's own pin) accepts the value at drm_panic.c's dispatch and states the parameter overrides the built-in default; the new preflight tests are red on the base tree and green with the fragment; the installed gate's new arm fails on an R001.2-03 machine naming the mode it read, and passes against a kernel whose panic-screen mode is the kernel-log one. Not proven: this fragment inside a built image, and a panic actually drawn under it — a build and a deliberate panic are that leg. r28: the release identity is declared R001.3 — igos-release, os-release, lsb-release and issue move together through scripts/set-release-identity.py and the identity gate passes over the result (R001.3 row 42, runbook §1 item 3c); the chroot rebuilds this package in the targeted delta before squashfs.  # r27: the second half of the panic-record work (R001.3 row 45): /etc/kernel/cmdline.d/30-panic-record.conf gives the RAM-backed recorder a named memory region and names it as the pstore backend, and /etc/modules-load.d/panic-record-ramoops.conf loads the recorder at boot. r25's EFI backend was proven necessary and not sufficient: a deliberate panic with it registered wrote nothing, and why the write did not land in panic context cannot be determined from userspace, so the record moves to memory the kernel reserves itself. The region is reserved BY NAME (reserve_mem=1M:4096:pstore with ramoops.mem_name=pstore), not by address: with Secure Boot on the kernel runs in integrity lockdown, which refuses ramoops.mem_address — the one parameter fs/pstore/ram.c declares as a hardware parameter — and a machine configured that way reserves the region, never starts the recorder and looks configured while recording nothing. Naming the region also removes the fixed address that would have had to be free on every machine. The EFI option file stays as the fallback. verify_paths gains both files. Proven: a deliberate panic on a loaner with the old state leaves no record, the address form is refused by lockdown on that machine (twice, hexadecimal and decimal), and the kernel source declares exactly one hardware parameter. Not proven: a panic recorded and read back under this configuration, and this archive built and installed.  # r26: enable the shipped ModemManager service so its D-Bus activation alias and desktop mobile-broadband support are available (R001.3 row 20; the daemon's own unit drop-in keeps it off the boot target, so the preset creates only the activation alias).  # r25: ships /etc/modprobe.d/panic-record-retention.conf, which turns the kernel's EFI pstore backend on so a kernel panic leaves a record the next boot can read (R001.3 row 45). The backend is built here (CONFIG_EFI_VARS_PSTORE=m) but the kernel's own default switches it off (CONFIG_EFI_VARS_PSTORE_DEFAULT_DISABLE=y), so on every installed system to date the module loaded, declined to register and recorded nothing. Two panics have been seen on this project's hardware; the first left a record and could be explained, the second left none and cannot be. systemd-pstore.service drains the records to /var/lib/systemd/pstore on the next boot and clears the firmware store, which is what bounds the variable-storage cost; its enablement is upstream systemd's preset, as this package's enable-preset header already records. record_size is left at the upstream default. verify_paths gains the file. Proven: the option resolves and the backend registers under it. Not proven: a real panic recorded and read back after a reboot — the loaner leg, which is deconflicted with the seat holding that machine.  # r24: the systemd enable-preset's job-scheduler section records that one of the two schedulers is no longer part of the shipped install set and states why its disable line is kept — it is what holds that daemon off by default on a machine where someone installs the package from the mirror later. Preset text only; no unit default changes and no code, accounts or skeleton change.  # r23: the account-database seed helper invokes /usr/bin/install by absolute path, and its package-manager hook binds /usr/bin/bash; PATH can no longer select either root child. r22: ships /usr/lib/sysctl.d/60-intergenos-hardening.conf, the kernel hardening floor (R001.3 row 23): kernel.kptr_restrict 1, kernel.randomize_va_space 2, strict reverse-path filtering, ICMP redirects neither accepted nor sent (IPv4 and IPv6), martian packets logged — each on all, default and the interface glob so it wins over systemd's 50-default.conf, which sets the reverse-path filter loose through the same glob. kexec_load_disabled is deliberately not set (lockdown integrity and signed-kexec enforcement already refuse an unsigned image); SMT stays on. verify_paths gains the file. Proven on an installed R001.2-03 machine as root: applied, every value read back at the floor on every interface, a fresh ssh connection under strict filtering, the new installed gate green on every sysctl arm, then restored identical. Not proven: this archive built and installed — the R001.3 cycle. The kernel half (COMPAT_BRK off) is linux-kernel r2.  # r21: the shipped release identity moves to the R001.2 point release. /etc/os-release VERSION, VERSION_ID and PRETTY_NAME, /etc/lsb-release DISTRIB_RELEASE and DISTRIB_DESCRIPTION, /etc/igos-release and the /etc/issue banner now state R001.2 (Revival); the codename is unchanged. Identity files only; no code, no accounts, no skeleton change. The two R001.2 images minted on 2026-09-02 still said R001.1 because this file was not moved before the build; measured on an installed system, corrected here.  # r20: ships /etc/modprobe.d/pcspkr-alias-owner.conf, which decides which of the two PC-speaker drivers keeps the platform:pcspkr alias. The kernel builds both (CONFIG_INPUT_PCSPKR and CONFIG_SND_PCSP) and both register under the same platform-driver name, so the module index maps that one alias to both and every boot logs "Error: Driver 'pcspkr' is already registered, aborting..." while snd_pcsp fails to load. The console-bell driver keeps the alias and the ALSA PC-speaker driver is blacklisted, which also stops soundcore, snd, snd-timer and snd-pcm being pulled in on every boot for a card that then fails to register. blacklist, not install /bin/false, so loading it by name still works. verify_paths gains the new file and rtw88-aspm.conf, which had never been listed. Recipe and authoring-time tests prove the staged policy; a freshly built and installed image was not proved in this change.  # r19: the enable-preset's rtkit entry flips disable->enable (decided 2026-08-19): the D-Bus activation starts the daemon on first audio use regardless of the flag, so the written default now states what the machine actually does instead of reading disabled beside a running unit. Preset file only; no code, no accounts, no skeleton change.  # r18: the systemd enable-preset gains a written decision for six services whose default nothing stated. cups, avahi, rtkit, atd and fcron are now explicitly disabled and NetworkManager-wait-online explicitly enabled, each with the survey, the security note, the socket or D-Bus activation posture and the consequence of reverting it. None of the six changes what a fresh install resolves to — the catch-all already disabled five of them and NetworkManager.service's own Also= already enabled the sixth — but each was previously the unstated consequence of a catch-all or a side effect of another unit's Install section, while the recipes for the same units called systemctl enable and were overruled. Preset file only; no code, no accounts, no skeleton change.  # r17: the shipped release identity moves to the R001.1 point release. /etc/os-release VERSION, VERSION_ID and PRETTY_NAME, /etc/lsb-release DISTRIB_RELEASE and DISTRIB_DESCRIPTION, /etc/igos-release and the /etc/issue banner all now state R001.1 (Revival); the codename is unchanged. VERSION_ID is written lower-case (r001.1) because the os-release specification limits that field to 0-9 a-z . _ and -. These files are now the ONLY place the identity is authored: the installer no longer writes a second hand-maintained copy (see the forge release of the same date), which is what let the shipped LOGO=intergenos line go missing from every installed system.  # r16: the systemd enable-preset gains logrotate.timer and switcheroo-control.service so the install-time preset-all pass enables both instead of the 99- catch-all default-disable reverting them — the same failure shape the preset file already records for pkm-check-updates.timer. Preset file only; no code, no accounts, no skeleton change.  # r15: neutral-language sweep of comments and printed text: decisions are recorded as "decided <date>" instead of being credited to a person or project role, development-host shorthand is replaced by a plain description, and the citations of a repository that is not published are replaced by what they were pointing at. Comments and strings only — no rule, path, flag, threshold or code path changed. The public-content scanner now carries detectors for all three classes (scripts/check-public-content.py), so the classes cannot return silently; tests/preflight/test_public_language_detectors.py proves each detector in both directions. r14: seed-account-skel.sh header names its effective caller — pkm's canonical account-skel-seed hook, which runs it ahead of the first systemd-sysusers pass; the installer config-phase call is documented as the idempotent belt it now is. Comment-only change to the shipped helper; the create-only contract is unchanged. r13: account databases are no longer deploy-target bytes. passwd/group/shadow/gshadow move from files/etc/ to files/usr/share/intergenos-base-files/account-skel/ and reach /etc only via the new usr/lib/intergenos/seed-account-skel.sh (create-only, never overwrites) or the installer's config phase, which must run before the users phase's useradd --root. Shipping them as ordinary payload meant a first install on a system that never had this package deployed the pristine skeleton over the live databases and lost every real account row (root-caused 2026-07-23); pkm config protection refuses that overwrite now, and this split removes the bytes that made it possible. do_install HALTS if any account database reappears under etc/ in the payload. verify_paths re-pointed at what the package actually produces. r10: release-only bump — the content_hash recompute (7523e0dc→cbfbca63) landed without a release bump; same-version republish is invisible to pkm upgrade (monotonic-advancement rule), so the changed bytes need r10 to reach installed systems. r9: ship /var/run -> ../run + /var/lock -> ../run/lock compat symlinks (no archive carried them; first var/run/-bearing archive mkdir'd a REAL dir on installs -> split-brain runtime dirs; base-files installs first so the symlinks land before any offender extracts). r7: merged-usr compat skeleton ownership handoff (L27). base-files is now the SOLE archive shipping the bin/lib/sbin -> usr/* compat symlinks + the lib64 dir to installed systems: dev 866838c1 makes BOTH builders PRUNE the seed-state skeleton from every OTHER package's staging tree before capture (the 908/913-archive over-capture that let evicting a mirror-only package delete the chroot's compat symlinks WAS L27), and base-files as the Class-11 canonical owner (build-rules 2.7) is EXEMPT + must ship them explicitly. files/ gains the three git-native symlinks; do_install creates the empty real /lib64 (x86_64; glibc owns the loader inside) plus a fail-closed assertion that HALTS the build if a compat symlink is missing/mis-targeted or /lib64 is not a real dir — a files/-tree regression can no longer ship a skeleton-less base-files (the L27 harm inverted). verify_paths gains /bin /lib /sbin /lib64 (checked against the full chroot at squashfs Step 4.5, where usr/{bin,lib,sbin} are populated + /lib64 holds the loader). The prune 866838c1 + this r7 are the two halves of one ownership move; both in-tree before any ISO, the burn proves the pair. r6: ship the full FHS/LFS-7.5 directory skeleton (PI-Z22) — /media, /usr/local/{bin,lib,sbin}, /etc/opt, /var/{local,opt}, /mnt etc. were absent on installed systems because no archive carried them (chroot-build.sh §7.5 builds them only in the chroot). build.sh changed bytes. Re-recorded at r34 when this change set was placed onto a development branch that already carried r32 and r33 of this package.
content_hash: c3c13cf644d03afc
description: InterGenOS canonical /etc + FHS-skeleton + systemd-preset + tmpfiles ownership (Fedora setup + Arch filesystem analog)
license: GPL-3.0-or-later
homepage: https://github.com/InterGenJLU/intergenos
tier: core
build_style: custom
source: []
dependencies:
  build: []
  host: []
  runtime: []

# Class 11 chroot-state-not-packaged canonical owner. Every /etc/* file
# this package ships was previously written by chroot-build.sh or
# chroot-config-ch9.sh or scripts/create-image.sh as a heredoc-emit;
# install attempt #21 surfaced the structural defect that none of that
# content landed on Forge install targets (Forge ships ~half the
# /etc/* rows the build chroot does). Cross-distro prior-art research
# 2026-05-27 confirms every mainstream distro uses a single foundational
# package (Fedora setup, Debian base-files + base-passwd, Arch
# filesystem, Void base-files, Gentoo baselayout). intergenos-base-files
# is our equivalent. Plan v2 + bilateral peer-review APPROVE-clean
# 2026-05-27.

verify_paths:
  # Account databases ship as REFERENCE data here, never as /etc payload
  # (r13, 2026-07-24) — /etc/{passwd,group,shadow,gshadow} are created by
  # the installer's config phase (or the seed helper below), so this package
  # no longer produces them and must not claim to.
  - /usr/share/intergenos-base-files/account-skel/passwd
  - /usr/share/intergenos-base-files/account-skel/group
  - /usr/share/intergenos-base-files/account-skel/shadow
  - /usr/share/intergenos-base-files/account-skel/gshadow
  - /usr/lib/intergenos/seed-account-skel.sh
  - /etc/profile
  - /etc/bashrc
  - /etc/bash.bashrc
  - /usr/share/applications/mimeapps.list   # the shipped media default applications (Celluloid for webm and the common audio types)
  - /etc/inputrc
  - /etc/shells
  - /etc/issue
  - /etc/motd
  - /etc/os-release
  - /etc/lsb-release
  - /etc/igos-release
  - /etc/skel/.bashrc
  - /etc/skel/.bash_profile
  - /etc/profile.d/prompt.sh
  - /etc/systemd/system/getty@tty1.service.d/noclear.conf
  - /etc/systemd/coredump.conf.d/maxuse.conf
  - /etc/systemd/system/dbus.service.d/intergenos-capabilities.conf
  - /etc/systemd/system/systemd-tpm2-setup.service.d/intergenos-tss2-loglevel.conf
  - /etc/systemd/system/systemd-pcrextend.service.d/intergenos-tss2-loglevel.conf
  - /etc/systemd/resolved.conf.d/no-mdns.conf
  - /etc/systemd/user/wireplumber.service.d/restart.conf
  - /etc/modprobe.d/igos-dirty-frag-mitigation.conf
  - /etc/modprobe.d/disable-algif.conf
  - /etc/modprobe.d/pcspkr-alias-owner.conf
  - /etc/modprobe.d/rtw88-aspm.conf
  - /etc/modprobe.d/panic-record-retention.conf
  # The second half of the panic-record work (row 45): the kernel command
  # line fragment that gives the RAM-backed recorder a named region, and the
  # file that loads the recorder at boot. Neither is optional — without the
  # fragment the recorder has no memory, without the load file it never runs,
  # and in both cases a panic is recorded nowhere with nothing said about it.
  # The kernel console also reaches the serial port (decided 2026-09-20 after
  # CS-12): ttyS0 named ahead of tty0 so the screen stays /dev/console, plus the
  # switch that keeps the getty generator from putting a login prompt on every
  # machine's serial port (row 13 stays the installer's decision).
  - /etc/kernel/cmdline.d/20-console.conf
  - /etc/kernel/cmdline.d/30-panic-record.conf
  - /etc/modules-load.d/panic-record-ramoops.conf
  # The panic SCREEN, which needs neither the recorder nor a next boot: it
  # selects the formatter that draws the kernel log on the panic screen, so a
  # photograph of a dying machine carries the trace. Without this file a panic
  # prints three lines that name nothing.
  - /etc/kernel/cmdline.d/31-panic-screen.conf
  - /usr/lib/sysctl.d/60-intergenos-hardening.conf
  - /etc/gdm/custom.conf
  - /usr/bin/lsb_release
  - /usr/lib/systemd/system-preset/80-intergenos-enable.preset
  - /usr/lib/systemd/system-preset/99-intergenos-default-disable.preset
  - /usr/lib/tmpfiles.d/00-intergenos.conf
  - /root
  # FHS/LFS-7.5 skeleton (PI-Z22) — representatives of the class that was
  # absent on installed systems until base-files began shipping it.
  - /media/cdrom
  - /usr/local/bin
  - /var/opt
  # Merged-usr compat skeleton (L27 handoff, r7) — base-files is now the SOLE
  # archive shipping these after the 866838c1 seed-prune; checked against the
  # full chroot at squashfs (Step 4.5), where usr/{bin,lib,sbin} are populated
  # and /lib64 holds glibc's loader.
  - /bin
  - /lib
  - /sbin
  - /lib64
