# InterGenOS — declarative initialization of login-accounting files
# NOT covered by systemd's upstream /usr/lib/tmpfiles.d/var.conf.
#
# systemd's var.conf ships /var/log/wtmp, /var/log/btmp, and
# /var/log/lastlog. faillog is shadow-suite history and is NOT in
# systemd's var.conf, so we own it here to keep the install-time
# tmpfiles --create pass exhaustive across all four files LFS 13.0
# rows 32-35 cover.
#
# Removed wtmp/btmp/lastlog (2026-05-27 install #28 trace, anomaly C):
# duplicate-line warnings from systemd-tmpfiles fired because both
# 00-intergenos.conf AND systemd's var.conf declared them. Keeping
# systemd's declarations as canonical (same permissions, same owner)
# and owning only faillog here.
#
# Format: type path mode user group age argument
#   f = create empty file (idempotent)

f /var/log/faillog  0600 root root -
