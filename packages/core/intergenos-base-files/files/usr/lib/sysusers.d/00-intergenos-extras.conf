# InterGenOS — sysusers.d safety net (now empty).
#
# Historical: this file declared colord/polkitd/lp as a cross-cutting
# safety net while per-package sysusers.d migration was in progress
# (2026-05-27 install attempt #25). Migration completed at commit
# fa28e435 — every package whose build.sh used to call useradd/groupadd
# now ships its own /usr/lib/sysusers.d/<package>.conf.
#
# Keeping the file (empty) so packages.yml's files: list stays valid;
# the actual declarations now live in:
#   /usr/lib/sysusers.d/colord-sysusers.conf  (colord package)
#   /usr/lib/sysusers.d/polkit.conf           (polkit package)
#   /usr/lib/sysusers.d/cups.conf             (cups package — lp user)
#   /usr/lib/sysusers.d/basic.conf            (systemd upstream — lp group)
#
# Removing the duplicate declarations eliminates the systemd-tmpfiles
# "Conflict with earlier configuration" warnings emitted during install
# (2026-05-27 install #28 trace, anomaly B).
