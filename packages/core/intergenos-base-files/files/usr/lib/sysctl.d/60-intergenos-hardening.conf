# InterGenOS kernel hardening floor (decided 2026-09-14, R001.3 row 23).
#
# Every value here is a kernel tunable the shipped system used to leave at the
# kernel's own default, measured on installed systems: kernel.kptr_restrict 0,
# kernel.randomize_va_space 1 (the heap start was not randomised), the reverse
# path filter loose (2) on every interface, ICMP redirects accepted and sent on
# every interface, and martian packets never logged. None of them costs an
# ordinary desktop or laptop anything; each one closes a class of information
# leak or traffic redirection that a machine joining foreign networks is exposed
# to.
#
# ORDERING. systemd's own 50-default.conf sets the reverse path filter to the
# LOOSE value (2) through a glob over every interface that exists at boot. This
# file sorts after it, so it wins: the same glob, the "default" template that
# new interfaces inherit, and the "all" knob are all set here to strict (1) —
# the kernel applies the stronger of the "all" value and the interface's own
# value, so every one of them has to say 1 for an interface to be strict.
#
# THE VALUES ARE A FLOOR, NOT A CEILING. A machine that needs a different value
# states it in /etc/sysctl.d/ (sorted after this file, so it wins) — the one
# expected case is a router or multi-homed host with asymmetric routing, which
# sets net.ipv4.conf.all.rp_filter = 2 and the same for the interfaces concerned.
#
# WHAT IS DELIBERATELY NOT HERE. kernel.kexec_load_disabled is left alone: the
# shipped kernel runs with lockdown in integrity mode and signed-kexec enforcement
# (CONFIG_LOCK_DOWN_KERNEL_FORCE_INTEGRITY=y, CONFIG_KEXEC_SIG=y, both asserted
# by the required-symbol gate at kernel build time), which already refuses an
# unsigned kexec image while leaving a signed one available for crash dumps and
# a signed re-exec; the one-way switch would remove the signed path too.
# kernel.dmesg_restrict, kernel.yama.ptrace_scope, kernel.unprivileged_bpf_disabled
# and the fs.protected_* values are already at their hardened values from the
# kernel configuration and 50-default.conf and are not restated here. SMT is
# left ON: the kernel carries the mitigations for the known SMT-class flaws, the
# workloads on an InterGenOS machine are the user's own, and halving the
# processor is a cost the user chooses (nosmt or mitigations=auto,nosmt on the
# kernel command line).
#
# The installed-system gate tests/installed/test_gate_kernel_hardening_floor.py
# reads every value below back from /proc/sys on a real install and fails when
# the running kernel does not carry it.

# Kernel addresses in /proc/kallsyms, /proc/modules, dmesg and similar readers
# are hidden from unprivileged users (1). The stricter 2 hides them from root
# as well and breaks perf, ftrace and crash-dump analysis the machine's owner
# may legitimately run; 1 is the floor the row names.
kernel.kptr_restrict = 1

# Full address-space layout randomisation: stack, VDSO, shared libraries AND
# the heap start (brk). The kernel default 1 leaves the heap unrandomised. The
# kernel side of the same decision is CONFIG_COMPAT_BRK disabled in the
# shipped configuration (config/kernel/fragments/99-intergenos-overrides.config);
# with COMPAT_BRK enabled the kernel forces this value to 1 whatever is set here.
kernel.randomize_va_space = 2

# Strict reverse path filtering: a packet whose source address would not be
# routed back out of the interface it arrived on is dropped. 50-default.conf
# sets the loose value 2 on every interface through the same glob; this file
# sorts later, so these three lines win. Asymmetric-routing hosts set 2 in
# /etc/sysctl.d (see the header).
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.*.rp_filter = 1

# ICMP redirects rewrite the routing table of the host that accepts them. An
# end system on a foreign network has no reason to accept one, and an end
# system that is not a router has no reason to send one.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.*.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.*.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.*.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.*.accept_redirects = 0

# Log packets with impossible source addresses (martians) so that a spoofing
# attempt on the local segment is visible in the journal instead of silent.
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1
net.ipv4.conf.*.log_martians = 1
