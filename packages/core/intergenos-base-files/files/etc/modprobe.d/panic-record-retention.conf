# A kernel panic leaves a record the next boot can read — R001.3 gating row 45.
#
# Two kernel panics had been observed on this project's hardware when this file was
# written, both on the same laptop: 2026-07-08 and 2026-09-16. The first left a record,
# and the post-mortem could say where the fault was and rule causes out. The second left
# NOTHING in the firmware store, and the post-mortem written that day called the cause
# undeterminable. That was too strong, and the correction is recorded here rather than
# hidden (2026-09-20): the machine's journal from that boot does hold the last seven
# kernel lines before it stopped — an RCU stall self-detected on CPU 10 in the desktop
# compositor's process, with the instruction pointer in the cross-CPU call path
# (smp_call_function_many_cond), on a kernel tainted by an out-of-tree module. The
# print was cut off at that line; nothing after it reached the disk. A fragment is not
# a cause, and it is not the trace a recorder would have kept, but "nothing" was wrong.
# The same laptop ended abnormally four more times between 2026-09-16 and 2026-09-20,
# and none of those left a fault line at all; the argument below is unchanged by the
# correction and is stronger for the count.
#
# The difference is this module. The kernel's EFI pstore backend writes the tail of the
# panic log into UEFI variable storage, which survives a power cycle, and
# systemd-pstore.service moves those records to /var/lib/systemd/pstore on the next boot
# and clears them out of the firmware again. The backend IS built here
# (CONFIG_EFI_VARS_PSTORE=m), but the kernel's own default turns it off:
# drivers/firmware/efi/efi-pstore.c initialises its `pstore_disable` parameter from
# CONFIG_EFI_VARS_PSTORE_DEFAULT_DISABLE, which this tree's universal kernel baseline
# sets to y. efivars_pstore_init() then returns without registering, so on an installed
# system the module loads, does nothing, and no panic is ever recorded. This file turns
# it on at load, on every boot, with nobody having to remember.
#
# Why a file and not a one-off: in this kernel the parameter also has a setter
# (module_param_cb -> efi_pstore_disable_set), so writing it at runtime does register the
# backend. That is useful for a test and useless for a real panic, which does not
# announce itself in advance. Retention has to be the default state, not an action.
#
# On the firmware-wear tradeoff, which is why upstream ships this off: a panic loop on
# firmware that handles a full variable store badly can fill it. Three things bound that
# here. Each record is one UEFI variable of record_size bytes (1024, the upstream default,
# deliberately not raised without a measurement), the saved kmsg tail is capped
# (CONFIG_PSTORE_DEFAULT_KMSG_BYTES=10240), and systemd-pstore drains and erases the
# store on the very next boot so records do not accumulate across incidents. Against
# that: a machine that cannot say why it died costs a post-mortem every time. This file
# records the decision that the second cost is the larger one.
#
# The companion capture is the panic screen's QR code
# (CONFIG_DRM_PANIC_SCREEN_QR_CODE=y, added to the kernel overrides after the 2026-07-08
# panic and arriving with the R001.3 kernel). That one needs no storage but does need a
# person holding a phone at the right moment. This file is the half that works unattended.
#
# Enablement of the archiver itself is upstream systemd's (90-systemd.preset enables
# systemd-pstore.service, and it is matched before this project's 99- `disable *`
# catch-all); the enable-preset header records that systemd-* units are left to that file.
options efi_pstore pstore_disable=0
