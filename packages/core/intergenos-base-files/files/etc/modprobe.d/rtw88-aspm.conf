# Realtek RTL8821CE (rtw88) PCIe stability quirk — GBC003 G3-12.
#
# The 8821CE only leaves ASPM L1 briefly when an IRQ is raised; IRQs are masked
# during NAPI poll, so the PCIe link stays in L1, RX DMA goes extremely slow,
# and the link logs a flood of AER "Correctable RxErr" plus intermittent netdev
# (wlo1) drops. WORSE: on the HP 15-dw0037wm (.241, 2026-06-10) it escalated
# from that benign noise to a fatal "pci bus timeout, check dma status" DMA hang
# -> "Hardware restart was requested" that wedged the PCIe bus and LOCKED the
# whole machine. disable_aspm=y alone did NOT prevent the lockup (it ran with
# disable_aspm active), so this is paired with `pcie_aspm=off` on the kernel
# cmdline (forces ASPM off bus-wide, reaching the L1 substates the module param
# can't) — see installer/backend/config.py generate_kernel_cmdline + the static
# installer/init/cmdline.*.txt.
#
# disable_msi=y: the documented community fix pairs disable_aspm WITH disable_msi
# — MSI delivery problems on the 8821CE are a known cause of these DMA hangs, so
# fall back to legacy INTx interrupts.
#
# NOTE the parameters live on rtw88_pci (the bus module), NOT rtw88_8821ce — a
# prior on-hardware test set disable_aspm on rtw88_8821ce, which has no such
# parameter, so it silently did nothing. This targets the correct module.
#
# Device-scoped: rtw88_pci only loads on machines with an rtw88 Realtek wifi
# card, so these options have ZERO effect (and no power cost) on any other
# hardware. (The companion pcie_aspm=off cmdline IS bus-wide; that tradeoff is
# accepted because a card that freezes the system is the worse outcome.)
options rtw88_pci disable_aspm=y disable_msi=y
