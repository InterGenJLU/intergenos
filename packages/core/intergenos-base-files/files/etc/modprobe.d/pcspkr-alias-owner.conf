# Two drivers claim platform:pcspkr — this file says which one keeps it.
#
# The kernel this system ships builds both PC-speaker drivers as modules
# (CONFIG_INPUT_PCSPKR=m and CONFIG_SND_PCSP=m), and both register under the
# same bare platform-driver name, so the module index maps one alias to two
# modules:
#
#     alias platform:pcspkr pcspkr        input/misc — the console bell
#     alias platform:pcspkr snd_pcsp      sound/drivers/pcsp — an ALSA card
#                                         that plays through the PC speaker
#
# udev requests that alias once at boot; kmod resolves it to BOTH and loads
# them in index order. pcspkr binds first, and the kernel then refuses the
# second registration with
#
#     Error: Driver 'pcspkr' is already registered, aborting...
#
# — a line that names no module, on every boot. Two drivers cannot share a
# platform-driver name, so this is a choice the image makes here instead of
# leaving it to whichever module the index happens to list first.
#
# pcspkr keeps the alias. It is the driver that already wins, it is what the
# input subsystem and the console bell use, and it works. snd_pcsp would
# publish the PC speaker as an ALSA sound card — a square-wave beeper sitting
# in the sound device list beside the real codec, selectable as an output —
# and it pulls soundcore, snd, snd-timer and snd-pcm in behind it on every
# boot for a card that then fails to register anyway.
#
# `blacklist`, not `install ... /bin/false`, and that is deliberate: it
# suppresses only the autoload that goes through the alias, which is the whole
# mechanism above. Loading it by name still works. If you want the ALSA
# beeper, `sudo rmmod pcspkr` and `sudo modprobe snd_pcsp`; to make that the
# default, blacklist pcspkr here instead — you then lose the console bell.
blacklist snd_pcsp
