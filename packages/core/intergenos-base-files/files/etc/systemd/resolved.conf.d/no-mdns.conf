# Disable link-local peer name resolution (security hardening, PI-7).
# MulticastDNS and LLMNR both answer name queries from any unauthenticated
# peer on the local link — an attacker on the same L2 segment can spoof
# responses to poison/redirect name lookups, and the open listeners
# (5353/5355) are needless attack surface. InterGenOS resolves names via DNS
# only. (Filename is historical; this drop-in now covers both protocols.)
[Resolve]
MulticastDNS=no
LLMNR=no
