# Load the RAM-backed panic recorder at boot — R001.3 gating row 45.
#
# The parameters that configure it are on the kernel command line
# (/etc/kernel/cmdline.d/30-panic-record.conf), but nothing loads the module
# itself: the kernel builds it as a module (CONFIG_PSTORE_RAM=m) and no device
# or bus announces it, so without this file it is never loaded and the panic
# record has nowhere to go. A panic does not announce itself in advance, so the
# recorder has to be present from the start of every boot rather than loaded
# when someone remembers.
#
# If the reserved region could not be made, the module fails to register and
# says so in the boot log. That is the intended visible failure.
ramoops
