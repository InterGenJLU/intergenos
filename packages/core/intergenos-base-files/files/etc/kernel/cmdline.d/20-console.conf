# The kernel console reaches the serial port as well as the screen.
#
# WHAT THIS SETS. console= may be given more than once. Every console named
# receives the kernel's messages; the LAST one named becomes /dev/console, the
# device that init and the panic path write to. Naming the serial port first
# and the screen last therefore adds the serial port as a second kernel console
# without moving anything away from the screen: the panic screen, the boot
# messages and the login prompt on tty1 are exactly as before, and a serial
# cable now also carries the kernel log — including the last lines a dying
# machine prints, which is the one moment a screen photograph cannot be taken.
#
# WHY. Measured on an installed machine on 2026-09-20 (CS-12, the remote-login
# and serial surface): a login prompt was running on the serial port while the
# kernel console was the screen only, so a serial session could log in but saw
# none of the kernel's messages. Decided 2026-09-20: the shipped command line
# names the serial port ahead of the screen for R001.3.
#
# WHY systemd.getty_auto=0 RIDES WITH IT. systemd's getty generator reads the
# list of active kernel consoles at every boot and starts a login prompt
# (serial-getty@ttyS0) on each serial one it finds, by itself, outside any unit
# a package or the installer enabled. Without this switch, naming ttyS0 above
# would put a login prompt on the serial port of EVERY installed machine, which
# is exactly what the installer stopped doing on 2026-09-14 (R001.3 row 13: a
# serial login prompt is enabled only when the installer itself ran over a
# serial console — the one case in which someone demonstrably uses that port).
# The switch turns the generator's automatic instantiation off; the installer's
# decision remains the only source of a serial login prompt. The screen's own
# login prompt does not come from the generator: getty@tty1 is enabled by
# systemd's shipped preset (90-systemd.preset, "enable getty@.service"), so it
# is unaffected. The kernel console on the serial port needs no login prompt to
# be useful — it is the kernel's output, read with any terminal program.
#
# WHAT IT COSTS. The kernel writes its messages to a 115200-baud UART as well
# as to the screen. On a machine with no serial port the kernel finds no ttyS0,
# says so once in its log, and continues; the parameter is inert there.
#
# WHEN IT TAKES EFFECT. This file is merged into the signed kernel image's
# command line at image build time by the linux-kernel package's post-install
# hook, which concatenates /etc/kernel/cmdline.d/*.conf in sorted order. It
# reaches a machine at install time, and an already-installed machine at its
# next kernel update, after that machine reboots. Every flag is visible at
# `cat /proc/cmdline`; the active consoles at `cat /sys/class/tty/console/active`.
console=ttyS0,115200 console=tty0 systemd.getty_auto=0
