# A kernel panic shows the kernel's own record of what failed, on any machine.
#
# WHAT THIS SETS. The kernel draws a panic screen from inside the panic handler,
# on a display that is already lit, and it has two formatters. The default one,
# "user", prints exactly three lines — "KERNEL PANIC!", "Please reboot your
# computer." and the one-line reason the kernel passes in — and nothing about
# which code failed. "kmsg" draws the tail of the kernel log instead: the panic
# string, the instruction pointer, the call trace, the tainted line and the
# loaded modules. This file selects the second one.
#
# WHY. A machine running this system took a fatal exception in interrupt context
# on 2026-09-18 and showed the three-line screen. Nothing on it named the driver,
# and the machine's image predates the RAM-backed recorder configured by
# 30-panic-record.conf beside this file, so the panic was unrecorded twice over
# and could not be explained afterwards.
#
# The recorder and this screen are different paths and neither replaces the
# other. The recorder needs three things to be true at once — the reservation in
# the image, the recorder registering at boot, and a NEXT BOOT that runs
# systemd-pstore to read the region back. The screen needs none of them: it is
# drawn while the machine is dying, on the machine that is dying, and a
# photograph of it is a record even on a machine that has never been updated and
# never boots again. The kernel's default value is what decided this file: the
# screen was already being drawn on every panic, and it was drawn empty.
#
# WHY NOT THE QR-CODE FORMATTER. The kernel has a third formatter, "qr_code",
# which packs the same log into a QR code, and this tree's kernel fragments have
# asked for CONFIG_DRM_PANIC_SCREEN_QR_CODE since 2026-07-08. It has never been
# built: that option depends on RUST (drivers/gpu/drm/Kconfig), no fragment in
# this tree enables CONFIG_RUST, and the option is absent from the produced
# configuration of every kernel built here. A command line selecting qr_code on
# such a kernel does not fail — drm_panic.c falls back to the three-line screen
# and says nothing — so selecting it would be the quiet kind of failure. The
# kernel-log formatter is compiled in whenever the panic screen itself is
# (CONFIG_DRM_PANIC=y), which this tree sets.
#
# WHAT IT COSTS. Nothing at run time. The value is a 16-byte string in the drm
# module, read only when the panic handler draws, and it changes no code path
# before that moment. It is readable and writable at
# /sys/module/drm/parameters/panic_screen on a running machine, so a machine can
# be put back on the old screen without a rebuild if a reason ever appears.
#
# WHEN IT TAKES EFFECT. This file is merged into the signed kernel image's
# command line at image build time by the linux-kernel package's post-install
# hook, which concatenates /etc/kernel/cmdline.d/*.conf in sorted order. It
# therefore reaches a machine at install time, and an already-installed machine
# at its next kernel update, after that machine reboots. The parameter is visible
# at `cat /proc/cmdline` and the resulting mode at
# `cat /sys/module/drm/parameters/panic_screen`, which is what the installed gate
# tests/installed/test_gate_panic_record_backend.py reads.
drm.panic_screen=kmsg
