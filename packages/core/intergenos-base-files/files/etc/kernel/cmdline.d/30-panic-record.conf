# A kernel panic leaves a record the next boot can read — R001.3 gating row 45.
#
# This is the second half of the panic-record work. The first half
# (/etc/modprobe.d/panic-record-retention.conf) turns on the kernel's EFI pstore
# backend, which writes the tail of the panic log into UEFI variable storage.
# That half was necessary and is NOT sufficient: on 2026-09-16 a deliberate
# panic on a machine with the backend registered wrote nothing, and the firmware
# afterwards held no crash variable at all. The record was never written, not
# written and missed. Why the backend's own write did not land in panic context
# was not determined, and — this is the part that decided the design — it cannot
# be determined from userspace on a shipped system: the panic path is the
# kernel's non-blocking one, which no userspace probe can reach. A fix we could
# never verify is not a fix.
#
# So the record is taken out of the firmware's hands. These parameters give the
# kernel its own small piece of RAM to write the panic log into, which survives
# the warm reboot a panic causes, and systemd-pstore.service moves whatever is
# there to /var/lib/systemd/pstore on the next boot.
#
# WHY THE REGION IS NAMED RATHER THAN ADDRESSED. The obvious form of this is
# memmap= to carve out a fixed physical address plus ramoops.mem_address= to
# point the recorder at it. That form does not work on a machine of ours and
# must not be used. Measured 2026-09-16: with Secure Boot on, the kernel runs in
# integrity lockdown, and lockdown refuses module parameters the kernel marks as
# HARDWARE parameters. fs/pstore/ram.c declares exactly one of those —
# mem_address (line 49, module_param_hw). The boot logs
# "Lockdown: unsafe module parameters is restricted" and the recorder never
# starts. Every other parameter here (mem_name, record_size, max_reason) is an
# ordinary parameter and is permitted.
#
# reserve_mem=SIZE:ALIGN:NAME is the mechanism the kernel ships for exactly this
# situation: the kernel reserves the region itself, at an address it chooses,
# and the recorder asks for it by name. That also removes the problem no single
# machine could have solved — a fixed address that has to be free on every
# machine this project installs on. The kernel's own documentation carries the
# worked example (admin-guide/kernel-parameters.txt, reserve_mem; and
# admin-guide/ramoops.rst, "Using a region of memory reserved via reserve_mem").
#
# WHAT EACH PARAMETER DOES:
#   reserve_mem=1M:4096:pstore   reserve 1 MiB, 4 KiB-aligned, under the name
#                                "pstore". The kernel picks the address.
#   pstore.backend=ramoops       name the recording backend explicitly. pstore
#                                accepts ONE backend; without this line, which
#                                one registers would be a load-order race
#                                between this and the EFI backend.
#   ramoops.mem_name=pstore      the recorder takes the region reserved above.
#   ramoops.record_size=0x10000  64 KiB per record; the saved log tail is capped
#                                at 10 KiB (CONFIG_PSTORE_DEFAULT_KMSG_BYTES),
#                                so one record holds a panic with room to spare
#                                and 1 MiB holds sixteen of them.
#   ramoops.max_reason=2         record oopses and panics, the kernel's own
#                                default, stated here rather than assumed.
#
# The EFI backend's option file stays shipped. It costs nothing while this
# backend is the named one, and it is what a machine falls back to if this
# reservation ever cannot be made. reserve_mem is documented as best effort: if
# the kernel cannot place the region, the recorder does not register and the
# boot log says so, which is a visible failure rather than a silent one.
#
# This file is merged into the signed kernel image's command line at image build
# time by the linux-kernel package's post-install hook, which concatenates
# /etc/kernel/cmdline.d/*.conf in sorted order. It therefore reaches a machine
# at install time, and an already-installed machine at its next kernel update.
# Every flag here is visible at `cat /proc/cmdline`, which is the point.
reserve_mem=1M:4096:pstore pstore.backend=ramoops ramoops.mem_name=pstore ramoops.record_size=0x10000 ramoops.max_reason=2
