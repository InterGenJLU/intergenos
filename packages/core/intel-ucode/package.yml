name: intel-ucode
version: '20260512'
# release 2: ship the runtime post-install hook (standalone microcode
# upgrades now refresh the early-load image + UKI via the kernel hook chain)
release: 6  # r6: when the chained kernel hook refuses to sign the boot image, the line that finishes it names sudo pkm reinstall intel-ucode, the install the package manager marks unfinished; it named the kernel's reinstall, which left that mark in place. r5: the post-install passes on the chained kernel hook's refusal to sign the boot image (status 77) instead of logging a warning and exiting 0, so a microcode update whose boot image was not rebuilt is reported not finished and the package degraded, with the kernel hook's recovery line; any other failure of the chained hook is passed on as 1, a warning. r4: license: Intel-Microcode-License -> LicenseRef-Intel-Microcode-License — a valid SPDX identifier, so the new license-identifier gate passes and the SBOM/mirror index carry something resolvable. .PKGINFO carries license=, so this metadata-only change still needs the bump to reach installed systems on pkm upgrade. r3: post-install hook precondition guard — skip the microcode-cpio attempt with an info line when firmware is present but its tool is not yet deployed (dependency-derived first-install order); a failure with preconditions met still warns. Hand-bumped: hooks/ is outside the template hash, the bump forces the rebuild.
content_hash: 57d64ddcdb879974
description: Intel CPU microcode firmware
# Intel ships the microcode data files under its own redistribution license,
# which SPDX does not carry. LicenseRef- states that rather than forcing a
# nearby identifier that would describe a different license.
license: LicenseRef-Intel-Microcode-License
homepage: https://github.com/intel/Intel-Linux-Processor-Microcode-Data-Files
tier: core
build_style: custom
install_func: do_install
source:
- url: https://github.com/intel/Intel-Linux-Processor-Microcode-Data-Files/archive/refs/tags/microcode-${version}.tar.gz
  sha256: 5a07ce745d0bd8b360a4713564d46d5e38be797316a52abedaff0761e1b02370
dependencies:
  build:
  - iucode-tool
  host: []
  runtime: []

verify_paths:
  - /lib/firmware/intel-ucode
  - /var/lib/pkm/hooks/intel-ucode/post-install
