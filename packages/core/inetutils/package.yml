name: inetutils
version: '2.7'
release: 5  # r5: ping6 drops setuid for cap_net_raw+ep restored and read back after deployment; libcap is an explicit runtime dependency.
description: GNU network utilities
license: GPL-3.0-or-later
source:
- url: https://ftpmirror.gnu.org/inetutils/inetutils-${version}.tar.gz
  sha256: a156be1cde3c5c0ffefc262180d9369a60484087907aa554c62787d2f40ec086
dependencies:
  build: []
  host: []
  runtime:
  - libcap
  - ncurses
  - readline
tier: core
build_style: autotools
verify_paths:
  - /usr/bin/dnsdomainname
  - /usr/bin/ping
  - /usr/bin/ping6
  - /usr/lib/sysctl.d/50-ping-group-range.conf
