name: freetype-grub
version: "2.14.1"
release: 1
description: "FreeType (minimal — no HarfBuzz/PNG/Brotli) built in Chapter 8 before GRUB so GRUB's configure detects FreeType, enables build-time grub-mkfont, and compiles unicode.pf2. The full-featured freetype2 is rebuilt later in the desktop tier and replaces this copy."
license: FTL
homepage: https://www.freetype.org/
tier: core
build_style: custom
install_func: do_install
source:
- url: https://downloads.sourceforge.net/freetype/freetype-${version}.tar.xz
  sha256: 32427e8c471ac095853212a37aef816c60b42052d4d9e48230bab3bdf2936ccc
dependencies:
  build:
  - python   # meson's build scripts invoke python (meson.build:38) — required even
             # though FreeType's optional png/brotli/harfbuzz features are disabled
  host: []
  runtime: []
# bzip2 ships NO pkgconfig file upstream; freetype finds it via the direct
# library probe (`Bzip2: YES`). Not a loss.
# (silent-loss audit 2026-06-25.)
silent_loss_accepted:
  - bzip2   # no upstream .pc; built via direct lib fallback
verify_paths:
  - /usr/lib/libfreetype.so
