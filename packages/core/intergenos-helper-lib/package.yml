name: intergenos-helper-lib
version: "1.0.0"
release: 13  # r13: no behaviour change: one helper-lib.sh comment about superseding a partial-state sidecar now states the behaviour rather than attributing it to a role. Comment text only.  # r12: refusals that only a faulty installer script can reach now go through a new igos_helper_internal_fault, which tells the person at the terminal what happened, that nothing was installed and nothing on their machine changed, and that it is not theirs to fix — keeping the internal detail on a line marked for a maintainer. Ten sites previously printed only the internal detail (the library function called out of order, or a usage line), which is a note to ourselves on somebody else's screen. Behaviour and return codes are unchanged. r11: two changes to what helpers print. The notice that a helper declaring mixed 32/64-bit deposits has its per-file width check waived no longer goes to the terminal: it appeared on every successful install by such a helper, in vocabulary that means nothing outside this project, and the fact is already recorded durably — igos_helper_commit writes elf_class into the package's manifest, so the waiver is still answerable after the fact. The weak-signature security notice for Valve's repository is rewritten in plain words; it still states that the digest is weak, that the key is pinned and matched, that every downloaded byte is still bound by SHA-256 checksums, and that the acceptance is Steam-only. No verification behaviour changed. r10: neutral-language sweep of comments and printed text: decisions are recorded as "decided <date>" instead of being credited to a person or project role, development-host shorthand is replaced by a plain description, and the citations of a repository that is not published are replaced by what they were pointing at. Comments and strings only — no rule, path, flag, threshold or code path changed. The public-content scanner now carries detectors for all three classes (scripts/check-public-content.py), so the classes cannot return silently; tests/preflight/test_public_language_detectors.py proves each detector in both directions. r9: igos_helper_init says so when the helper was started by hand rather than by the package manager. A helper writes its footprint manifest either way, but only a package-manager-driven run reads that manifest into the package database, so a direct run leaves the payload on disk while the database goes on describing the previous payload — verify then reports files that are gone, and remove cannot clean up what it was never told about. The advisory existed only in each helper's not-root abort path, which is unreachable when the helper is run with sudo: that is, in exactly the case that produces the untracked install. It now prints from the shared library on every direct invocation including root, and stays quiet when PKM_HELPER_INVOCATION is set, which pkm sets for its own helper runs and which is not in pkm's environment allowlist so it cannot arrive from a caller's environment. Covered by tests/pkm/test_helper_footprint_lifecycle.py (both directions, plus that pkm actually sets the variable).
content_hash: c5070e79b82db2ba
description: Sourceable bash library for pkm install helpers — gives helpers an API for recording installed files / symlinks / depends to a manifest pkm reads at install time. Closes H-007.
license: GPL-3.0-or-later
homepage: https://github.com/InterGenJLU/intergenos
tier: core
build_style: custom
source: []
dependencies:
  build: []
  host:
    - coreutils-core
  runtime:
    - python
verify_paths:
