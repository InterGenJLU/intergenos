name: make-ca
version: "1.16.1"
release: 2  # hook-contract wave: profile.d/pythoncerts.sh moved post_install -> do_install (owned payload)
description: CA certificate management utility
license: MIT
homepage: https://github.com/lfs-book/make-ca
tier: core
build_style: custom
install_func: do_install

source:
  - url: https://github.com/lfs-book/make-ca/archive/v${version}/make-ca-${version}.tar.gz
    sha256: 98c7e6fded1938b972d0177b5d5e925d318be87f84ee9e4cad680656a8c29414

dependencies:
  build:
    - p11-kit
    - libtasn1
  host: []
  runtime:
    - p11-kit
verify_paths:
  - /etc/profile.d/pythoncerts.sh
  - /usr/sbin/make-ca
