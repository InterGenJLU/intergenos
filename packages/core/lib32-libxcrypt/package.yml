name: lib32-libxcrypt
version: "4.5.2"
release: 3  # r3: no recipe content changed: the two shared 32-bit build inputs the build style injects — scripts/lib32-env.sh and config/lib32/lib32-cross.ini — now fold into this package's content fingerprint, so a change to either rebuilds it instead of leaving it skipped under an older profile; r2: no built-byte change: the shared 32-bit build profile scripts/lib32-env.sh, declared in this recipe's source_tree, now records what the staging root already held before this package stages into it, so its staged-payload assertion judges what THIS build staged instead of everything in the root
content_hash: 9d6d1eb281c2a090
description: Modern password hashing library (32-bit multilib runtime)
license: LGPL-2.1-or-later
homepage: https://github.com/besser82/libxcrypt
tier: core
build_style: custom
install_func: do_install
lib32_source: libxcrypt
elf_class: "32"
# Mirror-only (D-W0-7: only lib32-glibc is ISO-resident).
iso_include: false
# Added 2026-07-03 (GE-01 launch-7): lib32-systemd-libs' meson configure
# hard-requires libcrypt (systemd's shared internal code) and refused with
# "C shared or static library 'crypt' not found" — the wave-2 authoring
# missed this twin. Build-time demand only: the shipped 64-bit
# libsystemd.so.0 NEEDs just libm/libc, so consumers do not runtime-depend
# on this package unless their own NEEDED says so. The reference multilib
# distro carries the same twin.
source:
- url: https://github.com/besser82/libxcrypt/releases/download/v${version}/libxcrypt-${version}.tar.xz
  sha256: 71513a31c01a428bccd5367a32fd95f115d6dac50fb5b60c779d5c7942aec071
dependencies:
  build:
  - lib32-glibc
  host: []
  runtime:
  - lib32-glibc
verify_paths:
  - /usr/lib32/libcrypt.so.2
  - /usr/lib32/pkgconfig/libxcrypt.pc

# Build inputs from the repository tree: declared here so an edit to one
# moves this package's content fingerprint and a targeted build rebuilds it
# (igos-build/content_hash.py arm (c)), and in sources_extra below so the
# published source archive carries them.
source_tree:
- scripts/lib32-env.sh

# Build inputs composed from the repository tree (declared so the published
# source archive carries every input the build consumes — the corresponding-
# source rule the kernel config fragments established; survey 2026-08-11).
sources_extra:
- scripts/lib32-env.sh
