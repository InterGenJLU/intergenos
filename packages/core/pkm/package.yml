name: pkm
version: "0.2.0"
release: 54  # r54: post_install no longer masks the timer enable — systemctl enable pkm-check-updates.timer runs bare inside the existing command -v systemctl guard, so a missing timer unit fails the package instead of shipping the update notifier permanently inert.  # r53: iso-prep asserts its own outcome. After the removals, every path a pruned package was known to own — from the database rows and its text manifest together — is looked for on disk, and one that is still there and that no remaining package records fails the prune, named and attributed. Two DESTDIR-staged compatibility symlinks of pruned packages survived a prune and reached the shipping-tree ownership gate as unowned content with nothing to attribute them to. PackageRemover now also records what it retained on purpose, so co-owned payload and preserved configuration cannot read as residue.  # r52: no behaviour change: two source comments reworded during the pre-release register pass — internal project shorthand replaced with the plain engineering terms it stood for (pkm/cli.py, pkm/installer.py). Comment text only; no code, no interface, no data.  # r51: every long pkm operation now reports its parts while it runs, and `pkm upgrade` now tells the truth about what it did. THE STANDARD. A new module, pkm/progress.py, states one shape for every long-running operation and generalises the shape the one-time database update established rather than inventing a second one: announce the work before it starts, name the part that is running, report that a running part is still working, and state the outcome. The announce and outcome lines print at every verbosity including quiet, because a request for less output is not a request for a silent multi-minute pause; the detail between them is suppressed at quiet as usual. Every console write is guarded, so reporting can never stop the work it describes. It is enforced as a standard and not applied as a list of fixes: a test reads pkm's own source and fails when a command grows a new loop over the installed corpus without reporting progress and without an exemption that states its reason. THE THREE SILENT LOOPS. `pkm verify --all` reads and hashes every owned file on the machine and printed nothing for over forty seconds; `pkm import` walks every installed package's manifest; `pkm remove` unlinks a whole payload and then walks the ancestor closure of every path it touched. Each reports through a callback the library exposes and the command drives, so the library keeps no console of its own and a callback that raises cannot abort the work. THE DOWNLOAD. The response body was copied by one blocking call, which is why the transfer could report nothing; it is now read in bounded chunks and reports bytes, percentage and rate, with no percentage at all when the server declares no length. NEW COMMAND `pkm vacuum`, with its man page. Removing packages and collapsing duplicated records leave unused pages inside the database file; compaction is explicit and nothing fires it automatically, because a whole-file rewrite needs free space of about twice the file and belongs to the person whose disk it is. A maintenance step that frees a large number of records advises in one line instead. The space check is fail-closed, and the preview states the same decision the real command would make and runs without root. STATUS TRUTHFULNESS. Three defects measured during a multi-package upgrade on 2026-08-06: the command exited 0 while reporting a CRITICAL post-install hook failure, so anything gating on the exit code was told it had worked; the update advisory that drives the desktop indicator was rewritten only on clean success, so a package that deployed and then failed its hook left the indicator lit against a stale count; and the `.pkmnew` config sidecars an upgrade writes were never named, because the message carrying them is discarded on success. The exit code now reflects a failed member, the advisory refresh keys on whether installed state changed, and the sidecars come back to the caller as data and are reported once at the end. STALE BYTECODE. A deploy that replaces a Python module now drops that module's cached bytecode: a deployed file's timestamp comes from the archive, so a replaced module can present the same modification time and size the stale cache was built against and the interpreter runs the old code with nothing to indicate it did. An installed fix that does not execute is a machine whose owner has been told they are patched and is not. COVERAGE. Five new test files, 82 cases. PROVEN AGAINST REALITY: `pkm vacuum` was fired end to end against real databases and caught two defects in this change that the unit cases did not — a preview promising a rebuild the command would decline, and figures read before the write-ahead log was checkpointed, which reported nothing returned for a rebuild that took a file from 30,883,840 to 798,720 bytes. The stale-bytecode failure is reproduced against a real interpreter before the fix is applied. NOT PROVEN HERE: the download reporting has not run against the live mirror, and no chroot build cycle has run.  # r50: the SOURCE-BUILD lane now STATES the hook-managed content class that r49 taught the import path to carry. r49 closed the reader; a from-scratch mint still produced manifests that stated nothing, because the build drivers write the manifest from the PRISTINE staged files and run `pkm import` before they ever run the recipe's post_install — so a payload file the hook rewrote in place kept a hash that can never match again, and the image metadata-sync gate refused a correct build. THE MECHANISM. Two new commands give that lane the same evidence the archive install path already has: `pkm hook-baseline <package> --out FILE` records the sha256 of every regular file the package owns, and `pkm record-hook-changes <package> --baseline FILE` compares them afterwards, records the files whose content changed across that window as hook-managed, and re-emits the text manifest stating the class so the record survives a later import. Both are documented in the man page (Rule 15). THE WINDOW IS THE EVIDENCE: a file that merely disagrees with its recorded hash is NEVER reclassified, because inferring a hook from a disagreement would stop the byte check on a damaged file — the opposite of the point. A file another package owns is never reclassified either. WIRING. Every build driver that runs a recipe's post_install now brackets it — the four bash drivers through two shared functions in scripts/pkg-functions.sh so all four follow one rule, and the Python builder through two tracker methods. A recording failure is reported and never fails a build: the package on disk is correct, and the condition worth surfacing is that its classification may be wrong on the shipped image. COVERAGE. tests/pkm/test_source_lane_hook_managed_recording.py, 8 cases, all red before this change; tests/preflight/test_driver_hook_recording_wiring.py, 4 cases plus subtests, which DERIVE the driver list by reading the scripts so a new driver that skips the brackets fails rather than ships. Both refusals are mutation-checked: removing the ownership scope and inferring from divergence each kill exactly their own case and nothing else. PROVEN END TO END on real artifacts — the banked from-scratch chroot database, the real docbook-xml-4.5 archive and the real post-hook catalog.xml: with the recording skipped the gate FAILS on that path, and with it the producer emits the header, the import carries it and the same gate PASSES. NOT PROVEN HERE: a real chroot build cycle, which rides the build VM.  # r49: the hook-managed content class now survives `pkm import`, including on a database that has never seen the package. r48 recorded the reclassification in the SQLite row only, and the import could recover it just by carrying it from a row that already had it — so a source-built chroot, which registers every package for the first time, imported those files as ordinary owned content and the ISO metadata-sync gate byte-compared them against pre-hook payload bytes and refused a correct image. Measured on the banked ge9b-13 chroot database: 881,959 file rows, none carrying the class, with docbook-xml's catalog.xml recorded at the pristine payload hash while the live file was the xmlcatalog product. THE MECHANISM. The text manifest — the artifact the import actually reads — can now state the class, as `HOOK-MANAGED: <path>` header lines above FILE LIST, and the install path emits them for the files a package's own sealed hook created or rewrote. The header sits above FILE LIST so a reader written before this field existed skips it as an unrecognized header rather than mistaking it for a path. The install path also re-emits its manifest when a hook only REWROTE its own payload and created nothing — docbook-xml's exact shape — which the previous keying on created paths alone missed. THE REFUSALS. A manifest may classify only paths it lists in its own FILE LIST, and marking a path never reaches the ownership record another package holds for it; downgrading a record to existence-only stops the byte check on that file, so an import able to move the class between packages would be a way to launder a tampered file into a classification that no longer inspects it. Every rejected claim is printed by `pkm import`, naming the manifest, the package and the path, and is recorded for callers. PROOF. Fired against the real artifacts, not fixtures: the banked chroot database, the real docbook-xml-4.5 archive, the real post-hook catalog.xml off a live installed system and the real ISO metadata-sync gate. With the manifest stating nothing the gate FAILS on that exact path, which is the ge9b-13 halt reproduced; with the manifest the fixed writer emits, the same gate PASSES with one path existence-only. A manifest naming a real path owned by a real other package in the same database was refused, reported, and left that package's record untouched. COVERAGE. tests/pkm/test_import_hook_managed_attribution.py, 7 cases: attribution on a from-scratch import, install-then-import-into-an-empty-database, verify staying clean afterwards, the undeclared-path refusal and its report, the other-package record left alone with its byte check still strict, a manifest without the header classifying nothing, and the pre-existing carry rule still working. NOT CLOSED BY THIS RELEASE: the source-build drivers run post_install AFTER writing the manifest and after `pkm import`, so nothing yet emits these headers on that path.  # r48: a payload file rewritten in place by the package's OWN sealed lifecycle hook is reclassified to the hook-generated content class at hook-record time (existence-checked, named bucket) — without this, verify reports designed behavior as damage forever and the ISO metadata gate refuses a correct image (docbook-xml's xmlcatalog-rewritten catalog.xml, first fired on the ge9b-13 mint). Files another package owns keep the original reported-never-absorbed rule; an unhooked package's byte checks are untouched. Companion: check-iso-metadata-sync.py reads the recorded flag for the same existence-only treatment.  # r47: the one-time files-table uniqueness update is refactored for time and for visibility; its meaning is unchanged. THE MECHANISM. r46 selected the surviving row by asking, for every row, whether it was the newest row for its (package_id, path) — a correlated scalar subquery evaluated once per row, and a second one beside it to inherit a source label. The only index usable for that lookup covers package_id alone, so each evaluation rescanned the whole of its package's rows: the work grew with the SUM OF THE SQUARES of the per-package row counts rather than with the size of the database. Measured against a copy of a real installed system's database — 881,959 file rows across 1,006 packages, the largest holding 118,775 of them — that is 89 billion row visits for a table of under a million rows, and the update had not finished after forty minutes at full processor load. It now asks the question once instead of once per row: a single grouped pass records, for each (package_id, path), the row id to keep, how many rows the group held and any source label present anywhere in it, and the rebuild joins that summary to the table by INTEGER PRIMARY KEY, which is a direct row lookup. The duplicate count that r46 obtained from its own second grouped pass now falls out of the same pass. Same database, same machine: 5.0s against a run that had not completed in over forty minutes; on synthetic corpora, 20,000 rows in one package took 83.66s under r46 and 0.20s here, and 200,000 rows across 200 packages 422.41s against 2.39s. ONE MEANING IS TIGHTENED, deliberately: where duplicates carried DIFFERENT source labels, r46 inherited whichever row the database happened to return first, which was arbitrary and could differ between runs over the same rows; the label is now the maximum, which is deterministic and, for the two labels that exist, prefers 'helper' over 'archive' — the label whose loss the inheritance rule exists to prevent. A differential harness ran both mechanisms over one corpus carrying every duplicate shape and compared all eight columns of every surviving row: identical except for that case, which it also demonstrates. VISIBILITY. The update ran for that whole time printing nothing, and an operation that prints nothing cannot be told from a hang. It now states what it is about to do, that it happens once, that it changes no installed file, and how many records it will check, BEFORE it starts; names each step as it reaches it; and, while a step is still running, reports that it is still working. The heartbeat rides SQLite's own progress callback, so liveness is reported from inside the statement that is actually working rather than by a timer that cannot see it. The opening and closing lines are shown at every verbosity including quiet — a request for less output is not a request for a silent multi-minute pause — while the step detail between them follows the usual prose rules. Every console write is guarded: a closed output stream or a failing console cannot abort a database update, which is the more serious failure the reporting was added to prevent. Nothing is printed at all when the constraint is already present, which is the path every database open takes. COVERAGE. tests/pkm/test_files_migration_performance_and_output.py, 11 cases: two wall-clock budgets on corpora shaped to expose the old cost (20,000 rows in one package, and 200,000 rows across 200 packages), a budget-free structural check that asks SQLite for its query plan and refuses a correlated scalar subquery, and output checks covering the announcement before the work, the per-step lines, the outcome in both the duplicates and no-duplicates directions, the quiet-level behaviour, silence when there is nothing to do, absence of internal vocabulary in user-facing text, a heartbeat proven to fire rather than assumed to, and a hostile console proven unable to damage the update. The 15 r46 cases covering the collapse semantics are unchanged and still pass.
