description: InterGenOS package manager — install, remove, query, verify
license: GPL-3.0-or-later
homepage: https://github.com/InterGenJLU/intergenos
# Tier moved core → desktop in 2026-05-09 stub-pattern audit follow-up:
# the previous tier:core declaration mirrored apparmor's pre-f190f1c shape
# (declared as core but NOT wired into either chroot-build-ch8.sh or
# chroot-build-core-extra.sh), which silently skipped pkm at install-time.
# The Python builder handles tier:desktop via topological sort and accepts
# `source: []` (builder.extract_source returns the empty work dir
# gracefully when no source is declared).
tier: core
build_style: custom
source: []
# pkm's source is the top-level pkm/ tree (build.sh copies from
# /mnt/intergenos/pkm/). Folded into the skip-built fingerprint.
source_tree:
  - pkm
dependencies:
  build: []
  host: []
  runtime:
  - python
verify_paths:
  - /usr/bin/pkm
  - /usr/lib/python3.14/site-packages/pkm
  - /etc/pkm/repos.conf
  # Q8 notification surface (Phase B + D)
  - /usr/lib/systemd/system/pkm-check-updates.service
  - /usr/lib/systemd/system/pkm-check-updates.timer
  - /etc/update-motd.d/90-pkm-pending
  # PI-218-1 — repo cache dirs created at boot (closes the fresh-install crash)
  - /usr/lib/tmpfiles.d/pkm.conf
