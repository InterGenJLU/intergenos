name: pkm
version: "0.2.0"
release: 63  # r63: the Welcomer's install path now runs one package transaction for a multi-item selection, so the closing REBOOT REQUIRED advisory is printed once at the end instead of scrolling away under a second install; Reporter.phase names the extract and deploy parts of a single package's install, which ran silently between the download line and the completion line; the REBOOT REQUIRED section of the next-steps block is painted bold amber on a terminal and byte-plain otherwise, decided by the same helper the severity prefixes use (pkm/services.py, pkm/output.py, pkm/installer.py, pkm/cli.py). r62: the upgrade path's rollback save actually finds the outgoing archive, and rollback coverage is reported once per transaction instead of once per package. _save_rollback_archive built only the release-qualified filename (`<name>-<version>-<release>.igos.tar.gz`) while repo.download_package caches under the signed index's `filename` field, which the live index publishes RELEASE-LESS (all 1,126 entries measured 2026-08-21) — so the save missed on every upgrade on every system since the mechanism landed (/var/cache/pkm/rollback/ existed nowhere in the fleet) and every upgraded package printed a "no cached archive … rollback unavailable" warning whose `cache clean --keep-current` remedy cannot help a cache that holds nothing. The lookup now checks both shapes, most-specific first (new helper _cached_old_archive); the saved copy keeps the fully-qualified name so `cache clean --rollback` parsing is unchanged. The per-package warning is replaced by ONE truthful pre-transaction line naming the protection that actually applies, in order of strength: a pre-transaction restore point captured by a registered handler (cmd_upgrade now reads run_pre_transaction_hook's result instead of discarding it), a kept rollback copy for every member, or — normal for the first upgrade after a fresh installation, whose pkg cache has never held anything — neither, stated calmly with the count. No mainstream package manager warns per package here; ours no longer does either, and unlike them it says what protection IS in force. COVERAGE: tests/pkm/test_upgrade_rehash_threading.py gains the release-less-shape case (the live-index reality the old test suite never pinned — the bug survived because the only test used the qualified shape) and a both-shapes precedence case.  # r61:`pkm remove` fires a package's post-remove hook once the removal has completed, completing the removal path's hook pair. pkm/hooks.py has named post_remove in LIFECYCLE_EVENTS since the R001 root and nothing invoked it, so a package could ship an executable at /var/lib/pkm/hooks/<name>/post-remove and state in its own documentation that it runs at remove time while the removal walked past it — the same silent-failure class the pre-remove surface closed from the other end. The hook fires AFTER the file-removal walk and after the database row is gone, which is what it is for: work that is only correct once the payload is off disk. Chroot-aware, non-fatal and environment-stripped exactly as the pre-remove hook is, sharing one implementation with it so the two cannot drift. The new run_post_remove_hook argument defaults to None meaning FOLLOW the pre-remove decision, so the four call sites that already opt out — proprietary-install rollback, reinstall, upgrade and the mint-chroot iso-prep prune — exclude both hooks without repeating themselves, and a future call site cannot exclude one and silently keep the other. COVERAGE: tests/pkm/test_post_remove_hook.py, 18 cases driving the REAL remover — ordering proven by a hook that records whether the payload was still on disk, plus argv, environment allowlist, non-fatal failure, non-executable and unrunnable hooks, the inheritance default and its explicit override, and an AST assertion over every opt-out call site. A mutation control moving the firing point ahead of the walk fails the ordering cases, so they detect the defect they exist for. NOT CHANGED HERE: the nvidia recipe still does not install its post-remove script, so that package's boot-image rebuild remains unwired on real systems and its KERNEL-CMDLINE document, which states the boot image is not rebuilt by a removal, remains true; a test pins those two to move together.  # r60: `pkm remove` builds its file list from the UNION of the database rows and the package's own text manifest — the same union the iso-prep outcome assertion (r53) already checks. The database rows alone have been incomplete on a real substrate: a compatibility symlink recorded only in the text manifest, as a trailing-slash directory entry the database import dropped, survived every removal, and the r53 assertion caught the pair (/opt/jdk, /opt/rocm/llvm) live on 2026-08-20 — the same two paths its origin note records from the 2026-08-15 build, now with the cause determined. Manifest-only paths join the removal set and disk truth still classifies each one; the FHS-skeleton refusal, the co-ownership chokepoint and config preservation apply to them identically, and a path on neither disk nor database is a no-op. The assertion stays: fixing one cause of a bad outcome does not retire the outcome check. COVERAGE: the residue-assertion case pinning the measured shape now proves the union-fed removal unlinks the symlink and the prune passes (tests/pkm/test_iso_prep_residue_assertion.py); full pkm suite 952 green. NOT PROVEN HERE: the in-chroot iso-prep firing, which rides this build cycle's relaunch. SURFACED, not fixed here: the manifest generator records a symlink-to-directory as a trailing-slash directory entry (it stat-follows the link) and the database import drops that row — the data-source defect gets its own fix and proof.  # r59: the post_install hook is removed. It existed only to enable pkm-check-updates.timer, which 80-intergenos-enable.preset whitelists and the real preset engine resolves to enabled — so the call was redundant on a fresh install and re-applied that decision on every upgrade over whatever the user had chosen since. The `command -v systemctl` guard went with it: it was a real named condition while there was a call inside it to guard, and with the call gone the function was empty. pkm fires hooks on every install and upgrade, so an empty one is not free. # r58: a lifecycle hook's own output now reaches the person running pkm. A hook is the only part of a package that speaks at install time, and everything one printed was discarded whenever it exited 0 — the result carried the word OK and nothing else — so a hook that reported what it had decided about a machine was silent in exactly the case that happens. The systemd recipe's preset branch, which states whether it left a machine's service enablement alone and why, was the change that surfaced it: the line it prints could not reach a user upgrading that package on a running system, because the forensic trace has no sink open for a standalone pkm command and the message set carried no trace of it either. Both streams are now reported, because a hook that warns and still exits 0 puts that warning on stderr and a warning nobody sees is the same defect in a different stream. A hook that prints nothing still yields exactly the one OK line it always did, so the packages with no lifecycle hook and the quiet ones that have one read unchanged. Separately, the failure status line shortens a long stderr to stay readable and now says when it has done so: a cap that leaves no mark turns 'there was more' into 'that was all', which is the harder error to notice because the reader has no reason to look for the rest. COVERAGE: five cases in tests/pkm/test_hooks.py, four of them red before this change and the fifth a control proving the quiet case stays quiet.  # r57: no behaviour change: one pkm/cli.py comment about exit-code truth and one comment in the update-check timer unit now use plain engineering terms. Comment text only; no code, no interface, no data, and the timer's schedule is unchanged.  # r56: build.sh's header comment drops its hardcoded version string — the recipe's version field is the single home for that value, and the header had drifted a full minor version behind it. Comment text only; no code, no interface.  # r55: `pkm remove` now runs a package's pre-remove hook before it deletes anything. A package could ship an executable at /var/lib/pkm/hooks/<name>/pre-remove and state in its own documentation that the script runs at remove time, and nothing ever ran it — the removal path invoked no external command at all. THE PURPOSE of such a hook is work that is only possible while the package's payload is still on disk: stopping a service the package provides, unloading kernel modules built from it, and deleting files the package created after its manifest was sealed — those files are in no manifest, so the file-removal walk cannot see them and they survive the removal unless something removes them first. THE FIRING POINT is after the two checks that can still refuse a removal (not installed, reverse dependencies) and before the file list is read, so a refused removal runs nothing and a package with no tracked files — which is still a package being removed — fires its hook too. THE EXECUTION shape mirrors the install-side per-package hook: the inherited environment is stripped to the lifecycle-hook allowlist before the hook is given PKM_PACKAGE_NAME, PKM_PACKAGE_VERSION and PKM_PACKAGE_ROOT, and on a chroot target the hook runs under chroot so /lib/modules, /etc and /boot resolve to the target rather than to the machine driving the removal. Failure is reported — a non-zero exit and an exec that could not happen at all both print a warning naming the package, what went wrong and the path to re-run — and the removal then proceeds, because a removal that stopped on a failed cleanup script would leave the package half-present with no way forward. WHICH CALLERS FIRE IT is a decision per call site rather than a default every caller of remove() inherits: `pkm remove` and `pkm autoremove` fire it; `pkm iso-prep` does not, because that is the build-time prune of packages the image never ships and it runs inside the mint chroot, whose /run, /proc and /sys belong to the build machine, so a hook fired there would act on the builder for a package that was never in service on any machine; `pkm upgrade` and `pkm reinstall` do not, because the package is not going away and a hook written for an uninstall would tear down runtime state the replacement expects to keep; the proprietary-install rollback does not, because it undoes an install that never completed. Decided 2026-08-19. COVERAGE: tests/pkm/test_pre_remove_hook.py, 20 cases driving the real remover — the hook firing, its ordering proven against a payload file that must still be present when it runs, the non-fatal reporting in both failure directions, the executable-bit refusal, the stripped environment with a planted variable proven not to reach the hook, the refused-removal and absent-package cases, the opt-out, and the argument at each of the six call sites read out of the source so a later edit to one cannot pass unnoticed. Six controlled mutations were run and each killed exactly its own case; the first run of that battery found one test passing under its own mutation (the executable-bit case was measuring the kernel refusing the exec, not the guard) and it was strengthened until it failed. NOT PROVEN HERE: no chroot build cycle has run, and the chroot branch is proven by the command the remover builds and runs rather than by a real chroot(2), which needs privilege the suite does not take.  # r54: post_install no longer masks the timer enable — systemctl enable pkm-check-updates.timer runs bare inside the existing command -v systemctl guard, so a missing timer unit fails the package instead of shipping the update notifier permanently inert.  # r53: iso-prep asserts its own outcome. After the removals, every path a pruned package was known to own — from the database rows and its text manifest together — is looked for on disk, and one that is still there and that no remaining package records fails the prune, named and attributed. Two DESTDIR-staged compatibility symlinks of pruned packages survived a prune and reached the shipping-tree ownership gate as unowned content with nothing to attribute them to. PackageRemover now also records what it retained on purpose, so co-owned payload and preserved configuration cannot read as residue.  # r52: no behaviour change: two source comments reworded during the pre-release register pass — internal project shorthand replaced with the plain engineering terms it stood for (pkm/cli.py, pkm/installer.py). Comment text only; no code, no interface, no data.  # r51: every long pkm operation now reports its parts while it runs, and `pkm upgrade` now tells the truth about what it did. THE STANDARD. A new module, pkm/progress.py, states one shape for every long-running operation and generalises the shape the one-time database update established rather than inventing a second one: announce the work before it starts, name the part that is running, report that a running part is still working, and state the outcome. The announce and outcome lines print at every verbosity including quiet, because a request for less output is not a request for a silent multi-minute pause; the detail between them is suppressed at quiet as usual. Every console write is guarded, so reporting can never stop the work it describes. It is enforced as a standard and not applied as a list of fixes: a test reads pkm's own source and fails when a command grows a new loop over the installed corpus without reporting progress and without an exemption that states its reason. THE THREE SILENT LOOPS. `pkm verify --all` reads and hashes every owned file on the machine and printed nothing for over forty seconds; `pkm import` walks every installed package's manifest; `pkm remove` unlinks a whole payload and then walks the ancestor closure of every path it touched. Each reports through a callback the library exposes and the command drives, so the library keeps no console of its own and a callback that raises cannot abort the work. THE DOWNLOAD. The response body was copied by one blocking call, which is why the transfer could report nothing; it is now read in bounded chunks and reports bytes, percentage and rate, with no percentage at all when the server declares no length. NEW COMMAND `pkm vacuum`, with its man page. Removing packages and collapsing duplicated records leave unused pages inside the database file; compaction is explicit and nothing fires it automatically, because a whole-file rewrite needs free space of about twice the file and belongs to the person whose disk it is. A maintenance step that frees a large number of records advises in one line instead. The space check is fail-closed, and the preview states the same decision the real command would make and runs without root. STATUS TRUTHFULNESS. Three defects measured during a multi-package upgrade on 2026-08-06: the command exited 0 while reporting a CRITICAL post-install hook failure, so anything gating on the exit code was told it had worked; the update advisory that drives the desktop indicator was rewritten only on clean success, so a package that deployed and then failed its hook left the indicator lit against a stale count; and the `.pkmnew` config sidecars an upgrade writes were never named, because the message carrying them is discarded on success. The exit code now reflects a failed member, the advisory refresh keys on whether installed state changed, and the sidecars come back to the caller as data and are reported once at the end. STALE BYTECODE. A deploy that replaces a Python module now drops that module's cached bytecode: a deployed file's timestamp comes from the archive, so a replaced module can present the same modification time and size the stale cache was built against and the interpreter runs the old code with nothing to indicate it did. An installed fix that does not execute is a machine whose owner has been told they are patched and is not. COVERAGE. Five new test files, 82 cases. PROVEN AGAINST REALITY: `pkm vacuum` was fired end to end against real databases and caught two defects in this change that the unit cases did not — a preview promising a rebuild the command would decline, and figures read before the write-ahead log was checkpointed, which reported nothing returned for a rebuild that took a file from 30,883,840 to 798,720 bytes. The stale-bytecode failure is reproduced against a real interpreter before the fix is applied. NOT PROVEN HERE: the download reporting has not run against the live mirror, and no chroot build cycle has run.  # r50: the SOURCE-BUILD lane now STATES the hook-managed content class that r49 taught the import path to carry. r49 closed the reader; a from-scratch mint still produced manifests that stated nothing, because the build drivers write the manifest from the PRISTINE staged files and run `pkm import` before they ever run the recipe's post_install — so a payload file the hook rewrote in place kept a hash that can never match again, and the image metadata-sync gate refused a correct build. THE MECHANISM. Two new commands give that lane the same evidence the archive install path already has: `pkm hook-baseline <package> --out FILE` records the sha256 of every regular file the package owns, and `pkm record-hook-changes <package> --baseline FILE` compares them afterwards, records the files whose content changed across that window as hook-managed, and re-emits the text manifest stating the class so the record survives a later import. Both are documented in the man page (Rule 15). THE WINDOW IS THE EVIDENCE: a file that merely disagrees with its recorded hash is NEVER reclassified, because inferring a hook from a disagreement would stop the byte check on a damaged file — the opposite of the point. A file another package owns is never reclassified either. WIRING. Every build driver that runs a recipe's post_install now brackets it — the four bash drivers through two shared functions in scripts/pkg-functions.sh so all four follow one rule, and the Python builder through two tracker methods. A recording failure is reported and never fails a build: the package on disk is correct, and the condition worth surfacing is that its classification may be wrong on the shipped image. COVERAGE. tests/pkm/test_source_lane_hook_managed_recording.py, 8 cases, all red before this change; tests/preflight/test_driver_hook_recording_wiring.py, 4 cases plus subtests, which DERIVE the driver list by reading the scripts so a new driver that skips the brackets fails rather than ships. Both refusals are mutation-checked: removing the ownership scope and inferring from divergence each kill exactly their own case and nothing else. PROVEN END TO END on real artifacts — the banked from-scratch chroot database, the real docbook-xml-4.5 archive and the real post-hook catalog.xml: with the recording skipped the gate FAILS on that path, and with it the producer emits the header, the import carries it and the same gate PASSES. NOT PROVEN HERE: a real chroot build cycle, which rides the build VM.  # r49: the hook-managed content class now survives `pkm import`, including on a database that has never seen the package. r48 recorded the reclassification in the SQLite row only, and the import could recover it just by carrying it from a row that already had it — so a source-built chroot, which registers every package for the first time, imported those files as ordinary owned content and the ISO metadata-sync gate byte-compared them against pre-hook payload bytes and refused a correct image. Measured on the banked ge9b-13 chroot database: 881,959 file rows, none carrying the class, with docbook-xml's catalog.xml recorded at the pristine payload hash while the live file was the xmlcatalog product. THE MECHANISM. The text manifest — the artifact the import actually reads — can now state the class, as `HOOK-MANAGED: <path>` header lines above FILE LIST, and the install path emits them for the files a package's own sealed hook created or rewrote. The header sits above FILE LIST so a reader written before this field existed skips it as an unrecognized header rather than mistaking it for a path. The install path also re-emits its manifest when a hook only REWROTE its own payload and created nothing — docbook-xml's exact shape — which the previous keying on created paths alone missed. THE REFUSALS. A manifest may classify only paths it lists in its own FILE LIST, and marking a path never reaches the ownership record another package holds for it; downgrading a record to existence-only stops the byte check on that file, so an import able to move the class between packages would be a way to launder a tampered file into a classification that no longer inspects it. Every rejected claim is printed by `pkm import`, naming the manifest, the package and the path, and is recorded for callers. PROOF. Fired against the real artifacts, not fixtures: the banked chroot database, the real docbook-xml-4.5 archive, the real post-hook catalog.xml off a live installed system and the real ISO metadata-sync gate. With the manifest stating nothing the gate FAILS on that exact path, which is the ge9b-13 halt reproduced; with the manifest the fixed writer emits, the same gate PASSES with one path existence-only. A manifest naming a real path owned by a real other package in the same database was refused, reported, and left that package's record untouched. COVERAGE. tests/pkm/test_import_hook_managed_attribution.py, 7 cases: attribution on a from-scratch import, install-then-import-into-an-empty-database, verify staying clean afterwards, the undeclared-path refusal and its report, the other-package record left alone with its byte check still strict, a manifest without the header classifying nothing, and the pre-existing carry rule still working. NOT CLOSED BY THIS RELEASE: the source-build drivers run post_install AFTER writing the manifest and after `pkm import`, so nothing yet emits these headers on that path.  # r48: a payload file rewritten in place by the package's OWN sealed lifecycle hook is reclassified to the hook-generated content class at hook-record time (existence-checked, named bucket) — without this, verify reports designed behavior as damage forever and the ISO metadata gate refuses a correct image (docbook-xml's xmlcatalog-rewritten catalog.xml, first fired on the ge9b-13 mint). Files another package owns keep the original reported-never-absorbed rule; an unhooked package's byte checks are untouched. Companion: check-iso-metadata-sync.py reads the recorded flag for the same existence-only treatment.  # r47: the one-time files-table uniqueness update is refactored for time and for visibility; its meaning is unchanged. THE MECHANISM. r46 selected the surviving row by asking, for every row, whether it was the newest row for its (package_id, path) — a correlated scalar subquery evaluated once per row, and a second one beside it to inherit a source label. The only index usable for that lookup covers package_id alone, so each evaluation rescanned the whole of its package's rows: the work grew with the SUM OF THE SQUARES of the per-package row counts rather than with the size of the database. Measured against a copy of a real installed system's database — 881,959 file rows across 1,006 packages, the largest holding 118,775 of them — that is 89 billion row visits for a table of under a million rows, and the update had not finished after forty minutes at full processor load. It now asks the question once instead of once per row: a single grouped pass records, for each (package_id, path), the row id to keep, how many rows the group held and any source label present anywhere in it, and the rebuild joins that summary to the table by INTEGER PRIMARY KEY, which is a direct row lookup. The duplicate count that r46 obtained from its own second grouped pass now falls out of the same pass. Same database, same machine: 5.0s against a run that had not completed in over forty minutes; on synthetic corpora, 20,000 rows in one package took 83.66s under r46 and 0.20s here, and 200,000 rows across 200 packages 422.41s against 2.39s. ONE MEANING IS TIGHTENED, deliberately: where duplicates carried DIFFERENT source labels, r46 inherited whichever row the database happened to return first, which was arbitrary and could differ between runs over the same rows; the label is now the maximum, which is deterministic and, for the two labels that exist, prefers 'helper' over 'archive' — the label whose loss the inheritance rule exists to prevent. A differential harness ran both mechanisms over one corpus carrying every duplicate shape and compared all eight columns of every surviving row: identical except for that case, which it also demonstrates. VISIBILITY. The update ran for that whole time printing nothing, and an operation that prints nothing cannot be told from a hang. It now states what it is about to do, that it happens once, that it changes no installed file, and how many records it will check, BEFORE it starts; names each step as it reaches it; and, while a step is still running, reports that it is still working. The heartbeat rides SQLite's own progress callback, so liveness is reported from inside the statement that is actually working rather than by a timer that cannot see it. The opening and closing lines are shown at every verbosity including quiet — a request for less output is not a request for a silent multi-minute pause — while the step detail between them follows the usual prose rules. Every console write is guarded: a closed output stream or a failing console cannot abort a database update, which is the more serious failure the reporting was added to prevent. Nothing is printed at all when the constraint is already present, which is the path every database open takes. COVERAGE. tests/pkm/test_files_migration_performance_and_output.py, 11 cases: two wall-clock budgets on corpora shaped to expose the old cost (20,000 rows in one package, and 200,000 rows across 200 packages), a budget-free structural check that asks SQLite for its query plan and refuses a correlated scalar subquery, and output checks covering the announcement before the work, the per-step lines, the outcome in both the duplicates and no-duplicates directions, the quiet-level behaviour, silence when there is nothing to do, absence of internal vocabulary in user-facing text, a heartbeat proven to fire rather than assumed to, and a hostile console proven unable to damage the update. The 15 r46 cases covering the collapse semantics are unchanged and still pass.
content_hash: fc22347f0c09f31e
description: InterGenOS package manager — install, remove, query, verify
license: GPL-3.0-or-later
homepage: https://github.com/InterGenJLU/intergenos
# Tier moved core → desktop in 2026-05-09 stub-pattern audit follow-up:
# the previous tier:core declaration mirrored apparmor's pre-f190f1c shape
# (declared as core but NOT wired into either chroot-build-ch8.sh or
# chroot-build-core-extra.sh), which silently skipped pkm at install-time.
# The Python builder handles tier:desktop via topological sort and accepts
# `source: []` (builder.extract_source returns the empty work dir
# gracefully when no source is declared).
tier: core
build_style: custom
source: []
# pkm's source is the top-level pkm/ tree (build.sh copies from
# /mnt/intergenos/pkm/). Folded into the skip-built fingerprint.
source_tree:
  - pkm
dependencies:
  build: []
  host: []
  runtime:
  - python
verify_paths:
  - /usr/bin/pkm
  - /usr/lib/python3.14/site-packages/pkm
  - /etc/pkm/repos.conf
  # Q8 notification surface (Phase B + D)
  - /usr/lib/systemd/system/pkm-check-updates.service
  - /usr/lib/systemd/system/pkm-check-updates.timer
  - /etc/update-motd.d/90-pkm-pending
  # PI-218-1 — repo cache dirs created at boot (closes the fresh-install crash)
  - /usr/lib/tmpfiles.d/pkm.conf
