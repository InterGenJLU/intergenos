name: lib32-nspr
version: "4.38.2"
release: 1
content_hash: ee4b705b4d2fb77c
description: Netscape Portable Runtime (32-bit multilib runtime)
license: MPL-2.0
homepage: https://developer.mozilla.org/en-US/docs/Mozilla/Projects/NSPR
tier: core
# Bash-tier lib32 twin (lib32-expat shape): build.sh sources the single
# lib32-env.sh profile, installs to a private root, and allowlist-stages
# ONLY /usr/lib32 (headers + nspr-config ship with the 64-bit sibling —
# NSPR's public headers are preprocessor-conditional per arch, safe to
# share). Wired at the lib32 tail of chroot-build-core-extra.sh (Rule 2).
#
# Forced-closure ADD (operator decision, 2026-07-02): the ratified
# lib32-nss links NSPR unconditionally and its build.sh --system-nspr
# resolves it via pkg-config, so the 32-bit libs + nspr.pc must exist.
# Arch's lib32-nspr is the reference shape: 32-bit selected via NSPR's
# own --disable-64bit (the sibling's uname-gated --enable-64bit,
# inverted), agreeing with the profile's -m32 CC. NSPR sonames are
# UNVERSIONED (libnspr4.so / libplc4.so / libplds4.so — upstream
# convention, matching the sibling's shipped names).
build_style: custom
install_func: do_install
lib32_source: nspr
elf_class: "32"
# Mirror-only (D-W0-7: only lib32-glibc is ISO-resident).
iso_include: false
source:
- url: https://archive.mozilla.org/pub/nspr/releases/v${version}/src/nspr-${version}.tar.gz
  sha256: e4092faeab77bdc9b32db1113e4215948ee768e26c4666db3b5a60b35f2c9105
dependencies:
  build:
  - lib32-glibc
  host: []
  runtime:
  - lib32-glibc
verify_paths:
  - /usr/lib32/libnspr4.so
  - /usr/lib32/pkgconfig/nspr.pc

# Build inputs from the repository tree: declared here so an edit to one
# moves this package's content fingerprint and a targeted build rebuilds it
# (igos-build/content_hash.py arm (c)), and in sources_extra below so the
# published source archive carries them.
source_tree:
- scripts/lib32-env.sh

# Build inputs composed from the repository tree (declared so the published
# source archive carries every input the build consumes — the corresponding-
# source rule the kernel config fragments established; survey 2026-08-11).
sources_extra:
- scripts/lib32-env.sh
