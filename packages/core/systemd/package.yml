name: systemd
version: '259.1'
release: 6  # r6: post_install applies the service preset policy on a first install only. The call was unconditional, which is correct in the build chroot, the image chroot and the target an installer is populating, and wrong on a machine that has already booted: pkm fires a package's sealed post_install on every install AND every upgrade, so upgrading this package re-applied the whole default policy over a running system and turned off every service its owner had turned on, remote login included, while printing nothing to say so. The predicate is systemd's own first-boot marker, /etc/machine-id, read by the rules in machine-id(5) FIRST BOOT SEMANTICS: absent or the literal 'uninitialized' is a first install and still gets the full pass; a valid id is not, and neither is an empty file, which is the case that is easy to read backwards. Both the read and the preset are scoped to PKM_PACKAGE_ROOT, because pkm runs lifecycle hooks on the host and never under chroot, so the previous unrooted call acted on whatever root the installer was running from rather than the target it was installing into; a root of / keeps the unrooted form the build chroot has always used. Each branch now prints one line naming the root it decided about and why. The installer's own end-of-install preset pass is untouched and remains the authoritative one for a freshly installed system. This release is a HAND bump: the recipe pins an upstream tarball and declares no source_tree, so bump-changed-releases.py does not track it. COVERAGE: tests/test_preset_all_first_install_only.py, 15 cases driving the real sealed hook against real roots with enablement resolved by the real preset engine, red against the pre-fix recipe in all eight invariant cases. NOT PROVEN HERE: no chroot build cycle and no install have run.  # r5: elfutils is declared as a build dependency and -D elfutils=enabled is passed explicitly, so coredump symbolisation is compiled in rather than left to the option's auto default. elfutils has shipped since its r3.  # r4: runtime deps renamed to shipped namespace (F25 gate wave 2026-07-21)
description: System and service manager
license: LGPL-2.1-or-later
source:
- url: https://github.com/systemd/systemd/archive/v${version}/systemd-${version}.tar.gz
  sha256: 7af4f36db512ad2f0f749a0f9886370edeb2bb5128014fc47cdf73702c7e1911
- url: https://anduin.linuxfromscratch.org/LFS/systemd-man-pages-259.1.tar.xz
  sha256: 0d130b265ed45015a88c35a1647463945dacbb48a379b506d09b1584360a49e1
dependencies:
  build:
    - meson
    - ninja
    - gperf
    - elfutils
  host:
  - jinja2
  - pyelftools
  runtime:
  - util-linux
  - kmod
  - libcap
  - openssl
  - elfutils
  - acl
  - expat
# gperf added 2026-05-12 (Scan A.2): meson.build:620 requires `gperf`
# program at configure time. Was transitively present from ch8 (gperf @
# ch8:452); declaring per real upstream requirement.
# elfutils added 2026-08-19: meson.build looks up libdw and libelf with
# `required : get_option('elfutils')` and sets HAVE_ELFUTILS only when both
# are found, so it is a build-time dependency of the coredump stack, not a
# runtime-only one. It was declared runtime-only, and with the option left at
# its `auto` default the lookup failed quietly on a chroot where elfutils had
# not been built yet: the first release ships systemd-coredump without ELF
# symbolization, reported on the installed system as "elfutils disabled" —
# which also means the one coredump that release produced could not be
# parsed. See the `elfutils=enabled` flag in build.sh for the other half.
tier: core
build_style: meson

tests:
  enabled: true
  failure_policy: known_failures
  reason: "systemd meson test suite requires PID 1, cgroup v2 delegation, /dev/kvm, /sys/fs/cgroup writability, working dbus, and machined/userdbd hosts that the build chroot does not provide. Many tests (test-execute, test-cgroup, test-bus, test-network) are documented as environment-only failures."
verify_paths:
  - /usr/bin/systemd-ac-power
  - /usr/bin/bootctl
  - /usr/lib/libnss_myhostname.so.2
