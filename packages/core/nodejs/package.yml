name: nodejs
version: "22.22.0"
release: 4  # r4: check() runs upstream's own offline 'default' suite set via tools/test.py instead of the make target that aborted fetching documentation tooling (npm ci) before any test ran in the offline chroot. check() edits only; installed bytes unchanged. HAND bump: pinned-upstream recipe, untracked by bump-changed-releases.py.  # r3: the test-suite policy is declared instead of every failure being masked, and the stale failure count in the comment beside it is corrected to what the suite actually reports.  # hook-contract wave: doc symlink moved post_install -> do_install (owned payload)
description: JavaScript runtime built on V8
license: MIT
homepage: https://nodejs.org/
tier: core
build_style: custom
install_func: do_install
source:
- url: https://nodejs.org/dist/v${version}/node-v${version}.tar.xz
  sha256: 4c138012bb5352f49822a8f3e6d1db71e00639d0c36d5b6756f91e4c6f30b683
patches:
  - file: node-v22.22.0-python_build_fix-1.patch
    sha256: 2e9bbd25cbf3841907e9d5bb601bf74450e91bc2f833d64340db2683ffa2e1c4
dependencies:
  build:
  - brotli
  - c-ares
  - icu
  - libuv
  - nghttp2
  - which
  host: []
  runtime:
  - brotli
  - c-ares
  - icu
  - libuv
  - nghttp2
  - openssl
  - zlib

tests:
  enabled: true
  failure_policy: known_failures
  reason: "the suite is invoked as tools/test.py over the `default` suite set, which is what upstream designates for a run with no network and no addon compilation: ArgsToTestPaths expands `default` to every suite except IGNORED_SUITES, and that list's own comment in the pinned node-v22.22.0 tarball says those suites 'should not be run as part of the default JavaScript test-run, e.g., internet/ requires a network connection, addons/ requires compilation'. Upstream documents a small known-failing set in the parallel suite — 3 of over 4400 at the version the reference book covers — and a few further cases here need a writable /dev/shm the build chroot does not provide, so the policy stays known_failures and the full output is kept in the package log, where a failure count out of line with that is visible. This block previously described the same policy while the recipe ran `make test-only`, which aborted before any test ran because its addon-build prerequisite chain ends in an npm fetch; the invocation was corrected 2026-08-21 so the statement and the behaviour agree."

verify_paths:
  - /usr/bin/node
  - /usr/bin/npm
