name: nodejs
version: "22.22.0"
release: 3  # r3: the test-suite policy is declared instead of every failure being masked, and the stale failure count in the comment beside it is corrected to what the suite actually reports.  # hook-contract wave: doc symlink moved post_install -> do_install (owned payload)
description: JavaScript runtime built on V8
license: MIT
homepage: https://nodejs.org/
tier: core
build_style: custom
install_func: do_install
source:
- url: https://nodejs.org/dist/v${version}/node-v${version}.tar.xz
  sha256: 4c138012bb5352f49822a8f3e6d1db71e00639d0c36d5b6756f91e4c6f30b683
patches:
  - file: node-v22.22.0-python_build_fix-1.patch
    sha256: 2e9bbd25cbf3841907e9d5bb601bf74450e91bc2f833d64340db2683ffa2e1c4
dependencies:
  build:
  - brotli
  - c-ares
  - icu
  - libuv
  - nghttp2
  - which
  host: []
  runtime:
  - brotli
  - c-ares
  - icu
  - libuv
  - nghttp2
  - openssl
  - zlib

tests:
  enabled: true
  failure_policy: known_failures
  reason: "upstream documents a small known-failing set in the parallel suite — 3 of over 4400 at the version the reference book covers — and further cases here need network access and a writable /dev/shm that the offline build chroot does not provide. The suite runs and its full output is kept in the package log, so a failure count out of line with that is visible."

verify_paths:
  - /usr/bin/node
  - /usr/bin/npm
