#!/usr/sbin/nft -f
# InterGenOS default-deny firewall — D-011, decided 2026-05-19.
#
# Posture: default-DROP on INPUT and FORWARD. Outbound allowed.
# Inbound limited to: established/related + loopback + ICMP echo-request
# + ICMP frag-needed (path-MTU discovery) + IPv6 neighbor
# discovery (required for IPv6 to function).
#
# SSH inbound (tcp/22) is CLOSED by default. Users who want SSH server
# open it themselves via direct nft edit, a future GUI control panel,
# or by adding a drop-in rule. WE DO NOT LISTEN BY DEFAULT.
#
# To remove the InterGenOS default policy and configure your own
# firewall: `pkm remove intergenos-firewall-defaults`. The upstream
# nftables tool stays installed; you write /etc/nftables.conf yourself.
#
# Distro precedent for this posture: Fedora Workstation (firewalld
# FedoraWorkstation zone), Ubuntu Desktop (ufw default-deny when
# enabled), openSUSE Leap Desktop (SuSEfirewall2 closed-by-default),
# macOS (SSH off by default), Windows (SSH service not running by
# default).

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        # Always allow loopback. Without this, intra-host services
        # (DBus, X11, local sockets bound to 127.0.0.1) break.
        iif "lo" accept

        # Drop invalid connections early. Conntrack flags packets
        # that fail state-machine validation; dropping them keeps
        # broken stacks from causing local processing overhead.
        ct state invalid drop

        # Established + related — allows the responses to outbound
        # connections to come back in. Without this, every outbound
        # connection is one-way (TCP handshake hangs at SYN-ACK).
        ct state established,related accept

        # ICMP echo-request (ping) — keeps `ping <this-host>` working
        # from peers on the LAN. Standard expected behavior; even
        # default-deny firewalls usually allow ping.
        ip protocol icmp icmp type echo-request accept
        ip6 nexthdr ipv6-icmp icmpv6 type echo-request accept

        # ICMP frag-needed (IPv4) + packet-too-big (IPv6).
        # Required for path-MTU discovery; without these, TCP across
        # any MTU boundary (VPN, GRE tunnel, etc.) silently stalls.
        # The IPv4 rule narrows on code "frag-needed" per D-011 verbatim
        # — wider destination-unreachable accept would admit host-
        # unreachable + port-unreachable + protocol-unreachable etc.,
        # none of which D-011 authorizes. (The canonical icmp-code name
        # nftables accepts is "frag-needed"; the verbose form
        # "fragmentation-needed" is rejected as unparseable.)
        ip protocol icmp icmp type destination-unreachable icmp code frag-needed accept
        ip6 nexthdr ipv6-icmp icmpv6 type packet-too-big accept

        # IPv6 Neighbor Discovery — required for IPv6 to function.
        # Without ND, IPv6 addresses won't resolve to MAC + router
        # advertisements get dropped + the host becomes invisible
        # on IPv6 networks.
        ip6 nexthdr ipv6-icmp icmpv6 type {
            nd-router-advert,
            nd-neighbor-solicit,
            nd-neighbor-advert
        } accept

        # libvirt NAT guest networking — DHCP + DNS, scoped to the virtual
        # bridge interface.
        #
        # Decided 2026-08-04: a host running libvirt NAT guests must be able
        # to answer those guests' DHCP and DNS requests, which the host-side
        # dnsmasq serves on the virtual bridge. Under the default-drop policy
        # above those requests were dropped, so guests came up with no address
        # and no name resolution. The only fix was a rule added by hand at
        # runtime, which did not survive a reboot; shipping it here makes the
        # behaviour a property of the installed system instead.
        #
        # The match is scoped to the bridge INTERFACE — never to an address,
        # never globally. These ports stay closed on every real network
        # interface. If libvirt is not installed, or its networks are not
        # started, no interface carries this name and these rules accept
        # nothing at all. Bringing an interface into existence under this name
        # requires CAP_NET_ADMIN, so an unprivileged local process cannot
        # conjure one to reach them.
        #
        # The name is matched as a class rather than as virbr0 alone: libvirt
        # names the default network's bridge virbr0 and additional NAT
        # networks virbr1, virbr2 and so on, and a virbr0-only match would
        # reproduce this exact defect on the second network.
        #
        # FORWARDING IS NOT OPENED HERE. This admits guest-to-host DHCP and
        # DNS only. Routing guest traffic onward stays opt-in through the
        # fragment the libvirt package ships for /etc/nftables.d.
        iifname "virbr*" udp dport 67 accept
        iifname "virbr*" udp dport 53 accept
        iifname "virbr*" tcp dport 53 accept

        # Everything else inbound DROPS via the chain policy above.
        # No SSH (tcp/22). No mDNS (udp/5353). No anything else.
        # Add explicit accept rules ABOVE this comment for any
        # services you want to expose.
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
        # No default forward rules. Users adding container/VM
        # bridging append accept rules above this comment.
    }

    chain output {
        type filter hook output priority filter; policy accept;
        # Outbound allowed. The default-deny posture is on the
        # INBOUND surface; outbound is trusted.
    }
}

# Opt-in drop-in rules. The shipped ruleset above is unchanged default-deny;
# this include is the "drop-in rule / GUI control panel" path D-011 itself
# anticipates for users who choose to open a service. The Welcomer's "Enable
# Services" page (intergen-welcome) writes removable fragments here — each
# re-opens `table inet filter` to append one accept rule (mDNS udp/5353, SSH
# tcp/22) and is deleted when the user toggles that service back off. An empty
# or absent directory matches nothing, so this is a no-op until a user opts in.
# (intergenos-firewall-defaults ships the directory so the glob always resolves.)
include "/etc/nftables.d/*.conf"
