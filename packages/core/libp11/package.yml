name: libp11
version: "0.4.18"
release: 1
description: PKCS#11 wrapper library and OpenSSL engine/provider for smart cards
license: LGPL-2.1-or-later
homepage: https://github.com/OpenSC/libp11
tier: core
build_style: custom
install_func: do_install

source:
  - url: https://github.com/OpenSC/libp11/releases/download/libp11-${version}/libp11-${version}.tar.gz
    sha256: 9292de67ca73aba1deacf577c9086b595765f36ef47712cfeb49fa31f6e772fb

dependencies:
  build:
    - pkgconf
    - openssl
  host: []
  runtime:
    - openssl
verify_paths:
  - /usr/lib/libp11.so
  - /usr/lib/engines-3/pkcs11.so
  - /usr/lib/ossl-modules/pkcs11prov.so
