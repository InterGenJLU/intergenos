name: lib32-dbus
version: "1.16.2"
release: 1  # r1: NEW — 32-bit libdbus-1 (the D-Bus client library), the floor for the full-client half of lib32-gamemode (libgamemode.so.0 links libdbus-1). Libs-only (-Dmessage_bus=false: no 32-bit dbus-daemon, no expat edge; the daemon stays 64-bit), sibling of packages/core/dbus (RT-9 version lock). -Dsystemd=enabled matches the 64-bit libdbus-1.so.3 NEEDED closure. Mirror-only.
content_hash: 89593a0aea66f5f5
description: D-Bus message bus client library — libdbus-1 (32-bit multilib runtime)
license: AFL-2.1 OR GPL-2.0-or-later
homepage: https://www.freedesktop.org/wiki/Software/dbus/
tier: core
# Bash-tier lib32 twin (core tier = bash-driver territory, the lib32-systemd-libs
# shape): build.sh drives meson through THE lib32 cross file (config/lib32/
# lib32-cross.ini) with the daemon side off (-Dmessage_bus=false), installs to a
# private root, and allowlist-stages ONLY /usr/lib32 — the allowlist staging IS the
# libs-only mechanism (the dbus-daemon + client tools the build could produce are
# never staged). Wired at the lib32 tail of chroot-build-core-extra.sh AFTER
# lib32-systemd-libs (Rule 2), because libdbus-1.so.3 links libsystemd.
#
# FLOOR (verified via readelf on the 64-bit libdbus-1.so.3 + the pinned meson.build,
# not memory): the shipped libdbus-1.so.3 NEEDs only libsystemd.so.0 + libc, so the
# runtime floor is lib32-systemd-libs + lib32-glibc (both in-tree). expat is NOT on the
# floor: meson requires expat ONLY when message_bus is set (meson.build:396-397), and
# this libs-only build sets it false — so no lib32-expat edge. -Dsystemd=enabled keeps
# 64-bit parity (the sibling libdbus links libsystemd for activation/sd_notify).
build_style: custom
install_func: do_install
lib32_source: dbus
elf_class: "32"
# Mirror-only (only lib32-glibc is ISO-resident).
iso_include: false
source:
- url: https://dbus.freedesktop.org/releases/dbus/dbus-${version}.tar.xz
  sha256: 0ba2a1a4b16afe7bceb2c07e9ce99a8c2c3508e5dec290dbb643384bd6beb7e2
dependencies:
  build:
  - lib32-glibc
  - lib32-systemd-libs   # meson -Dsystemd=enabled finds the 32-bit libsystemd.pc
  - python               # dbus meson requires python3 at configure (meson.build:87) — declared in build: matching the 64-bit dbus sibling's Scan A.2 resolution
  host: []
  runtime:
  - lib32-glibc
  - lib32-systemd-libs   # libdbus-1.so.3 NEEDs libsystemd.so.0 (readelf-verified)
verify_paths:
  - /usr/lib32/libdbus-1.so.3
  - /usr/lib32/pkgconfig/dbus-1.pc

# Build inputs from the repository tree: declared here so an edit to one
# moves this package's content fingerprint and a targeted build rebuilds it
# (igos-build/content_hash.py arm (c)), and in sources_extra below so the
# published source archive carries them.
source_tree:
- config/lib32/lib32-cross.ini
- scripts/lib32-env.sh

# Build inputs composed from the repository tree (declared so the published
# source archive carries every input the build consumes — the corresponding-
# source rule the kernel config fragments established; survey 2026-08-11).
sources_extra:
- scripts/lib32-env.sh
- config/lib32/lib32-cross.ini
