name: lib32-llvm
version: "21.1.8"
release: 1
content_hash: b6968884d359f6d0
description: LLVM compiler infrastructure (32-bit runtime + build interface)
license: Apache-2.0
homepage: https://llvm.org/
# tier CORE, sibling-derived (RT-14: a twin's tier derives from its
# declared sibling — the twin IS what the sibling is, one ABI narrower;
# the adopted item-3 table's desktop-by-consumer note is corrected by the
# shipped rule). Wired at the core-extra tail, building before its
# desktop consumers (lib32-mesa).
tier: core
build_style: custom
install_func: do_install
lib32_source: llvm
elf_class: "32"
# Mirror-only (D-W0-7: only lib32-glibc is ISO-resident).
iso_include: false
# The RESPEC (onboarding §3.5): this twin ships the 32-bit RUNTIME
# (libLLVM/libLTO/libRemarks/LLVMgold in /usr/lib32) AND the 32-bit BUILD
# INTERFACE — /usr/bin/llvm-config32 (the genuine 32-bit-built binary,
# renamed; --libdir answers /usr/lib32 and --cflags carry -m32 by
# construction) + the one 32-bit-specific config header + the lib32 cmake
# files. Everything else (the full header tree, the tools) is owned by the
# 64-bit sibling — hence the HARD runtime dep on llvm. LLVM-only: no
# clang, no compiler-rt (reference-distro-confirmed; mesa consumes only
# libLLVM + llvm-config).
source:
- url: https://github.com/llvm/llvm-project/releases/download/llvmorg-${version}/llvm-${version}.src.tar.xz
  sha256: d9022ddadb40a15015f6b27e6549a7144704ded8828ba036ffe4b8165707de21
# cmake + third-party tarballs extracted by pre_configure (subset of the
# sibling's pin set — the LIB32-SOURCE-DRIFT gate verifies identity; the
# clang/compiler-rt co-sources are deliberately NOT carried).
- url: https://anduin.linuxfromscratch.org/BLFS/llvm/llvm-cmake-${version}.src.tar.xz
  sha256: 85735f20fd8c81ecb0a09abb0c267018475420e93b65050cc5b7634eab744de9
- url: https://anduin.linuxfromscratch.org/BLFS/llvm/llvm-third-party-${version}.src.tar.xz
  sha256: 7fe99424384aea529ffaeec9cc9dfb8b451fd1852c03fc109e426fe208a1f1a7
dependencies:
  build:
  - cmake
  - lib32-glibc
  - lib32-libffi
  - lib32-zlib
  - lib32-zstd
  host: []
  runtime:
  # HARD: the 64-bit sibling supplies the shared bit-agnostic header tree
  # (/usr/include/llvm/** minus the one -32 config header this twin ships).
  - llvm
  - lib32-glibc
  - lib32-libffi
  - lib32-zlib
  - lib32-zstd
tests:
  enabled: false
  reason: "The LLVM test battery requires LLVM_INCLUDE_TESTS tooling and multiplies the twin's build hours; the identical sources are test-covered in the 64-bit sibling's recipe posture, and this twin's load-bearing artifacts are verified by the in-recipe llvm-config32 acceptance assertion (libdir + m32 cflags, fail-loud), the archive-time width/time64 audits, and the NEEDED-closure gate."
verify_paths:
  - /usr/bin/llvm-config32
  - /usr/lib32/libLLVM.so
  - /usr/include/llvm/Config/llvm-config-32.h

# Build inputs from the repository tree: declared here so an edit to one
# moves this package's content fingerprint and a targeted build rebuilds it
# (igos-build/content_hash.py arm (c)), and in sources_extra below so the
# published source archive carries them.
source_tree:
- config/lib32/lib32-cmake-toolchain.cmake
- scripts/lib32-env.sh

# Build inputs composed from the repository tree (declared so the published
# source archive carries every input the build consumes — the corresponding-
# source rule the kernel config fragments established; survey 2026-08-11).
sources_extra:
- scripts/lib32-env.sh
- config/lib32/lib32-cmake-toolchain.cmake
