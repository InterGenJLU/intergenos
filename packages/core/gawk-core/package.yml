name: gawk-core
ships_as: gawk  # ch8 dual-name twin — the driver archives this recipe under the ship name (chroot-build-ch8.sh run_package arg 2; runtime deps elsewhere may name 'gawk')
version: "5.3.2"
release: 1
description: GNU awk
license: GPL-3.0-or-later
source:
- url: https://ftpmirror.gnu.org/gawk/gawk-${version}.tar.xz
  sha256: f8c3486509de705192138b00ef2c00bbbdd0e84c30d5c07d23fc73a9dc4cc9cc
dependencies:
  build: []
  host: []
  runtime:
  - readline
tier: core
build_style: autotools
verify_paths:
  - /usr/bin/gawk
  - /usr/bin/awk
