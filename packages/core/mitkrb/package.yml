name: mitkrb
version: "1.22.2"
release: 3  # r3: the test-suite status is reported instead of masked. The `|| true` that swallowed every check() failure is gone and no waiver replaces it: this suite's failure is an uncharacterised segfault, which is exactly the class a waiver must not cover.  # L29: setuid-strip regression rebuild (staging-chokepoint chown)
description: MIT Kerberos V5 authentication
license: MIT
homepage: ''
tier: core
build_style: custom
install_func: do_install
source:
- url: https://kerberos.org/dist/krb5/1.22/krb5-${version}.tar.gz
  sha256: 3243ffbc8ea4d4ac22ddc7dd2a1dc54c57874c40648b60ff97009763554eaf13
patches:
  - file: mitkrb-1.22.2-upstream_fix-1.patch
    sha256: 91bed46e7c59b4bc27df659c13abd4514e456293717720e8545d7f8acad00a97
dependencies:
  build:
  - keyutils
  - e2fsprogs
  - cracklib
  - openldap
  host: []
  runtime:
  - keyutils
  - e2fsprogs
  - cracklib
  - openldap

tests:
  enabled: true
  failure_policy: strict
  # Deliberately strict, not known_failures. Upstream documents failures that need
  # network access, a time-synchronised host and keyutils kernel support, and the
  # first release's build log shows this suite skipping its DNS-dependent cases —
  # but it also produced an uncharacterized segmentation fault, and a waiver would
  # cover that too. Strict reports the real status to the driver, which logs and
  # traces it without stopping the build on this lane.

verify_paths:
  - /usr/bin/krb5-config
  - /usr/lib/libkrb5.so
