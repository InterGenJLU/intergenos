name: openldap
version: "2.6.12"
release: 3  # r3: hook-contract remainder — /etc/openldap/slapd.d ships as owned payload (mode 700) from do_install; post_install now only RESTORES its ownership, which is what a lifecycle hook is for. The ldap account is created by systemd-sysusers after the archive is deployed, so the uid the archive names cannot resolve at deploy time and a chown at hook time is the correct half. /var/lib/openldap stays hook-created (machine state). r2: strip upstream var/run install side-effect (split-brain runtime-dir class, 2026-07-17)
content_hash: bd929739c1e69024
description: Open source LDAP directory server and client libraries
license: OLDAP-2.8
homepage: https://www.openldap.org/
tier: core
build_style: custom
install_func: do_install
source:
- url: https://www.openldap.org/software/download/OpenLDAP/openldap-release/openldap-${version}.tgz
  sha256: 1716ad779e85d743694c3e3b05277fb71b6a5eadca43c7a958aa62683b22208e
patches:
  - file: openldap-2.6.12-consolidated-1.patch
    sha256: a1aee8daf29cbe6de0a41ce8d250d6f9157d581843c92034714cc82ea1cf934f
dependencies:
  build:
  - cyrus-sasl
  - openssl
  host: []
  runtime:
  - cyrus-sasl
  - openssl
verify_paths:
  - /usr/bin/ldapadd
  - /usr/lib/liblber.so
