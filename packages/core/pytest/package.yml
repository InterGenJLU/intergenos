name: pytest
version: "9.1.1"
release: 2  # r2: pip install adds --ignore-installed — populated-chroot rebuild empty-archive class sweep (DFB-01/02, 2026-07-19).
description: Simple powerful testing framework
license: MIT
homepage: https://docs.pytest.org
tier: core
build_style: custom
install_func: do_install
iso_include: true  # dev/test tooling shipped in the ISO (the InterGen test harness runs on it) — never mirror-only
source:
- url: https://files.pythonhosted.org/packages/source/p/pytest/pytest-${version}.tar.gz
  sha256: 1088fbde8f2b49d95a549a195707afa7a76a3ce9bcadc26b6d71f0ffda5fe313
dependencies:
  build:
  # setuptools, beside setuptools-scm. The pinned sdist's [build-system] needs
  # the setuptools backend itself, and setuptools-scm does not supply it: that
  # recipe carries setuptools only under runtime, and runtime edges do not order
  # the build (igos-build/graph.py orders on build+host only). Building with
  # --no-build-isolation installs nothing, so setuptools must be ordered here.
  - setuptools
  - setuptools-scm
  host: []
  runtime:
  - iniconfig
  - packaging
  - pluggy
  - pygments
verify_paths:
- /usr/bin/pytest
- /usr/lib/python3.14/site-packages/_pytest
