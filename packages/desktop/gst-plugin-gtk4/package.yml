name: gst-plugin-gtk4
# Version 1.28.1 = lockstep with the C gstreamer 1.28.1 stack
# (gst-plugins-rs versions together with gstreamer since the 1.26 series).
version: "1.28.1"
release: 1  # r1: initial package for gst-plugins-rs' gtk4paintablesink, required by Snapshot's camera-preview pipeline. Both packages built in chroot; gst-inspect, a 60-buffer Wayland pipeline, and a live Snapshot camera preview passed on real hardware.
description: "GStreamer GTK4 video sink plugin (gtk4paintablesink)"
license: MPL-2.0
homepage: https://gstreamer.freedesktop.org/
tier: desktop
build_style: custom
install_func: do_install
source:
- url: https://gitlab.freedesktop.org/gstreamer/gst-plugins-rs/-/archive/gstreamer-${version}/gst-plugins-rs-gstreamer-${version}.tar.gz
  sha256: fe56a64f6a8d45aea79470850bdd873fb3a98482379280bf3c921b295842c954
# Pre-vendored Cargo crates (offline chroot, by security design). Generated
# 2026-08-21 via `cargo vendor` at the workspace root with cargo 1.95.
# Includes the workspace's five git-sourced crate families (gtk-rs-core,
# gtk4-rs, gstreamer-rs, ffv1, flavors); configure() maps every declared
# source to the vendor directory.
# Decided 2026-08-25: this URL moves to the project's own source mirror, with its
# three sibling vendor tarballs. The address it used to name answered 404, and on
# that day the mirror did not carry this file either — it was the one source in
# this tree obtainable from no reachable address, and only the ORIGINAL tarball
# satisfies the pin below, since a fresh `cargo vendor` produces different bytes.
# The original was found where it was generated and PUBLISHED to the mirror on
# 2026-08-25. Verified from a second machine before this line was written: the
# address answers 200, serves 196213639 bytes, and their sha256 is the pin below,
# digit for digit. Nothing about what gets built changes.
- url: https://repo.intergenos.org/sources/current/gst-plugin-gtk4-${version}-vendor.tar.gz
  sha256: ac04ce412e3382cabfb2ccc237ba7eafc17221429bc1b1fbad3e96eae3df5e4f
dependencies:
  build:
  - gtk4
  - gstreamer
  - gst-plugins-base
  - gst-plugins-base-pass2
  - glib2
  - rust
  # The Rust -sys crates resolve every C library through pkg-config at
  # build time.
  - pkgconf
  host: []
  runtime:
  - gtk4
  - gstreamer
  - gst-plugins-base
  - gst-plugins-base-pass2
  - glib2
verify_paths:
  - /usr/lib/gstreamer-1.0/libgstgtk4.so
