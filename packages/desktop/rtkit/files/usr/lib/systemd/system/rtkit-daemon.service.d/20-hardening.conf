# Sandboxing subset from NixOS rtkit packaging:
# https://github.com/NixOS/nixpkgs/blob/ed4f4aa88f15b10a027f4ba45a627edb3870e435/nixos/modules/security/rtkit.nix
# Preserve upstream capabilities and host process access for scheduling.
# RestrictRealtime must stay disabled for the realtime broker and watchdog.
[Service]
NoNewPrivileges=yes
PrivateDevices=yes
PrivateTmp=yes
ProtectHome=yes
ProtectSystem=strict
ProtectControlGroups=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
RestrictAddressFamilies=AF_UNIX
