name: rtkit
version: "0.13"
release: 3  # r3: post_install removed. It contained one call, systemctl enable rtkit-daemon.service, which the install-time systemctl preset-all reverted. The broker's default now comes only from the preset files: not started at boot, because the package ships a D-Bus system-service file naming the unit, so the first client that asks starts it regardless. No installed bytes beyond the retired hook change.  # r2: post_install no longer masks the service enable, so a missing rtkit-daemon.service fails the package instead of being absorbed.
content_hash: c5672a61147fae22
description: RealtimeKit — D-Bus service for real-time scheduling
license: GPL-3.0-or-later
homepage: https://github.com/heftig/rtkit
tier: desktop
build_style: custom
install_func: do_install
source:
- url: https://github.com/heftig/rtkit/archive/refs/tags/v${version}/rtkit-${version}.tar.gz
  sha256: 0f9508530868109f0348e044cc1b20893672875467ace6d847ba6364274de003
dependencies:
  build:
  - dbus
  - libcap
  - polkit
  - systemd
  host: []
  runtime:
  - dbus
  - libcap
  - polkit
  - systemd
verify_paths:
  - /usr/libexec/rtkit-daemon
  - /usr/lib/systemd/system/rtkit-daemon.service
