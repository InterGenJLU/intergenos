  - assets/theming/extensions/ddterm@amezin.github.com.zip
  - assets/theming/extensions/AlphabeticalAppGrid@stuarthayhurst.zip
  - scripts/build-intergenos-source-tarballs.sh
dependencies:
  build: []
  host: []
  runtime:
  - gnome-shell-extensions

verify_paths:
  - /usr/share/gnome-shell/extensions/CoverflowAltTab@palatis.blogspot.com
