# Additional protections from the NetworkManager 1.58.0 service unit:
# https://github.com/NetworkManager/NetworkManager/blob/1.58.0/data/NetworkManager.service.in
# Retain host network/device access and writable network sysctls.
# Preserve upstream capabilities and read-only home access for connection helpers.
[Service]
PrivateTmp=true
ProtectClock=true
ProtectControlGroups=true
ProtectKernelLogs=true
RestrictRealtime=true
RestrictSUIDSGID=true
