name: lib32-libXrandr
version: "1.5.5"
release: 1
description: X Resize and Rotate extension library (32-bit multilib runtime)
license: MIT
homepage: https://www.x.org/
tier: desktop
# PURE-YML package (no build.sh): driven end-to-end by the builder's lib32
# autotools lane — sourced profile per command, mechanism flags injected
# (host triplet, lib32 libdir, verbose rules), allowlist staged-copy
# install (only /usr/lib32 ships; headers/protos stay with the sibling).
build_style: autotools
lib32_source: libXrandr
elf_class: "32"
# Mirror-only (D-W0-7: only lib32-glibc is ISO-resident).
iso_include: false
source:
- url: https://www.x.org/pub/individual/lib/libXrandr-${version}.tar.xz
  sha256: 72b922c2e765434e9e9f0960148070bd4504b288263e2868a4ccce1b7cf2767a
dependencies:
  build:
  - lib32-glibc
  - xorgproto  # arch-independent X protocol headers (pkg-config-required by the pinned configure.ac/meson.build; scanner-derived 2026-07-03)
  - lib32-libX11
  - lib32-libXext
  - lib32-libXrender
  host: []
  runtime:
  - lib32-glibc
  - lib32-libX11
  - lib32-libXext
  - lib32-libXrender
configure_flags:
- --prefix=/usr
- --disable-static
verify_paths:
  - /usr/lib32/libXrandr.so.2
  - /usr/lib32/pkgconfig/xrandr.pc
