name: lib32-libvorbis
version: "1.3.7"
release: 1
description: Vorbis audio codec library (32-bit multilib runtime)
license: BSD-3-Clause
homepage: https://www.xiph.org/vorbis/
tier: desktop
# PURE-YML package (no build.sh): driven end-to-end by the builder's lib32
# autotools lane — sourced profile per command, mechanism flags injected,
# allowlist staged-copy install (only /usr/lib32 ships). Ships
# libvorbis.so.0 + libvorbisfile.so.3 + libvorbisenc.so.2 (libsndfile
# links vorbis AND vorbisenc — both are in the measured closure).
build_style: autotools
lib32_source: libvorbis
elf_class: "32"
# Mirror-only (D-W0-7: only lib32-glibc is ISO-resident).
iso_include: false
source:
- url: https://downloads.xiph.org/releases/vorbis/libvorbis-${version}.tar.xz
  sha256: b33cc4934322bcbf6efcbacf49e3ca01aadbea4114ec9589d1b1e9d20f72954b
dependencies:
  build:
  - lib32-glibc
  - lib32-libogg
  host: []
  runtime:
  - lib32-glibc
  - lib32-libogg
tests:
  jobs: 1
  reason: "BLFS 13.0's own libvorbis instruction is `make -j1 check`: the test/ Makefile is not parallel-safe — under inherited MAKEFLAGS=-jN the same object rule fires twice concurrently (duplicate .Tpo->.Po mv, make[1]+make[2] in test/ at once) and the harness dies before any test runs. Hit on-run at GE-01 launch 7 (2026-07-03 20:0x CDT). Serializing is the honest fix; a known_failures waiver would mask the suite's real signal. Policy stays strict — the suite itself is expected to pass."
configure_flags:
- --prefix=/usr
- --disable-static
verify_paths:
  - /usr/lib32/libvorbis.so.0
  - /usr/lib32/libvorbisenc.so.2
  - /usr/lib32/pkgconfig/vorbis.pc
