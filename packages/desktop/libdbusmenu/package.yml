name: libdbusmenu
version: '16.04.0'
release: 1
description: Library for passing GTK menus over D-Bus — provides the Dbusmenu GObject-Introspection typelibs for GNOME Shell tray/quicklist support
license: GPL-3.0-only AND LGPL-2.1-only AND LGPL-3.0-only
homepage: https://launchpad.net/libdbusmenu
tier: desktop
build_style: custom
install_func: do_install
source:
- url: https://launchpad.net/libdbusmenu/16.04/${version}/+download/libdbusmenu-${version}.tar.gz
  sha256: b9cc4a2acd74509435892823607d966d424bd9ad5d0b00938f27240a1bfa878a
dependencies:
  build:
  - glib2
  - gtk3
  - gobject-introspection
  - vala
  - intltool
  - json-glib
  host: []
  runtime:
  - glib2
  - gtk3
verify_paths:
  - /usr/lib/libdbusmenu-glib.so
  - /usr/lib/libdbusmenu-gtk3.so
  - /usr/lib/girepository-1.0/Dbusmenu-0.4.typelib
  - /usr/lib/girepository-1.0/DbusmenuGtk3-0.4.typelib
