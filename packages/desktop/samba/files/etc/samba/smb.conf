# /etc/samba/smb.conf — the Samba configuration InterGenOS installs.
#
# This is a CLIENT configuration. It declares no shares and offers nothing on
# this machine to anyone else; no Samba server runs unless you start one. It
# exists because every tool that speaks SMB reads this exact path — the file
# manager's network browsing, smbclient, mount.cifs — and without it each of
# them begins by failing to load a configuration.
#
# The upstream example, with every server option and its documentation, is
# installed beside this file as smb.conf.default. Copy from it when you want
# to share something from this machine.
#
# Your edits here are kept. When an upgrade ships a new version of this file,
# the package manager leaves yours alone and writes the new one next to it as
# smb.conf.pkmnew for you to compare.

[global]
	workgroup = WORKGROUP

	# The first version of the SMB protocol is not spoken by this machine.
	# It is the version with the known-bad history, and stating the floor
	# here means it does not depend on what the build happened to default
	# to.
	client min protocol = SMB2_02

	# SMB signing. The manual documents three values for this setting —
	# desired, required and disabled — plus default, which means whatever
	# the build chose. `desired` is stated here because the manual says
	# desired and default behave the same way: signing is offered and not
	# enforced, so a server that cannot sign still connects and an older
	# device on the network keeps working. Stating it means a later change
	# to the build's default cannot quietly lower it. Set this to
	# `required` when every server you reach can sign and you want signing
	# enforced.
	client signing = desired

	# Where this machine's Samba tools write, and how much they keep.
	log file = /var/log/samba/%m.log
	max log size = 50
