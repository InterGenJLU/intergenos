name: samba
version: "4.23.5"
release: 4  # r4: test execution is declared truthfully: enabling the suite requires --enable-selftest, which compiles selftest-only branches into the shipped smbd (an on-demand sleep message handler) and the DNS resolver (a RESOLV_CONF environment override), so tests stay disabled and the reason records both consequences. check() edits only; installed bytes unchanged. HAND bump: pinned-upstream recipe, untracked by bump-changed-releases.py.  # r3: the quicktest suite's policy is declared instead of every failure being masked. Per-finding retrofit, not a sweep.  # r2: strip var/run+var/lock install side-effects, add tmpfiles.d /run/samba + /run/lock/samba (split-brain runtime-dir class, 2026-07-17)
description: SMB/CIFS file and print server
license: GPL-3.0-or-later
homepage: https://www.samba.org/
tier: desktop
build_style: custom
install_func: do_install
source:
- url: https://www.samba.org/ftp/samba/stable/samba-${version}.tar.gz
  sha256: 593a43ddd0d57902237dfa76888f7b02cb7fc7747111369cb31e126db4836b9f
dependencies:
  build:
  - gnutls
  - gpgme
  - jansson
  - mitkrb
  - openldap
  - perl-parse-yapp
  - rpcsvc-proto
  - fuse3
  - libtirpc
  - linux-pam
  - avahi
  - cups
  - cyrus-sasl
  - git
  - icu
  - libaio
  - libarchive
  - libgcrypt
  - libnsl
  - libtasn1
  - libxslt
  - lmdb
  - markdown
  - nss
  - popt
  - vala
  host: []
  runtime:
  - gnutls
  - gpgme
  - jansson
  - mitkrb
  - openldap
  - fuse3
  - libtirpc
  - linux-pam
  - avahi
  - cups
  - cyrus-sasl
  - icu
  - libaio
  - libarchive
  - libgcrypt
  - libnsl
  - libtasn1
  - lmdb
  - nss
  - popt
tests:
  enabled: false
  reason: "the suite cannot run against a build configured for shipping, and enabling it would change the binaries we ship. All source line numbers below are in the pinned samba 4.23.5 tarball. `make quicktest` calls waf test, whose cmd_testonly refuses immediately unless NSS_WRAPPER, UID_WRAPPER and SOCKET_WRAPPER are configured (selftest/wscript:112-116, printing 'ERROR: You must use --enable-selftest to enable selftest' and exiting 1). Those are set only by --enable-selftest or --enable-developer (selftest/wscript:100-101), and ENABLE_SELFTEST is a compile-time define consumed by production code, not by test code: it registers an on-demand MSG_SMB_SLEEP handler inside smbd (source3/smbd/server.c:1472-1474) and makes libcli/dns/dns_lookup.c:73-79 take the resolver configuration path from a RESOLV_CONF environment variable instead of /etc/resolv.conf. Passing the flag to make a test suite runnable would put both into the shipped daemon, so the flag is not passed and the suite does not run. This block previously declared known_failures and said the suite ran; it never ran — it exited on the guard above in under two seconds. Coverage for this package therefore comes from the build and the pre-squashfs path audit, not from upstream's suite."

verify_paths:
  - /usr/bin/samba-log-parser
  - /usr/bin/samba-regedit
  - /usr/bin/samba-tool
