name: intergen-welcome
version: "1.0"
release: 42  # r42: the Welcomer works after the NVIDIA driver reboot. Measured on the reference laptop 2026-09-02, the first time this path met real NVIDIA hardware: (1) the Meet InterGen page crashed before it had a window — the model-size loop rebound the name of the page heading, and the driver-done branch then handed a string to reorder_child_after; the loop uses its own names. (2) The crashed run was recorded as completed: an exception in do_activate was printed and swallowed and the process exited 0, so the launcher wrote the done marker and hid the Welcomer from every later login; a run that cannot build its window now exits non-zero and quits instead of lingering with an unshown window. (3) The page said the terminal had closed with nothing installed while the install was still running: the gnome-terminal process it watched was a client that exits at once; it is started with --wait. (4) The rows' card inside the amber advisory box took an amber cast (translucent card over translucent fill); the rows sit on an opaque ground, proven by rendering. (5) The last line printed in the terminal after the driver install now says the Welcomer returns after the reboot — one sentence shared by the notice, the verdict and the terminal. (6) The CUDA engine offer names the CUDA toolkit on the command line, first, so the package manager runs its download step; and the installed-state check reads the package manager's payload line, so an installer package whose download has not run is not called installed. dev/render_page.py gains machine-state scenarios and a headless route without Xvfb. tests/welcome/test_welcomer_after_the_driver_leg.py.  # r41: the generated source tarball now carries org.intergenos.welcome.policy, the polkit action that authorizes the privileged helper. build.sh installed it from the extracted tree since r35, but scripts/build-intergenos-source-tarballs.sh never staged it, so a build from a freshly generated tarball failed at `install: cannot stat` and the tarball-membership pre-flight gate refused the R001.2 build. A commit-time test now checks that every file do_install takes from the tarball is staged by the generator.  # r40: the first-boot greeter renders the Qwen attribution on both InterGen state cards. It obtains the line by running `intergen --version` over a process boundary on a worker thread with a bounded call, so the greeter never waits on a child process on its main loop; with an installed intergen that has no `--version` (any release before intergen r237) the card renders no attribution rather than a wrong one. Spelling: one form, "license", throughout.
content_hash: 8cc04bbbe4dc7395
description: InterGenOS first-boot welcome greeter — GTK4/libadwaita appearance + extensions chooser + prompt chooser; auto-launches once per new user account. release 7 adds StartupWMClass=com.intergenos.welcome so GNOME's window tracker paints the running window with the InterGenOS Welcomer icon instead of a generic gear (the app-id didn't match the .desktop id). release 6 renames the launcher "InterGenOS Welcome" → "InterGenOS Welcomer", ships a proper app icon (framed glass squircle + pulse + welcome sparkle, replacing the generic preferences avatar), and tags it under the custom ArcMenu "InterGenOS" category. release 5 adds the "Enable Services" page — opt-in toggles for the services InterGenOS ships off by default (print / network-discovery / SSH), each driving a pkexec privileged helper (root-password prompt) that sets the service up end-to-end and is fully reversible. release 4 fixes the Meet InterGen page overflow (scroll-on-overflow + valign FILL + taller 760x720 window + short header title) so the title is no longer clipped under the header and the closing paragraph is no longer cut off the bottom; release 3 adds Stock-vs-Starship prompt-chooser page (D-014 ratified 2026-05-20) wiring; release 2 added Cybernetic Blue theme combo (10th combo) + 10 deterministic SVG-rendered appearance-picker thumbnails.
license: GPL-3.0-or-later
homepage: https://github.com/InterGenJLU/intergenos
tier: desktop
build_style: custom
install_func: do_install
source:
- url: file:///intergen-welcome-${version}.tar.xz
  generated: true
source_tree:
  - assets/intergen-welcome
  - scripts/build-intergenos-source-tarballs.sh
  # The shared name-lookup-failure module lives in the intergen tree and is
  # staged into this package's tarball by the generator above. Declared here
  # so a change to it moves this package's content fingerprint and rebuilds
  # it — without this line the Welcomer would keep shipping an old copy.
  - intergen/net_diagnostics.py
dependencies:
  build: []
  host: []
  runtime:
  - python
  - gtk4
  - intergenos-theme
  - intergenos-icon-theme
  - papirus-icon-theme
  - cybernetic-icon-theme
  - bibata-cursor-theme
  - font-inter
  - font-jetbrains-mono
  - starship
  - gnome-shell-extensions
  - intergenos-extensions-appearance
  - intergenos-extensions-productivity
  - intergenos-extensions-layout
  - intergenos-extensions-utilities
verify_paths:
  - /usr/bin/intergen-welcome
  - /usr/libexec/intergen-welcome/intergen-welcome.py
  - /usr/libexec/intergen-welcome/intergen-welcome-privhelper
  - /usr/libexec/intergen-welcome/net_diagnostics.py
  - /usr/share/applications/intergen-welcome.desktop
  - /etc/xdg/autostart/intergen-welcome.desktop
  - /usr/share/icons/hicolor/scalable/apps/intergen-welcome.svg
  # The systemd drop-in that skips the generated autostart unit once the
  # user is done. Single-quoted because the unit name carries the escape
  # sequence systemd-xdg-autostart-generator produces from the entry's
  # basename; a plain scalar would leave a reader guessing whether the
  # backslash is literal.
  - '/usr/lib/systemd/user/app-intergen\x2dwelcome@autostart.service.d/50-skip-when-done.conf'
