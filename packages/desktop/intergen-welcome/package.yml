name: intergen-welcome
version: "1.0"
release: 32  # r32: ships a systemd drop-in for the autostart unit (/usr/lib/systemd/user/app-intergen\x2dwelcome@autostart.service.d/50-skip-when-done.conf) carrying ConditionPathExists=!%h/.config/intergen-welcome/done, so on an already-set-up system the unit is skipped instead of starting a wrapper that exits in milliseconds — the fast-exit process systemd lost on one of three cold boots (result=resources, "No PIDs left"). The wrapper's own marker check is unchanged and stays the authority.  # r31: no behaviour change: one source comment in intergen-welcome.py reworded in the pre-release register pass; the note that the backgrounds are placeholders is deliberately kept. Comment text only; no code.  # r30: the Meet InterGen page's copy states measured reality. The all-knowing colleague line is softened to what the assistant is, and two example prompts are replaced with request forms the shipped models pass in measured testing — the removed pair measurably fail (an install-flow form on the floor tier; the system-update phrasing on both tiers). A comment now records the rule: example prompts are drawn from measured-passing forms only. Decided 2026-08-14.  # r29: the GPU driver offer syncs the package index before installing, because first boot is exactly when the cache is empty; the offer terminal's closing line reflects the real exit status instead of always reporting success; the outcome is detected by querying the installed state rather than by the window closing, and a successful install replaces the retry banner with a success state that states the reboot requirement; after the driver step, setting the assistant up is presented as the next action rather than sitting below the fold. The HIP engine offer's hardware claim is scoped to what was measured. A boxed group's title no longer renders on the card border.  # r28: the GPU driver / compute-engine offer moves into the Welcomer. It reads the record the installer writes about this machine's display controller and, on hardware with something to add, offers it: the NVIDIA proprietary driver and the CUDA engine on NVIDIA, the HIP/ROCm engine on AMD. The toggles choose; one button runs the selection through the package manager in a terminal, where the vendor's own licence gate runs with its full text on the machine — nothing here accepts a licence on anyone's behalf, and the toggles cannot, because the licence text ships inside the download. Selecting the CUDA engine selects the driver it links, the parts are chained so a declined licence stops the rest, and what the offer says about which engine ends up serving is read from the record rather than asserted here.  # r27: comment-only rewording in the Welcomer source. The opt-in disclosure note and the two state-detection notes no longer attribute the decision behind them to a person, and no longer carry development-host identifiers. No widget, string shown to the user, or code path changed. r26: a Finding Websites page that shows which name server this machine uses and lets the user change it, and that is put in front of the user by itself when a name lookup is what failed. The page reads systemd-resolved state unprivileged, opens on the choice the machine is already in so doing nothing changes nothing, and offers network-default / Cloudflare / Quad9 / an address of the user's own. The two named providers are encrypted-only: a privacy-branded name server queried in plain text is the appearance of protection, so there is no argument that could ask for it. Every choice states who can still see the lookups. Applying goes through the existing privileged helper, which gained dns-use-* verbs that write a removable drop-in under /etc/systemd/resolved.conf.d and a check-address verb that validates an address and does nothing else; a user-supplied address is parsed inside the helper, at the privileged boundary, and written with printf rather than reaching any command line. After applying, the page reads systemd-resolved back and reports what the machine now says rather than what the command returned. Also fixed here: the Next button collected extension picks from a hard-coded page index that stopped being the Extensions page when the Layout page was inserted ahead of it, so every extension toggle silently went nowhere; the widget is now found by what it carries rather than by position. r25: co-bump only: no change to this package's own content. The shared source-tarball generator scripts/build-intergenos-source-tarballs.sh is listed in this package's source_tree, and it changed so that the backup engine's sysusers.d group fragment is staged into the intergenos-backup tarball; the input-based content fingerprint therefore moved for every package that declares the generator. This package's staged bytes are unchanged. r24: the first-party wiki icon now actually reaches the package. The Community page's Documentation & Wiki row names org.intergenos.Wiki and do_install has installed that file since r19, but the generated source tarball never carried it, so do_install failed on `install: cannot stat 'org.intergenos.Wiki.svg'` and the package could not build from a freshly generated tarball at all. The generator now stages the file, with the same required-file guard the application icon has. Measured on an installed system: the icon lands in /usr/share/icons/hicolor/scalable/apps, which every icon theme inherits, and resolves under Adwaita, Papirus-Dark, Tela-dark and WhiteSur-dark as well as the shipped InterGenOS theme; before the fix it resolved only under the InterGenOS theme, so a user who changed icon theme saw a missing image. r23: two corrections to the driver-install flow found in review. A re-arm request left behind by a run that never reached its own bookkeeping — the user rebooted from the terminal without closing the window, or abandoned the install at the password prompt — is now cleared by the launcher at startup and withdrawn by the page itself when no terminal could be opened; a stale one cost an extra Welcomer appearance for a reboot that was never going to happen. And the install button no longer stays dead for the life of the application: it is handed back, relabelled, when the terminal window closes, so a user who mistypes their password has a way to try again. What the button says then claims nothing about the outcome, because the terminal wraps the command in a pause and its exit status belongs to the pause, not to the installer. r22: pressing the driver-install button now tells the user what is about to happen, at the advisory heading's size rather than at body size, and waits six seconds before opening the terminal — the terminal takes the foreground and covered the instruction before it could be read. The notice names the three things the user has to do (password, accept the licence with Enter, reboot afterwards) and states that the Welcomer will return so setup can be finished; the button is disabled while the countdown runs so a second press cannot open a second privileged transaction. That return is made real by a sentinel this page writes and the launcher acts on: the launcher clears the first-login marker instead of writing it, because it writes that marker on EVERY clean exit and a marker deleted inside the app would be re-created moments later — the promise would have read true and behaved false. The launcher also stops treating a non-zero exit from the app as a reason to skip the marker bookkeeping entirely. Measured end to end on a laptop with an RTX 3070 Ti: driver installed from the button, marker cleared on close, the Welcomer launched by the user session two seconds into the next login, the advisory gone with the card on the proprietary driver, and the model choice offering the 9B and the 2B. r21: the NVIDIA driver advisory is presented where it can actually be seen — a bordered amber banner at the top of the page carrying the heading, the install command as a monospace code span, and a button that opens a terminal running `sudo pkm update && sudo pkm install nvidia` (the terminal is held open afterwards so the licence and the summary stay readable, and a machine with no terminal emulator is told so and given the command rather than left with a dead button). r20 set the same text in 12px body grey below the example grid, where it was measurably missed on the hardware it was written for. "Set up InterGen now" now opens a confirmation dialog on advisory machines offering drivers-first or the 2B, so that button can no longer install the 2B without the choice having been put in front of the user; dismissing the dialog installs nothing. Header title "Meet InterGen" → "AI Assistant": it repeated the page's own heading verbatim, and the new wording also stays accurate once the assistant is set up and the page shows its ready state instead of a setup card. r20: the InterGen setup card offers the model-tier choice — reads `intergen setup --show-offer` over a process boundary, renders radio choices when the box can run more than one tier (advisory text on NVIDIA-on-nouveau boxes), and passes the pick through as --tier; any failure to read the offer falls back to the previous one-click card. r19: ship the approved first-party org.intergenos.Wiki mark beside the app icon — the Community page's Documentation & Wiki row names it, but no package shipped the asset and the row rendered image-missing on the ge9b-12 installed system (the ge9b-11 fallback fix swapped a pruned emblem-* name for a first-party name that never landed on disk). item 8b: det_tar --mode normalization changed the generated tarball bytes
content_hash: 9373f1d719f41525
description: InterGenOS first-boot welcome greeter — GTK4/libadwaita appearance + extensions chooser + prompt chooser; auto-launches once per new user account. release 7 adds StartupWMClass=com.intergenos.welcome so GNOME's window tracker paints the running window with the InterGenOS Welcomer icon instead of a generic gear (the app-id didn't match the .desktop id). release 6 renames the launcher "InterGenOS Welcome" → "InterGenOS Welcomer", ships a proper app icon (framed glass squircle + pulse + welcome sparkle, replacing the generic preferences avatar), and tags it under the custom ArcMenu "InterGenOS" category. release 5 adds the "Enable Services" page — opt-in toggles for the services InterGenOS ships off by default (print / network-discovery / SSH), each driving a pkexec privileged helper (root-password prompt) that sets the service up end-to-end and is fully reversible. release 4 fixes the Meet InterGen page overflow (scroll-on-overflow + valign FILL + taller 760x720 window + short header title) so the title is no longer clipped under the header and the closing paragraph is no longer cut off the bottom; release 3 adds Stock-vs-Starship prompt-chooser page (D-014 ratified 2026-05-20) wiring; release 2 added Cybernetic Blue theme combo (10th combo) + 10 deterministic SVG-rendered appearance-picker thumbnails.
license: GPL-3.0-or-later
homepage: https://github.com/InterGenJLU/intergenos
tier: desktop
build_style: custom
install_func: do_install
source:
- url: file:///intergen-welcome-${version}.tar.xz
  generated: true
source_tree:
  - assets/intergen-welcome
  - scripts/build-intergenos-source-tarballs.sh
  # The shared name-lookup-failure module lives in the intergen tree and is
  # staged into this package's tarball by the generator above. Declared here
  # so a change to it moves this package's content fingerprint and rebuilds
  # it — without this line the Welcomer would keep shipping an old copy.
  - intergen/net_diagnostics.py
dependencies:
  build: []
  host: []
  runtime:
  - python
  - gtk4
  - intergenos-theme
  - intergenos-icon-theme
  - papirus-icon-theme
  - cybernetic-icon-theme
  - bibata-cursor-theme
  - font-inter
  - font-jetbrains-mono
  - starship
  - gnome-shell-extensions
  - intergenos-extensions-appearance
  - intergenos-extensions-productivity
  - intergenos-extensions-layout
  - intergenos-extensions-utilities
verify_paths:
  - /usr/bin/intergen-welcome
  - /usr/libexec/intergen-welcome/intergen-welcome.py
  - /usr/libexec/intergen-welcome/intergen-welcome-privhelper
  - /usr/libexec/intergen-welcome/net_diagnostics.py
  - /usr/share/applications/intergen-welcome.desktop
  - /etc/xdg/autostart/intergen-welcome.desktop
  - /usr/share/icons/hicolor/scalable/apps/intergen-welcome.svg
  # The systemd drop-in that skips the generated autostart unit once the
  # user is done. Single-quoted because the unit name carries the escape
  # sequence systemd-xdg-autostart-generator produces from the entry's
  # basename; a plain scalar would leave a reader guessing whether the
  # backslash is literal.
  - '/usr/lib/systemd/user/app-intergen\x2dwelcome@autostart.service.d/50-skip-when-done.conf'
