name: gegl
version: "0.4.66"
release: 1
description: GEneric Graphics Library — graph-based image processing framework
license: LGPL-3.0-or-later
homepage: https://gegl.org/
tier: desktop
build_style: custom
install_func: do_install
source:
- url: https://download.gimp.org/pub/gegl/0.4/gegl-${version}.tar.xz
  sha256: 92b05855e2190868949d70cea6e9a50b163a6a441242e740a6263975379f993b
dependencies:
  build:
  - babl
  - json-glib
  - glib2
  - graphviz
  - pygments
  - pygobject3
  - libjpeg-turbo
  - libpng
  host: []
  runtime:
  - babl
  - json-glib
  - glib2
  - libjpeg-turbo
  - libpng

# gexiv2 0.16 renamed its pkg-config module to gexiv2-0.16, so gegl's
# optional 'gexiv2' probe misses (GE-01 L20, 2026-07-03). Verified non-loss
# from the 0.4.66 source: gexiv2 feeds ONLY the mrg-gated bin/ UI (mrg is not
# packaged, so the gate `mrg.found() and gexiv2.found() and lua.found()` is
# off regardless), the non-installed examples/, and tests/ — no image
# OPERATION uses it, so a found probe would yield a byte-identical shipped
# artifact. Re-evaluate (probe name AND this accept) if mrg is ever packaged.
silent_loss_accepted:
  - gexiv2

tests:
  enabled: true
  failure_policy: known_failures
  reason: "no display in chroot — gegl image-processing tests render to display surfaces and fail without a display server."
verify_paths:
  - /usr/bin/gegl
  - /usr/bin/gegl-imgcmp
  - /usr/lib/libgegl-0.4.so
