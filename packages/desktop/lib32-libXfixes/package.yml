name: lib32-libXfixes
version: "6.0.2"
release: 1
description: X Fixes extension library (32-bit multilib runtime)
license: MIT
homepage: https://www.x.org/
tier: desktop
# PURE-YML package (no build.sh): driven end-to-end by the builder's lib32
# autotools lane — sourced profile per command, mechanism flags injected
# (host triplet, lib32 libdir, verbose rules), allowlist staged-copy
# install (only /usr/lib32 ships; headers/protos stay with the sibling).
build_style: autotools
lib32_source: libXfixes
elf_class: "32"
# Mirror-only (D-W0-7: only lib32-glibc is ISO-resident).
iso_include: false
source:
- url: https://www.x.org/pub/individual/lib/libXfixes-${version}.tar.xz
  sha256: 39f115d72d9c5f8111e4684164d3d68cc1fd21f9b27ff2401b08fddfc0f409ba
dependencies:
  build:
  - lib32-glibc
  - xorgproto  # arch-independent X protocol headers (pkg-config-required by the pinned configure.ac/meson.build; scanner-derived 2026-07-03)
  - lib32-libX11
  host: []
  runtime:
  - lib32-glibc
  - lib32-libX11
configure_flags:
- --prefix=/usr
- --disable-static
verify_paths:
  - /usr/lib32/libXfixes.so.3
  - /usr/lib32/pkgconfig/xfixes.pc
