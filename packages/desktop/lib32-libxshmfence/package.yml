name: lib32-libxshmfence
version: "1.3.3"
release: 1
description: X shared memory fence library (32-bit multilib runtime)
license: MIT
homepage: https://www.x.org/
tier: desktop
# PURE-YML package (no build.sh): driven end-to-end by the builder's lib32
# autotools lane — sourced profile per command, mechanism flags injected
# (host triplet, lib32 libdir, verbose rules), allowlist staged-copy
# install (only /usr/lib32 ships; headers/protos stay with the sibling).
build_style: autotools
lib32_source: libxshmfence
elf_class: "32"
# Mirror-only (D-W0-7: only lib32-glibc is ISO-resident).
iso_include: false
source:
- url: https://www.x.org/pub/individual/lib/libxshmfence-${version}.tar.xz
  sha256: d4a4df096aba96fea02c029ee3a44e11a47eb7f7213c1a729be83e85ec3fde10
dependencies:
  build:
  - lib32-glibc
  - xorgproto  # arch-independent X protocol headers (pkg-config-required by the pinned configure.ac/meson.build; scanner-derived 2026-07-03)
  host: []
  runtime:
  - lib32-glibc
configure_flags:
- --prefix=/usr
- --disable-static
verify_paths:
  - /usr/lib32/libxshmfence.so.1
  - /usr/lib32/pkgconfig/xshmfence.pc
