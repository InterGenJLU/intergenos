name: intergenos-extensions-layout
version: "1.0"
release: 9  # r9: neutral-language sweep of comments and printed text: decisions are recorded as "decided <date>" instead of being credited to a person or project role, development-host shorthand is replaced by a plain description, and the citations of a repository that is not published are replaced by what they were pointing at. Comments and strings only — no rule, path, flag, threshold or code path changed. The public-content scanner now carries detectors for all three classes (scripts/check-public-content.py), so the classes cannot return silently; tests/preflight/test_public_language_detectors.py proves each detector in both directions. r8: co-bump only: no change to this package's own content. The shared source-tarball generator scripts/build-intergenos-source-tarballs.sh is listed in this package's source_tree, and it changed so that the Welcomer's tarball now carries the shared name-lookup-failure module intergen/net_diagnostics.py; the input-based content fingerprint therefore moved for every package that declares the generator. This package's staged bytes are unchanged. r7: co-bump only: no change to this package's own content. The shared source-tarball generator scripts/build-intergenos-source-tarballs.sh is listed in this package's source_tree, and it changed so that the backup engine's sysusers.d group fragment is staged into the intergenos-backup tarball; the input-based content fingerprint therefore moved for every package that declares the generator. This package's staged bytes are unchanged. r6: co-bump only: no change to this package's own content. The shared source-tarball generator scripts/build-intergenos-source-tarballs.sh is listed in this package's source_tree, and it changed so that the welcome greeter's wiki icon is staged into its tarball; the input-based content fingerprint therefore moved for every package that declares the generator. This package's staged bytes are unchanged.
content_hash: 1290b3a3b15dd6b3
description: InterGenOS Layout-category GNOME Shell extensions — Dash to Dock, Dash to Panel, ArcMenu, Show Desktop Button. release 2 carries a downstream ArcMenu patch (patches/arcmenu-intergenos-category.patch) adding a custom "InterGenOS" system category that collects every X-InterGenOS-tagged app, a greyscale boxed category icon, and a hover tooltip on the panel start button (operator branding §A/§G).
license: GPL-3.0-or-later
homepage: https://github.com/InterGenJLU/intergenos
tier: desktop
build_style: custom
install_func: do_install
source:
- url: file:///intergenos-extensions-layout-${version}.tar.xz
  generated: true
# Canonical inputs of the generated tarball (item-8 fingerprint design):
# the content fingerprint hashes these + build.sh instead of the tarball's
# bytes, so a regeneration-context difference can never phantom-bump.
# PAIRED with verify_paths: the generator derives its zip set from the
# verify_paths UUIDs — adding a UUID there means adding its zip here too.
# (The ArcMenu downstream patch lives in this package's own patches/ dir,
# which the fingerprint's own-dir walk already covers.)
source_tree:
  - assets/theming/extensions/dash-to-dock@micxgx.gmail.com.zip
  - assets/theming/extensions/dash-to-panel@jderose9.github.com.zip
  - assets/theming/extensions/arcmenu@arcmenu.com.zip
  - assets/theming/extensions/show-desktop-button@amivaleo.zip
  - scripts/build-intergenos-source-tarballs.sh
dependencies:
  build: []
  host: []
  runtime:
  - gnome-shell-extensions

verify_paths:
  - /usr/share/gnome-shell/extensions/dash-to-dock@micxgx.gmail.com
  - /usr/share/gnome-shell/extensions/dash-to-panel@jderose9.github.com
  - /usr/share/gnome-shell/extensions/arcmenu@arcmenu.com
  - /usr/share/gnome-shell/extensions/show-desktop-button@amivaleo
