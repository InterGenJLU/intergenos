name: lib32-libogg
version: "1.3.6"
release: 1
description: Ogg bitstream container library (32-bit multilib runtime)
license: BSD-3-Clause
homepage: https://www.xiph.org/ogg/
tier: desktop
# PURE-YML package (no build.sh): driven end-to-end by the builder's lib32
# autotools lane — sourced profile per command, mechanism flags injected
# (host triplet, lib32 libdir, verbose rules), allowlist staged-copy
# install (only /usr/lib32 ships; headers/docs stay with the sibling).
#
# Closure role: terminal node of the measured lib32-libpulse NEEDED closure
# (libsndfile → flac/vorbis/opus → ogg; decided ADD 2026-07-02).
build_style: autotools
lib32_source: libogg
elf_class: "32"
# Mirror-only (D-W0-7: only lib32-glibc is ISO-resident).
iso_include: false
source:
- url: https://downloads.xiph.org/releases/ogg/libogg-${version}.tar.xz
  sha256: 5c8253428e181840cd20d41f3ca16557a9cc04bad4a3d04cce84808677fa1061
dependencies:
  build:
  - lib32-glibc
  host: []
  runtime:
  - lib32-glibc
configure_flags:
- --prefix=/usr
- --disable-static
verify_paths:
  - /usr/lib32/libogg.so.0
  - /usr/lib32/pkgconfig/ogg.pc
