name: graphviz
version: "14.1.2"
release: 3  # r3: cmake also states -DWITH_GDK=OFF, -DWITH_POPPLER=OFF and -DWITH_RSVG=OFF: the gdk, poppler and rsvg loader plugins the lineage never built linked five libraries its archive never needed.  # r2: cmake states -DWITH_GHOSTSCRIPT=OFF and -DENABLE_JAVASCRIPT=OFF, the lineage configuration, instead of auto-detecting Ghostscript and JavaScriptCore from the build root; enabling either is a product decision for after the tag.
description: Graph visualization software
license: EPL-1.0
homepage: https://graphviz.org/
tier: desktop
iso_include: false  # 2026-05-28 curation walk — Mirror
build_style: cmake
install_func: do_install
source:
- url: https://gitlab.com/graphviz/graphviz/-/archive/${version}/graphviz-${version}.tar.bz2
  sha256: 8ba7611c378b3e82f2a0ca5fc9dbcc5fef77c86d9fdfe3281f8f59eaab3314f6
dependencies:
  build:
  - cmake
  - cairo
  - pango
  - freetype2
  - fontconfig
  - libpng
  host: []
  runtime:
  - cairo
  - pango
  - freetype2
  - fontconfig
  - libpng
verify_paths:
  - /usr/bin/acyclic
  - /usr/lib/libcdt.so
