name: pipewire
version: "1.6.0"
release: 6  # r6: the two edges of the r5 install step, and a microphone boost written straight to the mixer. (1) The step refuses by name when a listed mixer path file is a symbolic link: it writes a new file and moves it into place, which on a link would leave a regular file in the staged tree while the file the link points at kept `volume = merge`, with the count still reaching twelve. (2) A second run over a tree the step has already rewritten now says so, instead of reporting the upstream change that wording describes; the step is not idempotent and says which of the two refusals it is. (3) `volume = zero` is asserted by the audio server only when it applies a route, so `alsactl restore` - run by alsa-restore.service from the saved state at boot and from the udev rule whenever a sound control device appears - holds a stored non-zero boost up until the next apply; measured on an HP Victus sof-hda-dsp card 2026-09-22, a restored state carrying the boost at maximum left the control at +30.00 dB and it stayed there. This package now installs /usr/libexec/pipewire-zero-microphone-boost, generated from the same element list the path-file rewrite uses, and a drop-in on alsa-restore.service whose ExecStartPost runs it after the restore. It needs no new dependency: without alsa-utils there is no unit to drop into and no restore to correct. The other state scheme, the alsactl daemon behind alsa-state.service, is not covered; this system ships no /etc/alsa/state-daemon.conf, which is the condition that unit requires. The bump tool does not watch this pinned-tarball recipe, so this number is moved by hand. (4) Every file the step writes is written to a name it creates itself in the destination directory and moved into place, so a symbolic link at a scratch name or at either generated file is refused instead of followed: previously a link at the fixed scratch name was written through, the file it pointed at was rewritten and the staged name itself became a link, and a link at the helper or the drop-in had its target overwritten and its mode changed. (5) The helper distinguishes an element this codec does not have, which is silent and ordinary, from an element it has that will not take 0 dB, which it names and which makes it exit non-zero; it prints one line of counts, and the drop-in keeps the leading dash that stops this from failing the state restore. (6) The refusal on a part-rewritten path set says the set cannot be continued from and the files must be staged again. Found by the independent read of the first form of this change. (7) The helper is generated in full and checked before it is published: a failure of the command that lists the boost elements, or a list that comes out empty, stops the step and leaves whatever was at the destination as it was. Before, the generation was piped straight into the writer, so that failure was discarded and a helper with an empty element list was published, which zeroes nothing and reports success; measured by the independent read of the second form with a failing sort. (8) Every part of the text the step publishes - the element list, the helper's header and body, and the drop-in - is produced by one command in a substitution of its own, its status checked on the line that captures it, and a part that comes out empty is refused too; both files are staged before either is published, the helper first. The form in (7) generated the whole helper in one substitution tested by `if !`, and bash ignores `set -e` inside a substitution tested as a condition, so its status was its last command's: measured by the independent read of that form, a native cat failure at the helper's first here-document returned 0 and published a helper with no header and no `set -u` in place of the one already there, and the drop-in's text was read only after the helper had been published. The emptiness check covers what a status cannot: when bash cannot make the pipe a substitution is read through, the assignment succeeds with an empty value. The files a successful build publishes are unchanged byte for byte.
# r5: the microphone boost is no longer part of the volume range. The mixer path files this package installs mark BOTH the capture element and a microphone boost element `volume = merge`, and the format's own documentation (analog-output.conf.common lines 31-42) says the server walks the merge elements in file order, drives the first to the top of its range and puts the remainder on the next one. Capture is listed first and the boost second, so a source volume of 100% was the capture element at its maximum with the boost stacked on top: measured 2026-09-21 on a Realtek ALC285, +30.00 dB of capture plus +30 dB of boost, sixty decibels of analog gain, which saturates the microphone; the same shape was read on a Realtek ALC236. do_install now sets the twelve boost stanzas across nine of those files to the format's own `volume = zero` ("always set it to 0 dB") on the staged copies, and fails the build unless it changed exactly those twelve. The files come from the upstream tarball and are not carried in this repository, so the rewrite runs on every build of every version. Hand-bumped: this recipe is pinned to an upstream tarball, so scripts/bump-changed-releases.py does not watch it. Decided 2026-09-21. # r4: the ALSA default device reaches PipeWire — the two ALSA configuration files this package installs into /usr/share/alsa/alsa.conf.d are now also linked into /usr/etc/alsa/conf.d, which is the directory alsa-lib actually reads, so the ALSA default reaches PipeWire instead of falling back to alsa-lib's built-in default. That fallback failed to record in both observed forms: on a machine whose first card is index 0 it is the dmix/dsnoop pair, and `arecord -D default` failed in dsnoop while PipeWire held the card; on a machine whose cards are not numbered from 0 it does not resolve at all, because alsa.conf sets `defaults.pcm.card 0`, and `arecord -D default` failed with "cannot find card '0'" then "Unknown PCM default" — measured on the development machine 2026-09-21, cards at index 1 and 2, where plain-ALSA playback was broken too. The installed definition names no card index, so it fixes both. Hand-bumped: this recipe is pinned to an upstream tarball, so scripts/bump-changed-releases.py does not watch it. Decided 2026-09-20. # r3: the three Bluetooth audio codecs ship — aptX, LDAC and LC3 are pinned =enabled in the meson line and their encoder libraries (libfreeaptx, ldacBT, liblc3) are declared deps, so a missing one halts the configure instead of silently dropping the codec. Decided 2026-09-18. # r2: capture wave: libcamera SPA + webrtc echo-cancel enabled
description: Multimedia processing framework
license: MIT
homepage: https://pipewire.org/
tier: desktop
build_style: custom
install_func: do_install
source:
- url: https://github.com/PipeWire/pipewire/archive/${version}/pipewire-${version}.tar.gz
  sha256: eef582901d8323669560dd32e3b76b1b15011d73a38f0035a3f11b933112f397
dependencies:
  build:
  - alsa-lib
  - avahi
  - bluez
  - fdk-aac
  - ffmpeg
  - gst-plugins-base
  - gstreamer
  - libcanberra
  - libdrm
  - libsndfile
  - libusb
  - libxcb
  - opus
  - pulseaudio
  - sbc
  - vulkan-loader
  - modemmanager  # BlueZ HFP-via-MM backend. Build #5 audit: silently
                  # disabled because not in deps (despite vulkan-loader being
                  # in deps, the bluez5-backend-native-mm path needs MM).
  - libcamera     # capture wave: the libcamera SPA plugin (-Dlibcamera=enabled)
  - webrtc-audio-processing  # capture wave: real AEC engine for
                             # module-echo-cancel (-Decho-cancel-webrtc=enabled)
  - libfreeaptx   # aptX / aptX HD encoder for the A2DP codec plugin
  - ldacBT        # LDAC encoder and its adaptive bitrate control
  - liblc3        # LC3 codec, used by LE Audio and by A2DP LC3
  host: []
  runtime:
  - alsa-lib
  - avahi
  - bluez
  - fdk-aac
  - ffmpeg
  - gst-plugins-base
  - gstreamer
  - libcanberra
  - libdrm
  - libsndfile
  - libusb
  - libxcb
  - opus
  - sbc
  - vulkan-loader
  - modemmanager
  - libcamera
  - webrtc-audio-processing
  - libfreeaptx
  - ldacBT
  - liblc3
configure_flags:
- --wrap-mode=nofallback
- -Dsession-managers=[]
# man pages are deliberately disabled (-Dman=disabled). Not a feature loss.
# (silent-loss audit 2026-06-25.)
silent_loss_accepted:
  - man   # man pages disabled by -Dman=disabled
  - roc   # roc-toolkit (network audio streaming) not in tree; outside the capture mandate's class-compliant/mainline scope — no consumer asks for it
verify_paths:
  - /usr/bin/pipewire
  - /usr/bin/pw-cat
  - /usr/lib/libpipewire-0.3.so
  # The two ALSA configuration links. alsa-lib reads /usr/etc/alsa/conf.d and
  # not /usr/share/alsa/alsa.conf.d, so without these the ALSA default device
  # is not PipeWire and recording through it fails. Declared here so the build
  # halts if they ever stop being installed, which is how they went missing
  # unnoticed in the first place.
  - /usr/etc/alsa/conf.d/50-pipewire.conf
  - /usr/etc/alsa/conf.d/99-pipewire-default.conf
