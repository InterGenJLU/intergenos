name: pipewire
version: "1.6.0"
release: 4  # r4: the ALSA default device reaches PipeWire — the two ALSA configuration files this package installs into /usr/share/alsa/alsa.conf.d are now also linked into /usr/etc/alsa/conf.d, which is the directory alsa-lib actually reads, so the ALSA default reaches PipeWire instead of falling back to alsa-lib's built-in default. That fallback failed to record in both observed forms: on a machine whose first card is index 0 it is the dmix/dsnoop pair, and `arecord -D default` failed in dsnoop while PipeWire held the card; on a machine whose cards are not numbered from 0 it does not resolve at all, because alsa.conf sets `defaults.pcm.card 0`, and `arecord -D default` failed with "cannot find card '0'" then "Unknown PCM default" — measured on the development machine 2026-09-21, cards at index 1 and 2, where plain-ALSA playback was broken too. The installed definition names no card index, so it fixes both. Hand-bumped: this recipe is pinned to an upstream tarball, so scripts/bump-changed-releases.py does not watch it. Decided 2026-09-20. # r3: the three Bluetooth audio codecs ship — aptX, LDAC and LC3 are pinned =enabled in the meson line and their encoder libraries (libfreeaptx, ldacBT, liblc3) are declared deps, so a missing one halts the configure instead of silently dropping the codec. Decided 2026-09-18. # r2: capture wave: libcamera SPA + webrtc echo-cancel enabled
description: Multimedia processing framework
license: MIT
homepage: https://pipewire.org/
tier: desktop
build_style: custom
install_func: do_install
source:
- url: https://github.com/PipeWire/pipewire/archive/${version}/pipewire-${version}.tar.gz
  sha256: eef582901d8323669560dd32e3b76b1b15011d73a38f0035a3f11b933112f397
dependencies:
  build:
  - alsa-lib
  - avahi
  - bluez
  - fdk-aac
  - ffmpeg
  - gst-plugins-base
  - gstreamer
  - libcanberra
  - libdrm
  - libsndfile
  - libusb
  - libxcb
  - opus
  - pulseaudio
  - sbc
  - vulkan-loader
  - modemmanager  # BlueZ HFP-via-MM backend. Build #5 audit: silently
                  # disabled because not in deps (despite vulkan-loader being
                  # in deps, the bluez5-backend-native-mm path needs MM).
  - libcamera     # capture wave: the libcamera SPA plugin (-Dlibcamera=enabled)
  - webrtc-audio-processing  # capture wave: real AEC engine for
                             # module-echo-cancel (-Decho-cancel-webrtc=enabled)
  - libfreeaptx   # aptX / aptX HD encoder for the A2DP codec plugin
  - ldacBT        # LDAC encoder and its adaptive bitrate control
  - liblc3        # LC3 codec, used by LE Audio and by A2DP LC3
  host: []
  runtime:
  - alsa-lib
  - avahi
  - bluez
  - fdk-aac
  - ffmpeg
  - gst-plugins-base
  - gstreamer
  - libcanberra
  - libdrm
  - libsndfile
  - libusb
  - libxcb
  - opus
  - sbc
  - vulkan-loader
  - modemmanager
  - libcamera
  - webrtc-audio-processing
  - libfreeaptx
  - ldacBT
  - liblc3
configure_flags:
- --wrap-mode=nofallback
- -Dsession-managers=[]
# man pages are deliberately disabled (-Dman=disabled). Not a feature loss.
# (silent-loss audit 2026-06-25.)
silent_loss_accepted:
  - man   # man pages disabled by -Dman=disabled
  - roc   # roc-toolkit (network audio streaming) not in tree; outside the capture mandate's class-compliant/mainline scope — no consumer asks for it
verify_paths:
  - /usr/bin/pipewire
  - /usr/bin/pw-cat
  - /usr/lib/libpipewire-0.3.so
  # The two ALSA configuration links. alsa-lib reads /usr/etc/alsa/conf.d and
  # not /usr/share/alsa/alsa.conf.d, so without these the ALSA default device
  # is not PipeWire and recording through it fails. Declared here so the build
  # halts if they ever stop being installed, which is how they went missing
  # unnoticed in the first place.
  - /usr/etc/alsa/conf.d/50-pipewire.conf
  - /usr/etc/alsa/conf.d/99-pipewire-default.conf
