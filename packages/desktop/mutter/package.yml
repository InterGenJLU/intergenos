  - argcomplete
  - at-spi2-core
  - glycin
  - graphene
  - gtk4
  - libei
  - libxcvt
  - libdisplay-info
  - pipewire
  - startup-notification
  - libinput
  - wayland-protocols
  - libxkbcommon
  - libX11
  - libXrandr
  - libXi
  - libXcomposite
  - libXdamage
  - libXfixes
  - desktop-file-utils
  - docutils
  - glib2
  - gnome-settings-daemon
  - libadwaita1
  - xwayland
  - cairo
  - colord
  - gsettings-desktop-schemas
  - lcms2
  - pixman
  host: []
  runtime:
  - at-spi2-core
  - glycin
  - graphene
  - gtk4
  - libei
  - libxcvt
  - libdisplay-info
  - pipewire
  - startup-notification
  - libinput
  - libxkbcommon
  - libX11
  - libXrandr
  - libXi
  - libXcomposite
  - libXdamage
  - libXfixes
  - glib2
  - gnome-settings-daemon
  - argcomplete
# The display-wakeup patch, added 2026-08-25. A graphics card that drives no
# display runtime suspends, and the compositor, which holds no file descriptor on
# an idle device it is not using, must reopen it when the driver announces the
# resume. A transient refusal from the session manager was being treated as
# evidence that the device had changed, which rebuilt every monitor
# configuration on the machine. The builder applies the declaration and verifies
# this hash before it does.
patches:
  - file: mutter-49.4-headless_device_reopen_keeps_state-1.patch
    sha256: d1e1c360cd67f32a6088103d1000e2c9fcd56f47d318c78e962a071b66dfe3de

# The patch lives in the canonical build/patches directory, which
# build-source-archives.py does not bundle on its own: it collects a recipe's
# OWN patches/ directory. Without this entry the published corresponding source
# would not carry the patch and could not rebuild the published binary. The
# kernel recipes carry the same kind of entry for the same reason.
sources_extra:
- build/patches/mutter-49.4-headless_device_reopen_keeps_state-1.patch

verify_paths:
  - /usr/bin/mutter
  - /usr/bin/gdctl
  - /usr/lib/libmutter-17.so
