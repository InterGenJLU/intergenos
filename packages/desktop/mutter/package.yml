name: mutter
version: '49.4'
release: 2  # r2: a failed device reopen no longer destroys the KMS state of a graphics card that drives no display. A card with nothing connected to it runtime suspends, and this compositor holds no file descriptor on an idle device it is not using, so it must reopen the device when the driver announces the resume. The session manager answered the first reopen with a refusal while it was still processing the same device event, and that refusal was being treated as evidence the device had changed: the device's planes, CRTCs and connectors were freed and a full resource change reported, which made the monitor manager rebuild every monitor configuration on the machine - windows moved to the primary monitor and monitor-bound backgrounds were re-created. A new declared patch, build/patches/mutter-49.4-headless_device_reopen_keeps_state-1.patch, retries the reopen in short steps for up to 100 ms - the retry that succeeded came 17.0 ms and 18.2 ms after the failure in two recorded occurrences - and, if it still fails, keeps the previous state and reports no change for a device with no connected connector. A device with a connected connector keeps today's behaviour, because a real hotplug on a card that drives a display must still be honoured. Proven: the patch applies to the pristine 49.4 source, the tree builds with it, and the patched file produces exactly the five compiler warnings the unpatched file produces and no others. Not proven: the behaviour on an installed system - that is an install away.
description: GNOME window manager and Wayland compositor
license: GPL-2.0-or-later
homepage: https://gitlab.gnome.org/GNOME/mutter
tier: desktop
build_style: custom
install_func: do_install
source:
- url: https://download.gnome.org/sources/mutter/49/mutter-${version}.tar.xz
  sha256: c1666ec50561530be25cb88d939c2bcc2af34f01c63b8b16b82b892ee33d7855
dependencies:
