name: intergenos-theme
version: "1.0.0"
release: 15  # r15: co-bump only: no change to this package's own content. The shared source-tarball generator scripts/build-intergenos-source-tarballs.sh is listed in this package's source_tree, and it changed so that the Welcomer's tarball now carries its polkit action file org.intergenos.welcome.policy; the input-based content fingerprint therefore moved for every package that declares the generator. This package's staged bytes are unchanged.  # r14: CSS comment only: one research-attribution comment in gtk-4.0/gtk.css reworded to neutral language in the pre-release register pass. No selector or rule change.  # r13: co-bump only: no change to this package's own content. The shared source-tarball generator scripts/build-intergenos-source-tarballs.sh is listed in this package's source_tree, and it changed so that the Welcomer's tarball now carries the shared name-lookup-failure module intergen/net_diagnostics.py; the input-based content fingerprint therefore moved for every package that declares the generator. This package's staged bytes are unchanged. r12: co-bump only: no change to this package's own content. The shared source-tarball generator scripts/build-intergenos-source-tarballs.sh is listed in this package's source_tree, and it changed so that the backup engine's sysusers.d group fragment is staged into the intergenos-backup tarball; the input-based content fingerprint therefore moved for every package that declares the generator. This package's staged bytes are unchanged. r11: co-bump only: no change to this package's own content. The shared source-tarball generator scripts/build-intergenos-source-tarballs.sh is listed in this package's source_tree, and it changed so that the welcome greeter's wiki icon is staged into its tarball; the input-based content fingerprint therefore moved for every package that declares the generator. This package's staged bytes are unchanged.
content_hash: d767e3f490a6a99d
description: InterGenOS native metatheme — GTK 3/4 + GNOME Shell stylesheets (ECG blue on deep navy); references the first-party InterGenOS icons + Bibata-Modern-Classic cursor
license: GPL-3.0-or-later
homepage: https://github.com/InterGenJLU/intergenos
tier: desktop
build_style: custom
install_func: do_install
source:
- url: file:///intergenos-theme-${version}.tar.xz
  generated: true
# Canonical inputs of the generated tarball (item-8 fingerprint design):
# the content fingerprint hashes these + build.sh instead of the tarball's
# bytes, so a regeneration-context difference can never phantom-bump.
source_tree:
  - assets/intergen-shell-theme
  - scripts/build-intergenos-source-tarballs.sh
dependencies:
  build: []
  host: []
  runtime:
  - gtk3
  - gtk4
  - intergenos-icon-theme
  - bibata-cursor-theme
  - font-inter
  - font-jetbrains-mono
verify_paths:
  - /usr/share/themes/InterGenOS
  - /etc/skel/.config/gtk-3.0
  - /etc/skel/.config/gtk-4.0
