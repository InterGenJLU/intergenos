name: lynx
version: "2.9.2"
release: 2  # r2: release-only bump. The package was rebuilt in the R001.2 cycle after the 2026-08-25 toolchain-recipe rename; the build inputs did not change, so the rebuilt archive carries the same version-release as the one the mirror already serves with different bytes, which the publish gate refuses (a changed package must strictly advance or installed systems never see it). No build change in this commit; the rebuild itself is proven by the chroot build and the mirror publish that follow.
description: Text-mode web browser
license: GPL-2.0-or-later
homepage: ''
tier: desktop
build_style: autotools
install_func: do_install
source:
- url: https://invisible-mirror.net/archives/lynx/tarballs/lynx${version}.tar.bz2
  sha256: 7374b89936d991669e101f4e97f2c9592036e1e8cdaa7bafc259a77ab6fb07ce
dependencies:
  build:
  - openssl
  - zlib
  - ncurses-core
  - brotli
  - libarchive
  - libidn2
  host: []
  runtime:
  - openssl
  - zlib
  - ncurses
  - brotli
  - libidn2
configure_flags:
- --prefix=/usr
- --sysconfdir=/etc/lynx
- --with-zlib
- --with-bzlib
- --with-ssl
- --with-screen=ncursesw
- --enable-locale-charset
verify_paths:
  - /usr/bin/lynx
  - /usr/share/doc/lynx-2.9.2
