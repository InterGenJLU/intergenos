name: gst-plugins-bad
version: "1.28.1"
release: 2  # r2: the aptX GStreamer elements (openaptxenc/openaptxdec) ship — libfreeaptx is declared a build dependency and the openaptx feature is pinned =enabled in the meson line, so a missing library halts the configure instead of silently dropping the plugin (the pipewire r3 pattern). The silent-loss gate named the in-tree library this package's 2026-08-15 build log did not find (the R001.3 build halt, 2026-10-12). Hand-bumped: this recipe is pinned to an upstream tarball, so scripts/bump-changed-releases.py does not watch it.
description: GStreamer bad plugins
license: LGPL-2.0-or-later
homepage: https://gstreamer.freedesktop.org/
tier: desktop
build_style: custom
install_func: do_install
source:
- url: https://gstreamer.freedesktop.org/src/gst-plugins-bad/gst-plugins-bad-${version}.tar.xz
  sha256: 56c1593787f8b5550893d59e4ff29e6bcccf34973316fa55e34ce493e04313a2
dependencies:
  build:
  - gst-plugins-base
  - libfreeaptx
  - soundtouch
  - bluez
  - curl
  - fdk-aac
  - gst-plugins-good
  - gtk3
  - json-glib
  - lcms2
  - libaom
  - libass
  - libexif
  - libgcrypt
  - librsvg
  - libsndfile
  - libssh2
  - libusb
  - libva
  - libwebp
  - libxkbcommon
  - libxml2
  - nettle
  - openjpeg2
  - opus
  - pango
  - sbc
  - shaderc
  - svt-av1
  - vulkan-loader
  - wayland
  - x265
  - glib2
  - gst-plugins-base-pass2
  - gstreamer
  host: []
  runtime:
  - soundtouch
  - bluez
  - curl
  - fdk-aac
  - gst-plugins-good
  - gtk3
  - json-glib
  - lcms2
  - libaom
  - libass
  - libexif
  - libgcrypt
  - librsvg
  - libsndfile
  - libssh2
  - libusb
  - libva
  - libwebp
  - libxkbcommon
  - libxml2
  - nettle
  - openjpeg2
  - opus
  - pango
  - sbc
  - svt-av1
  - vulkan-loader
  - wayland
  - x265
  - glib2
  - gst-plugins-base-pass2
  - gstreamer
verify_paths:
  - /usr/bin/gst-transcoder-1.0
  - /usr/lib/libgstadaptivedemux-1.0.so
