# Source: openSUSE Factory udisks2 service hardening patch.
# https://api.opensuse.org/public/source/openSUSE:Factory/udisks2/harden_udisks2.service.patch?rev=0a9604d874426bf9cd3f8dc71158e7b8
# Preserve host mount propagation: filesystem namespace restrictions such as
# PrivateTmp= and ProtectSystem= would hide mounts created by udisksd.
[Service]
ProtectHostname=true
RestrictRealtime=true
