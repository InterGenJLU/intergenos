# Hardening for cups-browsed.service, in the shape the tree's other daemons use.
#
# What the daemon must keep: the network, because its whole function is to
# listen for DNS-SD advertisements and to talk to the print scheduler over its
# socket; and the ability to write the scheduler's configuration, because
# creating a local print destination is what it does.
#
# What it does not need: the user's files, kernel tunables, module loading,
# new privileges, or any address family beyond the ones it uses.
[Service]
NoNewPrivileges=yes
PrivateTmp=yes
ProtectHome=yes
ProtectClock=yes
ProtectControlGroups=yes
ProtectKernelLogs=yes
ProtectKernelModules=yes
ProtectKernelTunables=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
SystemCallArchitectures=native
