# B10 (USA-1 audit closure -- runtime boot-chain trace finding)
#
# Force gdm.service to wait for systemd-tmpfiles-setup.service so upstream
# systemd's /usr/lib/tmpfiles.d/x11.conf "D! /tmp/.X11-unix 1777 root root"
# directive completes its boot pass BEFORE gdm-greeter (DynamicUser=yes)
# creates /tmp/.X11-unix as its own dynamic UID (UID 60578 in the runtime
# trace empirical capture). Per runtime trace finding: the race recurred
# on workstation cold boot 2026-05-21 06:51:50 -- gnome-shell core-dumped
# with "Failed to start X Wayland: Wrong ownership for directory
# /tmp/.X11-unix, owned by 60578 but should be same as /tmp (owned by (0))
# or 1000"; recovered via gdm restart ~6 min later.
#
# This drop-in resolves the timing race at the systemd-unit-ordering level
# rather than via a duplicate /etc/tmpfiles.d/ override (the previous
# duplicate-override approach was removed in v7-commit-4 per decision D6 of
# 2026-05-21 -- composes-with-upstream not fight-it).
#
# Cross-distro precedent: Debian, Fedora, openSUSE all rely on upstream
# tmpfiles.d/x11.conf for /tmp/.X11-unix; the GDM unit-ordering pattern
# here is the missing piece on InterGenOS specifically (because our
# DynamicUser-greeter timing happens earlier than the reference distros).

[Unit]
After=systemd-tmpfiles-setup.service
Wants=systemd-tmpfiles-setup.service
