name: sane-airscan
version: "0.99.38"
release: 1
description: Driverless scanning backend for eSCL and WSD scanners, over USB or the network
license: GPL-2.0-or-later
homepage: https://github.com/alexpevzner/sane-airscan
tier: desktop
# tier: desktop, on the media. This is the driverless half of scanning: a
# scanner made in the last decade speaks eSCL (Apple AirScan) or WSD, and this
# backend speaks both, so the machine scans with no vendor driver. It is the
# scanning counterpart of what ipp-usb does for printing — and over USB the two
# work together, because ipp-usb presents the USB scanner as a local eSCL
# device that this backend then finds on the loopback address.
iso_include: true
build_style: custom
install_func: do_install
source:
- url: https://github.com/alexpevzner/sane-airscan/archive/refs/tags/${version}.tar.gz
  filename: sane-airscan-${version}.tar.gz
  sha256: 1e5b3b8373141caa37bf42fe74ae1950de3ff15c84966d8a415485d334ba5507
dependencies:
  build:
  - sane-backends
  - avahi
  - libxml2
  - gnutls
  - libjpeg-turbo
  - libpng
  - libtiff
  - pkgconf
  host: []
  runtime:
  - sane-backends
  - avahi
  - libxml2
  - gnutls
  - libjpeg-turbo
  - libpng
  - libtiff
tests:
  enabled: false
  reason: "upstream's tests are separate binaries built by non-default Makefile targets (test, test-decode, test-devcaps, test-multipart, test-zeroconf, test-uri) and every one of them needs either a real scanner on the network or a live mDNS responder to answer: there is no target that runs without hardware. No scanner exists on any machine in this project. What this recipe owes is asserted in do_install on every build instead: the backend library was staged under the SANE backend directory, and the configuration files that register it with the SANE loader were staged."
verify_paths:
  - /usr/lib/sane/libsane-airscan.so.1
  - /usr/bin/airscan-discover
  - /etc/sane.d/airscan.conf
  - /etc/sane.d/dll.d/airscan
