name: defusedxml
version: "0.7.1"
release: 2  # r2: Ship in the desktop tier and on the ISO as wsdd's required, upstream-preferred XML parser; CairoSVG remains a consumer.
description: XML parsing safeguards for Python applications
license: PSF-2.0
homepage: https://github.com/tiran/defusedxml
tier: desktop
iso_include: true
build_style: custom
install_func: do_install
source:
  - url: https://files.pythonhosted.org/packages/source/d/defusedxml/defusedxml-${version}.tar.gz
    sha256: 1bb3032db185915b62d7c6209c5a8792be6a32ab2fedacc84e01b52c51aa3e69
dependencies:
  build:
    - setuptools
  host: []
  runtime: []
verify_paths:
  - /usr/lib/python3.14/site-packages/defusedxml/__init__.py
  - /usr/lib/python3.14/site-packages/defusedxml/ElementTree.py
