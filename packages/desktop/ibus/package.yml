name: ibus
version: "1.5.33"
release: 2  # r2: do_install now stages the Unicode Character Database into DESTDIR, so the ~40 MB the package has always put on disk is archived and manifest-recorded instead of shipping unowned. The payload an install receives really changes, so the release has to advance or pkm upgrade cannot see it. Hand-bumped: this package pins an upstream tarball, so bump-changed-releases.py does not track it.
description: Intelligent Input Bus framework
license: LGPL-2.1-or-later
homepage: ''
tier: desktop
build_style: custom
install_func: do_install
source:
- url: https://github.com/ibus/ibus/archive/${version}/ibus-${version}.tar.gz
  sha256: a777068caba4ba7599a3214e2966f564daec01bba94cd7f2ca63062107e0604f
- url: https://www.unicode.org/Public/17.0.0/ucd/UCD.zip
  sha256: 2066d1909b2ea93916ce092da1c0ee4808ea3ef8407c94b4f14f5b7eb263d28e
dependencies:
  build:
  - dconf
  - gtk3
  - gtk4
  - iso-codes
  - libarchive
  - vala
  - glib2
  - gnome-desktop
  - libnotify
  - libxkbcommon
  - pygobject3
  - wayland
  - dbus
  host: []
  runtime:
  - dconf
  - gtk3
  - gtk4
  - iso-codes
  - libarchive
  - glib2
  - gnome-desktop
  - libnotify
  - libxkbcommon
  - pygobject3
  - wayland
  - dbus
configure_flags:
- --prefix=/usr
- --sysconfdir=/etc
verify_paths:
  - /usr/bin/ibus
  - /usr/bin/ibus-daemon
  - /usr/lib/libibus-1.0.so
  # The Unicode Character Database this package now stages into DESTDIR
  # (build.sh do_install). Declared so the pre-squashfs audit proves the
  # payload reached the chroot instead of trusting that it did.
  - /usr/share/unicode/ucd/NamesList.txt
