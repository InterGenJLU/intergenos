# Sandboxing from the upstream 2.6 unit:
# https://gitlab.freedesktop.org/hadess/switcheroo-control/-/raw/2.6/data/switcheroo-control.service.in
# Version 1.3.1 writes debugfs and reads /proc/cmdline. Preserve both paths.
# ProtectSystem=strict excludes /sys; do not add ProtectKernelTunables.
[Service]
ProtectSystem=strict
ProtectControlGroups=yes
ProtectHome=yes
ProtectKernelModules=yes
PrivateTmp=yes
RestrictAddressFamilies=AF_UNIX AF_LOCAL AF_NETLINK
MemoryDenyWriteExecute=yes
RestrictRealtime=yes
