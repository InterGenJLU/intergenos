name: switcheroo-control
version: "1.3.1"
release: 1
description: D-Bus service that reports which GPU an application should run on
license: GPL-3.0-or-later
homepage: https://gitlab.freedesktop.org/hadess/switcheroo-control
tier: desktop
build_style: autotools
# tier: desktop because this is a desktop integration service, not a user
# application: GNOME Shell reads its net.hadess.SwitcherooControl D-Bus
# interface to offer "Launch using Discrete Graphics Card" on hybrid-graphics
# machines and to set the DRI_PRIME environment for the launched process.
# Without it that menu entry is simply absent — the shell has no other source
# for which GPU is which.
source:
  - url: https://github.com/hadess/switcheroo-control/archive/refs/tags/${version}.tar.gz
    filename: switcheroo-control-${version}.tar.gz
    sha256: 41eb7ed4974c927c479425d4848d6a689c54f63e94ad906bc88fb3d85d1c6efc

dependencies:
  build:
    - autoconf      # the release tag ships configure.ac only; autogen must run
    - automake
    - libtool
    - pkgconf
    - glib2         # PKG_CHECK_MODULES(SWITCHEROO_CONTROL, gio-2.0) + glib-compile-resources
    - systemd       # --with-systemdsystemunitdir target
  host: []
  runtime:
    - glib2
    - systemd

tests:
  enabled: false
  reason: "upstream ships no test suite at this tag — Makefile.am defines no check targets and there is no tests directory, so there is nothing to run. Recorded rather than left implicit."

verify_paths:
  - /usr/libexec/switcheroo-control
  - /usr/lib/systemd/system/switcheroo-control.service
  - /etc/dbus-1/system.d/net.hadess.SwitcherooControl.conf
