name: usbmuxd
# The pin is an upstream COMMIT, not the 1.1.1 release tag, and that is a
# deliberate, measured choice rather than a preference (Rule 12 comment):
#
#   1. The 1.1.1 release is from 2020-06-15 and DOES NOT COMPILE against the
#      library set this tree ships. Measured on an installed R001.2 machine
#      with the tree's own libplist 2.7.0: src/utils.h declares its own
#      `enum plist_format_t { PLIST_FORMAT_XML, PLIST_FORMAT_BINARY }`, which
#      libplist has defined in plist.h itself since 2.3, so four objects fail
#      with "redeclaration of enumerator 'PLIST_FORMAT_XML'" and make exits 2.
#   2. Upstream fixed exactly that in 049877e1 ("Update to use latest libplist
#      code") and now REQUIRES libplist >= 2.6.0 (configure.ac) — the tree has
#      2.7.0 — and also moved its shared code into libimobiledevice-glue
#      (32a8ebed), which this tree ships at 1.3.2.
#   3. The 2020 release also predates fixes that matter on a USB-facing
#      daemon: a use-after-free in the mode-query callback (dca337385), a
#      vendor-specific-request buffer that was not zero-initialised
#      (b5dfb25dd), and input sanitisation for the SavePairRecord command
#      (3ded00c9, the pinned commit itself). Shipping the release would ship
#      those defects knowingly.
#   4. It also predates Apple Silicon restore-mode product ids and the USB
#      mode switching current devices need, so a 2020 daemon would see fewer
#      devices than the library stack in this tree already understands.
#
# There is no newer release to move to: 1.1.1 is upstream's only release and
# is five years stale. The pin is therefore the immutable 40-character commit
# sha of upstream master at authoring time; the version string states which
# commit date it carries, following the master-snapshot format this tree
# already uses (packages/extra/rapidjson).
#
# Upstream commit: 3ded00c9985a5108cfc7591a309f9a23d57a8cba (2025-12-06)
version: "1.1.1+master.20251206"
release: 2  # r2: udev no longer RUNs the daemon (systemd-udevd kills a RUN-started process when the event ends — measured 2026-09-20 with an iPhone on an installed machine: alive at +3 s, gone at +6 s, never paired); the build now uses systemd support, so the rule wants a device-triggered usbmuxd.service with no [Install] section and a PIDFile under /run, the daemon exits by itself with no device and on the last device's removal; do_install asserts the staged unit and rule. r1: initial packaging, udev-only activation.
content_hash: e57e38aa6ceea28b
description: Daemon that multiplexes connections over USB to Apple mobile devices
license: GPL-2.0-only OR GPL-3.0-only
homepage: https://github.com/libimobiledevice/usbmuxd
tier: desktop
# tier: desktop for the same reason as its client library and libimobiledevice:
# this is desktop device integration, not a user-typed application. The gvfs
# afc backend and every libimobiledevice consumer talk to THIS daemon over
# /var/run/usbmuxd; without it those libraries are present and answer nothing.
iso_include: true   # the tier default, declared explicitly: the whole point of
                    # the package is that an installed machine can see an
                    # iPhone or iPad, so it must be on the media.
build_style: autotools
install_func: do_install
source:
  - url: https://github.com/libimobiledevice/usbmuxd/archive/3ded00c9985a5108cfc7591a309f9a23d57a8cba.tar.gz
    filename: usbmuxd-${version}.tar.gz
    sha256: fe4d04223b85add8bef6a2dd6452ef6f9bb1c0eb52ba036564c9aa8d1dd9dee2
dependencies:
  build:
    - autoconf                # the snapshot ships configure.ac only, no ./configure
    - automake
    - libtool
    - pkgconf
    - libusb                  # PKG_CHECK_MODULES(libusb, libusb-1.0 >= 1.0.9)
    - libplist                # PKG_CHECK_MODULES(libplist, libplist-2.0 >= 2.6.0)
    - libimobiledevice        # preflight worker support (>= 1.3.0)
    - libimobiledevice-glue   # PKG_CHECK_MODULES(limd_glue, >= 1.0.0)
  host: []
  runtime:
    - libusb
    - libplist
    - libimobiledevice
    - libimobiledevice-glue
    - systemd                 # udev runs the rule; systemd-sysusers creates usbmux
tests:
  enabled: false
  reason: "upstream ships no test suite at this commit — no TESTS variable and no check target in any Makefile.am, and no tests directory exists, so there is nothing to run. Recorded rather than left implicit. The assertions this recipe does owe (the binary reports the pinned version; no systemd unit was staged) run in do_install, which executes for every build, instead of in check(), which the builder skips for a package that declares tests disabled."
verify_paths:
  - /usr/sbin/usbmuxd
  - /usr/lib/udev/rules.d/39-usbmuxd.rules
  - /usr/lib/systemd/system/usbmuxd.service   # device-triggered by the rule; no [Install] section, so nothing can enable it at boot
  - /usr/lib/sysusers.d/usbmux.conf
