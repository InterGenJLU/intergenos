# Add a locked usbmux system user and group.
# The daemon drops to this account immediately after it has claimed the USB
# device (usbmuxd --user usbmux), and the udev rule hands the device node to
# the same account (OWNER="usbmux"), so nothing that talks to an Apple device
# over USB runs as root beyond the first moment.
# See man sysusers.d(5).
u! usbmux - "usbmuxd Apple device multiplexer"
