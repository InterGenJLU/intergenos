name: intergenos-grub-theme
version: "1.0"
release: 5  # r5: the boot menu's unified-kernel entries are now NAMED. Each entry /etc/grub.d/06_uki emits carries a menu id, and the newest carries a fixed one, intergenos-uki, which /etc/default/grub pins as the default. Before this, being first and being the default were the same thing only by accident: the unified-kernel entries sort ahead of the stock Linux entries because 06 is less than 10, and the stock header selects entry number zero, so any generator that later emitted an entry ahead of them would have taken the default on a machine that boots correctly today, with nothing in the menu configuration changing. An id cannot be taken that way. Older kernels get an id of their own so an operator or an automated recovery step can select one by name instead of by counting rows. No entry text, ordering or class changes; the newest kernel is still first.  # r4: description wording only: the design is recorded as decided on its date rather than credited to a project role. Theme, backgrounds and the /etc/grub.d override are unchanged. Hand bump — package.yml-only edits are outside the automatic bumper's fingerprint.
content_hash: fec42b62976e501f
description: InterGenOS GRUB boot-menu theme + resolution-aware background scaffold (design decided 2026-05-21; K1 closure) -- ships 12 Steam-hardware-survey-grounded background images + a runtime /etc/grub.d/06_intergenos_multi_background override that picks the matching PNG based on GRUB's negotiated $gfxmode + a minimal theme.txt that suppresses the menu border so the lower-right brand mark stays unobscured. Composes with upstream 05_debian_theme rather than forking it.
license: GPL-3.0-or-later
homepage: https://github.com/InterGenJLU/intergenos
# First-party authored assets following the assets/intergen-* canonical
# convention (mirrors intergen-firstboot / intergen-pkm-notifier /
# intergen-welcome). source: [] + direct cp -a from assets/ avoids the
# tarball-assembly step.
tier: desktop
build_style: custom
install_func: do_install
source: []
dependencies:
  build: []
  host: []
  runtime:
  # grub provides /etc/grub.d/, /etc/default/grub, /boot/grub/, /usr/share/grub/
  # grub-mkconfig_lib (which 06_intergenos_multi_background sources).
  - grub
verify_paths:
  - /etc/grub.d/06_intergenos_multi_background
  - /boot/grub/themes/intergenos/theme.txt
  - /boot/grub/backgrounds/1920x1080.png
  - /boot/grub/backgrounds/3840x2160.png
  - /boot/grub/grub_background.png
payload_license: GPL-3.0-or-later
