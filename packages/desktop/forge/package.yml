release: 232  # r233: co-bump only, no change to this package's own content. Its fingerprint covers the recipe tree it bundles — each non-toolchain recipe's build.sh and stripped package.yml — and in this change set five recipes really changed. FOUR of them now name the address that actually serves their pre-vendored tarball: loupe, snapshot, go-md2man, and gst-plugin-gtk4. The address all four named before answered 404. For the first three the project source mirror already held byte-identical copies; the fourth was obtainable from no reachable address at all until its original tarball was found where it was generated and published to that mirror on 2026-08-25, and every one of the four sha256 pins is untouched because each address was fetched and hashed against its pin before the recipe was changed. The fifth recipe, shim-signed, drops a source key nothing in the tree read; its own address already served its pinned bytes. MEASURED: applying only the parser change in this branch leaves this fingerprint unmoved, so the recipes are what moved it.  # r232: co-bump only, no change to this package's own content: installer_hooks bundles every non-toolchain recipe's build.sh and stripped package.yml into this package's fingerprint, so a release-number move anywhere in that set moves this one too. The move here is intergen r207, which teaches the assistant the word orders people actually use when they ask it to look something up on the internet.
# r231: co-bump only, no change to this package's own content: installer_hooks bundles every non-toolchain recipe's build.sh and stripped package.yml, and this change set edits the intergen-welcome recipe (r38: the launcher wrapper gains the per-user Hidden autostart override, and build.sh installs the Welcomer's polkit action), so the bundled bytes and this fingerprint advance with it.  # r230: co-bump only, no change to this package's own content. The tarball this recipe ships carries every non-toolchain recipe's build.sh and package.yml, so its fingerprint moves when any of them really changes; in this change three did - linux-kernel and linux-kernel-pass2 declare a new kernel patch, and mutter declares its first patch. A release-only bump elsewhere would not have moved it, which is the point of stripping the machine-owned lines before folding them.  # r229: co-bump only, no change to this package's own content: the fingerprint covers the recipe tree it bundles, and in this compose the intergen recipe's release line moved to r206 (the embedding server takes the input it is sent, is asked only when it is ready, and one alarm states its own numbers).  # r228: co-bump only, no change to this package's own content: the fingerprint covers the recipe tree it bundles, and in this compose the release notes of the intergen recipe (and this recipe's own r213/r217/r220/r223 notes) were reworded to state each delivery's measured proof boundary.  # r227: co-bump only, no change to this package's own content: the fingerprint covers the recipe tree it bundles, and in this compose the intergen recipe's release line moved to r205 (saying yes to an offered web search runs it; sunset questions are lookups, not the clock).  # r226: co-bump only, no change to this package's own content: the fingerprint covers the recipe tree it bundles, and in this change set the intergen recipe's release line moved to r204 (test-only: the installed-system gate predicates read the shape the tree ships, and the trace gate bounds its rows to the release under test).
# r224: co-bump only, no change to this package's own content: the fingerprint covers docs/users, and this compose corrects the seven user guides there to state what the shipped system does (encryption and Secure Boot recovery paths, package-manager semantics, service-hardening scope, the assistant's network exceptions and privilege dispatch).  # r223: co-bump only, no change to this package's own content: the fingerprint covers the recipe tree it bundles. `rocm-hip` and `rocr-runtime` now declare `rocprofiler-register` for their shipped DT_NEEDED edges; `rocsparse` declares `roctracer` for `libroctx64.so.4`. The intergen recipe's release line also moves to r199 for test-only turn-record row selection.  # r222: co-bump only, no change to this package's own content: the fingerprint covers the recipe tree it bundles, and in this compose the iptables recipe moved to r3 (its plain-named frontends repointed to the nftables backend) and the intergen recipe's release line moved r196 to r198 (offload by measured fit; secret-shape redaction in the turn record and the decision tracer).  # r221: co-bump only: no change to this package's own content. installer_hooks bundles every non-toolchain recipe's build.sh and stripped package.yml, and this change set edits the fcron recipe's package.yml, so the bundled bytes and this fingerprint advance with it.  # r220: installer/backend/bootloader.py now identifies the encrypted install's actual unlock initramfs at `/usr/lib/intergen/fde-initramfs.cpio.gz` instead of claiming that `/boot/initramfs.img` is replaced. The change is comment-only. Co-bump: `installer_hooks` also changed because this set edits the bundled fcron, linux-kernel and linux-kernel-pass2 recipes.  # r219: docs/users/desktop-experience.md gains the two keyboard-shortcut rows with their schema and key — show-desktop bound to Super+D in org.gnome.desktop.wm.keybindings, and Ctrl+Alt+T bound to the shipped terminal through the system dconf keybinding fragment. Documentation only; no installer, command or boot-order behaviour changes in this release.  # r218: co-bump only. This package's content fingerprint covers the recipe tree, and the intergen recipe's release line moved (r192 to r195: the turn-record lane and the per-conversation router-state lane). Nothing in forge itself changed.  # r217: when the installer can read live display state, a new user's stored monitor layout enables each connected monitor that reports a current mode and tiles it beside the primary instead of copying the greeter's single-primary layout. Outputs without a current mode are skipped, a state with nothing usable is refused, and the greeter seed remains single-primary. The old and new layouts were generated from a real display-state capture and the installer suite passed; a first login from a freshly built image was not proved in this change.  # r213: co-bump only: no change to this package's own content — installer_hooks bundles every non-toolchain recipe's build.sh and stripped package.yml, and this change set adds the new gst-plugin-gtk4 recipe (the camera application's preview sink element) plus snapshot's runtime dependency on it.  r212: co-bump only: no change to this package's own content — installer_hooks bundles every non-toolchain recipe's build.sh, and virt-manager's configure gained a startup-fix patch application in this change set.  r211: the boot menu's console font is now carried inside the signed GRUB image and loaded from there, instead of being read as a file on the EFI system partition. GRUB opens fonts as a file type the built-in shim_lock verifier does not skip, so under Secure Boot every font read from the partition was refused with "prohibited by secure boot policy" and the menu fell back to GRUB's built-in font. Both of this package's boot-path files change: installer/backend/bootloader.py builds a memdisk archive holding the font, passes it to grub-mkimage before the prefix flag (which that flag would otherwise overwrite), adds the tar module needed to read the archive, and refuses to sign an image missing either property; installer/iso/grub/grub.cfg loads the font from the memdisk path. The memdisk construction and unsigned OVMF path were executed; the Secure-Boot refusal and a signed clean boot were not proved in this change and ride the signing/install evaluation.  r210: co-bump only: installer_hooks bundles every recipe's stripped package.yml, and nmap's gained a measured silent_loss_accepted entry (bundled liblinear serves the feature) in this change set.  r209: co-bump only: no change to this package's own content — installer_hooks bundles every recipe's build.sh, and two hook texts moved in this change set (switcheroo-control's bootstrap gained the gtk-doc glue and macro removals; tcpdump's install dropped a make target its Makefile does not define).  r208: co-bump only: no change to this package's own content. This recipe declares installer_hooks, so the forge tarball bundles every non-toolchain recipe's build.sh; switcheroo-control's configure bootstrap changed in this change set (plain autoreconf replaces the gnome-common autogen path) and the bundled bytes moved with it.  r207: co-bump only: no change to this package's own content. This recipe declares installer_hooks, so the forge tarball bundles every non-toolchain recipe's build.sh; intergenos-backup's post_install changed in this change set and the bundled bytes moved with it.  r206: two changes. Its own: the post_install hook is removed — it existed only to enable forge-tui.service, which 80-intergenos-enable.preset whitelists and the real preset engine resolves to enabled; the unit also carries ConditionKernelCommandLine=igos.mode=install-tui, so it is a no-op outside install-tui mode either way, and with the call gone the function was empty. The co-bump half: this recipe declares installer_hooks, so the forge tarball bundles every non-toolchain recipe's build.sh, and the other recipes changed in this same change set move this package's content fingerprint with them.  # r205: co-bump only: no change to this package's own content. This package declares installer_hooks, so the forge tarball ships every non-toolchain package's build.sh and its content fingerprint moves whenever any recipe's hook text changes. The systemd recipe's post_install changed in this same change set. This package's own staged bytes are unchanged.  # r204: co-bump only: no change to this package's own content. This recipe declares installer_hooks, so the forge tarball bundles every non-toolchain package's build.sh and stripped package.yml as installer-hooks/, and the content fingerprint folds that set in. Seven recipes' build.sh changed in the service-enablement single-owner change, so the bundled bytes really did move and the release advances with them. The installer, its manual pages and the user documentation are untouched.  # r203: no behaviour change: one comment in the text-mode front end describing the output convention now states it without attributing the preference to a role, and forge's content fingerprint folds the tree-wide comment and documentation wording pass that landed with it. Text only; no code, no interface, no data.  # r202: no forge change at all: this package's fingerprint folds every non-toolchain recipe's build.sh and stripped package.yml as installer-hooks, so the handbrake package.yml edit in this same commit moved it. The forge payload is byte-identical to r201.  # r201: two mechanisms, no forge edit. scripts/lib/igos_trace.py, which do_install copies into the forge payload, is now declared in source_tree, so editing the trace library moves this package's fingerprint. And this package's fingerprint folds every non-toolchain recipe's build.sh and stripped package.yml as installer-hooks, so the linux-kernel and linux-kernel-pass2 package.yml edits in this same commit moved it as well. The forge payload is byte-identical to r200.  # r200: no forge source changed. forge's content fingerprint folds every non-toolchain package's stripped package.yml and build.sh; this cycle's pre-remove-hook change touches the nvidia recipe and pkm's build.sh header, so forge's shipped hook bytes change with them. Recipe and comment changes only; no code, no interface. Same mechanism and same verification as r186-r199.  # r199: the installer stops restating the release identity and records onto what the packages phase installed. generate_os_release now reads the target's /etc/os-release, strips any medium stamp and writes back the running medium's BUILD_ID as IMAGE_VERSION; generate_branding only asserts that /etc/issue and /etc/motd are present. Both fail loudly, naming intergenos-base-files, when the files are absent, and /etc/igos-release is left exactly as the package shipped it. Measured before the change on an installed system: the installer's own copy of os-release won, and it carried no LOGO= line, so that field was lost on every install.  # r198: post_install no longer masks the forge-tui.service enable, so a missing unit fails the package instead of shipping the text-mode installer entry point unreachable; the content fingerprint folds this change's recipe set.  # r197: no forge source changed. forge's content fingerprint folds every non-toolchain package's stripped package.yml and build.sh; this cycle's recipe/harness fix set changes ten recipes (test-phase retrofits, a build dependency, a file mode, staging and probe fixes, the first-boot greeter's autostart condition), so forge's shipped hook bytes change with them. Recipe fixes only; no code, no interface. Same mechanism and same verification as r186-r196.  # r196: no forge source changed. forge's content fingerprint folds the docs/users pages in its source_tree, and the documentation-truth pass corrected two of them against the implementing code. intergen.md's model-tier section previously said tiers are chosen from RAM and GPU and that the Tier-3 model was unreleased; the selector reads discrete-GPU video memory only, fails down on unreadable capability, and all three tiers ship, so the page now says that. secure-boot-and-mok.md previously said sbsign signs the UKI and that GRUB enforces check_signatures; ukify signs the UKI itself in the same invocation, and the gate in the fallback path is GRUB 2.14's built-in shim_lock verifier, so both are corrected and the tooling troubleshooting row is split so sbsign's real role is stated. Documentation text only; no code, no interface.  # r195: no forge source changed. forge's content fingerprint folds every non-toolchain package's stripped package.yml and build.sh; this cycle adds nineteen new package recipes (log rotation, VPN clients, container tooling, network diagnostics) plus a dependency line in one existing recipe, so forge's shipped hook bytes change with them. Recipe additions only; no code, no interface. Same mechanism and same verification as r186-r193.  # r194: installed-system grub now embeds the bli module (installer/backend/bootloader.py GRUB_EFI_MODULES): the generated grub.cfg insmods bli (25_bli) on every install, and under Secure Boot the shim_lock verifier refused the loose ESP module load, printing "prohibited by secure boot policy" on the boot console at every menu display. The ISO standalone grub already baked bli; this restores parity for the installed surface. New test tests/installer/test_grub_module_coverage.py pins both module lists to their config surfaces so they cannot drift apart again.  # r193: no forge source changed. forge's content fingerprint folds the docs/users pages in its source_tree; security-defaults.md's at-a-glance line now says the dm-verity seal covers the live and install media rather than the installed root filesystem, so forge's shipped hook bytes change with it. Documentation wording only; no code, no interface.  # r192: no forge source changed. forge's content fingerprint folds every non-toolchain package's stripped package.yml and four docs/users pages that are in its source_tree; this cut reworded security-defaults.md, desktop-experience.md, package-management.md and full-disk-encryption.md and corrected the homepage field in eight upstream recipes, so forge's shipped hook bytes change with them. Documentation and metadata wording only; no code, no interface. Same mechanism and same verification as r186-r191.  # r191: no forge source changed. forge's content fingerprint folds every non-toolchain package's build.sh; the gmp recipe's tracking-reference comment was reworded in the pre-release register pass, so forge's shipped hook bytes change with it. Same mechanism and same verification as r186-r190.  # r190: no forge source changed. forge's source_tree includes docs/users, and three user-guide pages were reworded in the pre-release register pass (package-management.md, databases.md, desktop-experience.md), so forge's content fingerprint folds those bytes. Documentation wording only; no code, no interface.  # r189: no forge source changed. forge's tarball ships every non-toolchain package's build.sh and stripped package.yml as installer-hooks/, so its content fingerprint folds those bytes; the elfutils recipe changed in this cut (r3, libdwfl/libdwelf headers) and forge's shipped hook bytes change with it. Same mechanism and same verification as r188 and r187.  # r188: no forge source changed. forge's tarball ships every non-toolchain package's build.sh and stripped package.yml as installer-hooks/, so its content fingerprint folds those bytes; the v4l-utils recipe changed in this cut (r2, glu edge) and forge's shipped hook bytes change with it. Same mechanism and same verification as r187 and r186.  # r187: no forge source changed. forge's tarball ships every non-toolchain package's build.sh and stripped package.yml as installer-hooks/, so its content fingerprint folds those bytes; the lib32-elfutils recipe changed in this cut (r2, sibling patch parity) and forge's shipped hook bytes change with it. Same mechanism and same verification as r186 and r185.  # r186: no forge source changed. forge's tarball ships every non-toolchain package's build.sh and stripped package.yml as installer-hooks/, so its content fingerprint folds those bytes; the elfutils recipe changed again in this cut (r2 amended: -Wno-error build) and forge's shipped hook bytes change with it. Same mechanism and same verification as r185 and r184.  # r185: no forge source changed. forge's tarball ships every non-toolchain package's build.sh and stripped package.yml as installer-hooks/, so its content fingerprint folds those bytes; the elfutils recipe changed again in this cut (r2 amended: riscv_disasm const patch declared) and forge's shipped hook bytes change with it. Same mechanism and same verification as r184 and r183.  # r184: no forge source changed. forge's tarball ships every non-toolchain package's build.sh and stripped package.yml as installer-hooks/, so its content fingerprint folds those bytes; the elfutils recipe changed in this cut (r2, libdw installed alongside libelf for the libcamera backtrace dependency) and forge's shipped hook bytes change with it. Same mechanism and same verification as r183 and r182.  # r183: no forge source changed. forge's tarball ships every non-toolchain package's build.sh and stripped package.yml as installer-hooks/, so its content fingerprint folds those bytes; the rocminfo recipe changed in this cut (r2, /usr/bin symlinks) and forge's shipped hook bytes change with it. Same mechanism and same verification as r182 and r181.  # r182: no forge source changed. forge's tarball ships every non-toolchain package's build.sh and stripped package.yml as installer-hooks/, so its content fingerprint folds those bytes; the intergen recipe changed in this cut (r164, round-2 training bank) and forge's shipped hook bytes change with it. Same mechanism and same verification as r181 and r180.  # r181: no forge source changed. forge's tarball ships every non-toolchain package's build.sh and stripped package.yml as installer-hooks/, so its content fingerprint folds those bytes; the intergen recipe changed in this cut (r163, tier-governed serving path) and forge's shipped hook bytes change with it. Same mechanism and same verification as r180 and r179.  # r180: no forge source changed. forge's tarball ships every non-toolchain package's build.sh and stripped package.yml as installer-hooks/, so its content fingerprint folds those bytes; both kernel recipes changed in this cut and forge's shipped hook bytes change with them. Same mechanism and same verification as r179 and r177.  # r179: no forge source changed. The forge tarball ships every non-toolchain package's build.sh and stripped package.yml as installer-hooks/, so forge's content fingerprint folds those hook bytes (igos-build/content_hash.py, installer_hooks_fingerprint). Both kernel recipes changed in this cut to carry the fabricated-device build gate, so the hook bytes forge ships genuinely change and the release moves with them. Verified rather than assumed: the branch base measured clean at 122 packages in sync, and each of forge's own declared source_tree entries hashes byte-identically before and after.  # r178: the two EXPERIMENTAL LUKS unlock methods (TPM2-sealed key, FIDO2 token) are NO LONGER OFFERED by the installer. A functionality review (2026-08-08) found both not functional as shipped: FIDO2 enrollment aborts an install that opts in, and the TPM2 sealed key's parent context cannot survive a reboot, so auto-unlock never outlives the first power cycle. One offer switch (installer/backend/disks.py EXPERIMENTAL_UNLOCK_OFFERED=False) gates everything: the GUI switch rows and their EXPERIMENTAL hint stay hidden, the TUI never asks, and the backend REFUSES install_io that requests the flags anyway — loudly in the aggregated validation error, never a silent drop. Passphrase LUKS is untouched; every boot-side path already falls through to the passphrase. Enrollment plumbing retained for the post-release fix, which returns only with dedicated hardware verification (enroll + reboot on real TPM2 and FIDO2 hardware). Proven against reality: the real GUI wizard was driven under a headless compositor — LUKS on, neither switch presented; flipping the offer switch in-process makes both appear (the firing detects presence). That firing also caught a scoping defect in the first edit (module alias referenced outside its constructor scope) that source-level tests missed. New guard: installer/tests/test_experimental_unlock_not_offered.py (7 cases incl. mutation control). User docs updated with a status note (docs/users/full-disk-encryption.md, secure-boot-and-mok.md). NOT proven here: the TUI question flow was not pty-driven end to end (its two gates are the same constant, source-asserted); the wiki book adjustment is a separate release-time surface.  # r177: two coupled moves in one commit, neither a forge code change. (1) forge's OWN source archive was understating its build: build.sh installs scripts/lib/igos_trace.py from the repository tree (build.sh:124) and the generated forge tarball does not carry it — the file is now declared in sources_extra, so the published corresponding source finally contains every input the build consumes. (2) The installer-hooks fingerprint moved because 23 other recipes gained sources_extra declarations in this commit (kernel lifecycle helpers, openssh's unit, the lib32 env/cross/toolchain inputs, mesa's feature matrix) — same by-design coupling as r176/r175.  # r176: no change to forge's own files. forge ships every non-toolchain package's build.sh and package.yml as its installer-hooks tree, so its fingerprint moves when any recipe's package.yml moves — and both kernel recipes gained a sources_extra declaration in this commit. The hook bytes forge installs really are different, so the release advances. Same by-design coupling as r175 (igos-build/content_hash.py installer_hooks_fingerprint).  # r175: no change to forge's own files. forge ships every non-toolchain package's build.sh and package.yml as its installer-hooks tree, so its content fingerprint moves whenever any recipe's build.sh moves — and packages/core/linux-kernel/build.sh changed in this same commit (the fake-hardware assertion loop). The bytes forge installs really are different, so the release advances and installed systems receive the corrected kernel hook. This coupling is by design (igos-build/content_hash.py installer_hooks_fingerprint), not a spurious bump.  # r174: ships the new installer/smoke/checks/hardware.sh category — the unclaimed-hardware smoke checks (deferred-probe list, unclaimed PCI, audio controller with no card, card reader with no MMC host, laptop with no touchpad, day-one devices). forge carries the installer/ tree into its generated tarball, so a smoke-harness change is a forge content change.  # r172: machine bump only: no forge source changed. The installer-hook fingerprint this package declares covers the recipe tree, and the intergen recipe change in this commit (the secondary-AMD-GPU runtime-PM udev rule routed into its install) moved it.  # r171: machine bump only: no forge source changed. The installer-hook fingerprint this package declares covers the recipe tree, and this compose moved it twice over: the ibus recipe now stages the Unicode Character Database into DESTDIR, and intergenos-default-settings gained the shell blur-effects dconf fragment.  # r170: machine bump only: no forge source changed. The installer-hook fingerprint this package declares covers the recipe tree, and the three recipe changes in this commit moved it.  # r169: machine bump only: no forge source changed. The installer-hook fingerprint this package declares covers the recipe tree, and the recipe changes in this commit moved it.  # r168: the Phase-1 wave compose. Real build.sh change: do_install now creates DESTDIR/usr/bin itself before the smoke-test symlink instead of depending on the caller's skeleton; plus the doc-viewer image-size comment refreshed to the cropped 640x456 panel captures, and the fingerprint re-derived over the six merged branches (the wave's recipe edits all fold into the installer-hooks hash).  # r167: machine bump only: no forge source changed. The installer-hook fingerprint this package declares covers the recipe tree, and the release lines of the other packages in this change moved, so the fingerprint moved with them.  # r166: the installer's GPU detection records which GPU architectures the installed compute engine build supports, so the assistant and the setup flow can tell a supported device from an unsupported one instead of treating every AMD device as capable.  # r165: machine bump only: the installer-hooks fingerprint couples to the recipe changed in this commit (libxapp's dbus build-dep declaration). No forge source changed.  # r164: machine bump only: the installer-hooks fingerprint couples to the recipe changed in this commit (handbrake's recorded silent-loss acceptance). No forge source changed.  # r163: machine bump only: the installer-hooks fingerprint couples to the recipes changed in this commit (the nv-codec-headers 13.0.19.0 pairing fix). No forge source changed.  # r162: the Graphics & compute screen is removed and its detection is kept. The installer can never perform the vendor driver or compute-engine install — both are mirror-only and the installer reaches no network — so a page whose only product was a command to remember across a reboot has been retired. Forge still runs the same PCI probe the install-time hardware gate uses and writes /etc/intergen/gpu-detection.json onto the installed system (vendor, the engine that ships, the mirror-only engine the vendor can add, and whether adding it changes which engine serves, all derived from the ratified per-vendor engine preference). The first-boot welcome reads that record and makes the offer where the package manager can actually run it, with the vendor's own licence gate. The wizard is eight screens again; no user choice about graphics is recorded during the install, because none is made there any more.  # Also folds the composed wave's recipe-set movement (installer_hooks fingerprint) and the steam r6 density command recipe. r161: machine bump only: the installer-hooks fingerprint couples to the recipe changed in this commit. No forge source changed. r160: machine bump only: the installer-hooks fingerprint couples to the recipes changed in this commit. No forge source changed. r159: neutral-language sweep of comments and printed text: decisions are recorded as "decided <date>" instead of being credited to a person or project role, development-host shorthand is replaced by a plain description, and the citations of a repository that is not published are replaced by what they were pointing at. Comments and strings only — no rule, path, flag, threshold or code path changed. The public-content scanner now carries detectors for all three classes (scripts/check-public-content.py), so the classes cannot return silently; tests/preflight/test_public_language_detectors.py proves each detector in both directions. r158: installer-hooks fold co-bump — the icon-theme recipe (r8, three new application marks) joined the composed wave after the r157 settlement, moving the fold once more. Number and content_hash derived by scripts/bump-changed-releases.py on the composed tree.# r157: installer-hooks fold co-bump on the composed wave — no forge source change beyond the new Graphics & compute screen riding the forge tarball. Five branches composed (language sweep, allowlist paydown, GPU wizard page, codec-headers/timm recipes, Track A recipes); the fold covers every non-toolchain build.sh + package.yml, so the composed recipe set moves the fingerprint once. Number and content_hash derived by scripts/bump-changed-releases.py on the composed tree.# r156: installer-hooks fold co-bump — no forge source change. The forge tarball ships every non-toolchain package's build.sh and package.yml, so the comment-only rewording in the openssh, shadow, intergen and nvidia recipes moved the fold. Verified at the mechanism rather than from the bumper's summary: installer_hooks_fingerprint computed in both trees moved 7ea9a3891b99 -> a8ed010cc8a6. r155: installer-hooks fold co-bump — no forge source change. Nineteen recipes normalized their license: field to a valid SPDX identifier for the new licence-identifier gate, and forge bundles every non-toolchain recipe as installer-hooks/, so those bytes move forge's fingerprint. r154: installer-hooks fold co-bump — no forge source change. The firewall-defaults recipe gained its bridge-scoped libvirt DHCP/DNS accepts (intergenos-firewall-defaults r2) and installer_hooks: true folds every recipe's hooks into this package's fingerprint, so the composed tree moves it again atop r153. The number and fingerprint were derived by scripts/bump-changed-releases.py on the composed tree rather than chosen by hand. Same fold class as r152. r153: the inline documentation viewer renders images, and the MokManager enrollment captures ship with the walkthrough. installer/frontend/gui/doc_viewer.py was text-only: a markdown image line rendered as literal text, so docs/users/secure-boot-and-mok.md described the four MokManager screens in prose and the installer's link to it advertised "Step-by-step walkthrough" because "Screenshots" would have been a claim the viewer could not meet. The viewer now splits a doc into a sequence of text and image blocks and builds the dialog body as a box of labels and pictures instead of one label; a doc with no images renders exactly as before. An image reference is resolved only as a relative path, with an image suffix, resolving inside the directory the doc itself was read from — absolute paths, parent-directory escapes, symlinks leading out of that directory, URLs and every other suffix are refused, because the viewer opens files on the running system and the markdown it renders must not be able to choose them. A reference that does not resolve renders as a visible placeholder carrying the caption, never a crash and never a silent omission. The four captures (docs/users/images/mok-1-enroll.png, mok-2-view.png, mok-3-confirm.png, mok-4-reboot.png) are the existing verified-boot walkthrough images, copied unmodified, and this package now installs docs/users/images/ beside the markdown at /usr/share/doc/intergenos/users/ so the installed and live-medium paths both resolve. The installer's link subtitle says "Screenshots" again, which is now true. r152: installer-hooks fold co-bump — no forge source change. One NEW package recipe entered the fold, packages/ai/python-xxhash (the Python binding for xxHash, which the datasets package imports at module load and which no existing package provided), and installer_hooks: true folds every recipe's hooks into this package's fingerprint. The number and fingerprint were derived by scripts/bump-changed-releases.py on the rebased tree rather than chosen by hand. Same fold class as r151/r150/r149. r151: the install seeds the created user's ~/.config/monitors.xml with the same synthesized single-primary layout the greeter seed derives from the live session (users.seed_user_monitor_layout, called beside seed_greeter_monitor_layout). The user's first login was the one unseeded surface left: with no stored monitor configuration, mutter settles the connected-monitor set while the first background paint and offscreen effects run against unsettled state — on a multi-GPU machine the desktop rendered the solid primary-color fallback on every screen and windows were thrown onto a wrong default primary until a monitor-configuration re-apply forced a repaint (measured on a triple-GPU install 2026-07-31: 233 offscreen-framebuffer failures in the first login's journal; zero on every later boot, because a stored configuration is applied before painting). Ownership comes from the target's /etc/passwd; an unresolvable user or unreadable live state traces a skip and writes nothing — a root-owned monitors.xml would block the user's own layout saves. Best-effort exactly like the greeter seed; the r76 sync service mirrors the user's later saves back to the greeter unchanged. installer/backend ships via this package. r150: installer-hooks fold co-bump, composed-landing re-derivation — no forge source change. The three engine recipes' build hooks changed in this landing (the build-number stamp: ai/llama-cpp r7, compute/llama-cpp-cuda r3, compute/llama-cpp-hip r3), and installer_hooks: true folds every recipe's hooks into this package's fingerprint. The stamp branch recorded r149 against the pre-landing tip while the BLFS-parser landing had already taken r149 with a different fingerprint, so neither recorded value matches the composed tree; the machine re-derived the number and fingerprint here (the r141/r148 class). Same fold class as r149/r148/r147. r149: installer-hooks fold co-bump — no forge source change. Two NEW package hooks entered the fold: packages/core/soupsieve and packages/core/beautifulsoup4, the HTML/XML parser the BLFS book reader imports and its required CSS selector engine, both mirror-only. installer_hooks: true stages every non-toolchain recipe's build.sh and stripped package.yml into this package's tarball, so a new recipe dir moves its fingerprint. This release was re-derived after a rebase: it was first recorded as r148 against an earlier tip, and r148 had meanwhile been taken by the llama-cpp fold landing, so the machine recomputed the fingerprint on the rebased tree and this is that value. Same class as r148/r147/r146. r148: installer-hooks fold co-bump, composed-landing re-derivation — no forge source change. packages/ai/llama-cpp's build.sh changed (the default engine stops installing test, example and undeclared tool binaries), and installer_hooks: true folds every recipe's hooks into this package's fingerprint. This landing and the release_staged_source landing each recorded r147 against their own trees, so neither recorded fingerprint matches the composed tree; the machine re-derived the value here (the r141 class). Same fold class as r147/r146/r145/r144. r147: installer-hooks fold co-bump — no forge source change. The intergenos-wiki recipe gained a release_staged_source declaration, read by the tarball-membership gate to tell a generated tarball that is absent because its source is staged at release time from one whose recipe could not be parsed; installer_hooks: true folds every recipe's stripped package.yml into this package's fingerprint, so the added line moves it. The declaration is inert at install time (the installer reads these recipes with yaml.safe_load and never looks at the key). Same class as r146/r145/r144. r146: installer-hooks fold co-bump — no forge source change. Three engine recipes (ai/llama-cpp, compute/llama-cpp-hip, compute/llama-cpp-cuda) changed in this set (the --list-devices PCI-id patch), and installer_hooks: true folds every recipe's hooks into this package's fingerprint. Same class as r145/r144. r145: installer-hooks fold co-bump — no forge source change. installer_hooks: true folds every recipe's hooks into this package's fingerprint, and eleven recipes moved in this change set (the Welcomer's name-lookup page and the shared-generator co-bumps behind it). Same class as the earlier fold co-bumps. r144: installer-hooks fold co-bump — two NEW package hooks entered the fold (packages/compute/cuda-toolkit and packages/compute/llama-cpp-cuda, the CUDA serving engine and the toolkit install-helper). NO forge source change; same class as r141/r139/r138/r137/r135/r134/r133/r132/r131. r143: boot-chain pair. (1) The root LUKS volume's crypttab line now carries x-initrd.attach, so the shutdown transaction no longer runs `systemd-cryptsetup detach cryptroot` while the root filesystem is still mounted on it — every FDE install recorded "Device cryptroot is still in use" and a failed systemd-cryptsetup@cryptroot.service at every shutdown. (2) The UEFI boot entry the installer registers is now verified and kept: the install reads NVRAM back after writing it and records the observed BootOrder in the forensic trace, writes /etc/intergenos/boot-default.conf with the user's default-boot-target answer, and ships intergenos-bootorder-check plus its unit, which restores the registered entry to the front of BootOrder when firmware moves it (measured: a board enumerated the ESP's fallback loader as its own "UEFI OS" option and placed it first, so the machine booted through \EFI\BOOT\BOOTX64.EFI instead of the registered entry). The checker changes nothing when the user kept another operating system as the default. installer/ ships via this package. r142: the installer places the account it creates in the chronicle group. The backup engine's socket is now root:chronicle mode 0660 instead of 0666, so an account outside that group cannot open the backup application at all; the account this installer creates is the machine's console user, so the group is granted at account creation alongside wheel, audio, video, cdrom and input. The group set moved into a named constant, DEFAULT_USER_GROUPS, and an explicit group list that omits chronicle is honoured but logged as a warning naming the consequence, because an account that silently cannot open its backup application looks like a broken application. The groupadd loop that already ran before useradd covers the ordering: useradd -G aborts the whole account creation on a group that does not exist yet, and this installer's account is the only administrative login on the installed system. r141: composed-landing re-derivation, no new source change. The two branches landing in this cycle each recorded r140 against their own tree — one for the installed-mode smoke corrections, one for the live boot-menu timeout — so neither recorded value matches the fingerprint of the tree that actually ships. The machine re-derived it here. The content of this release is exactly the two changes described in r140 below, nothing more. r140: installed-mode smoke set: three signing checks now report what they measured. sign/mok-enrolled asked mokutil for a SHA-256 fingerprint that mokutil never prints (it lists SHA-1 only), so the comparison could not match and the check FAILed on every Secure-Boot-on system whose key was correctly enrolled; it now asks `mokutil --test-key` with the certificate converted to DER, falling back to comparing exported enrolled certificates, and the not-enrolled case still FAILs. integrity/dev-skip and integrity/self-reval grepped the forge install trace without checking they could read it — the trace is mode 0600 root, so a non-root run printed a raw permission error and then drew a conclusion from a read that never happened; both now say plainly that root is required. An unused SMOKE_MOK_DER override variable, which nothing read, is removed. installer/ ships via this package. ALSO IN r140, landing in the same cycle: co-bump for the live medium's boot menu: installer/iso/grub/grub.cfg raises the menu timeout from 2 seconds to 10. USB keyboards on evaluated hardware need about 3.8 seconds to initialise, so the menu timed out and booted the default before a first keystroke could register and no boot entry could be chosen. 10 seconds matches GRUB_TIMEOUT=10, the value written for installed systems. No signed artifact changes: the menu config is copied to the ESP and is not an input to the standalone GRUB binary, the UKIs or any signing step, and grubx64.efi rebuilt from the inputs before and after the change is byte-identical. r139: installer-hooks fold co-bump — intergen-welcome's build.sh entered the fold (its launcher wrapper now clears a stale re-arm request at startup); no installer source change. r138: installer-hooks fold co-bump — intergen-welcome's build.sh entered the fold (its launcher wrapper learned to clear the first-login marker when a driver install is started from the AI-assistant page); no installer source change. r137: installer-hooks fold co-bump — linux-kernel-pass2's package.yml (r7 verify_paths lockstep to igos-10) entered the fold; no installer source change. r136: greeter monitor-seed reader runs busctl via setpriv instead of runuser — the live image ships setpriv (util-linux) and does NOT ship runuser (needs PAM), so the seed step skipped on every install to date (measured on the ge9b-12 installed system: WARNING `runuser` absent, monitors.xml never seeded); uid/gid resolved via pwd at call time, unknown-user surfaces as the traced-SKIP DisplayStateError posture, tests updated to the setpriv contract. installer/backend ships via this package. r135: installer-hooks fold co-bump — intergen-welcome's and intergenos-backup's build.sh (r19 wiki mark; r4 preset whitelist) entered the fold; no installer source change. r134: installer-hooks fold co-bump — mesa's build.sh (r7 skip-subprojects install) entered the fold; no installer source change. r133: installer-hooks fold co-bump — intergenos-backup's post_install now starts the engine and timers it enables. r132: installer-hooks fold co-bump — glibc-core's build.sh (r4 localtime-clobber removal) entered the fold; no installer source change. r131: installer-hooks fold co-bump — rust-bindgen's build.sh (r3 fail-closed check) entered the fold; no installer source change. (⚠ r111–r130 notes were never carried by their machine bumps — reconstruct from git history, not this chain.) r110: account-database seeding at the config phase — installer/backend/config.py gains seed_account_databases() wired FIRST in generate_all() (create-only, fail-loud on an absent/incomplete skeleton; must precede the users phase useradd --root); pairs with intergenos-base-files r13 payload split. installer/backend ships via this package. r108: installer_hooks fingerprint co-bump — the linux-kernel r8 boot-menu post-install hook + the claude-code 2.1.218 helper-pin recipe entered the fold; NO forge source change; same class as r45/r51/r55/r58-r64. r86: package-group description truth sync (decided 2026-07-22, F41 wave) — GROUPS "extra" no longer advertises download-helpers that are mirror-only (now: the tier's real ISO-shipped membership — Firefox/Thunderbird/LibreOffice/GIMP/media/QEMU-libvirt/CLI tools) and "ai" drops the stale "text-only" label (InterGen is multimodal; the tier ships intergen + llama-cpp, training apparatus is mirror-only); the TUI's own hardcoded copies synced to the same truth. backend/packages.py + frontend/tui.py changed bytes. r76: greeter monitor-layout sync enable at PHASE_SERVICES (decided 2026-07-21) — installer/backend users.py gains enable_greeter_monitor_sync (host-side systemctl --root, fail-loud), install.py calls it with the wizard-created username after enable_services; pairs with gdm r4's shipped helper + templated units. installer/backend ships via this package. r75: UserPage MOK docs-row subtitle honest-claim reword — the doc is prose-only and the inline viewer is text-only, so "Screenshots" over-promised (record-sweep finding, honest-claim step 1, 2026-07-19). r73: installer_hooks fingerprint co-bump — systemd/systemd-pass2 r3 (pcrproduct ordering drop-in) entered the fold; NO forge source change. r72: installer_hooks fingerprint co-bump — the 2026-07-19 fix-wave recipe changes entered the fold (qemu r4 udev+optionroms, python-requests/certifi r3 --ignore-installed); NO forge source change; same class as r45/r51/r55/r58-r64/r69. r69: installer_hooks fingerprint co-bump — the 2026-07-18 curation-correction wave (gimp/inkscape/libreoffice + 12 runtime-closure deps flipped iso_include true, releases bumped) entered the fold; NO forge source change; same class as r45/r51/r55/r58-r64. r64: installer_hooks fingerprint co-bump — the igos-build tracker snapshot-prune fix (builder.py: log-dir + trace-root pruned from the direct_install walk) entered the fold basis; NO forge source change; same class as r45/r51/r55/r58-r63. r63: installer_hooks fingerprint co-bump — the linux-kernel-pass2 r3 build-hook change (rsync-free uapi-header export) entered the fold; NO forge source change; same class as r45/r51/r55/r58-r62. r62: installer_hooks fingerprint co-bump — the runtime-dir wave recipe edits (base-files r9, apache-httpd r3, fcron r5, openldap r2, qemu r2, samba r2, tpm2-tss r3), the dev-demo NoDisplay trio (gtk4 r3, vte r2, librest r2), the libcap-ng extra->core retier + util-linux-pass2 introduction, and the intergen r82/r83 package.yml changes (WP-4.1 live-run land) entering the fold; NO forge source change; same class as r45/r51/r55/r58-r61. r61: installer_hooks fingerprint co-bump — the linux-kernel/-pass2 uapi-headers build-hook changes entered the fold; NO forge source change. r60: installer_hooks fingerprint co-bump — the libxml2-pass2 hook entered the fold + the swtpm r2 build-hook change; NO forge source change; same class as r45/r51/r55/r58/r59. r59: installer_hooks fingerprint co-bump — the amdsmi build.sh comment fix (compute-wave land) + intergen r80/r81 package.yml changes (scenario-harness Phase-3/4 lands) entering the fold; NO forge source change; same class as r45/r51/r55/r58. r58: installer_hooks fingerprint co-bump — intergen r78/r79 package.yml changes (scenario-harness Phase-2 land) + the compute-tier wave hooks in the working tree entering the fold; NO forge source change; same class as r45/r51/r55. r55: installer_hooks fingerprint co-bump — packages/ai/intergen/build.sh changed (ship the intergen/tests/scenario/seeds/ data dir with the scenario-harness Phase-1 grading + seed scenarios); NO forge source change; same class as r45/r52. r54: installer_hooks fingerprint co-bump — packages/compute/rocprofiler-register/build.sh changed (the TARGETS_GLOBAL flag + fmt/format.h migration, probe-proven pair); NO forge source change; same class as r45. r53: installer_hooks fingerprint co-bump — packages/compute/rocprofiler-register/build.sh changed (the CPackComponent include patch); NO forge source change; same class as r45. r52: installer_hooks fingerprint co-bump — packages/ai/intergen/build.sh changed (ship the intergen/tests/scenario/ subpackage, the scenario-harness Phase-1 skeleton); NO forge source change; same class as r45. r51: installer_hooks fingerprint co-bump — new compute-tier package hooks entered the fold (packages/compute/rocprofiler-register at its introduction, packages/compute/fmt + packages/compute/glog with the system-libs recipe wave) plus the rocprofiler-register recipe edit; NO forge source change; same class as r45. r50: install-defect wave (decided 2026-07-16, first hardware-install findings): (1) installer-hooks fold ships yml-only recipes' package.yml (previously skipped with build.sh absent -> Forge's runtime-dep closure was blind through them; plutosvg/plutovg silently missing on the installed system, libSDL3_ttf unresolvable); (2) foreign-OS detection excludes removable-media device paths (a USB stick's firmware entry carries a trailing HD() node -> false "another operating system detected" on the install medium itself); (3) MokManager staged into the ESP EFI/BOOT fallback dir (firmware taking the fallback path with a pending MOK enrollment hard-failed "MOK Manager not found" and bootlooped); (4) forensic-trace step events redact positionally-passed secrets + sinks open 0600 (install passwords landed in plaintext in the mode-644 target trace). installer/ + scripts/lib/igos_trace.py + the hooks fold ship via this package. r48: installer_hooks fingerprint co-bump — the intel-ucode + linux-firmware package.ymls changed (microcode-currency version bumps); NO forge source change; same class as r44/r45/r46. r47: installer_hooks fingerprint co-bump — the five perl-module build hooks gained the perllocal.pod strip; NO forge source change; same class as r44-r46. r46: installer_hooks fingerprint co-bump — the intergenos-default-settings package.yml changed (greeter idle-suspend release note, r11); NO forge source change; same class as r44/r45. r45: installer_hooks fingerprint co-bump — two changed build hooks entered the fold (packages/desktop/gdm/build.sh, the Wayland-only build; packages/ai/intergen/build.sh, the judge_calibration data-dir install). NO forge source change; same class as r19/r21-r29/r37-r40/r44. r44: installer_hooks/source_tree co-bump — installer/backend config.py + install.py changed (carried Wi-Fi profile drops the live-user permission binding), and forge ships the installer tree in its source_tree, so forge's content_hash moved. NO forge-specific source change; same co-bump class as r19/r21-r29/r37-r40. r40: installer_hooks fingerprint co-bump — three NEW package hooks entered the fold (packages/desktop/plutovg, plutosvg, sdl3-ttf: the SDL3_ttf color-emoji chain for the freerdp SDL3 client, decided 2026-07-12) + the freerdp r4 dep change; NO forge source change; same class as r19/r21-r29/r37-r39. r39: installer_hooks fingerprint co-bump — the intergenos-wiki package.yml gained the signed pages-manifest pair in source_tree (first-mint wiki manifest ceremony, 2026-07-12); NO forge source change; same class as r19/r21-r29/r37. r38: static-core fold moved on the installer/init/init.sh S3-F1 header-comment fix (comment-only, no behavior change). r37: installer_hooks fingerprint co-bump — the seven-branch cleanup landing folded THREE hook changes: a NEW package hook (packages/desktop/intergenos-wiki/build.sh, the wiki-citation + offline-wiki arc), a NEW package hook (packages/core/mpdecimal/build.sh, the sweep-dispositions system-mpdecimal split), and changed build hooks (python + libheif WITH_DAV1D, same sweep). NO forge source change; same class as r19/r21-r29. r29: installer_hooks fingerprint co-bump — a NEW package hook entered the fold (packages/extra/winetricks/build.sh, the GE-tooling wave / winetricks recipe). NO forge source change; same class as r22/r24-r28. r28: installer_hooks fingerprint co-bump — two NEW package hooks entered the fold (packages/core/lib32-dbus/build.sh + packages/extra/lib32-gamemode/build.sh, the GE-tooling lib32 wave: the 32-bit libdbus floor + the 32-bit gamemode client pair). NO forge source change; same class as r22/r24/r25/r26/r27 (new package hooks entering the fold). r27: installer_hooks fingerprint co-bump — two NEW package hooks entered the fold (packages/base/unzip/build.sh + packages/extra/cabextract/build.sh, the GE-tooling wave landing winetricks' unzip + cabextract runtime deps). NO forge source change; same class as r22/r24/r25/r26 (new package hooks entering the fold). r26: installer_hooks fingerprint co-bump — a NEW package hook entered the fold (packages/extra/gamemode/build.sh, the GE-tooling wave / gamemode recipe). NO forge source change; same class as r19/r21/r22/r23/r24/r25. r25: installer_hooks fingerprint co-bump — four NEW package hooks entered the fold (packages/desktop/libXres/build.sh + packages/desktop/libdecor/build.sh + packages/desktop/seatd/build.sh + packages/extra/gamescope/build.sh, the gamescope floor + recipe). NO forge source change; same class as r19/r21/r22/r23/r24. r24: installer_hooks fingerprint co-bump — a NEW package hook entered the fold (packages/desktop/intergenos-launch-monitor/build.sh, the launch-monitor GNOME Shell extension). NO forge source change; same class as r19/r21/r22/r23. r23: installer_hooks fingerprint co-bump — the nvidia + lib32-nvidia package.yml deps changed (the decided auto-couple: nvidia runtime-deps lib32-nvidia, and the reverse edge dropped), and the fold hashes the release/content_hash-stripped package.yml, so forge's installer_hooks_fingerprint moved. NO forge source change; same class as r19/r21/r22. r22: installer_hooks fingerprint co-bump — a NEW package hook entered the fold (packages/extra/lib32-nvidia/build.sh, the 32-bit NVIDIA twin), so forge's installer_hooks_fingerprint changed. NO forge source change; same class as r19/r21. Re-bump so the staged hook set can never ship stale. r21: installer_hooks fingerprint co-bump — the intergen build.sh install hook changed (panic-remediation intergen.service scoping, intergen r45), so forge's installer_hooks_fingerprint (the item-8 input basis) picked it up. NO forge source change; same class as r19 (gimp hook). Re-bump so the staged hook can never ship stale. r20: runtime-generation fix in the GE smoke gate (installer/smoke/checks/gaming.sh). The runtime locator hardcoded "sniper", but the SLR generation is PER-TOOL — measured on-metal 2026-07-08: Proton 11 + GE-Proton11 require SLR 4.0 (require_tool_appid 4183110), Hotfix/Experimental require sniper (1628350). gaming.sh now enumerates EVERY installed generation (SLR_4 / sniper / soldier) via _ge_present_runtimes and the composed-path proof probes each, fail-closed if none present — never a hardcoded generation. Fixtures extended (SLR_4-only, both-generations, no-generation strict-fail) in tests/installer/test_ge_composed_path_assert.py; 29 tests green. installer/ ships via this package. r19: gimp 3.2.4 hook auto-bump (the installer_hooks fingerprint picked up the changed gimp build hook, upstream 9fa0f708 — no forge source change). r18: RT-2 composed-path assertor (installer/smoke/ge-composed-path-assert.py) corrected against the FIRST real on-metal sniper srsi capture (2026-07-08, the GE-02 test machine, RTX 3070 Ti). The assertor was written against an ASSUMED steam-runtime-tools schema its own comments flagged for "the item-5 live run to confirm"; this is that run, and it false-failed every stack: (1) vulkan graphics-details is keyed by <window-system>/<api> ("x11/vulkan"), not "<arch>/vulkan" — now found by "*/vulkan" suffix scan (back-compatible with the arch spelling); (2) library health is "libraries-ok" bool (+ library-details) in the sniper schema, not a "library-issues-summary" list — now accepts either, fail-closed if neither; (3) F3-a rejected ANY cpu-type device in the list, but Mesa always enumerates llvmpipe ALONGSIDE the real GPUs (the capture shows x86_64 = NVIDIA + Intel + llvmpipe, renderer NVIDIA) — now fails only when the SELECTED renderer is software OR NO real (non-cpu) GPU is enumerated, preserving the software-fallback catch without the false positive; (4) GLX-info key found by scan. Proven: fixed assertor PASSES the captured report, leg-2 --strict PASSES live end-to-end (1 PASS/0 FAIL), 26 tests green incl. 6 new real-sniper-schema fixtures (tests/installer/test_ge_composed_path_assert.py). installer/ ships via this package. content_hash BASIS = INPUTS not tarball bytes (item-8 completion, 2026-07-08): forge's fingerprint is now its source_tree static core + installer_hooks normalized per-package hooks instead of the generated tarball's bytes — no shipped-byte change, and the basis migration itself takes NO release bump (the e34cf726/fd997c5e precedent). Retires forge's --check "generated source not in build/sources" error (now clean on a bare tree) and closes the stale-hooks silent-loss gap a static source_tree would leave. r15: work-plan 1.25 + 1.22 — the Forge install-time UX pair (installer/backend + frontend). D1/1.25 (default boot target, decided 2026-07-08, Prime Directive): efibootmgr --create unconditionally prepended InterGenOS to BootOrder, silently making it the machine default on dual-boot metal. bootloader.py now detects a foreign installed-OS boot entry (an active HD-path efibootmgr entry that is not ours), the GTK Confirm screen + the TUI ask "Make InterGenOS the default boot target?" ONLY when one is present (a single-OS / non-EFI install keeps the historical prepend, no ask), and install-time BootOrder is set per the answer — declined -> InterGenOS demoted to last so the prior default stays first; accepted or single-OS -> prepend kept. Trace event efibootmgr_default_boot_target records the decision. D2/1.22 (MOK-staging nudge, PI-Z18): an EFI install with Secure Boot currently OFF silently skipped MOK-enrollment staging; the Confirm screen + the TUI now state the consequence LOUDLY (enabling Secure Boot later needs a manual mokutil --import) while a blank MOK password stays a valid choice (never forced); trace event mok_enrollment_skipped_efi records the skip + SB state. RED/GREEN in installer/tests/test_boot_default_target.py + test_forge_ux_pair_frontend.py; 398 installer tests green. installer/ ships via this package. r14: S4 security-review fix (P1-A/1.1) — installer locale-injection defense. The user-selected locale is interpolated into a root `bash -c` inside the target chroot (config.py generate_locale -> hooks.run_chroot); config.py now validates it against a strict <lang>[_TERRITORY][.CODESET][@modifier] allowlist and fails closed BEFORE writing locale.conf or touching the shell, so a name carrying shell metacharacters ("en_US.UTF-8; rm -rf /") can no longer break out into arbitrary root code. run_chroot/run_chroot_stdin call-site census confirmed locale is the only untrusted-free-text sink (bootloader = internal constants + partitioner device paths; mok = installer-built paths + stdin password; install = static). installer/backend ships via this package. item 8a: hooks tree strips release/content_hash (bump-feedback-loop kill) + mode-normalized tarball. r12: PI-Z6 eula_helper packages omitted from the non-interactive install set
