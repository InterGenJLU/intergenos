# item-8 completion (2026-07-08): forge's content fingerprint is its INPUTS, not
# the generated tarball's bytes (byte-hashing was context-sensitive — item 8).
# source_tree = the STATIC core scripts/build-forge-tarball.sh stages verbatim;
# installer_hooks:true adds the DYNAMIC per-package hooks fold (every non-
# toolchain build.sh + release/content_hash-stripped package.yml) so a stale
# hook can never ship unbumped. content_hash rebaselined to this input
# fingerprint with NO release bump (basis migration, the e34cf726/fd997c5e
# precedent). See igos-build/content_hash.installer_hooks_fingerprint.
source_tree:
- installer
- man/forge.1
- man/intergenos-bootorder-check.8
- docs/users
- scripts/build-forge-tarball.sh
- scripts/lib/igos_trace.py
installer_hooks: true
dependencies:
  build: []
  host: []
  runtime:
  - python
  - gtk4
  - libadwaita1
  - pygobject3
  - polkit
verify_paths:
  - /usr/bin/forge
  - /usr/bin/forge-gui-launch
  - /usr/bin/intergenos-smoke-test
  - /usr/lib/intergenos/bootorder-check.sh
  - /usr/lib/systemd/system/intergenos-bootorder-check.service
  - /usr/lib/intergenos/smoke-test.sh
  - /usr/lib/python3.14/site-packages/installer
  - /usr/lib/systemd/system/forge-tui.service
  - /usr/lib/systemd/system/forge-installer-backend.service
  - /usr/share/applications/forge-gui.desktop
  - /usr/share/dbus-1/system.d/org.intergenos.ForgeInstaller1.conf
  - /usr/share/dbus-1/system-services/org.intergenos.ForgeInstaller1.service
  - /usr/share/intergenos/installer-hooks
  - /usr/share/man/man1/forge.1

# Build inputs composed from the repository tree (declared so the published
# source archive carries every input the build consumes — the corresponding-
# source rule the kernel config fragments established; survey 2026-08-11).
sources_extra:
- scripts/lib/igos_trace.py
