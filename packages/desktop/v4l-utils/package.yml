name: v4l-utils
version: "1.32.0"
release: 2  # r2: declare glu in dependencies.build (silent-loss gate catch — GL rendering had configured out; the new edge orders glu first and the template-hash flip rebuilds against it). Decided 2026-08-15.
description: Video4Linux utilities and libraries (v4l2-ctl, media-ctl, libv4l)
license: LGPL-2.1-or-later AND GPL-2.0-or-later
homepage: https://linuxtv.org/wiki/index.php/V4l-utils
tier: desktop
build_style: custom
source:
- url: https://linuxtv.org/downloads/v4l-utils/v4l-utils-1.32.0.tar.xz
  sha256: 6828828a17775526eb93fb258a9294d1d1073d633c344dd71ecd4e7a1ffb7dfc
dependencies:
  build:
  - systemd
  - gettext     # meson.build:233 pkg-config-requires it at build (undeclared-deps HARD, ge9b-10 onboarding)
  - perl-core   # meson.build:88 requires the perl program at build (undeclared-deps HARD, ge9b-10 onboarding)
  - glu         # qv4l2/qvidcap GL rendering — BLFS-recommended, in-tree; silent-loss gate catch at the RC001 resume (built before glu with no edge, GL feature silently lost). Decided 2026-08-15.
  host: []
  runtime:
  - libjpeg-turbo
  - alsa-lib
  - glu         # libGLU NEEDED by the qv4l2/qvidcap GL path (build dep above)
  - systemd
verify_paths:
  - /usr/bin/v4l2-ctl
  - /usr/bin/media-ctl
  - /usr/lib/libv4l2.so
  - /usr/lib/gconv/gconv-modules.d/gconv-modules-v4l.conf
