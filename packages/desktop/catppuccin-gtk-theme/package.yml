name: catppuccin-gtk-theme
version: "1.0.3"
release: 7  # r7: co-bump only: no change to this package's own content. The shared source-tarball generator scripts/build-intergenos-source-tarballs.sh is listed in this package's source_tree, and it changed so that the Welcomer's tarball now carries its polkit action file org.intergenos.welcome.policy; the input-based content fingerprint therefore moved for every package that declares the generator. This package's staged bytes are unchanged.  # r6: co-bump only: no change to this package's own content. The shared source-tarball generator scripts/build-intergenos-source-tarballs.sh is listed in this package's source_tree, and it changed so that the Welcomer's tarball now carries the shared name-lookup-failure module intergen/net_diagnostics.py; the input-based content fingerprint therefore moved for every package that declares the generator. This package's staged bytes are unchanged. r5: co-bump only: no change to this package's own content. The shared source-tarball generator scripts/build-intergenos-source-tarballs.sh is listed in this package's source_tree, and it changed so that the backup engine's sysusers.d group fragment is staged into the intergenos-backup tarball; the input-based content fingerprint therefore moved for every package that declares the generator. This package's staged bytes are unchanged. r4: co-bump only: no change to this package's own content. The shared source-tarball generator scripts/build-intergenos-source-tarballs.sh is listed in this package's source_tree, and it changed so that the welcome greeter's wiki icon is staged into its tarball; the input-based content fingerprint therefore moved for every package that declares the generator. This package's staged bytes are unchanged.
content_hash: 0f767651a82810c1
description: Catppuccin GTK theme — Mocha-blue-standard variant (the welcomer's Catppuccin Mocha combo target)
license: MIT
homepage: https://github.com/catppuccin/gtk
tier: desktop
build_style: custom
install_func: do_install
source:
- url: file:///catppuccin-mocha-blue-${version}.tar.xz
  generated: true
# Canonical inputs of the generated tarball (item-8 fingerprint design):
# the content fingerprint hashes these + build.sh instead of the tarball's
# bytes, so a regeneration-context difference can never phantom-bump.
source_tree:
  - assets/theming/gtk-themes/catppuccin-mocha-blue.zip
  - scripts/build-intergenos-source-tarballs.sh
dependencies:
  build: []
  host: []
  runtime:
  - gtk3

verify_paths:
  - /usr/share/themes/catppuccin-mocha-blue-standard+default/cinnamon/cinnamon.css
  - /usr/share/themes/catppuccin-mocha-blue-standard+default/cinnamon/thumbnail.png
  - /usr/share/themes/catppuccin-mocha-blue-standard+default/gnome-shell/gnome-shell.css
