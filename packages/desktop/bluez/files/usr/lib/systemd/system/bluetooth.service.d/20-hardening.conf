# Additional protections used by the NixOS Bluetooth service:
# https://github.com/NixOS/nixpkgs/blob/5a0711127cd8b916c3d3128f473388c8c79df0da/nixos/modules/services/hardware/bluetooth.nix
# Keep /dev/uhid and /dev/rfkill visible for input and radio control.
# Preserve upstream capabilities, filesystem restrictions and host networking.
[Service]
RestrictNamespaces=true
RestrictSUIDSGID=true
SystemCallArchitectures=native
LockPersonality=true
