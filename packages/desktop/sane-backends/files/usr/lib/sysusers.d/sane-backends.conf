# sane-backends — the accounts the shipped files name and nothing else
# declares.
#
# scanner: the group the scanner access rule assigns to every matched device
# (60-libsane.rules: MODE="0664", GROUP="scanner"). The user at the seat
# reaches the device through systemd's uaccess tag on the same match; this
# group is for accounts that are not at the seat — the sharing daemon below,
# a user on another console — and for the rule to name a group that exists:
# udev logs "unknown group" at every rules load otherwise and leaves the
# device root-owned.
#
# saned: the account the network scanner-sharing unit runs as
# (saned@.service: User=saned, Group=saned; the preset ships the socket
# disabled). A member of scanner so that, once deliberately enabled, it can
# open the devices the rule hands that group.
#
# IDs system-assigned.
# Type Name     ID  GECOS                               Home Shell
g      scanner  -   -
u      saned    -   "Network scanner sharing daemon"    -    /sbin/nologin
m      saned    scanner
