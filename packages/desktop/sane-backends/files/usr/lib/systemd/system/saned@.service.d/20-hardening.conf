# Hardening for saned@.service — the per-connection unit the socket starts when
# another machine asks to use this machine's scanner.
#
# This unit runs only when the person has deliberately turned scanner sharing
# on; it ships disabled. When it does run, it handles input from another
# machine, so it gets the tightest set the daemon can work under: it needs the
# scanner (raw USB) and the connection the socket hands it, and nothing else.
#
# It does not get ProtectSystem=strict: saned writes nothing outside /tmp, but
# the backends it loads read their configuration from /etc/sane.d and some
# open firmware files under /usr/share, so the read-only ProtectSystem=full
# posture plus ProtectHome is what is asserted here.
[Service]
NoNewPrivileges=yes
PrivateTmp=yes
ProtectHome=yes
ProtectSystem=full
ProtectClock=yes
ProtectControlGroups=yes
ProtectKernelLogs=yes
ProtectKernelModules=yes
ProtectKernelTunables=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
SystemCallArchitectures=native
