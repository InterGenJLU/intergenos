# sane-backends — the device lock directory. The backends that serialize
# access to one scanner across processes (the plustek family) create their
# lock files here; the library was configured with --with-lockdir=/run/lock/sane
# and the directory is never a packaged member: /run is a tmpfs, and an
# archive member under /var/lock would land as a real directory where the
# base files ship a symlink into /run.
#
# World-writable with the sticky bit, like /var/lock itself on the systems
# upstream's default (localstatedir/lock) was written for. The user at the
# seat holds the scanner through systemd's uaccess access list and shares no
# group with other scanning accounts, and a lock the device holder cannot
# create is an access-denied answer from the backend, not a warning.
# Residue stated plainly: a lock file left by a dead process of ANOTHER
# user cannot be removed by the next user (the sticky bit), so that backend
# answers access-denied until the file is removed by its owner or root, or
# the machine reboots and the tmpfs is recreated.
#
# Type Path            Mode User Group Age
d      /run/lock/sane  1777 root root  -
