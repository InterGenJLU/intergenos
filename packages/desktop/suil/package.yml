name: suil
version: "0.10.26"
release: 1
description: LV2 plugin UI loader — wraps native plugin GUIs for host toolkits
license: ISC
homepage: https://gitlab.com/lv2/suil
tier: desktop
build_style: meson
install_func: do_install
source:
- url: https://download.drobilla.net/suil-${version}.tar.xz
  sha256: 62808916602c47d201a1ec2d246323a8048243f2bf972f859f0db1db4662ee43
dependencies:
  build:
  - lv2
  - lilv
  - gtk3
  host: []
  runtime:
  - lv2
  - gtk3
# the GTK2 plugin-UI wrapper is disabled — InterGenOS ships GTK3/4 not GTK2
# (gtk+-3.0 found YES). Not a loss.
# (silent-loss audit 2026-06-25.)
silent_loss_accepted:
  - gtk2   # GTK2 plugin-UI wrapper; we ship GTK3/4
verify_paths:
  - /usr/lib/libsuil-0.so
  - /usr/lib/pkgconfig/suil-0.pc
