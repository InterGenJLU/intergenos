name: snapshot
# GNOME 49 alignment: 50.0 added a glycin-gtk4-2 pkg-config dep that
# requires GNOME 50 stack. 49.1 only needs plain glycin (which we ship).
version: '49.1'
release: 3  # r3: release-only bump. The package was rebuilt in the R001.2 cycle after the 2026-08-25 source-address correction; the build inputs did not change, so the rebuilt archive carries the same version-release as the one the mirror already serves with different bytes, which the publish gate refuses (a changed package must strictly advance or installed systems never see it). No build change in this commit; the rebuild itself is proven by the chroot build and the mirror publish that follow.  # r2: declares the gst-plugin-gtk4 runtime dependency. The camera preview pipeline hard-requires the gtk4paintablesink GStreamer element and the application aborted at launch without it; the element ships in the new gst-plugin-gtk4 package.
description: GNOME camera application
license: GPL-3.0-or-later
homepage: https://apps.gnome.org/Snapshot/
tier: desktop
build_style: meson
install_func: do_install
source:
- url: https://download.gnome.org/sources/snapshot/49/snapshot-${version}.tar.xz
  sha256: 3558f6f8e0d38b2950b6bad9b9eec238249bedfedce70fb58a28cad6945e6ce9
# Pre-vendored Cargo crates (offline chroot, by security design). Generated
# via `cargo vendor` on build VM with rustup cargo 1.95.
# Decided 2026-08-25: this URL moves to the project's own source mirror. The
# address it used to name answered 404, so a rebuild from this recipe alone
# could not obtain the file; the build only kept working because
# scripts/download-sources.py falls back to the mirror when an address fails,
# which turned an outage path into the everyday path. The mirror copy was
# fetched and hashed on the same day and is byte-identical to the pin below,
# so nothing about what gets built changes.
- url: https://repo.intergenos.org/sources/current/snapshot-${version}-vendor.tar.gz
  sha256: 5b3b6ae56d10370fadca8e7d02e723bf526263c9705ac2d97d81cc4e164402db
dependencies:
  build:
  - gtk4
  - libadwaita1
  - glycin
  - gstreamer
  - gst-plugins-base
  - lcms2
  - libseccomp
  - rust
  - gst-plugins-bad
  - glib2
  - gst-plugins-base-pass2
  host: []
  runtime:
  - gtk4
  - libadwaita1
  - glycin
  - gstreamer
  - gst-plugins-base
  - lcms2
  - libseccomp
  - gst-plugins-bad
  - glib2
  - gst-plugins-base-pass2
  # gtk4paintablesink — the camera preview sink; the application aborts at
  # launch without it (found 2026-08-21).
  - gst-plugin-gtk4
verify_paths:
  - /usr/bin/snapshot
  - /usr/share/snapshot
