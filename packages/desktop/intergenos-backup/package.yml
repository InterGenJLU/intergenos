name: intergenos-backup
version: "1.0"
release: 21  # r21: the root-run Chronicle pre-transaction handler uses /usr/bin/python3 -P, so PATH and the current directory cannot select its interpreter or imports. r20: three capture and state corrections in Chronicle, each with a red-then-green proof against the real engine on scratch files. (1) An unchanged file is reused by hard link only after its bytes and the previous stored copy are verified: a same-size file whose modification time was preserved, or whose earlier stored copy was damaged, was reused with stale bytes. (2) A source that changes while it is being copied is refused (identity, size, mode, ownership and both timestamps compared before and after), and the staging left behind is removed; a cleanup that itself fails is reported to the client beside the original error instead of only as an exception note. (3) An unreadable engine state file (malformed, wrong encoding, unreadable) is refused and its bytes preserved instead of being silently replaced by an empty state. Validation of the twelve earlier corrections: each reproduces as a failure on the tree before its fix and passes at this tree. Not proven: the installed daemon, socket and authorization path — the first R001.3 install is that leg.  # r19: two gaps in the retention record closed (independent review of the landed guard, 2026-09-11). (1) A validator I/O error (OSError from the checked open of the store) escaped without a saved outcome: during preflight it bypassed prune-refused, and during the repeated validation of a later candidate — after an earlier one was already removed — it bypassed prune-stopped, leaving the announcement alone in state as if the process had been killed. OSError now joins the caught class in the drop check. (2) The newest-200 eviction of retention events could erase an announcement whose plan never reached a terminal record, and a comment claimed a journal timer task that did not exist. Every event of one plan now carries the same plan id and the store root, eviction keeps every unresolved announcement regardless of age, and every retention event is emitted through the chronicle.retention logger at WARNING (the daemon's journal carries it). Proven: tests/chronicle/test_retention_events_io_errors_and_eviction.py — 7 tests red on the previous release, green after; tests/chronicle 225 passed. Not proven: a process killed mid-plan on a real install. # r18: the directory-class target's size cap is enforced, and two review findings from the previous series are closed: (1) an oversized first capture and an oversized mirror are refused, unpinned user-data history is pruned oldest-first to make room, a capture that a pin blocks is refused without touching history, a lowered cap is enforced by retention, physical allocation counts each hardlinked inode once and a scan error stops the cap decision instead of reading as free space, and every removal goes through the announced all-before-any pruning path of release 17; (2) a user-data file's hash no longer keeps an otherwise unreferenced content-store object alive (user-data bytes live in the version tree, not the store); (3) a persistently failing mirror no longer accumulates one local manifest per attempt: the failed attempt's local manifest and its now-unreferenced objects are removed and verified gone, partially copied target objects are removed, prior history is untouched, and the retry captures current bytes. Reported, not fixed here: target-mirrored configuration and restore-point history has no cap-reclamation path (a design decision); a hard process kill between a candidate's commit and the cap decision has no startup reconciliation.  # r17: retention removes versions all-before-any, fail-loud, and announced: a non-mutating validator performs every check the user-data tree removal performs; a prune plan is checked whole before the first removal and is refused whole, with nothing removed, when any version fails a check; an error while removing a tree stops retention instead of being suppressed, the tree's absence is verified afterwards, and a version's manifest is unlinked only after its tree is gone, so a failed removal leaves a still-listed version that the next retention pass plans again rather than an orphaned tree behind a deleted manifest; every prune plan is recorded in engine state before it runs (announced) and after it (completed, stopped naming what was removed and what remains, or refused), and the status command, the window's protection status and the manual show that record.  # r16: containment guard, second review finding: the store's own userdata directory is refused when it is a symlink (a symlinked directory there made both sides of the resolved-parent check point outside the store while the lexical path still reached the deletion), and a pruned version tree is now removed relative to a descriptor opened on the userdata directory without following a final symlink, after the opened object is verified as the checked one by device and inode — so no component between the store and the version can be swapped for a symlink between the check and the removal.  # r15: correctness series for the backup engine, twelve defects found by review and eleven fixed here, each with a regression test that fails on the previous tree and passes on this one: captures record directory symlinks; reclamation stops before deleting anything when any manifest is unreadable or structurally wrong, and the strict inventory now also refuses a manifest whose version id is not in the canonical shape or does not name its own file; a same-size edit inside one timestamp second is stored as new bytes (nanosecond mtime); the manifest hashes the stored copy, not the live source; scrub reports every integrity failure instead of clean; an existing store object is verified before deduplication accepts it; a failed configuration capture is retried instead of suppressed, with the error written to the journal; integrity failures exit non-zero from the command line and the daemon; the configuration fingerprint covers every watched path's metadata; capture work runs off the desktop application's main loop; separate engine instances serialize state updates with a process lock and atomic no-replace manifest publication. Containment guard: a stored user-data version id is validated before it is joined to the store as a path, the user-data tree path must resolve to a direct child of the userdata directory, a symlinked version directory is never removed, and retention validates the tree path before unlinking the manifest — a version id such as a dot pair can no longer direct pruning at the store root. Not in this release: the directory-target cap (defect 11) lands on top of the guard in a later release.  # r14: co-bump only: no change to this package's own content. The shared source-tarball generator scripts/build-intergenos-source-tarballs.sh is listed in this package's source_tree, and it changed so that the Welcomer's tarball now carries its polkit action file org.intergenos.welcome.policy; the input-based content fingerprint therefore moved for every package that declares the generator. This package's staged bytes are unchanged.  # r13: post_install starts a unit only when that unit's own enablement says it should be running. The hook fires on installs and upgrades alike with nothing telling it which, and the previous unconditional start would bring a deliberately stopped engine back up on every upgrade — the same override the r12 enable deletion removed, one moment later. Fresh images are unaffected: preset-all enables the units before first boot and systemd starts them at boot.  r12: post_install no longer enables the engine and its three timers. This package ships its own 90-chronicle.preset enabling chronicled.service, chronicle-userdata.timer, chronicle-offpeak.timer and chronicle-scrub.timer, and the real preset engine resolves all four to enabled, so the enable was redundant on a fresh install while re-applying itself on every upgrade over a user's choice. Unlike the other three recipes in this change set the hook is KEPT, because it still does real work: the chronicle group, the icon cache, the desktop database, and a `systemctl start`. The start is a different operation from enablement — enablement decides the next boot, and without a start a freshly-installed or live-upgraded system has no running engine until then. # r11: comment-only: one polkit-design comment in chronicle/api.py dropped an internal vocabulary reference in the pre-release register pass. No code change.  # r10: the backup engine's own system-call filter was killing its group handoff. The unit now declares the group directly and the code changes ownership only when it is not already correct, so the handoff no longer needs a call the filter denies. The filter itself is unchanged.  # r9: co-bump only: no change to this package's own content. The shared source-tarball generator scripts/build-intergenos-source-tarballs.sh is listed in this package's source_tree, and it changed so that the Welcomer's tarball now carries the shared name-lookup-failure module intergen/net_diagnostics.py; the input-based content fingerprint therefore moved for every package that declares the generator. This package's staged bytes are unchanged. r8: post_install creates the group itself rather than leaving it to the boot-time systemd-sysusers.service: on a live upgrade the engine restarts in that same post_install, and a restart with no group correctly leaves the socket owner-only, which would stop the backup application working for the console user with no visible cause until the machine was rebooted. A failure to create it is reported rather than swallowed. Note for existing installations: the group is created, but accounts that already exist are NOT added to it — an administrator adds them with usermod -aG chronicle <user>, and the application's window now names that remedy instead of claiming the service is stopped. the backup engine's socket is no longer open to every process on the machine. It was created mode 0666, so any local process could connect to the privileged backup engine, and — because the administrative polkit action allows user interaction — could make an administrator password dialog appear in the logged-in session as often as it liked. Polkit cannot close that: it is only consulted once a caller has already connected. The socket is now root:chronicle mode 0660 in a 0750 directory, so the kernel refuses the connect for anyone outside the group before a byte is read, and the two authorization tiers sit on top of it unchanged. The mode is a creation-time property, not a chmod after the fact: serve() binds under a umask that denies every bit outside the owner, widens exactly once when the group is known, and reads the result back off the inode before serving — a socket whose permissions do not verify is narrowed to owner-only. A missing group leaves it owner-only and says so in the journal rather than falling back to something wider. The group itself ships as /usr/lib/sysusers.d/chronicle.conf and is created by systemd-sysusers at squashfs time and at install time; the installer and the live-image script place their console user in it. Three client-side consequences came with it, all of them the difference between an honest answer and a misleading one: Client.available() treats a permission denial as present rather than absent, because os.path.exists answers False for a socket the account may not stat and every caller read that False as "the engine is not running"; the CLI reports the refusal instead of quietly starting a second engine in-process against a root-owned store; and the window gained a sixth protection state, NO_ACCESS, so a user who is not in the group is not told to start a service that is already running. Also from the release-7 review: a verb that is a JSON object or array is unhashable, so the membership test raised TypeError and the client got a dropped connection where a refusal line belonged; both the authorization path and dispatch now refuse anything that is not a string. The chronicled(8) SECURITY section, which still described the single pre-release-7 polkit action, was rewritten to match what the code does. r7: the backup engine stops demanding an administrator password to answer harmless questions, and a client can no longer crash it. chronicle/api.py gated EVERY verb behind the single org.intergenos.Chronicle.manage action, so reading a status line raised a password dialog, then raised another on the following read because each client process authorizes from nothing. A second action, org.intergenos.Chronicle.read, now serves status, queue-status, list and target-scan, granted outright by the policy to a local active session. The split is by disclosure, not by whether a verb writes: config.user_data_paths defaults to ["/home"], so one shared store holds every user's home directory, and manifest, diff, verify and restore-plan stay administrative because their answers carry paths out of it. The daemon strips a queued intent's `scope` field from read-tier answers — the one read-tier field that can carry paths — while the count and summary survive. Authorization moved from per-connection to per-request because the required tier depends on the verb, and a refused read is never escalated to the administrative action. Separately, the response write is now guarded and the accept loop guards each connection: an unguarded conn.sendall meant a client that went away mid-response raised out of serve() and took the daemon down, seen in the field on 2026-08-03. The policy file's claim that the credential is cached for the session was REMOVED rather than relied upon — it was never measured, and the observed behaviour was a dialog per client process. r6: co-bump only: no change to this package's own content. The shared source-tarball generator scripts/build-intergenos-source-tarballs.sh is listed in this package's source_tree, and it changed so that the welcome greeter's wiki icon is staged into its tarball; the input-based content fingerprint therefore moved for every package that declares the generator. This package's staged bytes are unchanged. r5: target-scan honesty pair, measured on the ge9b-12 installed system (encrypted-root laptop): (1) chronicled.service ran under PrivateDevices=yes, whose private /dev hides the device-mapper + partition nodes — lsblk could not resolve the LUKS holder chain or find the root mount, and the scan labelled EVERY volume (including the partition holding the encrypted root) "Full protection — survives disk failure"; the unit now runs PrivateDevices=no with DevicePolicy=closed + DeviceAllow=block-* r (read-only device-cgroup access, everything else in the hardening baseline stands). (2) enumerate.py fails CLOSED on unresolved topology: a new "undetermined" protection label whenever the system disk or a candidate's parent disk cannot be established — such candidates are refused outright (no adoption, no remediation matrix) instead of defaulting to the strongest claim; and the system-volume refusal now actually covers /boot + /boot/efi on the system disk (the computed check existed but was dropped before classification — the ESP was being offered a partition-surgery flow). Regression tests replay both the real topology and the blinded-sandbox lsblk shape. r4: ship 90-chronicle.preset (enable chronicled.service + the three timers) — the post_install enable is stripped by the installer's post-hook `systemctl --root preset-all` pass under the image-wide default-disable preset, measured on the ge9b-12 installed system (enablement links removed, engine dead on first boot); the package now whitelists its own units exactly as gdm does, so preset-all wires rather than un-wires them. r3: window identity (brand cluster in the header) + five-state protection model with persistent service-down banner, polkit-prompted Start, and the never-a-bare-heading invariant on all three pages; engine client maps socket-level failures to the service-down state instead of crashing on a stale socket; post_install now starts the engine and timers it enables (fresh installs no longer run without capture until the next boot)
content_hash: e3e4c2a6541b73d2
description: >-
  Chronicle — the InterGenOS backup utility. A browse-by-time history of three
  layers on a stack with no copy-on-write filesystem: config state and package
  restore points in an always-on content-addressed store on the system disk,
  and hourly user-data history to an external POSIX target by hardlink rotation.
  Ships the chronicled engine + sentinel, the chronicle CLI, an
  org.intergenos.Chronicle GTK4/libadwaita GUI, the pkm pre-transaction restore
  point handler, and the systemd schedule (hourly capture, off-peak drain,
  weekly scrub) with a separate higher-capability restore leg.
license: GPL-3.0-or-later
homepage: https://github.com/InterGenJLU/intergenos
tier: desktop
build_style: custom
install_func: do_install
source:
- url: file:///intergenos-backup-${version}.tar.xz
  generated: true
source_tree:
  - assets/intergenos-backup
  - scripts/build-intergenos-source-tarballs.sh
dependencies:
  build: []
  host: []
  runtime:
  - python
  - gtk4
  - libadwaita1
  - pkm
  - rsync
  - cryptsetup
  - polkit
verify_paths:
  - /usr/bin/chronicle
  - /usr/bin/chronicle-gui
  - /usr/bin/chronicled
  - /usr/libexec/chronicle/chronicle/engine.py
  - /usr/libexec/chronicle/chronicled
  - /usr/lib/systemd/system/chronicled.service
  - /usr/lib/systemd/system/chronicle-restore@.service
  - /usr/lib/sysusers.d/chronicle.conf
  - /usr/lib/pkm/pre-transaction.d/chronicle-restore-point
  - /etc/chronicle/chronicle.conf
  - /usr/share/applications/org.intergenos.Chronicle.desktop
  - /usr/share/polkit-1/actions/org.intergenos.Chronicle.policy
  - /usr/share/icons/hicolor/scalable/apps/org.intergenos.Chronicle.svg
  - /usr/share/man/man1/chronicle.1
  - /usr/share/man/man5/chronicle.conf.5
  - /usr/share/man/man8/chronicled.8
