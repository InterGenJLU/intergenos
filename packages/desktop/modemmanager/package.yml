name: modemmanager
version: "1.24.2"
release: 3  # r3: preset-enable only the D-Bus activation alias; clear the boot target dependency so the daemon starts on request. r2: require the daemon unit and D-Bus activation file in the shipped payload for desktop mobile broadband.
content_hash: d3ebfa8fc7bbb1c9
description: Mobile broadband modem management daemon
license: GPL-2.0-or-later
homepage: ''
tier: desktop
build_style: custom
install_func: do_install
source:
- url: https://gitlab.freedesktop.org/mobile-broadband/ModemManager/-/archive/${version}/ModemManager-${version}.tar.gz
  sha256: fbc75adcc0d7b0565f256e7ff4e8872b0a37c4413ff576665f7470932d9c1b68
dependencies:
  build:
  - libgudev
  - libmbim
  - libqmi
  - polkit
  - vala
  - glib2
  - dbus
  host: []
  runtime:
  - libgudev
  - libmbim
  - libqmi
  - polkit
  - glib2
  - dbus
verify_paths:
  - /usr/bin/mmcli
  - /usr/lib/libmm-glib.so
  - /usr/lib/systemd/system/ModemManager.service
  - /usr/lib/systemd/system/ModemManager.service.d/10-dbus-activation.conf
  - /usr/share/dbus-1/system-services/org.freedesktop.ModemManager1.service
