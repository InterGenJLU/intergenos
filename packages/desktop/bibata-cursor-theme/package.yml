description: Bibata material-design cursor theme bundle (Modern-Classic + Modern-Amber + Modern-Ice; upstream v2.0.7)
license: GPL-3.0-or-later
homepage: https://github.com/ful1e5/Bibata_Cursor
tier: desktop
build_style: custom
install_func: do_install
source:
- url: file:///bibata-cursor-theme-${version}.tar.xz
  generated: true
# Canonical inputs of the generated tarball (item-8 fingerprint design):
# the content fingerprint hashes these + build.sh instead of the tarball's
# bytes, so a regeneration-context difference can never phantom-bump. The
# three shipped variants are listed EXACTLY (Bibata-Modern-Original-Classic
# is deliberately not shipped — see the generator + build.sh).
source_tree:
  - assets/theming/cursor-themes/Bibata-Modern-Classic.tar.xz
  - assets/theming/cursor-themes/Bibata-Modern-Amber.tar.xz
  - assets/theming/cursor-themes/Bibata-Modern-Ice.tar.xz
  - scripts/build-intergenos-source-tarballs.sh
dependencies:
  build: []
  host: []
  runtime: []

verify_paths:
