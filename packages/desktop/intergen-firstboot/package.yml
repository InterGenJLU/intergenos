name: intergen-firstboot
version: "1.0"
release: 5  # r5: description wording only: the animation is no longer described as tuned by a project role. Nothing about the extension changed; hand bump because a package.yml-only edit is outside the automatic bumper's content fingerprint and the description publishes as pkgdesc.  # r4: comment-only: one attribution comment in extension.js reworded to neutral engineering language in the pre-release register pass. No code change.  # r3: neutral-language sweep of comments and printed text: decisions are recorded as "decided <date>" instead of being credited to a person or project role, development-host shorthand is replaced by a plain description, and the citations of a repository that is not published are replaced by what they were pointing at. Comments and strings only — no rule, path, flag, threshold or code path changed. The public-content scanner now carries detectors for all three classes (scripts/check-public-content.py), so the classes cannot return silently; tests/preflight/test_public_language_detectors.py proves each detector in both directions.
content_hash: e4bc28a72b489edb
description: InterGenOS first-login branded ECG-pulse animation (GNOME Shell extension) -- renders the 22.4s pulse + text sequence above gnome-shell's session-startup UI on the first login per user; subsequent logins no-op via filesystem marker gate
license: GPL-3.0-or-later
homepage: https://github.com/InterGenJLU/intergenos
# First-party authored GNOME shell extension following the assets/intergen-*
# canonical convention (mirrors intergen-pkm-notifier / intergen-welcome /
# intergen-shell-theme / intergen-mark / theming). source: [] + direct
# cp -a from /mnt/intergenos/assets/ avoids the tarball-assembly step.
tier: desktop
build_style: custom
install_func: do_install
source: []
# Assets live under assets/intergen-firstboot{,-py}/; fold into the fingerprint.
source_tree:
  - assets/intergen-firstboot
  - assets/intergen-firstboot-py
dependencies:
  build: []
  host: []
  runtime:
  # gnome-shell-extensions provides the runtime + extension-loader.
  - gnome-shell-extensions
verify_paths:
  - /usr/share/gnome-shell/extensions/intergen-firstboot@intergenos.org/extension.js
  - /usr/share/gnome-shell/extensions/intergen-firstboot@intergenos.org/metadata.json
