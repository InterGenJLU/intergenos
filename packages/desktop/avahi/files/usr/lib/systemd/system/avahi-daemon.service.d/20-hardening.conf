# Based on the avahi 0.8 service policy shipped by openSUSE:
# https://api.opensuse.org/public/source/openSUSE:Factory/avahi/harden_avahi-daemon.service.patch?rev=3236be17352237871738200265b74d9d
# Retain host networking and writable runtime state. Do not isolate the hostname:
# the responder must continue observing changes to the host's advertised name.
[Service]
ProtectSystem=full
ProtectHome=true
PrivateDevices=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
RestrictRealtime=true
