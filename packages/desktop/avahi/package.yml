name: avahi
version: "0.8"
release: 5  # r5: links the avahi-daemon profile (usr.sbin.avahi-daemon, enforce) into /etc/apparmor.d, because this package installs /usr/sbin/avahi-daemon. The profile text is upstream's, staged by apparmor in /usr/share/apparmor/extra-profiles, which nothing loads; apparmor r4 stopped loading top-level profiles for programs it does not install, because the apparmor unit loads every file in /etc/apparmor.d at every boot and on an ordinary install 39 of the 55 it shipped named a program that machine did not have. apparmor is now a runtime dependency so the link cannot dangle. The profile is unchanged and keeps upstream's mode. # r4: install daemon restrictions while retaining network discovery and runtime state.  # r3: post_install removed. It contained one call, systemctl enable avahi-daemon.service, which the install-time systemctl preset-all reverted. The responder's default now comes only from the preset files: off, because enabling it is the welcome application's network-discovery switch, which turns the daemon on together with the firewall rule that lets it answer. No installed bytes beyond the retired hook change.  # r2: post_install no longer masks the service enable, so a missing avahi-daemon.service fails the package instead of being absorbed.
content_hash: ea23caf7f9956aa6
description: Service Discovery for Linux using mDNS/DNS-SD
license: LGPL-2.1-or-later
homepage: https://avahi.org/
tier: desktop
build_style: autotools
install_func: do_install
source:
- url: https://github.com/lathiat/avahi/releases/download/v${version}/avahi-${version}.tar.gz
  sha256: 060309d7a333d38d951bc27598c677af1796934dbd98e1024e7ad8de798fedda
patches:
- file: avahi-0.8-ipv6_race_condition_fix-1.patch
  sha256: 218c909581d0ca2c86c8145bb0797050d987a6b0ae3417949dbe2a6d55c49360
dependencies:
  build:
  - dbus
  - glib2
  - libdaemon
  - libevent
  host: []
  runtime:
  - apparmor
  - dbus
  - glib2
  - libdaemon
  - libevent
verify_paths:
  - /usr/lib/systemd/system/avahi-daemon.service.d/20-hardening.conf
  - /usr/sbin/avahi-autoipd
  - /usr/bin/avahi-browse
  - /usr/lib/libavahi-client.so
