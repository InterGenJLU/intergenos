# The daemon's state and log directories. They are created here rather than by
# the daemon because its unit runs under ProtectSystem=strict with these two
# paths as its only writable ones, and systemd refuses to start a unit whose
# ReadWritePaths entry does not exist. Root-owned and not world-readable: the
# state directory holds per-device records and the log holds what the printer
# and the machine said to each other.
d /var/ipp-usb     0750 root root -
d /var/ipp-usb/dev 0750 root root -
d /var/log/ipp-usb 0750 root root -
