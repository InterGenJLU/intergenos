# Hardening for ipp-usb.service, in the shape the tree's other daemons use.
#
# What the daemon must keep: raw access to the USB printer (so no
# PrivateDevices), an HTTP listener on the loopback address (so AF_INET and
# AF_INET6 stay), its own state and log directories under /var, and the
# ability to ask about users and groups for the per-operation authentication
# its configuration expresses.
#
# Everything named here was chosen against what the pinned source actually
# touches (paths.go: /etc/ipp-usb, /var/ipp-usb, /var/log/ipp-usb,
# /usr/share/ipp-usb/quirks), not against a general template.
[Service]
NoNewPrivileges=yes
PrivateTmp=yes
ProtectHome=yes
ProtectSystem=strict
ReadWritePaths=/var/ipp-usb /var/log/ipp-usb
ProtectControlGroups=yes
ProtectKernelLogs=yes
ProtectKernelModules=yes
ProtectKernelTunables=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
SystemCallArchitectures=native

# MemoryDenyWriteExecute is deliberately NOT set. The daemon is a Go program
# linked against libusb through cgo, and whether that combination ever asks for
# a writable-then-executable mapping cannot be answered on a machine with no
# IPP-over-USB printer to start it against. Setting it unverified would risk a
# daemon that dies the moment a printer is plugged in, which is the failure the
# hardening is supposed to prevent. It is named here so the omission reads as a
# decision rather than an oversight, and it is the first thing to try once a
# printer is available (the R001.3 real-hardware evaluation).

# The two directories ReadWritePaths names are created by
# /usr/lib/tmpfiles.d/ipp-usb.conf. Under ProtectSystem=strict the daemon
# cannot create them itself, and a ReadWritePaths entry that does not exist
# makes the unit fail to start — so the tmpfiles fragment is part of this
# hardening, not a convenience.
