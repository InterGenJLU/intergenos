name: nv-codec-headers
# 13.0.19.0 is deliberately NOT the newest upstream tag (13.1.15.0 exists).
# The 13.1 headers split NV_ENC_CLOCK_TIMESTAMP_SET's `countingType` bitfield
# into countingTypeLSB/countingTypeMSB, and ffmpeg 8.0.1's released
# libavcodec/nvenc.c (line 2520) still assigns `.countingType` — the pairing
# fails to compile (verified live 2026-08-05 on the first ffmpeg r3 build).
# ffmpeg 8.0.1 requires ffnvcodec >= 12.1.14.0 and gains nothing from the
# 13.1 headers its code predates; 13.0.19.0 carries the unsplit member
# (verified in its nvEncodeAPI.h) and is the pairing current binary distros
# ship beside ffmpeg stable. Re-evaluate at the next ffmpeg version bump.
version: "13.0.19.0"
release: 1
description: FFmpeg version of the NVIDIA codec API headers (ffnvcodec) — build-time only
license: MIT
homepage: https://github.com/FFmpeg/nv-codec-headers
tier: desktop
# Mirror-only. This package installs headers and a pkg-config file and nothing
# else — it has no runtime consumer on an installed system, so it is not worth
# ISO space. It is a BUILD dependency of ffmpeg and nothing more; a user who
# wants to rebuild ffmpeg themselves pulls it from the mirror.
#
# TIER NOTE: the natural reading is `tier: compute` — this is NVIDIA-specific
# and belongs conceptually with the opt-in GPU stack. It cannot go there.
# Tier build order is ... desktop -> extra -> compute -> ai, so a compute-tier
# package builds AFTER desktop, and ffmpeg (tier: desktop) needs these headers
# at configure time. Placing it in desktop is what makes the build order
# correct; `iso_include: false` is what keeps the mirror-only intent. The two
# concerns are separate fields and are set separately here on purpose.
iso_include: false
build_style: custom
install_func: do_install
# No sdist or release tarball is published; upstream distributes via git tags.
# The tag is `n<version>`, hence the `n${version}` in the URL. Downloaded and
# summed 2026-08-05.
source:
- url: https://github.com/FFmpeg/nv-codec-headers/archive/refs/tags/n${version}.tar.gz
  filename: nv-codec-headers-13.0.19.0.tar.gz
  sha256: 86d15d1a7c0ac73a0eafdfc57bebfeba7da8264595bf531cf4d8db1c22940116
dependencies:
  build: []
  host: []
  runtime: []
verify_paths:
  - /usr/include/ffnvcodec/nvEncodeAPI.h
  - /usr/include/ffnvcodec/dynlink_cuda.h
  - /usr/lib/pkgconfig/ffnvcodec.pc
