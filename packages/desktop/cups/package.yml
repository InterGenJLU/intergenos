name: cups
version: "2.4.16"
release: 3  # r3: the test suite's policy is declared instead of every failure being masked. Per-finding retrofit, not a sweep.  # hook-contract wave: client.conf + pam.d/cups moved post_install -> do_install (owned payload)
content_hash: 548f7e1221b23ea3
description: Common UNIX Printing System
license: Apache-2.0
homepage: https://openprinting.github.io/cups/
tier: desktop
build_style: custom
install_func: do_install
source:
- url: https://github.com/OpenPrinting/cups/releases/download/v${version}/cups-${version}-source.tar.gz
  sha256: 0339587204b4f9428dd0592eb301dec0bf9ea6ea8dce5d9690d56be585aba92d
dependencies:
  build:
  - dbus
  - gnutls
  - libusb
  - linux-pam
  - avahi
  - xdg-utils
  host: []
  runtime:
  - dbus
  - gnutls
  - libusb
  - linux-pam
  - avahi
tests:
  enabled: true
  failure_policy: known_failures
  reason: "the suite needs an active graphical session with a bus address, and no other cupsd running; the build chroot has neither a session bus nor a display, and upstream documents at least four tests failing with 'address in use' when a cupsd is present. Those failures are environmental. The suite runs and its output is kept, so a NEW failure class is visible in the log."

verify_paths:
  - /etc/cups/client.conf
  - /etc/pam.d/cups
  - /usr/sbin/cupsd
  - /usr/sbin/cupsaccept
  - /usr/bin/cancel
  - /usr/lib/libcupsimage.so
  - /etc/cups/cupsd.conf
  - /etc/cups/cups-files.conf
  - /etc/cups/snmp.conf
