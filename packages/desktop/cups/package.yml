name: cups
version: "2.4.16"
release: 6  # r6: the tests: block records what make check actually does — the programming-interface tests run, and the scheduler test plan refuses to run as root, which is what makes the target exit non-zero. The wording it replaces named a session bus, a display and address-in-use conflicts, none of which appear in the build log. Recipe text only; no change to what the package installs.  # r5: post_install removed. It contained one call, systemctl enable cups.service, which the install-time systemctl preset-all reverted on every install, so the recipe stated a default the shipped system did not have. The scheduler's default now comes only from the preset files, where it is written down: off, because printing is one of the opt-in switches the welcome application offers, and cups.service is socket-activated by cups.socket once the user turns it on. No installed bytes beyond the retired hook change.  # r4: post_install no longer masks the scheduler enable, so a missing cups.service fails the package instead of being absorbed.  # r3: the test suite's policy is declared instead of every failure being masked. Per-finding retrofit, not a sweep.  # hook-contract wave: client.conf + pam.d/cups moved post_install -> do_install (owned payload)
content_hash: 12bbd09b3d7ae894
description: Common UNIX Printing System
license: Apache-2.0
homepage: https://openprinting.github.io/cups/
tier: desktop
build_style: custom
install_func: do_install
source:
- url: https://github.com/OpenPrinting/cups/releases/download/v${version}/cups-${version}-source.tar.gz
  sha256: 0339587204b4f9428dd0592eb301dec0bf9ea6ea8dce5d9690d56be585aba92d
dependencies:
  build:
  - dbus
  - gnutls
  - libusb
  - linux-pam
  - avahi
  - xdg-utils
  host: []
  runtime:
  - dbus
  - gnutls
  - libusb
  - linux-pam
  - avahi
tests:
  enabled: true
  failure_policy: known_failures
  reason: "make check has two halves and only one of them can run here. The unit tests do run: `make -k check` builds and executes the array, internationalization, PWG, option, file, language, IPP, raster, HTTP and PPD API tests plus the CGI, help-index, PPD-compiler, PPD-importer and MIME tests, and their output is in the package log. One of them, the CGI API init test, reports FAIL because it runs without a CGI request environment. The second half is the scheduler test plan, which cannot run: the top-level check target ends by calling test/run-stp-tests.sh (Makefile:246-248 in the pinned cups 2.4.16 tarball), and that script refuses to run as root at its lines 19-22 with 'Please run this as a normal user. Not supported when run as root.' and exits 1. The chroot builds as root, so make check always ends non-zero on that step and the whole target is waived. Running that half would mean dropping to an unprivileged account that also owns the build tree the script writes into, which the build does not currently arrange. The earlier wording here attributed the non-zero exit to a session bus, a display and 'address in use' conflicts; the measured cause is the root refusal above, so that explanation is replaced by what the log actually shows. Named consequence of this policy: because the waiver covers the whole target, a NEW unit-test failure would also be absorbed rather than halting."

verify_paths:
  - /etc/cups/client.conf
  - /etc/pam.d/cups
  - /usr/sbin/cupsd
  - /usr/sbin/cupsaccept
  - /usr/bin/cancel
  - /usr/lib/libcupsimage.so
  - /etc/cups/cupsd.conf
  - /etc/cups/cups-files.conf
  - /etc/cups/snmp.conf
