# Process restrictions from openSUSE's CUPS service policy:
# https://api.opensuse.org/public/source/openSUSE:Factory/cups/harden_cups.service.patch?rev=2574a21ffc4bf08794e78c01e3c631dc
# Private temporary files follow the NixOS CUPS service configuration:
# https://github.com/NixOS/nixpkgs/blob/b67c7a60c3732edd4b947a7df8af06215851a614/nixos/modules/services/printing/cupsd.nix
# Keep printer devices, driver ABIs and kernel interfaces available to filters.
# Do not make /etc read-only: the default Printcap is /etc/printcap and is
# replaced atomically, outside /etc/cups. Printer configuration must stay writable.
# https://github.com/OpenPrinting/cups/blob/v2.4.16/config-scripts/cups-defaults.m4
[Service]
PrivateTmp=true
ProtectKernelLogs=true
ProtectControlGroups=true
RestrictRealtime=true
