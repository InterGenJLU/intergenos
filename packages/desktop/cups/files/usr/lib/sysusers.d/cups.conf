# InterGenOS — CUPS print service users + groups
# Replaces wrong-layer useradd/groupadd from build.sh configure().
# UID/GID pinned per LFS+BLFS convention so files chowned at build
# time align with the user systemd-sysusers creates on the target.
#
# Group lp (gid 7) is declared by systemd's upstream basic.conf;
# duplicating it here triggered a "Conflict with earlier configuration"
# warning during install (2026-05-27 install #28 trace, anomaly B).
# Keeping only the lp user (uid 9) and lpadmin group (gid 19) — both
# are CUPS-specific and not in systemd's basic.conf.
#
# Type Name      ID  GECOS                     Home              Shell
u  lp        9   "Print Service User"      /var/spool/cups   /bin/false
g  lpadmin   19  -
