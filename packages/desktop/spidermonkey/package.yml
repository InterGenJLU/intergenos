name: spidermonkey
version: "140.8.0"
release: 3  # r3: the jstests policy is declared instead of every failure being masked. Per-finding retrofit, not a sweep.  # hook-contract wave: XP_UNIX define staged into the shipped js-config.h (closes the Step-2.7 divergence)
description: Mozilla SpiderMonkey JavaScript engine
license: MPL-2.0
homepage: https://spidermonkey.dev/
tier: desktop
build_style: custom
install_func: do_install
source:
- url: https://archive.mozilla.org/pub/firefox/releases/${version}esr/source/firefox-${version}esr.source.tar.xz
  sha256: 57a7f339ef68273f6597d8074a841fa053f63a21d1f609ab0074a26c063282e6
patches:
  - file: spidermonkey-140.8.0-python_3.14_fixes-1.patch
    sha256: 24183878004982be0d7d87af2daa49a36d327a279b0abcf222c0c99e805e2ed7
dependencies:
  build:
  - cbindgen
  - llvm
  - rust
  - icu
  - readline
  - zlib
  - pixman
  host: []
  runtime:
  - icu
  - readline
  - zlib
tests:
  enabled: true
  failure_policy: known_failures
  reason: "this recipe configures --with-system-icu, and upstream documents that building against the system ICU leaves a small set of the 50,000-plus jstests failing on locale-dependent expectations — 24 of them at the version the reference book covers. The failures are a property of the ICU choice, which is deliberate here, not of the build. The suite runs with --wpt=disabled and a 300s per-test timeout and its full output is kept in the package log."

verify_paths:
  - /usr/bin/js140
  - /usr/bin/js140-config
  - /usr/lib/libmozjs-140.so
