name: sed-tmp
version: "4.10"
release: 2  # r2: update GNU sed to 4.10 with matching source and documentation paths.
description: "GNU sed stream editor (temporary tools)"
license: GPL-3.0-or-later
homepage: https://www.gnu.org/software/sed/

source:
  - url: https://ftpmirror.gnu.org/sed/sed-${version}.tar.xz
    sha256: b8e72182b2ec96a3574e2998c47b7aaa64cc20ce000d8e9ac313cc07cecf28c7

dependencies:
  build: []
  host:
    - ncurses-tmp
  runtime: []

tier: toolchain
target_triple: x86_64-igos-linux-gnu
build_style: autotools
configure_flags:
  - --prefix=/usr
  - --host=$IGOS_TARGET
  - --build=$(./build-aux/config.guess)
