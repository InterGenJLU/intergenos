name: httpcore
# Upstream latest stable; httpx requires httpcore==1.* (satisfied).
version: "1.0.9"
release: 1
description: Minimal low-level HTTP client
license: BSD-3-Clause
homepage: https://github.com/encode/httpcore
tier: ai
iso_include: false
build_style: custom
install_func: do_install
source:
- url: https://files.pythonhosted.org/packages/06/94/82699a10bca87a5556c9c59b5963f2d039dbd239f25bc2a63907a05a14cb/httpcore-1.0.9.tar.gz
  sha256: 6e34463af53fd2ab5d807f399a9b45ea31c3dfa2276f15a2c3f00afff6e176e8
dependencies:
  build:
  - hatchling
  - hatch-fancy-pypi-readme
  host: []
  runtime:
  - h11
  - python-certifi
  # certifi resolves via the tree's python-certifi.
verify_paths:
  - /usr/lib/python3.14/site-packages/httpcore/__init__.py
  - /usr/lib/python3.14/site-packages/httpcore/_api.py
