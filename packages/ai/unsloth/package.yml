name: unsloth
version: "2026.6.2"
release: 1
description: Fast fine-tuning and RL for open LLMs (LoRA/QLoRA on the local GPU stack)
license: Apache-2.0
homepage: https://github.com/unslothai/unsloth
tier: ai
iso_include: false  # the training-apparatus centerpiece — mirror-only (decided 2026-07-20)
build_style: custom
install_func: do_install
# Decided 2026-09-19: pinned to the newest release upstream publishes as a SOURCE
# tarball. Releases after 2026.6.2 (2026-06-10) ship a wheel only, so the source URL
# for 2026.7.4 answered 404 and the package could not be rebuilt from its declared
# source by anyone, including this project. The dependency band below was re-read
# from 2026.6.2's own pyproject.toml and is unchanged by the move.
source:
- url: https://files.pythonhosted.org/packages/source/u/unsloth/unsloth-${version}.tar.gz
  sha256: 4c64575cce1ff999e1a7a5c5d3508bc34b083f05c88bbdeaba298a1877e80bed
dependencies:
  build:
  - setuptools
  host: []
  runtime:
  # Requires-Dist walked 2026-07-21 (linux/x86_64/py3.14 markers applied).
  # THE GOVERNING PINS: torch<2.11,>=2.4 (→ pytorch 2.10.0, the band-setter) ·
  # bitsandbytes!=0.46/!=0.48,>=0.45.5 (0.49.2 ✓) · triton>=3.0 (3.6.0 ✓) ·
  # transformers >=4.51.3,<=5.5.0 w/ excludes · trl >=0.18.2,<=0.24 !=0.19 ·
  # datasets >=3.4.1,<4.4 !=4.0.*,!=4.1.0 · peft>=0.18 !=0.11 ·
  # sentencepiece>=0.2 (0.2.2 ✓) · huggingface-hub>=0.34 — python-deps-wave
  # pins band-verified at merge review.
  - unsloth-zoo
  - pytorch
  - torchvision
  - xformers
  - bitsandbytes
  - triton
  - transformers
  - trl
  - peft
  - accelerate
  - datasets
  - huggingface-hub
  - hf-transfer
  - diffusers
  - sentencepiece
  - tokenizers
  - numpy
  - protobuf
  - packaging
  - wheel
  - tqdm
  - psutil
  - tyro
  - typer
  - pydantic
  - pyyaml
  - nest-asyncio
verify_paths:
  - /usr/lib/python3.14/site-packages/unsloth/__init__.py
  - /usr/lib/python3.14/site-packages/unsloth/models
