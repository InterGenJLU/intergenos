name: intergen
version: "0.1.0"
release: 199  # r200: a fact the user asks InterGen to forget is actually forgotten. A forget arrived in the words the user typed and the store held what the extractor wrote, and those were never the same string: "my backup drive" became "your backup drive" on the way in and the same sentence also landed under the bare noun, while the forget path asked for rows containing the user's literal words. Nothing was deleted, the drive was still recalled afterwards, and the reply said there was no such memory — false twice over, and the same behaviour a live run recorded in July. The subject is now matched in the three forms the store side can have produced, bounded by what the store side widened first, so a subject naming nothing still matches nothing; a forget that removes something now says how much, and one that removes nothing still says so. A forget also writes a row into the turn record naming the subject and the number removed, because a deletion of a person's own data that the record does not mention is a hole in a writer whose mandate is that there are none. The delete stays LOGICAL — the row is hidden by its flag and keeps its bytes, and the record's row says physical=false — because whether a forgotten fact's bytes must leave the file is a separate storage-contract question scheduled for a later release.  # r199: the turn-record tests read a row by what it is, not by where it sits. The writer emits rows of its own around a turn — one when it opens the file, a marker when the file rolls, a synthesized ending when a turn stops without one — and each of those, when it landed, moved the position of every row a test had emitted. The last time it happened a corpus file reported twenty-nine failures where nineteen were real and the other ten were its own controls, which makes a broken measurement look like a worse defect. One helper now reads the record and selects from it by phase, event or turn, and eleven test files go through it; a selection that finds nothing says what the record does hold instead of raising an index error. Four cases were reading by position and are corrected; the rest were already filtering and are converted so the next edit cannot quietly drop the filter. A probe that makes the writer emit one extra row ships beside them, so the same question can be asked again the next time the writer learns to say something. Test files only: nothing shipped changes behaviour, and the release moves because test files are inside this package's content fingerprint.  # r198: the decision tracer redacts secret-shaped content from the same definition the turn record uses. The two writers were documented as being in lockstep on which values may never be written and were not: the turn record gained a predicate for secrets that arrive as content and the tracer kept only the older key-name check, so with content capture deliberately on the same value came out redacted from one and verbatim from the other. The shapes and the redaction that applies them are now public names in the module that owns them and the tracer imports them, so the lockstep is true by construction and a shape added in one place is caught in both. The tracer's posture is otherwise unchanged: content capture stays off unless it is explicitly enabled on a non-root process, a credential-shaped key name still replaces its whole value, and non-string values are untouched.  # r197: the turn record redacts a secret it finds inside CONTENT, not only one a caller labelled as a credential. Its redaction was a key-NAME predicate, so a secret arriving inside a prompt, a command line, a tool result or a file the person asked about was written to the record verbatim and kept for up to the full retention ceiling — measured on the shipped tree with an eight-case corpus, seven of which reached the file byte-identical. A second predicate now scans every string value for named secret formats — PEM private-key blocks, URLs carrying an inline password, crypt hashes, JSON web tokens, and vendor-prefixed API tokens — and replaces each match, and only that match, with a placeholder naming the shape, so the surrounding content survives and the reader can see what kind of thing was removed. No entropy heuristic: a threshold that fired on ordinary content would put unexplained holes in a full-fidelity record while still missing structured secrets. Both directions are proved against the corpus, including eight ordinary-content cases that must survive byte-identical. Redaction happens when the record is built and the oversized-row shortening happens when it is written, so a secret carried in a row too large to write is already a placeholder by the time any prefix of it is kept; that order is asserted, not assumed. One limit is stated and tested rather than assumed away: a secret with no distinguishing shape is still written.  # r196: offload to a discrete graphics card is decided by whether the resolved model FITS the detected video memory, independent of the hardware tier; the tier still chooses the model. Three outcomes in order: the whole model (with its vision projector) fits with headroom and every layer is offloaded; it does not fit and the largest number of layers that does fit is offloaded; only when not one layer fits, or something needed could not be read, is the answer zero — stated in words in the log and the record. Zero is never again reached by inference from a tier, which is what left a 4 GB card serving the tier-1 model on the processor. New intergen/gpu_offload.py holds the rule and the launch-time composer (card memory as detected, model and projector sizes from the signed manifest with the file on disk as fallback, layer count from the model file's own header via new intergen/gguf.py, bounded and returning None on any doubt — a None layer count forbids a partial answer). The engine's allocation beyond the weights was MEASURED on the shipped 9B at the shipped 16384 context (key/value cache 512 MiB, recurrent state 50 MiB, compute buffers 501 MiB = 1063 MiB, reserved as 1088) and the largest shipped value is reserved for every model, so the only error possible is declaring that something does not fit. The tier clause is gone from resolve_gpu_layers; the health surface no longer calls a failed offload complete and processor-only serving has its own field; the user's explicit pin still outranks everything. The installed-tier matrix gate that imported a class that does not exist (LlamaServerManager) now imports the shipped LlamaManager, so it measures the defect instead of the import.  # r195: one conversation per conversation. The router held a single conversation for every browser tab, the console and the desktop bus together — one history, one consent record, one ingress watermark, one set of pending offers, one turn index — so two tabs were one conversation as far as the model was concerned, a "yes" typed in one could accept an offer staged in another, and an approval granted "for this conversation" stayed in force for every conversation after it, including one started by a different person at the same machine. All of it moves onto a per-conversation object; every turn names the conversation it belongs to, and on the daemon, where one router serves the browser and the desktop bus, a turn that does not name one is refused with a logged reason rather than answered from someone else's history. The browser connection's transcript and the model's prompt are now one list, so the pane and the prompt cannot drift. Both dispatch paths read the ONE consent record: the second, per-connection record is gone rather than synchronised. "New session" and "switch session" end the conversation instead of only emptying the pane. Releases 192 to 194 belong to the turn-record lane composed ahead of this one; this is 195.  # r194: comment and docstring text only, no behaviour. Three passages still described the route deadline as living on another branch and as not exercised against its producer, which stopped being true when this branch was rebased onto the composed tree and the deadline began emitting its own terminal; they now describe what the code does. The warning glyphs those passages carried are replaced with words, because public source and tests stay plain text. The release moves because shipped files and test files are inside this package's content fingerprint, not because anything executes differently.  # r193: the thread-seam proof for the turn-terminal guarantee lands as its own test file, and test files are inside this package's content fingerprint, so the fingerprint recorded at r192 was taken before that file existed. WHY THIS BRANCH MOVES THE RELEASE TWICE, stated rather than left to be noticed: a bump is the mechanical consequence of content changing after a fingerprint is recorded, so a branch that changes shipped bytes, records, and then changes them again moves twice. Nothing about r192 was wrong; it predates the added proof. Both numbers are provisional in any event — other branches cut from this base also move intergen, so whoever integrates the set re-derives the numbering across it. The tool's re-baseline mode is deliberately not used: it exists for a change to the fingerprint DEFINITION and refuses a package whose content also changed under the old definition, which is this case exactly.  # r192: the always-on turn trace becomes usable as a record. Three defects, each measured on the shipped path before it was touched. A turn handed to a worker thread lost its identity: contextvars do not cross a thread, so every row the router, the tool executor, the frontier escalation and the three honesty regenerations wrote landed unattached and could not be joined to the turn that caused them — seven such handoffs, found by parsing the file rather than reading it, where a hand read found three. A turn could also begin and never say how it ended: only the three successful exits recorded a delivery, so a crash, a cancelled client, an early refusal or the routing deadline left a turn that started and stopped mid-record. Ending a turn is now guaranteed at the one place every interface passes through, exactly once, with a second attempt kept under its own name so a call site that ends a turn twice stays findable; the routing deadline says plainly that it timed out. The row sequence number, which exists to give a replay order for rows born in the same millisecond, restarted at zero on every start, so two runs numbered their rows identically and a reader ordering by it interleaved them into one wrong timeline; the counter now continues above what the file already holds, every row names the run that wrote it, and the resume is recorded rather than inferred. Retention was overstated by a whole file — five kept files were counted and the live one was not — and a single row larger than the rotation size defeated the ceiling entirely by rotating the file away and landing whole in the fresh one; the ceiling is now derived from the constants it describes and no row may exceed a fraction of the rotation size, with anything shortened saying how large it was and how much was kept. No interface changed; the release moves because shipped code and test files are inside this package's content fingerprint.  # r191: the first-run setup offer states each model tier's download size from the signed manifest (model bytes + multimodal projector bytes; model_choice.tier_download_sizes), fail-closed with no claim when no manifest is present; Tier 1 is 1.8 GB and Tier 2 6.1 GB, not the fixed '4-5 GB' the page carried. r190: test-only correction. Three cases in the write-file guard's test file asserted that a write under /usr/lib/ is CONFIRM-tier. The shipped code hard-blocks it and has since r179 added the system_binaries category to the signed never-list manifest, whose prefixes cover the executable and library trees. The code is the stricter side and is right; the expectations were written when /usr/lib/systemd/ was sensitive-but-not-never-listed and did not follow the manifest when it grew — the same drift that had already moved /etc/ssh/sshd_config out of the same list once before. The three expectations move to the BLOCKED contract; the CONFIRM coverage is preserved on /usr/share/ paths, which are in the guard's sensitive-prefix list and carry no never-list coverage, so they remain the honest CONFIRM case. Two cases are added: one stating the never-list prefixes as their own contract, and one proving a never-listed path is refused in root context as well. Both read the refusal TEXT rather than a false success flag, because the test runner is not root and a write to /usr/lib/ would fail on filesystem permissions regardless — verified by removing the policy and confirming the message changes. The case covering the unprivileged-write backstop moves to /usr/share/ and now asserts its path classifies CONFIRM first, because the hard block had begun firing ahead of the backstop it exists to test. No shipped code changed; the release moves because test files are inside this package's content fingerprint.  # r189: the privileged runner is started as a short-lived unit through the assistant's own systemd user manager instead of as a direct child of the daemon, and the request it carries no longer travels on a command line. The daemon's unit sets NoNewPrivileges=yes, which every child inherits and which cannot be cleared; under that flag the kernel ignores pkexec's setuid bit, so pkexec started unprivileged, saw its own effective uid was not root, and refused before PolicyKit was contacted — no install could perform any privileged action through the assistant. The user manager does not carry the flag, so a unit it starts reaches the runner. No hardening directive changed: the assistant's unit file is byte-identical, and the transient unit is deliberately plain because imposing the flag on it would reproduce the defect. The PolicyKit action is unchanged and still bound to the runner's exact path, so what a person authenticates against is the same narrow, purpose-built action. Second correction in the same change: the tool name, the arguments and the human-approval token were the runner's argv words 2, 3 and 4, and a command line is readable by any local account through /proc for the life of the process; they now travel in an owner-only file created 0600 with O_EXCL, removed as it is read and on every failure path, and no path is passed at all. The runner's argv narrows to one argument and that argument is an opaque identifier of thirty-two hex characters: the shim refuses any other shape before an interpreter sees it, and the root-side dispatcher takes --request-id and derives the directory itself from the uid PolicyKit reports, verifying that the directory is a real directory owned by that user at mode 0700, then that the file is a regular file, not a symlink, owned by the calling user, mode 0600, single-linked and within a 64 KiB bound before believing its contents, and removing the file it actually read rather than the name it was given. The unprivileged side never names a location the privileged side reads, so a traversal, an absolute path or a borrowed file is not something to defend against but something that cannot be expressed. The wait for the privileged unit is bounded at both ends and an outcome that is not known is reported in those words rather than as a failure, and the approval a person gives is spent when the action is taken rather than when it is asked for, so a refused dispatch no longer costs an authentication. Third: the package-management path no longer builds a second pkexec — by the time that command builder runs it is already root inside the privileged dispatcher, so the second crossing had no PolicyKit action of its own, carried no approval token, and ran from a scrubbed environment where it could not have raised a prompt anyone could answer. The failure diagnostic gains the two components the new path depends on, each measured before it is named. Nothing a person sees changes except that privileged actions now work.  # r188: the privileged-dispatch diagnostic now reports a measured cause instead of a fixed sentence — the runner path is checked on the filesystem before anything is said about it, pkexec's own stderr is carried to the user instead of being replaced, and the exit code is stated; a refusal the runner itself reported still leads. Companion documentation fix in the same release: the in-tree copy of the user unit is replaced with the unit the recipe actually installs (it described an unhardened Type=simple service that has not shipped). No interface, no data, no model artefact changed.  # r187: test-only change to the gate r186 introduced. The startup-embedding gate's budget case asserted that a budget constant exists and that construction finishes inside a bound, but the corpus it embedded cost about the same either way, so bounded and unbounded construction were indistinguishable to it and the timing half proved nothing. An added case sets about 2.2 s of embedding work against a 0.3 s budget and asserts three things together: construction finished well inside the unbounded time, the index did not complete, and at least one request was still made, since the budget must never suppress the first request or a small wiki would never embed at all. No shipped code changed; the release moves because test files are inside this package's content fingerprint and the fingerprint recorded at r186 was taken before this case existed.  # r186: a web turn is acknowledged before routing and the wiki index is embedded in bounded requests. Three defects measured against the released build. (1) Nothing was sent to the browser between 'message received' and 'routing finished'. The browser arms a 30 s whole-turn failsafe on send and disarms it only on the first server frame, so whenever routing outlived that failsafe the browser hid the thinking indicator, told the user there had been no response and force-closed the socket, while the server was still working and the answer had nowhere to go. Observed in a live session: two turns recorded a turn-start event and nothing further, the socket dropped about thirty seconds later, and each session file held exactly one message. A turn_ack frame now goes out before any routing work begins, and the server holds itself to a routing deadline (20 s) declared next to the client's 30 s failsafe and asserted to be strictly shorter than it; a turn that passes the deadline ends with a truthful message instead of silence. Time spent waiting on a person at a consent card is not charged against that deadline. The deadline bounds what the user experiences, not the worker thread, which runs on and has its result discarded. (2) The same file's failsafe would fire while a consent card was on screen on the fast path, force-closing the socket and losing the decision; the client now disarms it for the card's lifetime and refuses to fire while one is pending. (3) The installed wiki was embedded by submitting all 2,116 passages in one request to a single-slot embedding server under a 30 s client timeout, so it timed out on every boot and left an abandoned batch occupying the slot as the web server began accepting turns, with no rebuild path, leaving keyword-only matching for the life of the daemon. The corpus now goes in 32-passage requests inside a bounded startup budget, partial progress is kept, and resume_embedding() can finish a degraded index later. Retrieval semantics are unchanged: the embedding matrix is published only when every passage is embedded, so a query is never scored against a half-present corpus. No caller drives the resume path yet; its natural site is outside this change.  # r185: the owner-only permission pass now stops at the tree boundary and covers the answer cache. Five ways it reached past its own scope, each found by an independent review and each reproduced before it was changed: the mode was read with lstat and written with a path-based chmod, which follows a symbolic link, so the inode measured and the inode changed could differ and a symbolic link's own 0777 mode written to a 0644 target GRANTED owner-execute — the mode is now read from and written to one descriptor opened O_PATH | O_NOFOLLOW, which the kernel refuses to follow; a per-user tree the user had relocated with a symbolic link was walked THROUGH, re-permissioning a directory outside the home while reporting the root as skipped — a symbolic-link root is now refused before anything is listed; storage mounted inside a tree was re-permissioned on the underlying filesystem, so the walk now stops at a mount point, found by device number and, for a bind mount of a directory on the same filesystem which keeps the same device number, by the kernel's mount table; a directory the walk could not READ had its contents omitted silently while the report said clean, so an unreadable directory and an owned root that is not a directory are now named as failures; and the directory helper tightened whatever path it was given, including the root-owned system log directory a privileged daemon keeps, so it now leaves anything outside the owned trees to the platform default. The pass also runs ONCE per home rather than at every start, recorded by a marker in the state directory that names the paths it changed: re-tightening at every start silently reversed a sharing decision the user is entitled to make on their own machine, and files the product writes are created owner-only and need no pass. Owned intermediate directories are created one at a time at the final mode, closing the create-then-tighten window that mkdir(parents=True) left open for everything above the last component. Finally the answer cache is the fourth owned tree: ~/.cache/intergen/last-answer.json holds the delivered answer AND the raw model output behind it, the same class of material as a session transcript, and it was reached by none of the three mechanisms — the create path, the migration's root list and the permission gate's tree list now all resolve it from one place. The provider-configuration panel creates its directory through the same helper, because on a fresh account it can be the first creator of ~/.config/intergen and a bare mkdir landed it 0755 beside the dispatch signing key and the web-auth token.  # r184: per-user state is created owner-only. Conversation transcripts, the personal-fact database, the daemon log, the event log, the decision trace, the tool-dispatch ledger, the console history, the recorded hardware-tier pick, the licence-acceptance records, the MCP schema pins and audit log, the web-auth token and the dispatch signing key were all created 0644 inside 0755 directories under the ordinary umask 0022, which makes them readable by every other local account on the machine; memory.py's own docstring states that a shared store would leak one user's stored facts to every other user, and a 0644 file in a 0755 directory is that same leak by a different route. A new module, intergen/private_state.py, sets the mode AT CREATION — 0700 passed to mkdir(2), 0600 passed to open(2), neither of which a umask can loosen because they carry no group or other bits to remove — and every create site across fourteen modules now goes through it. Two holes close with it: the daemon log's ROTATION backups (the stock handler opens each fresh backup through plain open, so tightening only the live file left every backup readable, and three such backups were measured at 0644 on an installed system), and the trace append path, which re-created a removed or rotated trace world-readable with no signal while it still carried prompt, model and delivered bytes. Directory modes were previously order-dependent: three components wrote to the same directory with three different postures, so its confidentiality depended on which ran first. Shared XDG parents (~/.local, ~/.local/share, ~/.config) are deliberately untouched — they belong to every application on the machine. A one-time pass at daemon start brings an EXISTING home up to the same standard, since the create path only ever runs when a file does not yet exist; the walk is structural rather than a list of known names, so rotated logs and records left by an earlier release are covered too. It only REMOVES group and other access and never grants any, so a directory deliberately made stricter than 0700 keeps that choice; it skips symlinks, because chmod follows one and would change a file outside the tree; and it names any path it could not adjust instead of logging a partial pass as a success. The suite's own home is isolated alongside its XDG bases in the same change: the daemon entry point performs that pass, three cases drive that entry point to pin its argv contract, and a bare test run therefore adjusted the invoking user's real per-user trees until HOME was redirected with them. Proven red-first: the fresh-HOME gate failed against the previous behaviour before the correction existed. Measured against the permission shape of an installed system: 16 entries readable by other local accounts before, 0 after, second pass a no-op.  # r183: no behaviour change: comment, docstring and test-README wording across intergen/ and intergen/tests/ now uses plain engineering terms in place of project-internal shorthand. Text only; no code, no interface, no data, no model artefact.  # r182: test-fixture wording only: the system-information formatter test used the previous release's identity string as its example, which read as a statement of the current release and would go stale at every release. It now uses a deliberately synthetic value. No shipped code changed.  # r181: no intergen code changed. intergen's content fingerprint folds its own tree; a wording-alignment pass over the same two test READMEs the r180 note describes standardized the reviewer-role terms used there. Documentation text only; no code, no interface.  # r180: no intergen code changed. intergen's content fingerprint folds its own tree, and the documentation-truth pass reworded two test-corpus READMEs in it: tests/demand_corpus/README.md now states the M8-6 requirement as a dated decision rather than a role instruction, and tests/judge_calibration/README.md names the independent annotator as ground truth. Documentation text only; no code, no interface, no data.  # r179: destructive-policy-manifest.json gains the system_binaries never-list category (decided 2026-08-16) — prefix protection for /usr/bin, /usr/sbin, /usr/lib, /usr/lib64 and the FHS symlink spellings; re-signed with the release key; a shipped-manifest test pins the entries. The manifest pair ships in this package, so the archive bytes change with it.  # r178: destructive-policy-manifest.json description/notes text corrected to state installed-system protections truthfully (detached-signature verification + root ownership; dm-verity seals live/install media only) and re-signed with the release key; path lists and policy semantics unchanged. The manifest and its .asc ship in this package, so the archive bytes change with them.  # r177: no behaviour change: two test-fixture strings neutralized in the pre-release pass — a canned hostname answer in test_scenario_responsiveness.py generalized, and a docstring's internal ledger reference in test_m7_trust_priority.py reworded. Fixture/docstring text only; no code, no interface.  # r176: no behaviour change: one section comment in intergen/web_server.py reworded from 'seamless reads' to 'read-only actions' during the pre-release register pass. Comment text only; no code, no interface, no data.  # r175: every displayed model size is on ONE convention: decimal GB of the real payload bytes. Measured at r174 against the shipped manifest, one tier-3 file displayed three different sizes (catalog 20.5 - a binary reading, hardware table 21.0 - matching neither convention, status 22.0 decimal) - a 1.5 GB spread larger than the discrepancy r173 closed. The catalog and hardware-table constants move to the decimal values of the real byte counts (1.3 / 5.6 / 22.0), the tier-table docstring and the VRAM-rationale comments follow, and the offline-status test fixture now carries the real tier-3 byte count so its expectation states a size a shipped model actually has. Display-only: no gate or free-space check consumes these values (verified by review before the change).  # r174: the offline-status test's size expectation moves to the decimal-GB convention r173 adopted (the fixture's 20 GiB of bytes renders 21.5 decimal GB) — the r173 display change was landed with its own suite run still in flight and this pin correctly caught the unmoved expectation; the test's substance (integrity NOT checked offline, the start/logs guidance) is untouched.  # r173: second review-fold, all guard/test/display level, zero serving-behaviour change. (1) A new preflight test verifies EVERY in-tree artifact+signature pair (discovered by the sibling rule) against the tree's own pinned keyring via gpgv — the class it kills was measured on this very tree: the tier-2 pin swap changed models-manifest.json without a re-sign and the BAD pair survived branch gates, a composed landing, and one independent review, corrected only by a scheduled ceremony; the test proven RED against that exact historical pair and carries a tampered-artifact positive control. (2) The refusal escape-route pin gains an author-path case (the same probes through entry_to_sample, where the gate actually fires). (3) `intergen status` daemon-down branch now prints the model size in decimal GB matching the tier table — the binary GiB labelled GB showed the same file 0.4 GB smaller.  # r172: release-review findings folded, all string/comment/guard level, zero behaviour change. (1) The tier-2 size shown to users moves 5.5 to 5.6 GB, matching the shipped payload's real 5,629,108,608 bytes (both the docstring table and the catalog display value). (2) A new guard test pins the catalog-to-manifest lockstep in the direction that degrades QUIETLY: a manifest row missing for a catalog filename caps the tier down silently at provisioning, so the suite now fails loud on that pair; proven red by removing the tier-2 row and green on the shipped pair. (3) The port-bind failure text now states the schedule's real total (155.5s) instead of a constant it does not consume. (4) A protocol-doc example payload and a license-test comment move to the shipped tier-2 filename.  # r171: review findings from the pre-landing pass, folded before the build proves the tree. (1) The literal-marker refusal in the training-set emitter advertised an escape route its own gate refuses: it told an author a gold quoting tool-call syntax could ride in 'a prose gold about the format', but a prose gold's content becomes an assistant message — exactly the position the refusal fires on — so following the advice reproduced the refusal. Measured through the real gate: user turn PASSES, tool result PASSES, prose gold REFUSED. The message and docstring now name only the two carriers the gate accepts and state the prose-gold impossibility plainly. (2) A new test binds the advice to the gate's behaviour (each advertised carrier exercised through the real gate; the wording pinned) — it fails against the prior message, proven red-first 1/3. (3) Two comment direction errors in the watchdog cooldown work corrected: the exhaustion hold is ABOVE the cooldown wait, not below, in both the loop comment and the test module docstring. No behaviour change anywhere in this release.  # r170: the tier-2 model-manifest signature is refreshed over the r168 payload swap: models-manifest.json.asc re-signed as a detached OpenPGP signature and verified against the project primary key at delivery, so the shipped pin file and its signature verify as a pair again; the manifest bytes themselves are unchanged from the r168 swap.  # r169: the training-set emitter's docstrings state WHERE their rendering claim holds. Three of them asserted, without qualification, that tool-call arguments serialised as a JSON string render the function name with every argument dropped. That is true of DIRECT template application -- what this training pipeline does, applying internvl-tool-template.jinja itself over the emitted JSONL, where the template's `arguments is mapping` guard is false for a string -- and it is NOT true of the serving engine. Measured 2026-08-13 against llama.cpp b8796 serving that same template (sha256 7f0e529032c25183..., verified identical installed, in-tree, and in two running servers' memory): llama-server parses function.arguments as JSON before applying the template, so a JSON-object string and the mapping render byte-identically -- identical <tool_call> regions (sha256 78669ee3c16d9598...) and identical prompt_tokens (87 for both, against 66 for a call carrying no parameters, which is the control proving the measurement can move). The engine states the mechanism itself: an arguments string that is not valid JSON is refused with "Failed to parse tool call arguments as JSON", and a string that parses to a scalar or an array is accepted but renders no parameter blocks. The consequence recorded on these lines is that LLMRouter.continue_after_tool_call must NOT be changed to send a bare mapping: json.dumps is what the OpenAI wire format specifies for that field, and a mapping works only because this engine is lenient about it. render_tool_flow's "Mirrors LLMRouter.continue_after_tool_call" now reads "Mirrors what it RENDERS" and says why the two Python values differ while the rendered bytes do not. The corpus-side gate is unchanged and still required, because nothing in the training path does the parsing the engine does. Also: the literal-<tool_call> refusal message and its docstring now name the escape route for a gold that legitimately QUOTES tool-call syntax -- move that text out of assistant content, into a user turn, a tool result, or a prose gold, since assistant content is the only position the template turns into a rendered row of the model's own output. Docstrings and one refusal message only; no behaviour change.  # r168: six change sets composed into one release; each note follows in landing order. [a] four measurement-instrument items for round 2. (1) A coherent reply about the WRONG subject now fails Gate A. Asked about one service, answered confidently about another, such a reply satisfies every quality dimension a judge reads because it really is coherent; what it fails is structural, so the check is an assertion, not prompt text. no_wrong_target binds the answer to the subject the turn's dispatch acted on, deriving its targets from the turn's own tool arguments, so it carries no subject list and covers a service nobody has named before the day a cell dispatches against it; argument keys that carry a verb are excluded, and a command with no subject of its own produces no assertion at all. (2) An honest enumeration of data already in hand is no longer read as corruption. The one measured false positive of the fast-path synthesis screen was a real summary of a 979-package listing, whose many short items look to a repetition detector exactly like a token loop; the synthesis lanes hold the ground truth the model was asked to phrase, so an enumeration whose items trace back to that text is honest however long it runs, while items that appear nowhere in it stay rejected. Narrow by construction: only a repetition-shaped flag can be excused, only with source text in hand, only when the reply really enumerates, and never for a text-shape gate reason. (3) Short replies with no grammatical spine are named as corruption. A reply of at most eight words carrying no verb, no number, no identifier and no terminal punctuation is not a sentence — the word-bag class that every other instrument passed because each needs either length or structural damage. Shape only, never meaning, with a script guard that leaves non-Latin output to the flood check. (4) The fabrication screen now reads clauses, so a denial or an offer is not a claim. A bare present-progressive act claim is caught, but only when it opens its own clause and that clause is neither negated nor interrogative; the same clause scope makes the module's long-documented promise true for every alternation, including the passive one that fired on the honest denial its own docstring cites. Cross-review then returned five defects in these four items, all fixed on this branch before it landed and each reproduced against the reviewed tree first: a comma-joined clause now ends the fabrication screen's clause, so a denial can no longer amnesty a claim written beside it in the same sentence (the regression against the prior release); a shell dispatch's options consume their own arguments, so an option VALUE is no longer read as the subject and a correct answer is no longer graded as a correctness failure; naming a target is a prefix relation between whole words that must cover most of the name, so ordinary English no longer satisfies a three-character stem; an enumeration item must carry information and appear in the tool output as its own token before it can trace; and the short-reply script guard defers at the same ratio the flood check acts on, so a single non-Latin letter no longer switches the check off. [b] the per-path system-prompt modifiers stop colliding with the base prompt's own rule numbering, and four measurement-instrument items land with it. (1) Every modifier hardcoded its text as rule "4." while the base prompt had grown its own fourth rule (the fencing convention), so every assembled prompt served two rules numbered 4 and the conversational path served "4, 4, 5"; the collision lived only in the assembled string, which is why no code path and no test saw it. Modifier text now lives as rule bodies with no numbers, and the numbers are derived from the base prompt's own rule count, so adding a base rule renumbers every modifier instead of requiring six strings to be edited in step. Assembled bytes are otherwise unchanged and every path stays inside its char budget. (2) A coherent answer about the wrong subject now fails the grader's Gate A, so an answer that is fluent about something else can no longer score as correct. (3) An honest enumeration of data already in hand is no longer classified as corruption by the synthesis screen. (4) A short reply with no grammatical spine is named as corruption by the semantic health check. (5) The fabrication screen reads clauses, so a denial or an offer is not read as a claim. Decided 2026-08-13: the four instrument items land in-tree with the prompt fix; the serving process in front of the running measurement batteries is not restarted by this landing. [c] the training-set emitter writes tool calls in the ONE form the chat template renders. Measured 2026-08-13 by rendering the candidate shapes through the shipped template rather than reading its docstring: the template emits <parameter=...> blocks only under its own `arguments is mapping` guard, so the two shapes this emitter produced both rendered wrong. A dispatch gold was written as a JSON blob inside the assistant's CONTENT and rendered as literal text with no <function=> block at all -- while the template's own system block instructs, in the same rendered row, that a call must be an inner <function=></function> block; and a tool_flow history call serialised its arguments as a JSON STRING and rendered as the function name with every argument dropped. Both are now a structured call with mapping, key-sorted arguments -- the same shape for both turn kinds, which is what let one of them go unnoticed. render_gold returns a message rather than a string and is renamed render_gold_message; distribution_report tells a trained dispatch from a replayed history call by position (the history call is the one followed by the tool-role result) now that both carry the same shape. New fail-closed post-condition assert_renderable_tool_calls fires inside entry_to_sample, so every path that produces a sample is gated rather than relying on a caller to remember: it refuses literal <tool_call> text in content, non-mapping arguments, and an EMPTY arguments mapping -- empty matters as much as mapping, because an empty mapping is a mapping and still renders no parameters. Three negative controls prove the gate can fail and one positive control proves it accepts the real emission. The existing tool_flow test asserted the call's NAME and stopped, which is why the string-arguments defect survived; it now asserts the arguments too. [d] the model-server manager survives a child that will not die, and its two launch-related waits are sized from measurements instead of fixed constants. Measured 2026-08-13 on a laptop with a discrete NVIDIA card on the open-source driver: a failing health check led the watchdog to stop its own model server; the child was wedged in an uninterruptible kernel teardown reached through the GPU driver's file-close path; the post-SIGKILL `wait(timeout=5)` therefore raised subprocess.TimeoutExpired past a handler that catches only OSError, and the exception escaped stop() and restart(). The first restart attempt never reached a launch at all, and the failure it reported named a five-second timeout that exists nowhere in the launch path (the wall clock reconciles exactly: 5s reap wait + the 10s stderr-pump join the finally block runs on the way out). The remaining two attempts then refused the port — it was still unbindable 98 seconds after the kill, while the whole bind budget was 11.5 seconds — and the machine sat with no language model until a person restarted the service. Three corrections: stop() REPORTS a surviving child (naming its pid) instead of raising, and waits GPU_TEARDOWN_BUDGET_S=150s after the SIGKILL, a budget bracketed by measurement (0.25s on a quiet machine, at least 98s in the incident); the port-bind schedule is derived from that same budget rather than a hand-picked attempt count, and a free port still binds on the first probe with no delay; and the flat 60-second health wait becomes startup_budget_seconds() — the 60s floor plus 30s per gigabyte of model and projector — so a larger model cannot outgrow the launch budget silently (the 2B-with-projector pair measured 3.77-6.53s to load and now gets 114s; a 20 GB model gets about 11 minutes instead of one). Proven against reality on the box that produced the incident: a real GPU-loaded server was wedged with SIGSTOP, and the watchdog killed and REPLACED it with no person involved in 28.0s, after which the new server served a real chat completion; separately the extended port wait cleared a 40-second hold in 45.5s where the shipped schedule refused the identical hold after 11.5s. The terminal "watchdog giving up" in the incident came from an installed package built before the retry-after-exhaustion fix landed, and needed no further change here. [e] two watchdog defects in the monitor loop, both found while reviewing the serving-watchdog recovery work and outside its scope. (1) The post-restart cooldown was a bare 60-second sleep nothing could interrupt, while stop() sets the stop event and joins with a 5-second timeout — so a stop landing in that window blocked for the rest of the sleep, and at the shipped cooldown it outlasted the join entirely and returned while a thread the daemon believed stopped was still resident. Measured at the base tree with the cooldown patched to 1.5s: stop() took 1.45s; after the change the same case returns in under 0.5s and a 6-second cooldown leaves no live thread behind. The wait is now the same stop-event wait the exhaustion hold twenty lines above already used. (2) The give-up message rendered its retry interval as recovery_interval // 60 minutes, so any sub-minute interval announced "retrying every 0 minutes" — observed live at interval=1 in the red run. It now renders seconds, minutes, or both; the shipped 900-second default still reads "15 minutes", pinned by a test so the wording cannot regress into seconds. Red-first at the base tree: 5 failed / 2 passed, the two passes being deliberate controls including one proving the cooldown is a real wait and not a no-op. Serving behavior is otherwise unchanged: the restart budget, the cooldown duration, the exhaustion hold and the recovery retry are all as they were. [f] tier 2 ships the fine-tuned round-3 build of Qwen3.5-9B. The build passed the ruled acceptance bar — three fine-tuned runs against three baseline runs, the gain above the instrument's measured same-day noise, ten request families moving from never-passing to always-passing with the run spread tightening 8 to 2 — where the same round's 2B and 35B fine-tunes measured no effect and are not shipped. models-manifest.json and the in-code catalog swap the tier-2 filename and pin together (the overlay is filename-keyed, so they move in lockstep or the fail-closed pin contract locks the tier out); the vision projector is unchanged. Mirror-hosted under the new filename; the vendor never serves it, so a mirror miss fails loud rather than fetching different bytes. Two tests that read the box's installed pins manifest are made hermetic with catalog-derived pins. Decided 2026-08-14. Chain clause recorded at this composed landing: r162's byte-identity claim - that the assembled training sets reproduce byte-for-byte - ends at r168, because the tool-call serialisation fix changes the emitted bytes by design while the position-based counts reproduce unchanged (517; 257/308/115); training sets assembled and models trained before r168 rode the prior serialisation.  # r167: a judge call that fails in transport escalates the turn instead of destroying the run — the transport twin of the r-landed unparseable-reply contract. Measured 2026-08-12: one judge prompt (16,157 tokens against the judge server's 8,192 context) drew HTTP 400, the raised HTTPError passed straight through apply_judge_grading, and a completed 204-conversation baseline died in its final grading phase — three consecutive firings, the cause invisible until an instrumented run captured the runner's exit code and traceback. judge_turn now retries a transport-failed call once (a transient fault usually clears) and a second failure folds a 'flag' verdict naming the failure — the turn lands in the human-read escalation subset, Layer-1 deterministic verdicts still fold, and the floor cannot end below 'flag' for an unjudged turn. Grade-neutral for every run that previously completed: only calls that raised (and killed the run) grade differently, and only toward escalation.  # r166: the deny-recovery cells' refusal-acknowledgment vocabulary is broadened to the register the gold corpus actually teaches, and the two cells now share one constant (DENY_RECOVERY_VOCAB in intergen/tests/conversations.py) so they cannot drift apart. The old 13-phrase contains_any list accepted only 6 of the corpus's own 34 deny-recovery gold replies — the eval demanded literal substrings ("need approval", "not able") that the gold's natural phrasing ("needs your approval", "wasn't able") never contains, so a reply matching the trained register graded as evasive. Measured before landing: gold acceptance 6/34 -> 34/34; against sealed eval replies, 9 of 10 previously-reddened denial recoveries now pass while the one genuinely evasive reply (a denial misreported as a lookup result) still fails — the broadened check still discriminates. Every added phrase is a denial acknowledgment on its own; the trace-backed gate_action=deny assertion remains the hard falsifier for fabricated success. Decided 2026-08-12: the assertion vocabulary moves rather than the gold — a check that fails 28 of 34 of its own gold answers measures the wrong thing — and the affected cell family re-baselines on the next baseline run rather than comparing across instruments.  # r165: risk classification for a mixed-capability tool is per ACTION end to end, and a review prompt now states the class it is actually asking about. Three measured defects, one observed live: a manage_services call with action "list" — a read — raised the approval modal, and the modal said the request changes the system. (1) The schema declared an action enum and nothing enforced it, so a value the tool does not define passed validation, matched neither the read-only nor the state-changing action list, and took the unrecognised-action default of CONFIRM; on a tool that escalates via pkexec that default is the privileged tier, so a read reached an administrator-approval prompt for `systemctl list`, a verb systemd refuses outright. BaseTool.validate_arguments now enforces every declared enum, before the dispatcher gate and before anything executes — an undefined value is an input error reported with the accepted values, not a risk put to a person. (2) manage_services gains ACTION_ALIASES (list -> list-units, and two siblings), canonicalised ahead of classification so a colloquial spelling of a read classifies and runs as that read; manage_packages already accepted "list", so the two tools had disagreed on the most basic query. The enum is now derived from AUTO_ACTIONS | CONFIRM_ACTIONS | ACTION_ALIASES, so an accepted value is a declared value. (3) The consent surfaces could not name the class at all: DispatchDecision carried no risk tier, so the zenity header was the fixed string "a system action you did not directly request" and the branded dialog's risk copy was keyed on provenance alone, asserting "It still changes your system" for reads. DispatchDecision now carries risk_tier, the dialog protocol carries it to the renderer, and origin and effect are separate sentences derived from the decision. Decided 2026-08-12: unrecognised must stay fail-closed but must not be described as understood — an unclassified tier keeps the severe wording everywhere, so a missing classification can never be what softens a prompt. State-changing actions are untouched: they still classify privileged and still always prompt.  # r164: the round-2 training bank lands in-tree beside the round-1 bank. Three lanes, each aimed at a defect the honest rounds 3-4 measured (2026-08-12): class 7 honesty contrastives (41 entries - read-only state reports, completed-action claims, and admitted failures in same-subject pairs, the counter-signal to the two regressed honesty cells), class 8 assembled multi-turn context (16 conversations of 4-6 turns - 100% of round-1's grade movement was single-turn and the multi-turn eval slice scored zero PASS in both honest rounds), class 9 long tool-output synthesis (11 entries - journal, package-history, unit-listing, boot-blame, and search outputs answered in a few faithful lines). Combined 585-entry training input emitted fail-closed and boundary-proven through all three model tiers' tokenizers; deduplicated under the qualified rule decided 2026-08-11 (0 qualified drops; all 54 over-0.85 pairs are opposite-intent or different-structure spares).
# r163: the detected hardware tier now governs the serving path — "auto" gpu_layers resolves to CPU-only serving (0 layers) on Tier-1 hardware, full offload on higher tiers; an explicit integer in config remains the last word on every tier (the 2026-07-31 user-control contract, unchanged); unknown/failed detection keeps the offload default, matching the daemon's assume-Tier-2 posture. Decided 2026-08-12: the hardware-detection mechanism exists to guarantee an adequate user experience, so its verdict governs how a model is served, not just which model is selected — the Tier-1 model is sized specifically for CPU serving, and measurement on Tier-1 integrated-GPU hardware showed Vulkan offload there is both slower than CPU (retry ladders over degenerate output) and, on one measured device class, intermittently corrupt. No probe, no audition, no fallback machinery ships — the tier verdict alone decides the default.
# r162: the round-1 training bank lands in-tree (intergen/tests/training_bank/) — the corpus must not live only in sealed evidence directories. Six behavior classes plus a retention lane: 289 imperative-dispatch entries with contrastive twins, 128 approval-flow/deny-recovery, 97 fragments/teach-then-offer/frustration, 47 retention, deduplicated to the 517-entry training input by a qualified embedding rule (over-0.85 cosine drops only identical-tool-target, matching-turn-structure pairs — bare 0.85 measurably conflates opposite-intent same-subject pairs, the exact contrasts the corpus teaches; decided 2026-08-11). Generators are deterministic and hard-fail on held-out/validation eval user texts, banned subjects, and internal implementation vocabulary in gold, so eval contamination is refused rather than trusted to review. Landing proof: the landed bank re-emitted through the landed emitter reproduces the sealed SFT corpus byte-identically (517 samples; dispatch 257 / prose 308 / dispatch-history 115). The serving system prompt is deliberately NOT stored in the bank directory — it is extracted from the shipped composer at the tree being trained, and the trainer applies the same chat template the server uses with the real tool-schema array, so training-time and serving-time bytes match by construction.
content_hash: c438ba48d1b4267f
description: InterGen AI assistant — system-aware, local-first, hardware-adaptive
license: GPL-3.0-or-later
homepage: https://github.com/InterGenJLU/intergenos
tier: ai
build_style: custom
source: []
# First-party source lives in the top-level intergen/ tree (build.sh copies
# from /mnt/intergenos/intergen/). Folded into the skip-built fingerprint so
# an edit there forces a rebuild instead of being silently skipped.
source_tree:
  - intergen
dependencies:
  build: []
  host: []
  runtime:
  - python
  - llama-cpp
  - pyyaml
  - numpy
  - aiohttp
  - prompt-toolkit
  - rich
  # GUI runtime deps — ship /usr/bin/intergen-panel (GTK4/WebKit-6.0 window)
  # + the intergen@intergenos.org gnome-shell extension. The panel does
  # `import gi` (pygobject3) and embeds a WebKit-6.0 WebView (webkitgtk,
  # USE_GTK4=ON) in a GTK4 window (gtk4).
  - gtk4
  - webkitgtk
  - gnome-shell-extensions
  - pygobject3
  # zenity is the GUI consent modal the permission gate shells out to on
  # non-web surfaces (review_modal.py -> zenity --question); without it a
  # gated action on the D-Bus/CLI/voice path cannot be approved.
  - zenity
  # logrotate consumes /etc/logrotate.d/intergen-tool-dispatch, which this
  # package installs (build.sh) and intergen(1) documents as the rotation
  # mechanism for the tool-dispatch audit log. The snippet shipped from the
  # start; the consumer did not exist until logrotate was packaged, so the
  # audit log had no bound on its growth. Declared here so an install that
  # carries InterGen also carries the thing that rotates its log.
  - logrotate
verify_paths:
  - /usr/lib/python3.14/site-packages/intergen
  - /usr/lib/python3.14/site-packages/intergen/tools
  # M4 gate ground-truth (Ruling 3): the capability-claim + read-only-state gates
  # read these via Path(__file__)/data/; missing = a silently-degraded gate.
  - /usr/lib/python3.14/site-packages/intergen/data/capability-surface.json
  - /usr/lib/python3.14/site-packages/intergen/data/readonly-state-map.json
  # Secondary-AMD-GPU runtime-PM pin (desktop monitor-layout integrity on
  # multi-GPU systems; the rule file documents the measured mechanism).
  - /usr/lib/udev/rules.d/70-intergen-compute-gpu-pm.rules
  - /usr/lib/python3.14/site-packages/intergen/web
  - /usr/lib/python3.14/site-packages/intergen/console
  - /usr/lib/python3.14/site-packages/intergen/panel
  - /usr/bin/intergen
  - /usr/bin/intergen-panel
  - /usr/share/gnome-shell/extensions/intergen@intergenos.org
  - /usr/share/gnome-shell/extensions/intergen@intergenos.org/schemas/gschemas.compiled
