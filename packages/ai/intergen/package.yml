name: intergen
version: "0.1.0"
release: 293  # r293: the serving engine sees only the card it is pinned to. --device places the model's layers on one card; it does not stop the ROCm runtime from opening every other card, and an allocation the layer pin does not cover - the vision projector among them - lands on whichever card the runtime calls device 0. Measured on the two-card AMD workstation on 2026-09-20: device 0 is the card driving the desktop, so the projector sat on the display card, holding 1,266 MiB there, while the offload plan's arithmetic charged that memory to the pinned card. A plan that is arithmetically correct about a machine state that does not exist is harder to catch than an obviously wrong number, because nothing looks wrong. The launch now derives a device-visibility filter first: the pinned card's ROCr enumeration index comes from the kernel's own KFD topology (node directories ordered as integers, CPU nodes skipped), ROCR_VISIBLE_DEVICES takes that index and HIP_VISIBLE_DEVICES takes 0, and the engine is then RE-ENUMERATED under that environment. The filter is used only when the filtered listing reports exactly one device and that device carries the pinned card's PCI address. The --device name is read from the filtered listing, because under the filter the pinned card becomes device 0 and the name computed from the unfiltered listing would name a device that no longer exists - on the measured machine the 7900 XT is ROCm1 unfiltered and ROCm0 filtered. The verified environment is passed to the child explicitly; until now Popen was called with no env at all, so the child inherited the daemon's whole view of the machine. Anything that cannot be verified leaves the launch byte-for-byte as it was and says why in the log, so an unfiltered serve is never silent. Only the ROCm backend is filtered, decided by the ggml device name, and an instance serving on CPU is untouched. Measured after the change through the shipped daemon on the same machine: the serving process holds 32 KiB on the display card instead of 1,266 MiB, the remaining kibibytes being the kernel's own cost of opening that card's render node, which a bare HIP process shows as well. r292: a follow-up is not a fresh question. Four routes answer before the model is ever asked - the explain gate, the cached-state answer, the keyword match and the semantic match - and each of them reads the current message and nothing else. That is what makes them fast, and what makes them wrong for a message whose subject was named in an earlier turn: the route cannot know there was an earlier turn. Measured on a second machine on 2026-09-20: turn one was answered by the explain route in 19 milliseconds with no model call, turn two by the keyword route in 14 milliseconds - it ran `free -h` - and the person was having a conversation while the assistant answered two unrelated sentences. A message that carries its subject rather than stating it now steps past those four routes and reaches a path that is assembled with the conversation. The test for that is deliberately narrow, because a wrong positive hands a code-owned answer to the model: either an explicit back-reference to what was said, or a referring word standing in the opening words where the subject belongs with nothing else in the message naming one. With an empty conversation nothing is a follow-up, whatever its wording, so a first message is answered exactly as before; questions that name their own subject are untouched, and the answers that read the conversation - what was the first thing I asked - still come from the code that reads it. r291: a turn the assistant answered is a turn it can be asked about. On the command line and on every desktop surface that speaks to the daemon, the exchange was recorded by each answering path for itself, and nine of the router's functions build a delivered answer without doing so - so those turns never reached the conversation the next turn is assembled from, nor the verbatim transcript a question about the conversation reads. The browser never depended on that: it records the delivered answer once, at its own delivery boundary. The daemon now does the same. Measured on an integrated-graphics machine with the tree running as the daemon: a person said thanks, then asked what the first thing they had asked was, and was told "The first thing you asked me was: 'What was the first thing I asked you?'" - the question quoted back as the whole conversation - while the same two turns in the browser answered "Your first question was: 'thanks'". After the change both surfaces answer the same. The write records the FINAL delivered text, past the identity guard and the unconsumed-dispatch repair, so the buffer holds what the person actually received, and the idempotency guard inside the recorder makes it a no-op for the paths that already recorded the same exchange, so nothing is doubled. It also cannot cost anyone their answer: recording runs inside the turn's catch-all, so a failure there used to replace a good answer with an error message; the failure is now reported on its own - an error line and a decision-trace row saying this turn did not reach the conversation - and the answer is delivered. r290: a connection the model server refused is not retried inside the same turn, and a server that is not listening is reported once per down-episode instead of once per attempt. Measured on an integrated-graphics machine with the tree running as the daemon: one stopped engine produced seven identical connection-refused error lines in 140 milliseconds, because a request that returns no tokens reads to the quality gate as an empty answer, and an empty answer is worth retrying with more room - which it is not, when nothing accepted the connection. The new module-level function transport_failure_kind() decides refused, timeout or other in one place, unwrapping the URLError wrapper and deciding refused on the errno rather than the message text, whose wording depends on the locale. The router records that kind beside the reason it already recorded; the reply ladder skips the second LOCAL attempt when the kind is refused; the handler logs the failure at error level once per down-episode and at debug level on repeats, and the next successful request reopens the episode so the next outage is reported again. A timed-out attempt keeps its retry, which is the opposite case and the one the retry was written for: something accepted the connection and may well answer with more room. Cloud escalation is untouched and still runs when the local connect was refused, because a local server nobody is listening on is exactly when a configured provider is the one route left to an answer. The decision trace still carries a row for every attempt that got no response and now names which kind of failure it was, so suppressing the repeated log lines does not suppress the record. Re-measured the same way after the change: seven error lines became one, with three ladder stops recorded in their place. r289: an engine that was asked to stop is not an engine that failed - the chat path gets the same teardown measurement the embedding path got in r288, through ONE shared function rather than a copy, and stops recording a deliberate stop as an unreachable endpoint. The chat handler did more than log at the wrong level: it called note_transport_failure(), and that record is what the last-resort text reads, so a stop the person asked for could make the assistant tell them their model server was not running and the service needed restarting. llama_manager's measurement is promoted to the module-level function planned_teardown_of(manager) and the manager's own method delegates to it; the LLM router gains set_serving_engine(), which the daemon calls with the chat manager it already holds at that point, and the router asks that one question only after a request has already failed. When the answer is that the engine was asked to stop the line is informational and names the teardown, no transport failure is recorded, and the decision-trace row carries planned_teardown so a trace reader can tell the two apart as well; with no engine wired the behaviour is exactly as before. The case that matters most is the game pause, where the engine is stopped on purpose and the daemon keeps running, so the record would have outlived the stop. Proven on an integrated-graphics machine with the tree running as the daemon: the in-flight request's line moved from error to informational and named the teardown. r288: stopping the assistant is reported as a stop rather than as a failure, and the layer plan is measured against the card the graphics engine can see. Two changes, both about a line a person reads. (1) Stopping or restarting the assistant while it was catching up on its documentation index logged `embed() request failed: ...` at error level for a request that died because the embedding server had been asked to stop; an error line that is routine teardown noise teaches a reader to skim error lines. The level now follows two measured facts - whether this code had itself begun stopping the server, and whether the server's own process had already exited on the stop signal, which is what stopping the service does to every process in its group before the assistant's shutdown path runs at all. A server still running, or one that crashed, was killed, or exited non-zero, keeps its error line. (2) On a machine whose only graphics processor is the integrated one the offload plan said video memory could not be read and then offloaded every layer without having measured anything, while the engine it was about to launch would print that card's total and free memory on demand; the plan now asks the chosen engine for its own device list when neither the pinned card nor the hardware detector read the card, and uses it only when that list names exactly one device. Which of that device's two figures is used is decided by the rule that already governs a pinned card. An unreadable or empty list keeps the honest could-not-be-read plan. Proven on an integrated-graphics machine with the tree running as the daemon: the in-flight request's line is informational and names the teardown, and the same start now records 2917 MiB needed against 10584 MiB free. r287: the web battery's sealed record now carries what the harness measured about the end of each turn. The harness computes when the terminal frame arrived and how many frames the server sent after it, and wrote neither into the record, so a reader of a sealed record could not tell a turn that stopped cleanly from one that kept speaking after it ended - the question the settle window was added to be able to answer. Measured on 2026-09-19 against three real sealed records taken on a development workstation: zero occurrences of either field. Both are now written for every question, in the per-question table and in the record's summary, from one column list so header and rows cannot drift apart; a turn that never reached a terminal frame writes an empty time rather than a zero, and a collected turn that cannot supply the fields raises rather than recording a default. The non-streaming reply path, which returned at the terminal frame instead of reading on for the settle window, now takes the same terminal path as the streaming and failure terminals, so a frame sent after a fast reply is observed rather than assumed absent - measured against a real daemon on 2026-09-19, one late frame observed on all fourteen questions, including the seven answered by the fast path. Also in this release: the two cardless-start tests that watch the per-card engine gate now pin the GPU vendor they assert on instead of reading the host, so they answer the same on an AMD machine and on an NVIDIA one; nothing they test changed. r286: the engine-selection line for the embedding server says that it pins no card, and why the card question is still asked. That server is CPU-resident by design: it starts with zero GPU layers, which is what makes the launcher pass --device none, and no graphics card is pinned for it. The launcher nevertheless wrote only the engine chooser's per-card answer, with nothing around it to say what the start was, so on a two-card machine whose installed build did not cover the card the chooser would have picked, the line read as a refusal of an engine over a card the reader had no reason to connect to this start. Measured through the daemon itself on 2026-09-18 and 2026-09-19. A start with zero GPU layers now tells the launcher so, and the launcher writes one line before the selection: the start is CPU-pinned with --device none, no card is pinned, and the per-card question is still asked because the engine binary enumerates every visible card when it starts, whatever --device none then does about loading a model onto one. The gate is not skipped: doing that would trade a measured refusal for an expectation about how an uncovered card behaves during enumeration. Nothing else moves — measured on the same machine against the unchanged tree, with the architecture record shortened and with it intact, the embedding server resolves the same engine and the same binary, and the chat server's engine, device and layer count are unchanged. r285: engine selection honours the operator's device pin at every step. Two defects, both measured on a two-card AMD workstation on 2026-09-19 with the shipped daemon and one architecture removed from the engine build's own record. First: the per-card architecture gate was consulted with the pin at the point the engine is CHOSEN and without it at the point the fallback ladder is BUILT, so on a machine whose two cards differ the ladder judged a different card and offered back the engine the chooser had just declined; the daemon relaunched that engine with no device pin at all and the model loaded across both cards. engine_ladder and next_engine_after now take the same device_pin argument select_serving_engine takes, and the server manager supplies the pin in force when it advances a rung; with no pin the automatic selection is asked, exactly as before. Second: device names are backend-local, and the configured name was handed to whichever engine won. When the gate declined the preferred engine, its fallback was started with a name from the other engine's namespace and exited 1 with `invalid device: <name>` on every attempt; on the display-free card the ladder then reported itself exhausted and a machine with a working fallback engine served nothing. A pin now reaches an engine only after that engine's own enumeration resolved it: a known name is used unchanged, a name from another engine is matched BY PCI ADDRESS and the chosen engine's own name for that card is used, and otherwise the pin is dropped with one plain line saying why and the chosen engine makes its own single-card selection. Nothing is resolved by position. The same rule applies where a rung is advanced, which used to clear the pin outright. r284: content hash re-recorded on the composed chain: the assistant chain rebased onto the landed six-target ROCm change set, then the memory-index test fix (r283) composed on top; no change to this package's own content beyond those already noted. r283: the test suite no longer leaves a memory index worker writing behind it — the case that proves a stop is bounded used to release its hung embedding server at cleanup without waiting for the worker it had abandoned, so that worker's last trace row landed in whatever record the process pointed at by then: the next case's temporary record, counted there as its own, or a temporary directory already removed, which left the process-wide trace writer bound to a path that no longer existed and silently dropped the next case's rows. Measured on that file before the change: 6 of 30 runs red, 5 of 30 with a full suite running concurrently, 0 of 30 after. No shipped code changed. r282: the offload plan weighs a display-driving card's FREE memory. The engine's device listing prints a total and a free figure for every card; the plan read the total and discarded the free figure, and on a card that is also painting the desktop the difference is the desktop — measured on a two-card workstation, a model needing 7331 MiB against a card reporting 8176 MiB total and 6842 MiB free was declared a comfortable fit and then loaded with 155 MiB to spare. Both figures now come off the same device line of the same enumeration that produces the pin, and one function decides which of the two the plan is weighed against: a card provably driving a display, whose line carried a free figure, is weighed on the free figure; a display-free card, an unreadable display state and a line with no free figure keep the total, exactly as before, so a single-card machine's plan does not move. The log line and the recorded trace name which figure was used and why, beside the card's total and its display state. r281: the assistant package re-composed on the extended chain: the turn-level prohibition now also declines the code-owned dispatch paths (keyword, semantic, state fallback, the fixed IP commands, the staged-action backstop), joining the chain; the content hash re-recorded on the composed chain, no code change. r280: a turn whose own text forbids commands gets none on any path. Withholding the tool schemas stopped the model from asking for a tool and nothing else: the keyword match, the similarity match and the fast path for state questions each decide to run a command without asking the model, and they went on doing it — measured on the running assistant, a turn reading "What time is it and why is the sky blue? Do not use tools, run commands, access files, or contact external services." had its first clause answered by running date. All three paths reach a tool through one helper; that helper now declines when the per-turn reading is set, records the reason in the route trail and the glass record, and returns nothing, so the clause carries on to the model, which is already given the date and time and answers from that. The two fixed commands behind the IP answer are gated the same way, and an accepted staged action is gated as a backstop. A turn that forbids nothing is untouched: none of the 885 user turns in the scenario corpus loses a tool, and the same question without the prohibition still runs the command. r279: the assistant package re-composed on the extended chain: the compound detector no longer counts a prohibition as an action, joining the no-action grading rule and the panic-screen fragment on the chain; the content hash re-recorded on the composed chain, no code change. r278: a sentence that says what NOT to do is no longer recorded as a request for several things. "Do not use tools, run commands, access files, or contact external services" carries a comma followed by an action verb, one of the signals that marks a message as asking for more than one thing; the splitter already left such a sentence whole, while detection and the action count still read the raw text and called it two actions. Both now ask the same question about negation scope that the splitter asks, from the same code, so one sentence has one reading. A signal or a verb outside the prohibition still counts. r277: the assistant package re-composed on the extended chain: the no-action grading rule (evidence of action, not the route label) and its corrected grading test join the chain; the content hash re-recorded on the composed chain, no code change. r276: the check that a question was answered without doing anything now reads what the assistant did, not what it was allowed to do. One question in the release's own front-door test asks for mental arithmetic and says not to use tools, run commands, read files or go online; the check failed that question whenever the answer came back on the route the assistant labels "tools", but that label means the tool descriptions were AVAILABLE, not that anything was used, and on a machine where the assistant is free to act it is the ordinary label for a plain answer from the model. Measured on 2026-09-18 on two installed machines: the question was answered correctly, nothing ran, the assistant's own record counted zero tool calls and linked the answer to no tool, and the check failed it anyway. It now fails only on evidence that something was DONE — an action shown to the person during the turn, a request split into a plan of steps, a counted tool call, or an answer traced to a named tool.  # r275: the assistant package re-composed as the next chain on the landing chain: the PCI-domain width fix, the turn whose own text forbids tools is not offered tool schemas (read once per turn and gated at the chokepoint), and the CUDA refusal that names the card; the content hash re-recorded on the composed chain, no code change. r274: the reading that withholds tool descriptions from a turn whose own text forbids them now covers every path from a turn to the model, a SPLIT turn included. A request with more than one part is divided into its parts before anything else happens, and each part used to be handed the tool descriptions on its own — so "Tell me the time and how much memory I have, without using any tools." was split in two and offered every tool twice, and the first part, read by itself, carried no prohibition at all to notice. The turn is therefore read once, whole, before it can be divided, and the one place that offers the descriptions to the model checks that reading, so no route to the model can get around it. Measured on a daemon running this tree: the model clause of a forbidding request is answered from the model, while the same request without the prohibition still reaches the tool path.  # r273: the assistant package re-composed as the next chain on the landing chain: the PCI-domain width fix, the turn whose own text forbids tools is not offered tool schemas, and the CUDA refusal that names the card; the content hash re-recorded on the composed chain, no code change. r272: a CUDA engine the installed build cannot serve on now says WHY it was passed over. The architecture gate added in r257 skips the CUDA engine on a measured refusal through a bare continue, so a machine that dropped from CUDA to Vulkan wrote only the engine it arrived at and never the reason — measured on two machines 2026-09-18, a grep over the selector's own loggers returning zero on both. Both walks, select_serving_engine and engine_ladder, now log a line naming the card by PCI address, that card's compute capability, and the target list the installed build declares, which is the sentence the HIP rung has written since its own per-card gate landed. The new cuda_refusal_reason builds it from the per-card verdict cuda_card_support already returns and yields None when nothing was measurably refused, so an unreadable capability or a build that installed no target record stays silent and only a line that matters ever appears. The verdict and the sentence are built from ONE capability reading, passed in, so a reason can never describe a different state of the machine than the decision it explains; that also drops the engine walk from two nvidia-smi runs to one. No engine choice changes: the rung that refuses, and the rung that does not, are exactly the ones r257 established. # r271: a turn that forbids the use of tools is no longer offered them. The assistant exposes its tool descriptions to the model on most turns, which is deliberate — withholding them was never a safety boundary, and every action that changes anything is still gated at the point of execution. But a person who writes "Do not use tools, run commands, access files, or contact external services" has not failed a threshold; they have given an instruction, and offering the tools anyway holds open a door they just asked to be kept shut. Measured against the running assistant on 2026-09-18, that exact sentence was routed to the tool path every time, and the panel then told the person it was looking something up on the one turn where they had forbidden it. The turn's own text is now read for an explicit prohibition, using the same reading of negation the query splitter already uses, and the tool descriptions are withheld when it finds one. Not a refusal: the turn is answered from the model, and the recorded reason says the turn's text is why. The reading is deliberately narrow — a closed list of wordings naming a general capability, so a request forbidding one particular file still gets every tool. Across the 885 conversation turns this project keeps for testing, not one loses its tools.  # r270: a graphics card behind a Thunderbolt or VMD bridge is no longer invisible to the serving-card selection. Each engine's device listing carries a "[PCI domain:bus:device.function]" tail, and the two readers of that listing required the domain to be exactly four hex digits. The backends print it with a MINIMUM width of four — a device in domain 0 reads 0000:01:00.0, and a device behind a Thunderbolt or VMD host bridge reads 10000:e1:00.0, which is five. The cost was not a lost address but a lost device: the optional tail failed to match while text still followed on the line, so the whole line failed and the card disappeared from the list the selection reads — a card the machine has, reported as one it does not have. Both readers now take one to eight hex digits of domain, a malformed tail is still refused, and the four-digit form parses to exactly the address it always did. Read out of the installed engine binary rather than assumed: its device id is built with "%04x:%02x:%02x.0". Regression tests red before, green after. # r269: the assistant package re-composed as one chain onto the CUDA engine's record change: the engine check asks about the card that will be pinned (and the launcher's fallback too), no tool acknowledgement on a turn that runs no tool, the offload plan sizes the pinned card, the HIP record reader ignores comments, the tool card is sent before the turn's terminal frame, the session turn index stops its worker before a row can land, status reports the model server, and the display identity follows the PCI listing; every lane's own note follows under its composed number; the content hash re-recorded on the composed tree, no further code change. r268: the graphics card is named correctly on a machine whose PCI listing prints domains. `lspci` prints the PCI domain on every line as soon as ANY device on the machine has a domain that is not zero — a Thunderbolt controller is enough, and it need not be a display adapter. The display-adapter identity, which is read once from the kernel's own device attributes, dropped a zero domain unconditionally, so on such a machine it reported an identity that differed from the machine's own listing; it now makes the same whole-listing decision the listing tool makes, read from sysfs, with no command run and no configuration space touched. The sentence the assistant answers a graphics-card question with took the card's description off the line by counting colons, which on a line carrying a domain answered "GPU: 02.0 Iris Xe Graphics." instead of naming the card; it now takes the PCI slot off at its space, so the cached identity and a raw listing both answer with the card. Measured 2026-09-18 on a laptop whose four Thunderbolt devices sit in domain 0x10000: the answer from a raw listing was wrong there before this change, and the identity reader and the listing tool now agree byte for byte. The adapters are also ordered by domain, bus, device and function as numbers rather than as text, which is the order the listing tool uses and the same order for every domain that fits in four hex digits. Regression tests red before, green after. # r267: `intergen status` reports the MODEL SERVER, not the daemon process. Seen twice on real hardware: a daemon alive with no chat server bound printed Running True and Last Error None while its own component marker read [-] llama_server and every request failed. The daemon already computed the reason — model_server_down — and the renderer discarded it. Running now reads DEGRADED when the chat server is down, the reason reaches Last Error instead of None (a recorded last_error is shown too; neither fact overwrites the other), the journalctl pointer is offered, and the Offload line stops describing the offload of a server that is not running — the second sighting rendered "unknown, ? layers on CPU" while nothing was serving at all. A healthy machine, a deliberate CPU run and a stopped daemon each keep their own words; those are the controls. Renderer only: the daemon's payload is unchanged and is not mutated by rendering. r266: stopping the session memory index now waits for its worker, so a trace row written for one conversation can no longer land in the record that replaced it; the wait is bounded by a stated timeout and writes a row of its own when that timeout expires, and a stop finishes the exchanges already queued instead of dropping them. The device selector's own documentation also stops quoting a fixed list of AMD architectures it deliberately does not read, so the comment cannot go stale when that declaration widens. # r265: the record that an action was taken now reaches the browser before the turn ends. When the assistant runs a tool on a streamed turn it sends the person a card naming the tool and summarising what it did, and that card was sent AFTER the frame that ends the turn, so anything treating the end of the turn as the end of the turn never received it. Measured in a real browser on 2026-09-18, the same question against both versions minutes apart: before, the panel read question, answer, statistics row, tool card — the record of the action below the answer that used it and below the row saying the turn was over; after, question, tool card, answer, statistics row. The project's own websocket test harness had the same blind spot and stopped reading at the end-of-turn frame; it now drains what follows, reports when the terminal frame arrived and counts anything that came in after it, so a regression of this kind is visible to the instrument instead of invisible to it. No payload changed: the card carries the same tool name, success flag, summary line and optional full output it always did.  # r264: the HIP architecture-record reader strips comments line-wise (everything from '#' to the end of the line), so a comment's words are never read as architectures; the record the recipe writes carries no comment and reads exactly as before. r263: the decision about whether a model fits the graphics card now measures the card the model goes onto. On a machine with more than one card the assistant serves from exactly one of them, chosen after the model is picked and overridable by hand in configuration, but whether the model fits — and how many of its layers are placed on the card — was worked out from the most capable card the hardware detection found. Measured on a two-card workstation on 2026-09-18 with the model pinned to the smaller card: the recorded plan read "card 20464 MiB" and declared a comfortable fit while the model was placed on a card of 8176 MiB, with 155 MiB to spare and the fit never checked against the card that received it. For the largest model the signed record describes, the same mistake would place 29 of 33 layers on a card with room for 9. The card's size now comes from the same reading that chooses the card, so its name, its address and its size cannot describe different cards; every engine build reports its own devices' sizes, so this is the same on all of them. With no card pinned, or no size reported, the previously detected figure still stands, and the plan states which figure it used in both the log and the recorded trace. (This change was authored on top of release 256 and claimed 257; it was moved onto the composed tree at release 259 and re-numbered by the release-bump machine.)  # r262: a turn that runs no tool no longer tells the person it is running one. The browser server sent its "let me look that up" acknowledgement the instant a turn was routed to the tool path, but that route means tools were OFFERED to the model, not that the model called one, and on this tier most such turns are answered straight from the model with no tool at all. Measured against the running assistant on 2026-09-18: every tool-route question in the fourteen-question browser battery showed the line and not one of them ran a tool, including "Calculate 17 times 23 mentally. Reply with the number only. Do not use tools, run commands, access files, or contact external services." — answered 391, correctly and with no tool, underneath a line promising an action the person had just forbidden. The line is now sent at the first real tool call, once per turn; it still says nothing about the outcome, so it still appears when the action is refused or held for consent. The browser panel and the terminal client read the same message and are both corrected by the one change; the user-invoked tool path already had a real call before it sent the frame and is untouched. (Composed onto r258 by the release-bump machine, which named this package.)  # r261: the launcher's own engine fallback asks the same question about the same card. Choosing an engine happens in two places, and only one of them was given the card the launch pins; the other asked about whichever card the automatic selection would have taken. That was harmless while the architecture check was a question about the machine, and stopped being harmless when release 257 made it a question about the card: measured on a two-card workstation on 2026-09-18, with the card pinned by hand to the one the installed build covers, the assistant correctly launched on that card while the second call wrote a contradicting decision into the log. Nothing served wrongly, because the path that launches is given the binary directly; a caller that falls back to the second call would have been refused an engine that works on the card it was about to use. The fallback is now handed the pinned card. r260: the check that decides whether the HIP build of the inference engine may serve now asks about the CARD the assistant will pin, not about the machine. It compared the architectures the machine reports against the architectures the build carries device code for, and accepted the engine when any of them overlapped; exactly one card serves, and it is chosen afterwards. Measured on a two-card workstation on 2026-09-18 (a gfx1100 card and a gfx1102 card, against a declared list of gfx1102;gfx1201): the check said supported on the strength of the gfx1102 card and the running assistant launched the engine with --device ROCm1, the gfx1100 card the list does not cover — the crash at model load the check exists to prevent, on a machine that had a working Vulkan engine installed throughout. The card asked about now comes from the same selection that produces the pin, and its architecture from the graphics driver's own topology records, so the check and the launch cannot describe different cards and no second copy of the hardware list exists to drift. A card named by hand in configuration is the card asked about, read before the engine is chosen. Single-card machines are unchanged, every unknown falls back to the previous answer rather than to a refusal, and a decline names the card and what the build declares. The CUDA counterpart was checked and is not the same defect: that engine does not enumerate a card that is not on its driver, so such a card is never a candidate to pin. r259: the CUDA architecture-gate test that reads the engine recipe now asserts the record line reads the builder's exported declaration rather than a configure-time variable. Test text only; no runtime behaviour changed. the CUDA architecture-gate tests reason about the twelve-generation list the engine recipe declares since its release 6 (every generation compiled, no PTX token); the tests' parity case had pinned the earlier four-generation list. Test text only; no runtime behaviour changed. r257: the serving selector gates the CUDA engine on ARCHITECTURE, not only on the driver. serving_device gains cuda_build_gpu_targets, detect_nvidia_compute_caps, cuda_card_support and cuda_is_supported_here, and both engine walks (select_serving_engine and engine_ladder) now skip the CUDA engine when the installed build measurably has no code this machine's cards can execute. The test is not set membership, as the HIP gate's is: a -virtual entry is PTX the driver JIT-compiles for any newer architecture, so a card above a virtual target is covered and a gate demanding an exact match would refuse an engine that serves; an 'a' entry is architecture-specific and covers only its own number. The verdict is three-valued exactly as the HIP gate's is — an unreadable capability or an engine that installed no target record leaves the preference alone, because only a measured no may skip an engine. cuda_card_support answers per card, keyed by PCI id, because a multi-GPU box can carry cards of different generations and the serving model pins exactly one. r256: the daemon's first start reaches the next engine on its own instead of spending its whole attempt budget on one binary and waiting for a watchdog cycle; the GPU offload warning compares what reached the card against what the launch asked for, and says so when the banner does not state it at all; an MCP audit entry that cannot be written no longer travels out through the tool call that already ran; and the logging section states that a per-user service writes under the user state directory rather than the root paths it lists. r255: spelling only — the project's license word is written the American way everywhere this project speaks in its own voice, and this recipe's own text moved with the sweep. No behaviour, no payload and no declared input changed; a gate now refuses the other spelling in new text, with every upstream name exempted by name. r254: a person who declines an action is answered in their own language, the assistant can be run with administrator actions turned off, and a launch states a serving decision it used to leave unsaid. Declining a system action at the consent card used to be answered with the machine's own audit line ("Tool call denied by user via review modal."), which said what the person had just done and nothing about what they could do instead; the same decline now names the action, says plainly that it needs administrator approval which cannot be collected from that window, and hands over the exact command to run. The wording comes from one place, so the panel and the rest of the assistant cannot drift apart, and an action the machine refuses outright is still never handed to a person as something to run themselves. The assistant can now be started in a posture where actions needing administrator rights are declined before anything begins, with the posture read only from how the assistant itself was started and recorded on every such action either way, so a machine running that way can always be told from one that is not; an ordinary install is unchanged and keeps the ability to make those changes. A launch that serves one conversation at a time now says why the engine's idle-slot clearing is off, after measuring that turning it on changes neither speed, memory nor a single answer on this class of machine. # r253: the assistant answers from what it holds instead of improvising, and a launch stops setting an option the engine cannot honour. A question about the conversation itself — "what was my first question" — is answered from a verbatim, in-order record the conversation now keeps, rather than from the twenty-message window that had already discarded the opening exchange (it named a later turn). A question about memory is answered from the machine's own reading, the way the disk question already was, and reports what is AVAILABLE rather than what is free, because free excludes the cache the kernel hands back on demand; a follow-up of the form "and memory?" resolves only against a resource question in the turn before it, and a memory question about one program is declined rather than answered machine-wide. Neither answer uses the model, and neither invents a turn or a figure it does not hold. The display adapter's identity is read once from the kernel's own device attributes at start, instead of being re-derived every five minutes by a PCI listing that reads configuration space for a value that cannot change. A launch no longer passes the prefix-reuse option to a multimodal context, which cannot use it, and states in its own log why a launch went without it. The battery that drives the shipped web panel now checks whether an answer is TRUE, not only whether it was delivered. # r252: record the chat model, paired projector and embedding model in the runtime manifest; verify projector and embedding bytes before daemon loading and report manifest-write failure. r251: Model records use the package descriptor identity and an explicit license URL map. Existing-model setup re-verifies the installed artifact through the privileged provision runner and reports the record rewritten, already correct or refused; verification, authorization and record-write failures prevent ready. Record-only mode does not download or copy model files or update inventory. The request-removal fixture now retains the descriptor for the same lifetime as the production reader. (The command catalogue is already current on this base; the lane's regeneration was empty here.)  # r250: the assistant's serving plan, its status and its browser transcript state what was measured. First, the browser transcript: one writer records each exchange once, and the model is asked the question once (the user message was appended before routing and again by the transcript writer, so every second turn carried the question twice). Second, the serving plan on real hardware: the offload plan is computed with the video-memory figure the hardware detector read (the tier record carried no such field, so a machine whose card was measured still logged that its video memory could not be read); a writeback connector is not a display, so the serving model stays off the card painting the desktop (a virtual Writeback-* node reading "connected" counted as a monitor); on an NVIDIA card behind the proprietary driver the CUDA engine serves first and Vulkan is the floor (the driver, the toolkit and the CUDA build are installed for exactly this; the installer's copy of the table moves with it, forge r259); the engine ladder detects the card vendor itself and offers every engine not yet tried before it reports itself exhausted (a Vulkan failure with a present CUDA build ended the ladder). Third, status truth: the serving backend is named from the engine that was launched, with the load banner as the cross-check (a ROCm banner that mentions CUDA first was reported as CUDA); status reads the same conversation binding the routed turns use, so it never reports an unbound conversation after successful index writes; the session-recall line states how many exchanges are indexed, when the last index write happened and whether the embedder answered; a turn answered from the system-state cache records its exchange like every other fast path. Fourth, an explanation question about a system noun ("what is a kernel?") reaches the model and is never served from the system-state cache, while the live-data question ("what kernel am I running?") still is. Fifth, the computed documentation index is cached on disk under the daemon's state directory, keyed on the verified page-manifest digest, the embedding model identity and the index format version; a matching key loads without embedding, and a changed page, a changed model, or a corrupted file re-embeds from scratch with the reason logged; the installed-system restart-persistence gate demands the cache again. Regression tests red before, green after. UNPROVEN: the installed green on a real machine (the built archive installed and the browser battery re-run); a machine with an NVIDIA card; a real restart with the cache on an installed daemon; the two machines the serving-plan failures were first seen on.  # r249: every web-chat turn that needs the model completes. Once the daemon detached the router's own conversation, the browser server built the model prompt, looked up grounding, checked for a staged code offer and ran the three honesty-screen regenerations OUTSIDE the connection's conversation binding, so each such turn raised, crashed, and showed the "Something went wrong on my end" banner on every installed R001.2 machine (measured over the panel socket 2026-09-15 against an installed machine: 9 of 14 fresh-user questions failed, 7 of them with that banner). Every router access after routing now runs inside that connection's binding on whichever thread it runs on; an unbound access still refuses. Second: a clause governed by "do not" / "don't" / "never" / "without" is never cut into an affirmative sub-query — "Calculate 17 times 23 mentally. Reply with the number only. Do not use tools, run commands, access files, or contact external services." was split on the comma before "run commands" and the tail opened the consent dialog; the decomposition verdict of every turn in the shape corpus (122 turns, three tiers) is unchanged. Third: the shipped capability surface is regenerated so it lists the four pkm flags the parser gained on the development branch (upgrade --archive/--archive-trust, history --limit/--all); the artifact test had been failing at the tip. New instrument: intergen/tests/web_battery.py drives an installed machine over the panel socket through an ssh tunnel with fourteen fixed fresh-user questions and seals a strictly graded record (an error frame, the banner, a refusal, a consent prompt on the no-tools sentence, or a model-required question answered by anything but the model each fail); it is the red for the banner and the proof for later fixes. Regression tests red before, green after. UNPROVEN: the installed green — the built archive installed on a real machine and the battery re-run against it — and the two machines the failures were first seen on.  # r248: every trace row the memory index writes for an exchange names the turn that produced it. The index embeds each finished exchange on its own worker thread, and a thread does not inherit the turn binding, so the indexed row (and the chunked/degraded/recovered rows beside it) carried the placeholder identifier: one unjoinable row per served turn in the user's record, refused by the installed-system trace-integrity gate on the run after the one that wrote it (measured 2026-09-11 on the validation laptop; the earlier single-run records passed because the gate read the file before the turn it drove had been indexed). The turn id and interface are captured where the exchange is queued and the worker indexes it under that scope; outside any turn nothing changes. Regression test red before, green after.  # r247: the wiki index catches up after a turn even when the turn's own memory embedding is still in flight. The after-turn catch-up pass stood down, silently and without a retry, whenever an embedding request was in flight — and one always is at that instant, because the router has just queued the finished exchange for background memory embedding. On a machine whose embedder is slower than that gap the pass never ran: measured on the installed-system gate tier 2026-09-11 (a laptop with a 4 GB card, embedder on CPU) as 64 of 2182 passages at start-up, still 64 after a turn, no embedding request in the thirty seconds that followed, so wiki answers stayed keyword-only for the daemon's life. The pass now waits for the slot (bounded, 15 s) on its own thread and then runs; a pass that gives up or fails says so at INFO/WARNING instead of DEBUG. Two regression tests drive the exact shape (red before, green after).  # r246: two corrections found by the whole-tree test run at the backup-engine landing: the shipped capability surface (intergen/data/capability-surface.json) is regenerated so it lists the two download-helper commands added on 2026-09-05 (the artifact-matches-the-live-tool-surfaces test had been failing on the integration branch since then); and the serving-card selection wrappers now take a sysfs root (default /sys, behaviour on a real machine unchanged) so their tests read a fake tree instead of the connectors of whatever machine runs them — the two selection tests had started failing on the workstation that wrote them once its monitor moved to the other card.  # r245: every trace row the daemon writes while starting and warming up names the boot that produced it. The warm-up's two generations and the engine's offload check run through the same code a served turn uses, and that code reads the turn id from its context; outside any binding those rows were written with the literal placeholder identifier ("no-turn") and could not be joined to the boot, while the boot's own bookkeeping rows carried an explicit boot id. The start-up sequence and the warm-up thread now run under a boot scope that binds the boot id without arming the one-terminal-per-turn accounting a served turn has. Measured on an installed release: ten placeholder rows per start; the installed-system trace-integrity gate refused on them.
# r244: a recognised file-search request resolves to a command instead of being recognised and then dropped. "find the hidden files in my home" (and "in /etc", or with no place named) now runs one bounded, depth-limited, read-only listing of dot-entries over the named directory or the home directory; "find the big files" resolves to the same disk-usage breakdown its synonyms "largest" and "biggest" already did (a second dropped arm found by walking the pattern). A human name for a place ("the downloads folder") and a directory carrying shell metacharacters or a space resolve to nothing on purpose and fall to the rung that can judge them; the directory is read from the original text, not a lowercased copy. The file-search pattern is one shared constant read by both the registration and the selector, and a test walks every arm of it against the selector, so a recognised-then-dropped arm cannot be added silently. A guard keeps "find the hidden meaning" off this path.
# r208: a model that downloaded and then was not installed says so, instead of being reported as a download that did not finish. `intergen setup` asks the model manager which of the two happened before it reaches its download-failure reporting, because that reporting has no answer for a refused install and used to fall through to its catch-all — a user whose file was already on disk was told the download had not finished. The model manager now records the outcome of the PRIVILEGED INSTALL step beside the download outcome it already recorded: 'not-authorized' when pkexec exits 126 (the authorization was not obtained — the prompt was closed, or the password did not match, which a caller cannot tell apart), 'runner-missing' when it exits 127 (the runner could not be executed), and 'dispatcher-refused' for any other code, which is what a staged file failing its checksum re-verify on the root side produces. Setup prints a matching explanation ending in a stable marker line, `intergen-setup: result=`, so a caller that runs setup as a subprocess — the first-boot greeter does — can tell the three apart without matching prose that may be reworded. The two pkexec exit codes are named as constants (PKEXEC_NOT_AUTHORIZED = 126, PKEXEC_COMMAND_NOT_EXECUTED = 127) rather than left as bare numbers. Also here: the comment on setup's drop-to-invoking-user path is corrected. That path is kept — the installer and `sudo intergen setup` still run setup as root, and without it the per-user web token and dispatch key would be written into /root where the user's own session daemon cannot read them — but its comment claimed the greeter escalates setup, which is no longer true. One comment is corrected in the same change: the hardware-tier notes stated the largest model as 21 GB while stating the 9B beside it as 5.6 GB, which is the decimal reading of its bytes; the shipped pin manifest records 22,016,023,168 bytes for that model, so the comment now reads 22 GB. Comment text only; no selection behaviour changed. Release left at 207 by hand for the automatic bumper to move at compose.  # r206: an ordinary question no longer loses the local wiki lookup behind it. The assistant turns a question into numbers before it searches the wiki, and the small server that does that was started able to handle only 512 tokens at a time while being handed inputs of up to its full 2048-token context: anything longer came back as a server error and the search fell back to matching words instead of meaning, with nothing said to the person asking. Three days of ordinary questions on one installed machine hit this four times. That server is now started with room for its whole context, and an input longer than even that is shortened on token boundaries with a line in the log saying how much was dropped, instead of being refused. A single request also no longer carries more work than it can finish. The local wiki is indexed at every start by embedding its passages, and those went out thirty-two at a time under a thirty-second limit: on a laptop that was also loading the main model, one such request did not finish in time, the assistant stopped waiting for it, and the whole wiki index fell back to matching words for as long as that session ran — while the server kept working on the answer nobody was waiting for, so the first question a person asked queued behind it. Requests are now sized so they complete, and the assistant waits for the server to report itself ready before asking it anything, rather than sending the first requests while the model is still loading. One alarm is corrected in the same pass: the warning about repeatedly incoherent output counted zero flagged answers while raising the alarm, because the count was cleared before the message was written. It now states the count that fired it and the threshold that count passed, and says nothing at all when the count is below the threshold.  # r205: saying yes to an offered web search now runs that search. When a question needs live information the assistant cannot know from memory, it offers to look it up — and until now, agreeing to that offer did nothing. The question was never held anywhere, so the next turn arrived with nothing behind it and was treated as a brand-new sentence: one person's first three days produced three accepted offers and no searches, including one reply that said it did not know her location in answer to a sentence that named her town. A conversation now remembers the question a standing offer would answer, an acceptance runs that search with the question carried into it verbatim, a refusal says so plainly, and a change of subject clears the offer instead of searching the old question. Two forms of yes that people actually use are read correctly: a bare "please do", and a yes that restates the request and names the place. A question about when the sun will set is also no longer answered with this computer's clock: asking for a time of day was enough for the clock to claim the sentence, whatever it went on to ask, and the daylight wording only recognised sunset written as one word. Both are corrected, and asking the plain time still reads the clock as before.  # r202: a fact the user asks InterGen to forget also leaves the copy the running assistant holds in memory. Facts are embedded once and the vector is kept, keyed by the words the user stored, so the fact can be ranked against a question without paying to embed it again. Nothing emptied that cache on a forget: the stored rows went, the reply said they were forgotten, and the user's own words stayed in memory as a cache key — in every conversation, for as long as the assistant kept running, including conversations the user had already ended and could no longer reach. There was no path from the store to those caches at all, because a conversation's index and the store hold no reference to each other; a weak registry is that path, and a forget now clears the text of exactly the rows it removed from every live conversation. A fact the user did not name keeps its vector, and ending a conversation still keeps the whole cache, because facts outlive conversations and re-embedding them each time would be waste. Clearing all memories empties everything, because after it no stored fact remains. The candidate list, the cache key and a forget now spell a fact one way instead of three. The record of the forget says how many in-memory copies went with the stored rows. NOTHING ON DISK CHANGES: this removes a copy held in memory, the stored row is still hidden rather than overwritten, and whether a forgotten fact's bytes must leave the database file remains the separate question scheduled after this release. Scope: the shipped daemon uses one store. In an atypical process holding multiple stores, an identical cache entry from another store may also be evicted conservatively; that costs one re-embed and does not delete or restore the other store's row.  # r201: the installed-gate tier's stale predicates are re-keyed on shape rather than on text, with no verdict weakened. (1) The privilege-boundary gate decided who execs the setuid helper with the substring '"pkexec",' in the module source. That string is in BOTH shapes — the one where the daemon execs pkexec as its own child, which NoNewPrivileges kills, and the one the current dispatch shipped where a transient user unit execs it and the daemon's NoNewPrivileges does not reach it — so the gate went on reporting a defect that had been fixed. Measured 2026-08-24 against both modules at once: substring True on the R001.1 module (boundary really broken) and True on the tree module (fixed). The question is now parsed from the dispatch's argv by a reader in tests/installed/_shape_detectors.py, proved in both directions by the ordinary suite and mutation-checked. The gate's header no longer describes the old path. (2) The start-up embedding gate matched one exact source line; it passes today only because that line is gone and would pass equally if it had been reformatted with the shape intact. It now parses for a call whose first argument comprehends over the whole self._chunks, which a batched slice is not. (3) The restart-persistence gate accepted any of six markers appearing anywhere in the module, so an unrelated json.dump would have reported the index as cached; the region is now located by parsing the index-building functions and only writes inside them count. Verdicts on both modules are unchanged by (2) and (3) — captured — so nothing was weakened to go green.  # r200: a forget now soft-deletes matching active store rows, stops those rows being selected for recall, reports the count truthfully and records that the deletion is logical (`physical=false`). At this revision, already-cached session vectors still retained the fact text; r202 clears that in-memory remainder. The database row keeps its bytes by design, pending the separate physical-erasure contract.  # r199: the turn-record tests read a row by what it is, not by where it sits. The writer emits rows of its own around a turn — one when it opens the file, a marker when the file rolls, a synthesized ending when a turn stops without one — and each of those, when it landed, moved the position of every row a test had emitted. The last time it happened a corpus file reported twenty-nine failures where nineteen were real and the other ten were its own controls, which makes a broken measurement look like a worse defect. One helper now reads the record and selects from it by phase, event or turn, and eleven test files go through it; a selection that finds nothing says what the record does hold instead of raising an index error. Four cases were reading by position and are corrected; the rest were already filtering and are converted so the next edit cannot quietly drop the filter. A probe that makes the writer emit one extra row ships beside them, so the same question can be asked again the next time the writer learns to say something. Test files only: nothing shipped changes behaviour, and the release moves because test files are inside this package's content fingerprint.  # r198: the decision tracer redacts secret-shaped content from the same definition the turn record uses. The two writers were documented as being in lockstep on which values may never be written and were not: the turn record gained a predicate for secrets that arrive as content and the tracer kept only the older key-name check, so with content capture deliberately on the same value came out redacted from one and verbatim from the other. The shapes and the redaction that applies them are now public names in the module that owns them and the tracer imports them, so the lockstep is true by construction and a shape added in one place is caught in both. The tracer's posture is otherwise unchanged: content capture stays off unless it is explicitly enabled on a non-root process, a credential-shaped key name still replaces its whole value, and non-string values are untouched.  # r197: the turn record redacts a secret it finds inside CONTENT, not only one a caller labelled as a credential. Its redaction was a key-NAME predicate, so a secret arriving inside a prompt, a command line, a tool result or a file the person asked about was written to the record verbatim and kept for up to the full retention ceiling — measured on the shipped tree with an eight-case corpus, seven of which reached the file byte-identical. A second predicate now scans every string value for named secret formats — PEM private-key blocks, URLs carrying an inline password, crypt hashes, JSON web tokens, and vendor-prefixed API tokens — and replaces each match, and only that match, with a placeholder naming the shape, so the surrounding content survives and the reader can see what kind of thing was removed. No entropy heuristic: a threshold that fired on ordinary content would put unexplained holes in a full-fidelity record while still missing structured secrets. Both directions are proved against the corpus, including eight ordinary-content cases that must survive byte-identical. Redaction happens when the record is built and the oversized-row shortening happens when it is written, so a secret carried in a row too large to write is already a placeholder by the time any prefix of it is kept; that order is asserted, not assumed. One limit is stated and tested rather than assumed away: a secret with no distinguishing shape is still written.  # r196: the automatic launch path plans a requested llama.cpp GPU layer count from the resolved model and detected video memory instead of from the hardware tier; the tier still chooses the model and an explicit numeric layer setting still wins. When video memory and model size establish a full fit, the planner requests every layer. For a known non-fit and readable layer count, it requests a bounded estimate derived by dividing the model size uniformly across the reported layers; it requests zero when that estimate leaves room for no layer or when the model is known not to fit but its layer count is unreadable. If video memory or model size is unreadable, the implementation requests every layer so a failure is loud. Sizes are read from the package-shipped models manifest as JSON, with file-size fallback; this reader does not verify the manifest's detached signature, and an unreadable projector size currently contributes zero bytes. The 1088 MiB reserve exceeds one recorded 1063.25 MiB beyond-weight allocation for the shipped 9B load at context 16384, not a proved universal maximum. These values are launch requests: tests cover planner arithmetic, real model headers and a simulated matrix, while the server's startup banner remains the authority for actual offload and a post-change affected-card load was not proved here. The installed matrix now reaches the shipped LlamaManager predicate but does not exercise the production plan composer or a real GPU load.  # r195: one conversation per conversation. The router held a single conversation for every browser tab, the console and the desktop bus together — one history, one consent record, one ingress watermark, one set of pending offers, one turn index — so two tabs were one conversation as far as the model was concerned, a "yes" typed in one could accept an offer staged in another, and an approval granted "for this conversation" stayed in force for every conversation after it, including one started by a different person at the same machine. All of it moves onto a per-conversation object; every turn names the conversation it belongs to, and on the daemon, where one router serves the browser and the desktop bus, a turn that does not name one is refused with a logged reason rather than answered from someone else's history. The browser connection's transcript and the model's prompt are now one list, so the pane and the prompt cannot drift. Both dispatch paths read the ONE consent record: the second, per-connection record is gone rather than synchronised. "New session" and "switch session" end the conversation instead of only emptying the pane. Releases 192 to 194 belong to the turn-record lane composed ahead of this one; this is 195.  # r194: comment and docstring text only, no behaviour. Three passages still described the route deadline as living on another branch and as not exercised against its producer, which stopped being true when this branch was rebased onto the composed tree and the deadline began emitting its own terminal; they now describe what the code does. The warning glyphs those passages carried are replaced with words, because public source and tests stay plain text. The release moves because shipped files and test files are inside this package's content fingerprint, not because anything executes differently.  # r193: the thread-seam proof for the turn-terminal guarantee lands as its own test file, and test files are inside this package's content fingerprint, so the fingerprint recorded at r192 was taken before that file existed. WHY THIS BRANCH MOVES THE RELEASE TWICE, stated rather than left to be noticed: a bump is the mechanical consequence of content changing after a fingerprint is recorded, so a branch that changes shipped bytes, records, and then changes them again moves twice. Nothing about r192 was wrong; it predates the added proof. Both numbers are provisional in any event — other branches cut from this base also move intergen, so whoever integrates the set re-derives the numbering across it. The tool's re-baseline mode is deliberately not used: it exists for a change to the fingerprint DEFINITION and refuses a package whose content also changed under the old definition, which is this case exactly.  # r192: the always-on turn trace becomes usable as a record. Three defects, each measured on the shipped path before it was touched. A turn handed to a worker thread lost its identity: contextvars do not cross a thread, so every row the router, the tool executor, the frontier escalation and the three honesty regenerations wrote landed unattached and could not be joined to the turn that caused them — seven such handoffs, found by parsing the file rather than reading it, where a hand read found three. A turn could also begin and never say how it ended: only the three successful exits recorded a delivery, so a crash, a cancelled client, an early refusal or the routing deadline left a turn that started and stopped mid-record. Ending a turn is now guaranteed at the one place every interface passes through, exactly once, with a second attempt kept under its own name so a call site that ends a turn twice stays findable; the routing deadline says plainly that it timed out. The row sequence number, which exists to give a replay order for rows born in the same millisecond, restarted at zero on every start, so two runs numbered their rows identically and a reader ordering by it interleaved them into one wrong timeline; the counter now continues above what the file already holds, every row names the run that wrote it, and the resume is recorded rather than inferred. Retention was overstated by a whole file — five kept files were counted and the live one was not — and a single row larger than the rotation size defeated the ceiling entirely by rotating the file away and landing whole in the fresh one; the ceiling is now derived from the constants it describes and no row may exceed a fraction of the rotation size, with anything shortened saying how large it was and how much was kept. No interface changed; the release moves because shipped code and test files are inside this package's content fingerprint.  # r191: the first-run setup offer states each model tier's download size from the signed manifest (model bytes + multimodal projector bytes; model_choice.tier_download_sizes), fail-closed with no claim when no manifest is present; Tier 1 is 1.8 GB and Tier 2 6.1 GB, not the fixed '4-5 GB' the page carried. r190: test-only correction. Three cases in the write-file guard's test file asserted that a write under /usr/lib/ is CONFIRM-tier. The shipped code hard-blocks it and has since r179 added the system_binaries category to the signed never-list manifest, whose prefixes cover the executable and library trees. The code is the stricter side and is right; the expectations were written when /usr/lib/systemd/ was sensitive-but-not-never-listed and did not follow the manifest when it grew — the same drift that had already moved /etc/ssh/sshd_config out of the same list once before. The three expectations move to the BLOCKED contract; the CONFIRM coverage is preserved on /usr/share/ paths, which are in the guard's sensitive-prefix list and carry no never-list coverage, so they remain the honest CONFIRM case. Two cases are added: one stating the never-list prefixes as their own contract, and one proving a never-listed path is refused in root context as well. Both read the refusal TEXT rather than a false success flag, because the test runner is not root and a write to /usr/lib/ would fail on filesystem permissions regardless — verified by removing the policy and confirming the message changes. The case covering the unprivileged-write backstop moves to /usr/share/ and now asserts its path classifies CONFIRM first, because the hard block had begun firing ahead of the backstop it exists to test. No shipped code changed; the release moves because test files are inside this package's content fingerprint.  # r189: the privileged runner is started as a short-lived unit through the assistant's own systemd user manager instead of as a direct child of the daemon, and the request it carries no longer travels on a command line. The daemon's unit sets NoNewPrivileges=yes, which every child inherits and which cannot be cleared; under that flag the kernel ignores pkexec's setuid bit, so pkexec started unprivileged, saw its own effective uid was not root, and refused before PolicyKit was contacted — no install could perform any privileged action through the assistant. The user manager does not carry the flag, so a unit it starts reaches the runner. No hardening directive changed: the assistant's unit file is byte-identical, and the transient unit is deliberately plain because imposing the flag on it would reproduce the defect. The PolicyKit action is unchanged and still bound to the runner's exact path, so what a person authenticates against is the same narrow, purpose-built action. Second correction in the same change: the tool name, the arguments and the human-approval token were the runner's argv words 2, 3 and 4, and a command line is readable by any local account through /proc for the life of the process; they now travel in an owner-only file created 0600 with O_EXCL, removed as it is read and on every failure path, and no path is passed at all. The runner's argv narrows to one argument and that argument is an opaque identifier of thirty-two hex characters: the shim refuses any other shape before an interpreter sees it, and the root-side dispatcher takes --request-id and derives the directory itself from the uid PolicyKit reports, verifying that the directory is a real directory owned by that user at mode 0700, then that the file is a regular file, not a symlink, owned by the calling user, mode 0600, single-linked and within a 64 KiB bound before believing its contents, and removing the file it actually read rather than the name it was given. The unprivileged side never names a location the privileged side reads, so a traversal, an absolute path or a borrowed file is not something to defend against but something that cannot be expressed. The wait for the privileged unit is bounded at both ends and an outcome that is not known is reported in those words rather than as a failure, and the approval a person gives is spent when the action is taken rather than when it is asked for, so a refused dispatch no longer costs an authentication. Third: the package-management path no longer builds a second pkexec — by the time that command builder runs it is already root inside the privileged dispatcher, so the second crossing had no PolicyKit action of its own, carried no approval token, and ran from a scrubbed environment where it could not have raised a prompt anyone could answer. The failure diagnostic gains the two components the new path depends on, each measured before it is named. The path is structurally proved through the transient unit and live NoNewPrivileges probes. No privileged action was run end to end in this change; authenticated PolicyKit execution remained an attended proof leg. Diagnostic text also changes.  # r188: the privileged-dispatch diagnostic now reports a measured cause instead of a fixed sentence — the runner path is checked on the filesystem before anything is said about it, pkexec's own stderr is carried to the user instead of being replaced, and the exit code is stated; a refusal the runner itself reported still leads. Companion documentation fix in the same release: the in-tree copy of the user unit is replaced with the unit the recipe actually installs (it described an unhardened Type=simple service that has not shipped). No interface, no data, no model artefact changed.  # r187: test-only change to the gate r186 introduced. The startup-embedding gate's budget case asserted that a budget constant exists and that construction finishes inside a bound, but the corpus it embedded cost about the same either way, so bounded and unbounded construction were indistinguishable to it and the timing half proved nothing. An added case sets about 2.2 s of embedding work against a 0.3 s budget and asserts three things together: construction finished well inside the unbounded time, the index did not complete, and at least one request was still made, since the budget must never suppress the first request or a small wiki would never embed at all. No shipped code changed; the release moves because test files are inside this package's content fingerprint and the fingerprint recorded at r186 was taken before this case existed.  # r186: a web turn is acknowledged before routing and the wiki index is embedded in bounded requests. Three defects measured against the released build. (1) Nothing was sent to the browser between 'message received' and 'routing finished'. The browser arms a 30 s whole-turn failsafe on send and disarms it only on the first server frame, so whenever routing outlived that failsafe the browser hid the thinking indicator, told the user there had been no response and force-closed the socket, while the server was still working and the answer had nowhere to go. Observed in a live session: two turns recorded a turn-start event and nothing further, the socket dropped about thirty seconds later, and each session file held exactly one message. A turn_ack frame now goes out before any routing work begins, and the server holds itself to a routing deadline (20 s) declared next to the client's 30 s failsafe and asserted to be strictly shorter than it; a turn that passes the deadline ends with a truthful message instead of silence. Time spent waiting on a person at a consent card is not charged against that deadline. The deadline bounds what the user experiences, not the worker thread, which runs on and has its result discarded. (2) The same file's failsafe would fire while a consent card was on screen on the fast path, force-closing the socket and losing the decision; the client now disarms it for the card's lifetime and refuses to fire while one is pending. (3) The installed wiki was embedded by submitting all 2,116 passages in one request to a single-slot embedding server under a 30 s client timeout, so it timed out on every boot and left an abandoned batch occupying the slot as the web server began accepting turns, with no rebuild path, leaving keyword-only matching for the life of the daemon. The corpus now goes in 32-passage requests inside a bounded startup budget, partial progress is kept, and resume_embedding() can finish a degraded index later. Retrieval semantics are unchanged: the embedding matrix is published only when every passage is embedded, so a query is never scored against a half-present corpus. No caller drives the resume path yet; its natural site is outside this change. Proof boundary: the browser/deadline behavior was exercised through unit and integration harnesses with a router blocked on demand; no real browser was driven against a genuinely starved embedding server in this change.  # r185: the owner-only permission pass now stops at the tree boundary and covers the answer cache. Five ways it reached past its own scope, each found by an independent review and each reproduced before it was changed: the mode was read with lstat and written with a path-based chmod, which follows a symbolic link, so the inode measured and the inode changed could differ and a symbolic link's own 0777 mode written to a 0644 target GRANTED owner-execute — the mode is now read from and written to one descriptor opened O_PATH | O_NOFOLLOW, which the kernel refuses to follow; a per-user tree the user had relocated with a symbolic link was walked THROUGH, re-permissioning a directory outside the home while reporting the root as skipped — a symbolic-link root is now refused before anything is listed; storage mounted inside a tree was re-permissioned on the underlying filesystem, so the walk now stops at a mount point, found by device number and, for a bind mount of a directory on the same filesystem which keeps the same device number, by the kernel's mount table; a directory the walk could not READ had its contents omitted silently while the report said clean, so an unreadable directory and an owned root that is not a directory are now named as failures; and the directory helper tightened whatever path it was given, including the root-owned system log directory a privileged daemon keeps, so it now leaves anything outside the owned trees to the platform default. The pass also runs ONCE per home rather than at every start, recorded by a marker in the state directory that names the paths it changed: re-tightening at every start silently reversed a sharing decision the user is entitled to make on their own machine, and files the product writes are created owner-only and need no pass. Owned intermediate directories are created one at a time at the final mode, closing the create-then-tighten window that mkdir(parents=True) left open for everything above the last component. Finally the answer cache is the fourth owned tree: ~/.cache/intergen/last-answer.json holds the delivered answer AND the raw model output behind it, the same class of material as a session transcript, and it was reached by none of the three mechanisms — the create path, the migration's root list and the permission gate's tree list now all resolve it from one place. The provider-configuration panel creates its directory through the same helper, because on a fresh account it can be the first creator of ~/.config/intergen and a bare mkdir landed it 0755 beside the dispatch signing key and the web-auth token.  # r184: initial owner-only state pass. Fourteen listed create sites were routed through the 0700-directory/0600-file helpers and a startup migration was added. This revision did not cover the answer cache or provider-configuration directory, and its migration could follow a symlinked root or target, cross a mount, miss unreadable contents, repeat at every start, and create parent directories before tightening them. r185 is the boundary-corrected implementation; r184's broader claims that every site was covered, symlinks were safely skipped, the pass ran once, and permissions could never widen were false at this revision.  # r183: no behaviour change: comment, docstring and test-README wording across intergen/ and intergen/tests/ now uses plain engineering terms in place of project-internal shorthand. Text only; no code, no interface, no data, no model artefact.  # r182: test-fixture wording only: the system-information formatter test used the previous release's identity string as its example, which read as a statement of the current release and would go stale at every release. It now uses a deliberately synthetic value. No shipped code changed.  # r181: no intergen code changed. intergen's content fingerprint folds its own tree; a wording-alignment pass over the same two test READMEs the r180 note describes standardized the reviewer-role terms used there. Documentation text only; no code, no interface.  # r180: no intergen code changed. intergen's content fingerprint folds its own tree, and the documentation-truth pass reworded two test-corpus READMEs in it: tests/demand_corpus/README.md now states the M8-6 requirement as a dated decision rather than a role instruction, and tests/judge_calibration/README.md names the independent annotator as ground truth. Documentation text only; no code, no interface, no data.  # r179: destructive-policy-manifest.json gains the system_binaries never-list category (decided 2026-08-16) — prefix protection for /usr/bin, /usr/sbin, /usr/lib, /usr/lib64 and the FHS symlink spellings; re-signed with the release key; a shipped-manifest test pins the entries. The manifest pair ships in this package, so the archive bytes change with it.  # r178: destructive-policy-manifest.json description/notes text corrected to state installed-system protections truthfully (detached-signature verification + root ownership; dm-verity seals live/install media only) and re-signed with the release key; path lists and policy semantics unchanged. The manifest and its .asc ship in this package, so the archive bytes change with them.  # r177: no behaviour change: two test-fixture strings neutralized in the pre-release pass — a canned hostname answer in test_scenario_responsiveness.py generalized, and a docstring's internal ledger reference in test_m7_trust_priority.py reworded. Fixture/docstring text only; no code, no interface.  # r176: no behaviour change: one section comment in intergen/web_server.py reworded from 'seamless reads' to 'read-only actions' during the pre-release register pass. Comment text only; no code, no interface, no data.  # r175: every displayed model size is on ONE convention: decimal GB of the real payload bytes. Measured at r174 against the shipped manifest, one tier-3 file displayed three different sizes (catalog 20.5 - a binary reading, hardware table 21.0 - matching neither convention, status 22.0 decimal) - a 1.5 GB spread larger than the discrepancy r173 closed. The catalog and hardware-table constants move to the decimal values of the real byte counts (1.3 / 5.6 / 22.0), the tier-table docstring and the VRAM-rationale comments follow, and the offline-status test fixture now carries the real tier-3 byte count so its expectation states a size a shipped model actually has. Display-only: no gate or free-space check consumes these values (verified by review before the change).  # r174: the offline-status test's size expectation moves to the decimal-GB convention r173 adopted (the fixture's 20 GiB of bytes renders 21.5 decimal GB) — the r173 display change was landed with its own suite run still in flight and this pin correctly caught the unmoved expectation; the test's substance (integrity NOT checked offline, the start/logs guidance) is untouched.  # r173: second review-fold, all guard/test/display level, zero serving-behaviour change. (1) A new preflight test verifies EVERY in-tree artifact+signature pair (discovered by the sibling rule) against the tree's own pinned keyring via gpgv — the class it kills was measured on this very tree: the tier-2 pin swap changed models-manifest.json without a re-sign and the BAD pair survived branch gates, a composed landing, and one independent review, corrected only by a scheduled ceremony; the test proven RED against that exact historical pair and carries a tampered-artifact positive control. (2) The refusal escape-route pin gains an author-path case (the same probes through entry_to_sample, where the gate actually fires). (3) `intergen status` daemon-down branch now prints the model size in decimal GB matching the tier table — the binary GiB labelled GB showed the same file 0.4 GB smaller.  # r172: release-review findings folded, all string/comment/guard level, zero behaviour change. (1) The tier-2 size shown to users moves 5.5 to 5.6 GB, matching the shipped payload's real 5,629,108,608 bytes (both the docstring table and the catalog display value). (2) A new guard test pins the catalog-to-manifest lockstep in the direction that degrades QUIETLY: a manifest row missing for a catalog filename caps the tier down silently at provisioning, so the suite now fails loud on that pair; proven red by removing the tier-2 row and green on the shipped pair. (3) The port-bind failure text now states the schedule's real total (155.5s) instead of a constant it does not consume. (4) A protocol-doc example payload and a license-test comment move to the shipped tier-2 filename.  # r171: review findings from the pre-landing pass, folded before the build proves the tree. (1) The literal-marker refusal in the training-set emitter advertised an escape route its own gate refuses: it told an author a gold quoting tool-call syntax could ride in 'a prose gold about the format', but a prose gold's content becomes an assistant message — exactly the position the refusal fires on — so following the advice reproduced the refusal. Measured through the real gate: user turn PASSES, tool result PASSES, prose gold REFUSED. The message and docstring now name only the two carriers the gate accepts and state the prose-gold impossibility plainly. (2) A new test binds the advice to the gate's behaviour (each advertised carrier exercised through the real gate; the wording pinned) — it fails against the prior message, proven red-first 1/3. (3) Two comment direction errors in the watchdog cooldown work corrected: the exhaustion hold is ABOVE the cooldown wait, not below, in both the loop comment and the test module docstring. No behaviour change anywhere in this release.  # r170: the tier-2 model-manifest signature is refreshed over the r168 payload swap: models-manifest.json.asc re-signed as a detached OpenPGP signature and verified against the project primary key at delivery, so the shipped pin file and its signature verify as a pair again; the manifest bytes themselves are unchanged from the r168 swap.  # r169: the training-set emitter's docstrings state WHERE their rendering claim holds. Three of them asserted, without qualification, that tool-call arguments serialised as a JSON string render the function name with every argument dropped. That is true of DIRECT template application -- what this training pipeline does, applying internvl-tool-template.jinja itself over the emitted JSONL, where the template's `arguments is mapping` guard is false for a string -- and it is NOT true of the serving engine. Measured 2026-08-13 against llama.cpp b8796 serving that same template (sha256 7f0e529032c25183..., verified identical installed, in-tree, and in two running servers' memory): llama-server parses function.arguments as JSON before applying the template, so a JSON-object string and the mapping render byte-identically -- identical <tool_call> regions (sha256 78669ee3c16d9598...) and identical prompt_tokens (87 for both, against 66 for a call carrying no parameters, which is the control proving the measurement can move). The engine states the mechanism itself: an arguments string that is not valid JSON is refused with "Failed to parse tool call arguments as JSON", and a string that parses to a scalar or an array is accepted but renders no parameter blocks. The consequence recorded on these lines is that LLMRouter.continue_after_tool_call must NOT be changed to send a bare mapping: json.dumps is what the OpenAI wire format specifies for that field, and a mapping works only because this engine is lenient about it. render_tool_flow's "Mirrors LLMRouter.continue_after_tool_call" now reads "Mirrors what it RENDERS" and says why the two Python values differ while the rendered bytes do not. The corpus-side gate is unchanged and still required, because nothing in the training path does the parsing the engine does. Also: the literal-<tool_call> refusal message and its docstring now name the escape route for a gold that legitimately QUOTES tool-call syntax -- move that text out of assistant content, into a user turn, a tool result, or a prose gold, since assistant content is the only position the template turns into a rendered row of the model's own output. Docstrings and one refusal message only; no behaviour change.  # r168: six change sets composed into one release; each note follows in landing order. [a] four measurement-instrument items for round 2. (1) A coherent reply about the WRONG subject now fails Gate A. Asked about one service, answered confidently about another, such a reply satisfies every quality dimension a judge reads because it really is coherent; what it fails is structural, so the check is an assertion, not prompt text. no_wrong_target binds the answer to the subject the turn's dispatch acted on, deriving its targets from the turn's own tool arguments, so it carries no subject list and covers a service nobody has named before the day a cell dispatches against it; argument keys that carry a verb are excluded, and a command with no subject of its own produces no assertion at all. (2) An honest enumeration of data already in hand is no longer read as corruption. The one measured false positive of the fast-path synthesis screen was a real summary of a 979-package listing, whose many short items look to a repetition detector exactly like a token loop; the synthesis lanes hold the ground truth the model was asked to phrase, so an enumeration whose items trace back to that text is honest however long it runs, while items that appear nowhere in it stay rejected. Narrow by construction: only a repetition-shaped flag can be excused, only with source text in hand, only when the reply really enumerates, and never for a text-shape gate reason. (3) Short replies with no grammatical spine are named as corruption. A reply of at most eight words carrying no verb, no number, no identifier and no terminal punctuation is not a sentence — the word-bag class that every other instrument passed because each needs either length or structural damage. Shape only, never meaning, with a script guard that leaves non-Latin output to the flood check. (4) The fabrication screen now reads clauses, so a denial or an offer is not a claim. A bare present-progressive act claim is caught, but only when it opens its own clause and that clause is neither negated nor interrogative; the same clause scope makes the module's long-documented promise true for every alternation, including the passive one that fired on the honest denial its own docstring cites. Cross-review then returned five defects in these four items, all fixed on this branch before it landed and each reproduced against the reviewed tree first: a comma-joined clause now ends the fabrication screen's clause, so a denial can no longer amnesty a claim written beside it in the same sentence (the regression against the prior release); a shell dispatch's options consume their own arguments, so an option VALUE is no longer read as the subject and a correct answer is no longer graded as a correctness failure; naming a target is a prefix relation between whole words that must cover most of the name, so ordinary English no longer satisfies a three-character stem; an enumeration item must carry information and appear in the tool output as its own token before it can trace; and the short-reply script guard defers at the same ratio the flood check acts on, so a single non-Latin letter no longer switches the check off. [b] the per-path system-prompt modifiers stop colliding with the base prompt's own rule numbering, and four measurement-instrument items land with it. (1) Every modifier hardcoded its text as rule "4." while the base prompt had grown its own fourth rule (the fencing convention), so every assembled prompt served two rules numbered 4 and the conversational path served "4, 4, 5"; the collision lived only in the assembled string, which is why no code path and no test saw it. Modifier text now lives as rule bodies with no numbers, and the numbers are derived from the base prompt's own rule count, so adding a base rule renumbers every modifier instead of requiring six strings to be edited in step. Assembled bytes are otherwise unchanged and every path stays inside its char budget. (2) A coherent answer about the wrong subject now fails the grader's Gate A, so an answer that is fluent about something else can no longer score as correct. (3) An honest enumeration of data already in hand is no longer classified as corruption by the synthesis screen. (4) A short reply with no grammatical spine is named as corruption by the semantic health check. (5) The fabrication screen reads clauses, so a denial or an offer is not read as a claim. Decided 2026-08-13: the four instrument items land in-tree with the prompt fix; the serving process in front of the running measurement batteries is not restarted by this landing. [c] the training-set emitter writes tool calls in the ONE form the chat template renders. Measured 2026-08-13 by rendering the candidate shapes through the shipped template rather than reading its docstring: the template emits <parameter=...> blocks only under its own `arguments is mapping` guard, so the two shapes this emitter produced both rendered wrong. A dispatch gold was written as a JSON blob inside the assistant's CONTENT and rendered as literal text with no <function=> block at all -- while the template's own system block instructs, in the same rendered row, that a call must be an inner <function=></function> block; and a tool_flow history call serialised its arguments as a JSON STRING and rendered as the function name with every argument dropped. Both are now a structured call with mapping, key-sorted arguments -- the same shape for both turn kinds, which is what let one of them go unnoticed. render_gold returns a message rather than a string and is renamed render_gold_message; distribution_report tells a trained dispatch from a replayed history call by position (the history call is the one followed by the tool-role result) now that both carry the same shape. New fail-closed post-condition assert_renderable_tool_calls fires inside entry_to_sample, so every path that produces a sample is gated rather than relying on a caller to remember: it refuses literal <tool_call> text in content, non-mapping arguments, and an EMPTY arguments mapping -- empty matters as much as mapping, because an empty mapping is a mapping and still renders no parameters. Three negative controls prove the gate can fail and one positive control proves it accepts the real emission. The existing tool_flow test asserted the call's NAME and stopped, which is why the string-arguments defect survived; it now asserts the arguments too. [d] the model-server manager survives a child that will not die, and its two launch-related waits are sized from measurements instead of fixed constants. Measured 2026-08-13 on a laptop with a discrete NVIDIA card on the open-source driver: a failing health check led the watchdog to stop its own model server; the child was wedged in an uninterruptible kernel teardown reached through the GPU driver's file-close path; the post-SIGKILL `wait(timeout=5)` therefore raised subprocess.TimeoutExpired past a handler that catches only OSError, and the exception escaped stop() and restart(). The first restart attempt never reached a launch at all, and the failure it reported named a five-second timeout that exists nowhere in the launch path (the wall clock reconciles exactly: 5s reap wait + the 10s stderr-pump join the finally block runs on the way out). The remaining two attempts then refused the port — it was still unbindable 98 seconds after the kill, while the whole bind budget was 11.5 seconds — and the machine sat with no language model until a person restarted the service. Three corrections: stop() REPORTS a surviving child (naming its pid) instead of raising, and waits GPU_TEARDOWN_BUDGET_S=150s after the SIGKILL, a budget bracketed by measurement (0.25s on a quiet machine, at least 98s in the incident); the port-bind schedule is derived from that same budget rather than a hand-picked attempt count, and a free port still binds on the first probe with no delay; and the flat 60-second health wait becomes startup_budget_seconds() — the 60s floor plus 30s per gigabyte of model and projector — so a larger model cannot outgrow the launch budget silently (the 2B-with-projector pair measured 3.77-6.53s to load and now gets 114s; a 20 GB model gets about 11 minutes instead of one). Proven against reality on the box that produced the incident: a real GPU-loaded server was wedged with SIGSTOP, and the watchdog killed and REPLACED it with no person involved in 28.0s, after which the new server served a real chat completion; separately the extended port wait cleared a 40-second hold in 45.5s where the shipped schedule refused the identical hold after 11.5s. The terminal "watchdog giving up" in the incident came from an installed package built before the retry-after-exhaustion fix landed, and needed no further change here. [e] two watchdog defects in the monitor loop, both found while reviewing the serving-watchdog recovery work and outside its scope. (1) The post-restart cooldown was a bare 60-second sleep nothing could interrupt, while stop() sets the stop event and joins with a 5-second timeout — so a stop landing in that window blocked for the rest of the sleep, and at the shipped cooldown it outlasted the join entirely and returned while a thread the daemon believed stopped was still resident. Measured at the base tree with the cooldown patched to 1.5s: stop() took 1.45s; after the change the same case returns in under 0.5s and a 6-second cooldown leaves no live thread behind. The wait is now the same stop-event wait the exhaustion hold twenty lines above already used. (2) The give-up message rendered its retry interval as recovery_interval // 60 minutes, so any sub-minute interval announced "retrying every 0 minutes" — observed live at interval=1 in the red run. It now renders seconds, minutes, or both; the shipped 900-second default still reads "15 minutes", pinned by a test so the wording cannot regress into seconds. Red-first at the base tree: 5 failed / 2 passed, the two passes being deliberate controls including one proving the cooldown is a real wait and not a no-op. Serving behavior is otherwise unchanged: the restart budget, the cooldown duration, the exhaustion hold and the recovery retry are all as they were. [f] tier 2 ships the fine-tuned round-3 build of Qwen3.5-9B. The build passed the ruled acceptance bar — three fine-tuned runs against three baseline runs, the gain above the instrument's measured same-day noise, ten request families moving from never-passing to always-passing with the run spread tightening 8 to 2 — where the same round's 2B and 35B fine-tunes measured no effect and are not shipped. models-manifest.json and the in-code catalog swap the tier-2 filename and pin together (the overlay is filename-keyed, so they move in lockstep or the fail-closed pin contract locks the tier out); the vision projector is unchanged. Mirror-hosted under the new filename; the vendor never serves it, so a mirror miss fails loud rather than fetching different bytes. Two tests that read the box's installed pins manifest are made hermetic with catalog-derived pins. Decided 2026-08-14. Chain clause recorded at this composed landing: r162's byte-identity claim - that the assembled training sets reproduce byte-for-byte - ends at r168, because the tool-call serialisation fix changes the emitted bytes by design while the position-based counts reproduce unchanged (517; 257/308/115); training sets assembled and models trained before r168 rode the prior serialisation.  # r167: a judge call that fails in transport escalates the turn instead of destroying the run — the transport twin of the r-landed unparseable-reply contract. Measured 2026-08-12: one judge prompt (16,157 tokens against the judge server's 8,192 context) drew HTTP 400, the raised HTTPError passed straight through apply_judge_grading, and a completed 204-conversation baseline died in its final grading phase — three consecutive firings, the cause invisible until an instrumented run captured the runner's exit code and traceback. judge_turn now retries a transport-failed call once (a transient fault usually clears) and a second failure folds a 'flag' verdict naming the failure — the turn lands in the human-read escalation subset, Layer-1 deterministic verdicts still fold, and the floor cannot end below 'flag' for an unjudged turn. Grade-neutral for every run that previously completed: only calls that raised (and killed the run) grade differently, and only toward escalation.  # r166: the deny-recovery cells' refusal-acknowledgment vocabulary is broadened to the register the gold corpus actually teaches, and the two cells now share one constant (DENY_RECOVERY_VOCAB in intergen/tests/conversations.py) so they cannot drift apart. The old 13-phrase contains_any list accepted only 6 of the corpus's own 34 deny-recovery gold replies — the eval demanded literal substrings ("need approval", "not able") that the gold's natural phrasing ("needs your approval", "wasn't able") never contains, so a reply matching the trained register graded as evasive. Measured before landing: gold acceptance 6/34 -> 34/34; against sealed eval replies, 9 of 10 previously-reddened denial recoveries now pass while the one genuinely evasive reply (a denial misreported as a lookup result) still fails — the broadened check still discriminates. Every added phrase is a denial acknowledgment on its own; the trace-backed gate_action=deny assertion remains the hard falsifier for fabricated success. Decided 2026-08-12: the assertion vocabulary moves rather than the gold — a check that fails 28 of 34 of its own gold answers measures the wrong thing — and the affected cell family re-baselines on the next baseline run rather than comparing across instruments.  # r165: risk classification for a mixed-capability tool is per ACTION end to end, and a review prompt now states the class it is actually asking about. Three measured defects, one observed live: a manage_services call with action "list" — a read — raised the approval modal, and the modal said the request changes the system. (1) The schema declared an action enum and nothing enforced it, so a value the tool does not define passed validation, matched neither the read-only nor the state-changing action list, and took the unrecognised-action default of CONFIRM; on a tool that escalates via pkexec that default is the privileged tier, so a read reached an administrator-approval prompt for `systemctl list`, a verb systemd refuses outright. BaseTool.validate_arguments now enforces every declared enum, before the dispatcher gate and before anything executes — an undefined value is an input error reported with the accepted values, not a risk put to a person. (2) manage_services gains ACTION_ALIASES (list -> list-units, and two siblings), canonicalised ahead of classification so a colloquial spelling of a read classifies and runs as that read; manage_packages already accepted "list", so the two tools had disagreed on the most basic query. The enum is now derived from AUTO_ACTIONS | CONFIRM_ACTIONS | ACTION_ALIASES, so an accepted value is a declared value. (3) The consent surfaces could not name the class at all: DispatchDecision carried no risk tier, so the zenity header was the fixed string "a system action you did not directly request" and the branded dialog's risk copy was keyed on provenance alone, asserting "It still changes your system" for reads. DispatchDecision now carries risk_tier, the dialog protocol carries it to the renderer, and origin and effect are separate sentences derived from the decision. Decided 2026-08-12: unrecognised must stay fail-closed but must not be described as understood — an unclassified tier keeps the severe wording everywhere, so a missing classification can never be what softens a prompt. State-changing actions are untouched: they still classify privileged and still always prompt.  # r164: the round-2 training bank lands in-tree beside the round-1 bank. Three lanes, each aimed at a defect the honest rounds 3-4 measured (2026-08-12): class 7 honesty contrastives (41 entries - read-only state reports, completed-action claims, and admitted failures in same-subject pairs, the counter-signal to the two regressed honesty cells), class 8 assembled multi-turn context (16 conversations of 4-6 turns - 100% of round-1's grade movement was single-turn and the multi-turn eval slice scored zero PASS in both honest rounds), class 9 long tool-output synthesis (11 entries - journal, package-history, unit-listing, boot-blame, and search outputs answered in a few faithful lines). Combined 585-entry training input emitted fail-closed and boundary-proven through all three model tiers' tokenizers; deduplicated under the qualified rule decided 2026-08-11 (0 qualified drops; all 54 over-0.85 pairs are opposite-intent or different-structure spares).# r207: the assistant now recognises the way people actually ask it to look something up. Asking it to search the internet only worked if the words came out in one particular order: "search the web for a chair" was understood, and "web search for a chair", "do a web search for a chair" and "can you websearch for a chair" were not, even though they ask for exactly the same thing. Those other orders were not written into the patterns the assistant matches, and the meaning-based layer behind those patterns could not rescue them either: measured on a released machine, a real request reached only 0.41 to 0.46 on the scale that layer uses while the bar was set at 0.90, so that layer never once fired on real language. It also ranked badly — on several plain requests to search the web, the package manager's own "search for a package" examples scored higher than the web search examples did, so simply lowering the bar would have started sending people to the wrong place faster. The word orders are now recognised directly, and the list of examples the meaning-based layer compares against has been rewritten: it used to contain only commands ("search the web for", "google this"), while people mostly ask questions whose answer can only be found by looking — what something is worth, whether a free pattern or recipe exists, what a thing looks like. With those examples present the requests separate cleanly from the questions the assistant should simply answer itself, so the bar could be moved from 0.90 to 0.68 on measurement rather than on guesswork: the highest score any non-request reaches is 0.57, which leaves real distance on both sides. Asking to be shown a picture of something, and asking it to find a recipe, a pattern or instructions, are recognised directly as well. Two more things are fixed in the same pass: "how do I update this system" now reaches the package manager instead of being outranked by an example about editing a configuration file, and an answer of "yes" in front of a full request ("yes, do a web search for …") no longer throws the request away, while a bare "yes" on its own still starts nothing. The list of examples was widened once more after a check against sentences it had never seen: with the first draft, "what is my grandmother's ring worth" was not recognised while the recorded sentence was, which means it had learned a wording rather than a meaning. Across nineteen sentences recorded from a first-time user's own sessions, the assistant went from serving eight to serving all nineteen, with every sentence that should NOT start a tool still starting nothing.
# r206: an ordinary question no longer loses the local wiki lookup behind it. The assistant turns a question into numbers before it searches the wiki, and the small server that does that was started able to handle only 512 tokens at a time while being handed inputs of up to its full 2048-token context: anything longer came back as a server error and the search fell back to matching words instead of meaning, with nothing said to the person asking. Three days of ordinary questions on one installed machine hit this four times. That server is now started with room for its whole context, and an input longer than even that is shortened on token boundaries with a line in the log saying how much was dropped, instead of being refused. A single request also no longer carries more work than it can finish. The local wiki is indexed at every start by embedding its passages, and those went out thirty-two at a time under a thirty-second limit: on a laptop that was also loading the main model, one such request did not finish in time, the assistant stopped waiting for it, and the whole wiki index fell back to matching words for as long as that session ran — while the server kept working on the answer nobody was waiting for, so the first question a person asked queued behind it. Requests are now sized so they complete, and the assistant waits for the server to report itself ready before asking it anything, rather than sending the first requests while the model is still loading. One alarm is corrected in the same pass: the warning about repeatedly incoherent output counted zero flagged answers while raising the alarm, because the count was cleared before the message was written. It now states the count that fired it and the threshold that count passed, and says nothing at all when the count is below the threshold.  # r205: saying yes to an offered web search now runs that search. When a question needs live information the assistant cannot know from memory, it offers to look it up — and until now, agreeing to that offer did nothing. The question was never held anywhere, so the next turn arrived with nothing behind it and was treated as a brand-new sentence: one person's first three days produced three accepted offers and no searches, including one reply that said it did not know her location in answer to a sentence that named her town. A conversation now remembers the question a standing offer would answer, an acceptance runs that search with the question carried into it verbatim, a refusal says so plainly, and a change of subject clears the offer instead of searching the old question. Two forms of yes that people actually use are read correctly: a bare "please do", and a yes that restates the request and names the place. A question about when the sun will set is also no longer answered with this computer's clock: asking for a time of day was enough for the clock to claim the sentence, whatever it went on to ask, and the daylight wording only recognised sunset written as one word. Both are corrected, and asking the plain time still reads the clock as before.  # r202: a fact the user asks InterGen to forget also leaves the copy the running assistant holds in memory. Facts are embedded once and the vector is kept, keyed by the words the user stored, so the fact can be ranked against a question without paying to embed it again. Nothing emptied that cache on a forget: the stored rows went, the reply said they were forgotten, and the user's own words stayed in memory as a cache key — in every conversation, for as long as the assistant kept running, including conversations the user had already ended and could no longer reach. There was no path from the store to those caches at all, because a conversation's index and the store hold no reference to each other; a weak registry is that path, and a forget now clears the text of exactly the rows it removed from every live conversation. A fact the user did not name keeps its vector, and ending a conversation still keeps the whole cache, because facts outlive conversations and re-embedding them each time would be waste. Clearing all memories empties everything, because after it no stored fact remains. The candidate list, the cache key and a forget now spell a fact one way instead of three. The record of the forget says how many in-memory copies went with the stored rows. NOTHING ON DISK CHANGES: this removes a copy held in memory, the stored row is still hidden rather than overwritten, and whether a forgotten fact's bytes must leave the database file remains the separate question scheduled after this release. Scope: the shipped daemon uses one store. In an atypical process holding multiple stores, an identical cache entry from another store may also be evicted conservatively; that costs one re-embed and does not delete or restore the other store's row.  # r201: the installed-gate tier's stale predicates are re-keyed on shape rather than on text, with no verdict weakened. (1) The privilege-boundary gate decided who execs the setuid helper with the substring '"pkexec",' in the module source. That string is in BOTH shapes — the one where the daemon execs pkexec as its own child, which NoNewPrivileges kills, and the one the current dispatch shipped where a transient user unit execs it and the daemon's NoNewPrivileges does not reach it — so the gate went on reporting a defect that had been fixed. Measured 2026-08-24 against both modules at once: substring True on the R001.1 module (boundary really broken) and True on the tree module (fixed). The question is now parsed from the dispatch's argv by a reader in tests/installed/_shape_detectors.py, proved in both directions by the ordinary suite and mutation-checked. The gate's header no longer describes the old path. (2) The start-up embedding gate matched one exact source line; it passes today only because that line is gone and would pass equally if it had been reformatted with the shape intact. It now parses for a call whose first argument comprehends over the whole self._chunks, which a batched slice is not. (3) The restart-persistence gate accepted any of six markers appearing anywhere in the module, so an unrelated json.dump would have reported the index as cached; the region is now located by parsing the index-building functions and only writes inside them count. Verdicts on both modules are unchanged by (2) and (3) — captured — so nothing was weakened to go green.  # r200: a forget now soft-deletes matching active store rows, stops those rows being selected for recall, reports the count truthfully and records that the deletion is logical (`physical=false`). At this revision, already-cached session vectors still retained the fact text; r202 clears that in-memory remainder. The database row keeps its bytes by design, pending the separate physical-erasure contract.  # r199: the turn-record tests read a row by what it is, not by where it sits. The writer emits rows of its own around a turn — one when it opens the file, a marker when the file rolls, a synthesized ending when a turn stops without one — and each of those, when it landed, moved the position of every row a test had emitted. The last time it happened a corpus file reported twenty-nine failures where nineteen were real and the other ten were its own controls, which makes a broken measurement look like a worse defect. One helper now reads the record and selects from it by phase, event or turn, and eleven test files go through it; a selection that finds nothing says what the record does hold instead of raising an index error. Four cases were reading by position and are corrected; the rest were already filtering and are converted so the next edit cannot quietly drop the filter. A probe that makes the writer emit one extra row ships beside them, so the same question can be asked again the next time the writer learns to say something. Test files only: nothing shipped changes behaviour, and the release moves because test files are inside this package's content fingerprint.  # r198: the decision tracer redacts secret-shaped content from the same definition the turn record uses. The two writers were documented as being in lockstep on which values may never be written and were not: the turn record gained a predicate for secrets that arrive as content and the tracer kept only the older key-name check, so with content capture deliberately on the same value came out redacted from one and verbatim from the other. The shapes and the redaction that applies them are now public names in the module that owns them and the tracer imports them, so the lockstep is true by construction and a shape added in one place is caught in both. The tracer's posture is otherwise unchanged: content capture stays off unless it is explicitly enabled on a non-root process, a credential-shaped key name still replaces its whole value, and non-string values are untouched.  # r197: the turn record redacts a secret it finds inside CONTENT, not only one a caller labelled as a credential. Its redaction was a key-NAME predicate, so a secret arriving inside a prompt, a command line, a tool result or a file the person asked about was written to the record verbatim and kept for up to the full retention ceiling — measured on the shipped tree with an eight-case corpus, seven of which reached the file byte-identical. A second predicate now scans every string value for named secret formats — PEM private-key blocks, URLs carrying an inline password, crypt hashes, JSON web tokens, and vendor-prefixed API tokens — and replaces each match, and only that match, with a placeholder naming the shape, so the surrounding content survives and the reader can see what kind of thing was removed. No entropy heuristic: a threshold that fired on ordinary content would put unexplained holes in a full-fidelity record while still missing structured secrets. Both directions are proved against the corpus, including eight ordinary-content cases that must survive byte-identical. Redaction happens when the record is built and the oversized-row shortening happens when it is written, so a secret carried in a row too large to write is already a placeholder by the time any prefix of it is kept; that order is asserted, not assumed. One limit is stated and tested rather than assumed away: a secret with no distinguishing shape is still written.  # r196: the automatic launch path plans a requested llama.cpp GPU layer count from the resolved model and detected video memory instead of from the hardware tier; the tier still chooses the model and an explicit numeric layer setting still wins. When video memory and model size establish a full fit, the planner requests every layer. For a known non-fit and readable layer count, it requests a bounded estimate derived by dividing the model size uniformly across the reported layers; it requests zero when that estimate leaves room for no layer or when the model is known not to fit but its layer count is unreadable. If video memory or model size is unreadable, the implementation requests every layer so a failure is loud. Sizes are read from the package-shipped models manifest as JSON, with file-size fallback; this reader does not verify the manifest's detached signature, and an unreadable projector size currently contributes zero bytes. The 1088 MiB reserve exceeds one recorded 1063.25 MiB beyond-weight allocation for the shipped 9B load at context 16384, not a proved universal maximum. These values are launch requests: tests cover planner arithmetic, real model headers and a simulated matrix, while the server's startup banner remains the authority for actual offload and a post-change affected-card load was not proved here. The installed matrix now reaches the shipped LlamaManager predicate but does not exercise the production plan composer or a real GPU load.  # r195: one conversation per conversation. The router held a single conversation for every browser tab, the console and the desktop bus together — one history, one consent record, one ingress watermark, one set of pending offers, one turn index — so two tabs were one conversation as far as the model was concerned, a "yes" typed in one could accept an offer staged in another, and an approval granted "for this conversation" stayed in force for every conversation after it, including one started by a different person at the same machine. All of it moves onto a per-conversation object; every turn names the conversation it belongs to, and on the daemon, where one router serves the browser and the desktop bus, a turn that does not name one is refused with a logged reason rather than answered from someone else's history. The browser connection's transcript and the model's prompt are now one list, so the pane and the prompt cannot drift. Both dispatch paths read the ONE consent record: the second, per-connection record is gone rather than synchronised. "New session" and "switch session" end the conversation instead of only emptying the pane. Releases 192 to 194 belong to the turn-record lane composed ahead of this one; this is 195.  # r194: comment and docstring text only, no behaviour. Three passages still described the route deadline as living on another branch and as not exercised against its producer, which stopped being true when this branch was rebased onto the composed tree and the deadline began emitting its own terminal; they now describe what the code does. The warning glyphs those passages carried are replaced with words, because public source and tests stay plain text. The release moves because shipped files and test files are inside this package's content fingerprint, not because anything executes differently.  # r193: the thread-seam proof for the turn-terminal guarantee lands as its own test file, and test files are inside this package's content fingerprint, so the fingerprint recorded at r192 was taken before that file existed. WHY THIS BRANCH MOVES THE RELEASE TWICE, stated rather than left to be noticed: a bump is the mechanical consequence of content changing after a fingerprint is recorded, so a branch that changes shipped bytes, records, and then changes them again moves twice. Nothing about r192 was wrong; it predates the added proof. Both numbers are provisional in any event — other branches cut from this base also move intergen, so whoever integrates the set re-derives the numbering across it. The tool's re-baseline mode is deliberately not used: it exists for a change to the fingerprint DEFINITION and refuses a package whose content also changed under the old definition, which is this case exactly.  # r192: the always-on turn trace becomes usable as a record. Three defects, each measured on the shipped path before it was touched. A turn handed to a worker thread lost its identity: contextvars do not cross a thread, so every row the router, the tool executor, the frontier escalation and the three honesty regenerations wrote landed unattached and could not be joined to the turn that caused them — seven such handoffs, found by parsing the file rather than reading it, where a hand read found three. A turn could also begin and never say how it ended: only the three successful exits recorded a delivery, so a crash, a cancelled client, an early refusal or the routing deadline left a turn that started and stopped mid-record. Ending a turn is now guaranteed at the one place every interface passes through, exactly once, with a second attempt kept under its own name so a call site that ends a turn twice stays findable; the routing deadline says plainly that it timed out. The row sequence number, which exists to give a replay order for rows born in the same millisecond, restarted at zero on every start, so two runs numbered their rows identically and a reader ordering by it interleaved them into one wrong timeline; the counter now continues above what the file already holds, every row names the run that wrote it, and the resume is recorded rather than inferred. Retention was overstated by a whole file — five kept files were counted and the live one was not — and a single row larger than the rotation size defeated the ceiling entirely by rotating the file away and landing whole in the fresh one; the ceiling is now derived from the constants it describes and no row may exceed a fraction of the rotation size, with anything shortened saying how large it was and how much was kept. No interface changed; the release moves because shipped code and test files are inside this package's content fingerprint.  # r191: the first-run setup offer states each model tier's download size from the signed manifest (model bytes + multimodal projector bytes; model_choice.tier_download_sizes), fail-closed with no claim when no manifest is present; Tier 1 is 1.8 GB and Tier 2 6.1 GB, not the fixed '4-5 GB' the page carried. r190: test-only correction. Three cases in the write-file guard's test file asserted that a write under /usr/lib/ is CONFIRM-tier. The shipped code hard-blocks it and has since r179 added the system_binaries category to the signed never-list manifest, whose prefixes cover the executable and library trees. The code is the stricter side and is right; the expectations were written when /usr/lib/systemd/ was sensitive-but-not-never-listed and did not follow the manifest when it grew — the same drift that had already moved /etc/ssh/sshd_config out of the same list once before. The three expectations move to the BLOCKED contract; the CONFIRM coverage is preserved on /usr/share/ paths, which are in the guard's sensitive-prefix list and carry no never-list coverage, so they remain the honest CONFIRM case. Two cases are added: one stating the never-list prefixes as their own contract, and one proving a never-listed path is refused in root context as well. Both read the refusal TEXT rather than a false success flag, because the test runner is not root and a write to /usr/lib/ would fail on filesystem permissions regardless — verified by removing the policy and confirming the message changes. The case covering the unprivileged-write backstop moves to /usr/share/ and now asserts its path classifies CONFIRM first, because the hard block had begun firing ahead of the backstop it exists to test. No shipped code changed; the release moves because test files are inside this package's content fingerprint.  # r189: the privileged runner is started as a short-lived unit through the assistant's own systemd user manager instead of as a direct child of the daemon, and the request it carries no longer travels on a command line. The daemon's unit sets NoNewPrivileges=yes, which every child inherits and which cannot be cleared; under that flag the kernel ignores pkexec's setuid bit, so pkexec started unprivileged, saw its own effective uid was not root, and refused before PolicyKit was contacted — no install could perform any privileged action through the assistant. The user manager does not carry the flag, so a unit it starts reaches the runner. No hardening directive changed: the assistant's unit file is byte-identical, and the transient unit is deliberately plain because imposing the flag on it would reproduce the defect. The PolicyKit action is unchanged and still bound to the runner's exact path, so what a person authenticates against is the same narrow, purpose-built action. Second correction in the same change: the tool name, the arguments and the human-approval token were the runner's argv words 2, 3 and 4, and a command line is readable by any local account through /proc for the life of the process; they now travel in an owner-only file created 0600 with O_EXCL, removed as it is read and on every failure path, and no path is passed at all. The runner's argv narrows to one argument and that argument is an opaque identifier of thirty-two hex characters: the shim refuses any other shape before an interpreter sees it, and the root-side dispatcher takes --request-id and derives the directory itself from the uid PolicyKit reports, verifying that the directory is a real directory owned by that user at mode 0700, then that the file is a regular file, not a symlink, owned by the calling user, mode 0600, single-linked and within a 64 KiB bound before believing its contents, and removing the file it actually read rather than the name it was given. The unprivileged side never names a location the privileged side reads, so a traversal, an absolute path or a borrowed file is not something to defend against but something that cannot be expressed. The wait for the privileged unit is bounded at both ends and an outcome that is not known is reported in those words rather than as a failure, and the approval a person gives is spent when the action is taken rather than when it is asked for, so a refused dispatch no longer costs an authentication. Third: the package-management path no longer builds a second pkexec — by the time that command builder runs it is already root inside the privileged dispatcher, so the second crossing had no PolicyKit action of its own, carried no approval token, and ran from a scrubbed environment where it could not have raised a prompt anyone could answer. The failure diagnostic gains the two components the new path depends on, each measured before it is named. The path is structurally proved through the transient unit and live NoNewPrivileges probes. No privileged action was run end to end in this change; authenticated PolicyKit execution remained an attended proof leg. Diagnostic text also changes.  # r188: the privileged-dispatch diagnostic now reports a measured cause instead of a fixed sentence — the runner path is checked on the filesystem before anything is said about it, pkexec's own stderr is carried to the user instead of being replaced, and the exit code is stated; a refusal the runner itself reported still leads. Companion documentation fix in the same release: the in-tree copy of the user unit is replaced with the unit the recipe actually installs (it described an unhardened Type=simple service that has not shipped). No interface, no data, no model artefact changed.  # r187: test-only change to the gate r186 introduced. The startup-embedding gate's budget case asserted that a budget constant exists and that construction finishes inside a bound, but the corpus it embedded cost about the same either way, so bounded and unbounded construction were indistinguishable to it and the timing half proved nothing. An added case sets about 2.2 s of embedding work against a 0.3 s budget and asserts three things together: construction finished well inside the unbounded time, the index did not complete, and at least one request was still made, since the budget must never suppress the first request or a small wiki would never embed at all. No shipped code changed; the release moves because test files are inside this package's content fingerprint and the fingerprint recorded at r186 was taken before this case existed.  # r186: a web turn is acknowledged before routing and the wiki index is embedded in bounded requests. Three defects measured against the released build. (1) Nothing was sent to the browser between 'message received' and 'routing finished'. The browser arms a 30 s whole-turn failsafe on send and disarms it only on the first server frame, so whenever routing outlived that failsafe the browser hid the thinking indicator, told the user there had been no response and force-closed the socket, while the server was still working and the answer had nowhere to go. Observed in a live session: two turns recorded a turn-start event and nothing further, the socket dropped about thirty seconds later, and each session file held exactly one message. A turn_ack frame now goes out before any routing work begins, and the server holds itself to a routing deadline (20 s) declared next to the client's 30 s failsafe and asserted to be strictly shorter than it; a turn that passes the deadline ends with a truthful message instead of silence. Time spent waiting on a person at a consent card is not charged against that deadline. The deadline bounds what the user experiences, not the worker thread, which runs on and has its result discarded. (2) The same file's failsafe would fire while a consent card was on screen on the fast path, force-closing the socket and losing the decision; the client now disarms it for the card's lifetime and refuses to fire while one is pending. (3) The installed wiki was embedded by submitting all 2,116 passages in one request to a single-slot embedding server under a 30 s client timeout, so it timed out on every boot and left an abandoned batch occupying the slot as the web server began accepting turns, with no rebuild path, leaving keyword-only matching for the life of the daemon. The corpus now goes in 32-passage requests inside a bounded startup budget, partial progress is kept, and resume_embedding() can finish a degraded index later. Retrieval semantics are unchanged: the embedding matrix is published only when every passage is embedded, so a query is never scored against a half-present corpus. No caller drives the resume path yet; its natural site is outside this change. Proof boundary: the browser/deadline behavior was exercised through unit and integration harnesses with a router blocked on demand; no real browser was driven against a genuinely starved embedding server in this change.  # r185: the owner-only permission pass now stops at the tree boundary and covers the answer cache. Five ways it reached past its own scope, each found by an independent review and each reproduced before it was changed: the mode was read with lstat and written with a path-based chmod, which follows a symbolic link, so the inode measured and the inode changed could differ and a symbolic link's own 0777 mode written to a 0644 target GRANTED owner-execute — the mode is now read from and written to one descriptor opened O_PATH | O_NOFOLLOW, which the kernel refuses to follow; a per-user tree the user had relocated with a symbolic link was walked THROUGH, re-permissioning a directory outside the home while reporting the root as skipped — a symbolic-link root is now refused before anything is listed; storage mounted inside a tree was re-permissioned on the underlying filesystem, so the walk now stops at a mount point, found by device number and, for a bind mount of a directory on the same filesystem which keeps the same device number, by the kernel's mount table; a directory the walk could not READ had its contents omitted silently while the report said clean, so an unreadable directory and an owned root that is not a directory are now named as failures; and the directory helper tightened whatever path it was given, including the root-owned system log directory a privileged daemon keeps, so it now leaves anything outside the owned trees to the platform default. The pass also runs ONCE per home rather than at every start, recorded by a marker in the state directory that names the paths it changed: re-tightening at every start silently reversed a sharing decision the user is entitled to make on their own machine, and files the product writes are created owner-only and need no pass. Owned intermediate directories are created one at a time at the final mode, closing the create-then-tighten window that mkdir(parents=True) left open for everything above the last component. Finally the answer cache is the fourth owned tree: ~/.cache/intergen/last-answer.json holds the delivered answer AND the raw model output behind it, the same class of material as a session transcript, and it was reached by none of the three mechanisms — the create path, the migration's root list and the permission gate's tree list now all resolve it from one place. The provider-configuration panel creates its directory through the same helper, because on a fresh account it can be the first creator of ~/.config/intergen and a bare mkdir landed it 0755 beside the dispatch signing key and the web-auth token.  # r184: initial owner-only state pass. Fourteen listed create sites were routed through the 0700-directory/0600-file helpers and a startup migration was added. This revision did not cover the answer cache or provider-configuration directory, and its migration could follow a symlinked root or target, cross a mount, miss unreadable contents, repeat at every start, and create parent directories before tightening them. r185 is the boundary-corrected implementation; r184's broader claims that every site was covered, symlinks were safely skipped, the pass ran once, and permissions could never widen were false at this revision.  # r183: no behaviour change: comment, docstring and test-README wording across intergen/ and intergen/tests/ now uses plain engineering terms in place of project-internal shorthand. Text only; no code, no interface, no data, no model artefact.  # r182: test-fixture wording only: the system-information formatter test used the previous release's identity string as its example, which read as a statement of the current release and would go stale at every release. It now uses a deliberately synthetic value. No shipped code changed.  # r181: no intergen code changed. intergen's content fingerprint folds its own tree; a wording-alignment pass over the same two test READMEs the r180 note describes standardized the reviewer-role terms used there. Documentation text only; no code, no interface.  # r180: no intergen code changed. intergen's content fingerprint folds its own tree, and the documentation-truth pass reworded two test-corpus READMEs in it: tests/demand_corpus/README.md now states the M8-6 requirement as a dated decision rather than a role instruction, and tests/judge_calibration/README.md names the independent annotator as ground truth. Documentation text only; no code, no interface, no data.  # r179: destructive-policy-manifest.json gains the system_binaries never-list category (decided 2026-08-16) — prefix protection for /usr/bin, /usr/sbin, /usr/lib, /usr/lib64 and the FHS symlink spellings; re-signed with the release key; a shipped-manifest test pins the entries. The manifest pair ships in this package, so the archive bytes change with it.  # r178: destructive-policy-manifest.json description/notes text corrected to state installed-system protections truthfully (detached-signature verification + root ownership; dm-verity seals live/install media only) and re-signed with the release key; path lists and policy semantics unchanged. The manifest and its .asc ship in this package, so the archive bytes change with them.  # r177: no behaviour change: two test-fixture strings neutralized in the pre-release pass — a canned hostname answer in test_scenario_responsiveness.py generalized, and a docstring's internal ledger reference in test_m7_trust_priority.py reworded. Fixture/docstring text only; no code, no interface.  # r176: no behaviour change: one section comment in intergen/web_server.py reworded from 'seamless reads' to 'read-only actions' during the pre-release register pass. Comment text only; no code, no interface, no data.  # r175: every displayed model size is on ONE convention: decimal GB of the real payload bytes. Measured at r174 against the shipped manifest, one tier-3 file displayed three different sizes (catalog 20.5 - a binary reading, hardware table 21.0 - matching neither convention, status 22.0 decimal) - a 1.5 GB spread larger than the discrepancy r173 closed. The catalog and hardware-table constants move to the decimal values of the real byte counts (1.3 / 5.6 / 22.0), the tier-table docstring and the VRAM-rationale comments follow, and the offline-status test fixture now carries the real tier-3 byte count so its expectation states a size a shipped model actually has. Display-only: no gate or free-space check consumes these values (verified by review before the change).  # r174: the offline-status test's size expectation moves to the decimal-GB convention r173 adopted (the fixture's 20 GiB of bytes renders 21.5 decimal GB) — the r173 display change was landed with its own suite run still in flight and this pin correctly caught the unmoved expectation; the test's substance (integrity NOT checked offline, the start/logs guidance) is untouched.  # r173: second review-fold, all guard/test/display level, zero serving-behaviour change. (1) A new preflight test verifies EVERY in-tree artifact+signature pair (discovered by the sibling rule) against the tree's own pinned keyring via gpgv — the class it kills was measured on this very tree: the tier-2 pin swap changed models-manifest.json without a re-sign and the BAD pair survived branch gates, a composed landing, and one independent review, corrected only by a scheduled ceremony; the test proven RED against that exact historical pair and carries a tampered-artifact positive control. (2) The refusal escape-route pin gains an author-path case (the same probes through entry_to_sample, where the gate actually fires). (3) `intergen status` daemon-down branch now prints the model size in decimal GB matching the tier table — the binary GiB labelled GB showed the same file 0.4 GB smaller.  # r172: release-review findings folded, all string/comment/guard level, zero behaviour change. (1) The tier-2 size shown to users moves 5.5 to 5.6 GB, matching the shipped payload's real 5,629,108,608 bytes (both the docstring table and the catalog display value). (2) A new guard test pins the catalog-to-manifest lockstep in the direction that degrades QUIETLY: a manifest row missing for a catalog filename caps the tier down silently at provisioning, so the suite now fails loud on that pair; proven red by removing the tier-2 row and green on the shipped pair. (3) The port-bind failure text now states the schedule's real total (155.5s) instead of a constant it does not consume. (4) A protocol-doc example payload and a license-test comment move to the shipped tier-2 filename.  # r171: review findings from the pre-landing pass, folded before the build proves the tree. (1) The literal-marker refusal in the training-set emitter advertised an escape route its own gate refuses: it told an author a gold quoting tool-call syntax could ride in 'a prose gold about the format', but a prose gold's content becomes an assistant message — exactly the position the refusal fires on — so following the advice reproduced the refusal. Measured through the real gate: user turn PASSES, tool result PASSES, prose gold REFUSED. The message and docstring now name only the two carriers the gate accepts and state the prose-gold impossibility plainly. (2) A new test binds the advice to the gate's behaviour (each advertised carrier exercised through the real gate; the wording pinned) — it fails against the prior message, proven red-first 1/3. (3) Two comment direction errors in the watchdog cooldown work corrected: the exhaustion hold is ABOVE the cooldown wait, not below, in both the loop comment and the test module docstring. No behaviour change anywhere in this release.  # r170: the tier-2 model-manifest signature is refreshed over the r168 payload swap: models-manifest.json.asc re-signed as a detached OpenPGP signature and verified against the project primary key at delivery, so the shipped pin file and its signature verify as a pair again; the manifest bytes themselves are unchanged from the r168 swap.  # r169: the training-set emitter's docstrings state WHERE their rendering claim holds. Three of them asserted, without qualification, that tool-call arguments serialised as a JSON string render the function name with every argument dropped. That is true of DIRECT template application -- what this training pipeline does, applying internvl-tool-template.jinja itself over the emitted JSONL, where the template's `arguments is mapping` guard is false for a string -- and it is NOT true of the serving engine. Measured 2026-08-13 against llama.cpp b8796 serving that same template (sha256 7f0e529032c25183..., verified identical installed, in-tree, and in two running servers' memory): llama-server parses function.arguments as JSON before applying the template, so a JSON-object string and the mapping render byte-identically -- identical <tool_call> regions (sha256 78669ee3c16d9598...) and identical prompt_tokens (87 for both, against 66 for a call carrying no parameters, which is the control proving the measurement can move). The engine states the mechanism itself: an arguments string that is not valid JSON is refused with "Failed to parse tool call arguments as JSON", and a string that parses to a scalar or an array is accepted but renders no parameter blocks. The consequence recorded on these lines is that LLMRouter.continue_after_tool_call must NOT be changed to send a bare mapping: json.dumps is what the OpenAI wire format specifies for that field, and a mapping works only because this engine is lenient about it. render_tool_flow's "Mirrors LLMRouter.continue_after_tool_call" now reads "Mirrors what it RENDERS" and says why the two Python values differ while the rendered bytes do not. The corpus-side gate is unchanged and still required, because nothing in the training path does the parsing the engine does. Also: the literal-<tool_call> refusal message and its docstring now name the escape route for a gold that legitimately QUOTES tool-call syntax -- move that text out of assistant content, into a user turn, a tool result, or a prose gold, since assistant content is the only position the template turns into a rendered row of the model's own output. Docstrings and one refusal message only; no behaviour change.  # r168: six change sets composed into one release; each note follows in landing order. [a] four measurement-instrument items for round 2. (1) A coherent reply about the WRONG subject now fails Gate A. Asked about one service, answered confidently about another, such a reply satisfies every quality dimension a judge reads because it really is coherent; what it fails is structural, so the check is an assertion, not prompt text. no_wrong_target binds the answer to the subject the turn's dispatch acted on, deriving its targets from the turn's own tool arguments, so it carries no subject list and covers a service nobody has named before the day a cell dispatches against it; argument keys that carry a verb are excluded, and a command with no subject of its own produces no assertion at all. (2) An honest enumeration of data already in hand is no longer read as corruption. The one measured false positive of the fast-path synthesis screen was a real summary of a 979-package listing, whose many short items look to a repetition detector exactly like a token loop; the synthesis lanes hold the ground truth the model was asked to phrase, so an enumeration whose items trace back to that text is honest however long it runs, while items that appear nowhere in it stay rejected. Narrow by construction: only a repetition-shaped flag can be excused, only with source text in hand, only when the reply really enumerates, and never for a text-shape gate reason. (3) Short replies with no grammatical spine are named as corruption. A reply of at most eight words carrying no verb, no number, no identifier and no terminal punctuation is not a sentence — the word-bag class that every other instrument passed because each needs either length or structural damage. Shape only, never meaning, with a script guard that leaves non-Latin output to the flood check. (4) The fabrication screen now reads clauses, so a denial or an offer is not a claim. A bare present-progressive act claim is caught, but only when it opens its own clause and that clause is neither negated nor interrogative; the same clause scope makes the module's long-documented promise true for every alternation, including the passive one that fired on the honest denial its own docstring cites. Cross-review then returned five defects in these four items, all fixed on this branch before it landed and each reproduced against the reviewed tree first: a comma-joined clause now ends the fabrication screen's clause, so a denial can no longer amnesty a claim written beside it in the same sentence (the regression against the prior release); a shell dispatch's options consume their own arguments, so an option VALUE is no longer read as the subject and a correct answer is no longer graded as a correctness failure; naming a target is a prefix relation between whole words that must cover most of the name, so ordinary English no longer satisfies a three-character stem; an enumeration item must carry information and appear in the tool output as its own token before it can trace; and the short-reply script guard defers at the same ratio the flood check acts on, so a single non-Latin letter no longer switches the check off. [b] the per-path system-prompt modifiers stop colliding with the base prompt's own rule numbering, and four measurement-instrument items land with it. (1) Every modifier hardcoded its text as rule "4." while the base prompt had grown its own fourth rule (the fencing convention), so every assembled prompt served two rules numbered 4 and the conversational path served "4, 4, 5"; the collision lived only in the assembled string, which is why no code path and no test saw it. Modifier text now lives as rule bodies with no numbers, and the numbers are derived from the base prompt's own rule count, so adding a base rule renumbers every modifier instead of requiring six strings to be edited in step. Assembled bytes are otherwise unchanged and every path stays inside its char budget. (2) A coherent answer about the wrong subject now fails the grader's Gate A, so an answer that is fluent about something else can no longer score as correct. (3) An honest enumeration of data already in hand is no longer classified as corruption by the synthesis screen. (4) A short reply with no grammatical spine is named as corruption by the semantic health check. (5) The fabrication screen reads clauses, so a denial or an offer is not read as a claim. Decided 2026-08-13: the four instrument items land in-tree with the prompt fix; the serving process in front of the running measurement batteries is not restarted by this landing. [c] the training-set emitter writes tool calls in the ONE form the chat template renders. Measured 2026-08-13 by rendering the candidate shapes through the shipped template rather than reading its docstring: the template emits <parameter=...> blocks only under its own `arguments is mapping` guard, so the two shapes this emitter produced both rendered wrong. A dispatch gold was written as a JSON blob inside the assistant's CONTENT and rendered as literal text with no <function=> block at all -- while the template's own system block instructs, in the same rendered row, that a call must be an inner <function=></function> block; and a tool_flow history call serialised its arguments as a JSON STRING and rendered as the function name with every argument dropped. Both are now a structured call with mapping, key-sorted arguments -- the same shape for both turn kinds, which is what let one of them go unnoticed. render_gold returns a message rather than a string and is renamed render_gold_message; distribution_report tells a trained dispatch from a replayed history call by position (the history call is the one followed by the tool-role result) now that both carry the same shape. New fail-closed post-condition assert_renderable_tool_calls fires inside entry_to_sample, so every path that produces a sample is gated rather than relying on a caller to remember: it refuses literal <tool_call> text in content, non-mapping arguments, and an EMPTY arguments mapping -- empty matters as much as mapping, because an empty mapping is a mapping and still renders no parameters. Three negative controls prove the gate can fail and one positive control proves it accepts the real emission. The existing tool_flow test asserted the call's NAME and stopped, which is why the string-arguments defect survived; it now asserts the arguments too. [d] the model-server manager survives a child that will not die, and its two launch-related waits are sized from measurements instead of fixed constants. Measured 2026-08-13 on a laptop with a discrete NVIDIA card on the open-source driver: a failing health check led the watchdog to stop its own model server; the child was wedged in an uninterruptible kernel teardown reached through the GPU driver's file-close path; the post-SIGKILL `wait(timeout=5)` therefore raised subprocess.TimeoutExpired past a handler that catches only OSError, and the exception escaped stop() and restart(). The first restart attempt never reached a launch at all, and the failure it reported named a five-second timeout that exists nowhere in the launch path (the wall clock reconciles exactly: 5s reap wait + the 10s stderr-pump join the finally block runs on the way out). The remaining two attempts then refused the port — it was still unbindable 98 seconds after the kill, while the whole bind budget was 11.5 seconds — and the machine sat with no language model until a person restarted the service. Three corrections: stop() REPORTS a surviving child (naming its pid) instead of raising, and waits GPU_TEARDOWN_BUDGET_S=150s after the SIGKILL, a budget bracketed by measurement (0.25s on a quiet machine, at least 98s in the incident); the port-bind schedule is derived from that same budget rather than a hand-picked attempt count, and a free port still binds on the first probe with no delay; and the flat 60-second health wait becomes startup_budget_seconds() — the 60s floor plus 30s per gigabyte of model and projector — so a larger model cannot outgrow the launch budget silently (the 2B-with-projector pair measured 3.77-6.53s to load and now gets 114s; a 20 GB model gets about 11 minutes instead of one). Proven against reality on the box that produced the incident: a real GPU-loaded server was wedged with SIGSTOP, and the watchdog killed and REPLACED it with no person involved in 28.0s, after which the new server served a real chat completion; separately the extended port wait cleared a 40-second hold in 45.5s where the shipped schedule refused the identical hold after 11.5s. The terminal "watchdog giving up" in the incident came from an installed package built before the retry-after-exhaustion fix landed, and needed no further change here. [e] two watchdog defects in the monitor loop, both found while reviewing the serving-watchdog recovery work and outside its scope. (1) The post-restart cooldown was a bare 60-second sleep nothing could interrupt, while stop() sets the stop event and joins with a 5-second timeout — so a stop landing in that window blocked for the rest of the sleep, and at the shipped cooldown it outlasted the join entirely and returned while a thread the daemon believed stopped was still resident. Measured at the base tree with the cooldown patched to 1.5s: stop() took 1.45s; after the change the same case returns in under 0.5s and a 6-second cooldown leaves no live thread behind. The wait is now the same stop-event wait the exhaustion hold twenty lines above already used. (2) The give-up message rendered its retry interval as recovery_interval // 60 minutes, so any sub-minute interval announced "retrying every 0 minutes" — observed live at interval=1 in the red run. It now renders seconds, minutes, or both; the shipped 900-second default still reads "15 minutes", pinned by a test so the wording cannot regress into seconds. Red-first at the base tree: 5 failed / 2 passed, the two passes being deliberate controls including one proving the cooldown is a real wait and not a no-op. Serving behavior is otherwise unchanged: the restart budget, the cooldown duration, the exhaustion hold and the recovery retry are all as they were. [f] tier 2 ships the fine-tuned round-3 build of Qwen3.5-9B. The build passed the ruled acceptance bar — three fine-tuned runs against three baseline runs, the gain above the instrument's measured same-day noise, ten request families moving from never-passing to always-passing with the run spread tightening 8 to 2 — where the same round's 2B and 35B fine-tunes measured no effect and are not shipped. models-manifest.json and the in-code catalog swap the tier-2 filename and pin together (the overlay is filename-keyed, so they move in lockstep or the fail-closed pin contract locks the tier out); the vision projector is unchanged. Mirror-hosted under the new filename; the vendor never serves it, so a mirror miss fails loud rather than fetching different bytes. Two tests that read the box's installed pins manifest are made hermetic with catalog-derived pins. Decided 2026-08-14. Chain clause recorded at this composed landing: r162's byte-identity claim - that the assembled training sets reproduce byte-for-byte - ends at r168, because the tool-call serialisation fix changes the emitted bytes by design while the position-based counts reproduce unchanged (517; 257/308/115); training sets assembled and models trained before r168 rode the prior serialisation.  # r167: a judge call that fails in transport escalates the turn instead of destroying the run — the transport twin of the r-landed unparseable-reply contract. Measured 2026-08-12: one judge prompt (16,157 tokens against the judge server's 8,192 context) drew HTTP 400, the raised HTTPError passed straight through apply_judge_grading, and a completed 204-conversation baseline died in its final grading phase — three consecutive firings, the cause invisible until an instrumented run captured the runner's exit code and traceback. judge_turn now retries a transport-failed call once (a transient fault usually clears) and a second failure folds a 'flag' verdict naming the failure — the turn lands in the human-read escalation subset, Layer-1 deterministic verdicts still fold, and the floor cannot end below 'flag' for an unjudged turn. Grade-neutral for every run that previously completed: only calls that raised (and killed the run) grade differently, and only toward escalation.  # r166: the deny-recovery cells' refusal-acknowledgment vocabulary is broadened to the register the gold corpus actually teaches, and the two cells now share one constant (DENY_RECOVERY_VOCAB in intergen/tests/conversations.py) so they cannot drift apart. The old 13-phrase contains_any list accepted only 6 of the corpus's own 34 deny-recovery gold replies — the eval demanded literal substrings ("need approval", "not able") that the gold's natural phrasing ("needs your approval", "wasn't able") never contains, so a reply matching the trained register graded as evasive. Measured before landing: gold acceptance 6/34 -> 34/34; against sealed eval replies, 9 of 10 previously-reddened denial recoveries now pass while the one genuinely evasive reply (a denial misreported as a lookup result) still fails — the broadened check still discriminates. Every added phrase is a denial acknowledgment on its own; the trace-backed gate_action=deny assertion remains the hard falsifier for fabricated success. Decided 2026-08-12: the assertion vocabulary moves rather than the gold — a check that fails 28 of 34 of its own gold answers measures the wrong thing — and the affected cell family re-baselines on the next baseline run rather than comparing across instruments.  # r165: risk classification for a mixed-capability tool is per ACTION end to end, and a review prompt now states the class it is actually asking about. Three measured defects, one observed live: a manage_services call with action "list" — a read — raised the approval modal, and the modal said the request changes the system. (1) The schema declared an action enum and nothing enforced it, so a value the tool does not define passed validation, matched neither the read-only nor the state-changing action list, and took the unrecognised-action default of CONFIRM; on a tool that escalates via pkexec that default is the privileged tier, so a read reached an administrator-approval prompt for `systemctl list`, a verb systemd refuses outright. BaseTool.validate_arguments now enforces every declared enum, before the dispatcher gate and before anything executes — an undefined value is an input error reported with the accepted values, not a risk put to a person. (2) manage_services gains ACTION_ALIASES (list -> list-units, and two siblings), canonicalised ahead of classification so a colloquial spelling of a read classifies and runs as that read; manage_packages already accepted "list", so the two tools had disagreed on the most basic query. The enum is now derived from AUTO_ACTIONS | CONFIRM_ACTIONS | ACTION_ALIASES, so an accepted value is a declared value. (3) The consent surfaces could not name the class at all: DispatchDecision carried no risk tier, so the zenity header was the fixed string "a system action you did not directly request" and the branded dialog's risk copy was keyed on provenance alone, asserting "It still changes your system" for reads. DispatchDecision now carries risk_tier, the dialog protocol carries it to the renderer, and origin and effect are separate sentences derived from the decision. Decided 2026-08-12: unrecognised must stay fail-closed but must not be described as understood — an unclassified tier keeps the severe wording everywhere, so a missing classification can never be what softens a prompt. State-changing actions are untouched: they still classify privileged and still always prompt.  # r164: the round-2 training bank lands in-tree beside the round-1 bank. Three lanes, each aimed at a defect the honest rounds 3-4 measured (2026-08-12): class 7 honesty contrastives (41 entries - read-only state reports, completed-action claims, and admitted failures in same-subject pairs, the counter-signal to the two regressed honesty cells), class 8 assembled multi-turn context (16 conversations of 4-6 turns - 100% of round-1's grade movement was single-turn and the multi-turn eval slice scored zero PASS in both honest rounds), class 9 long tool-output synthesis (11 entries - journal, package-history, unit-listing, boot-blame, and search outputs answered in a few faithful lines). Combined 585-entry training input emitted fail-closed and boundary-proven through all three model tiers' tokenizers; deduplicated under the qualified rule decided 2026-08-11 (0 qualified drops; all 54 over-0.85 pairs are opposite-intent or different-structure spares).
# r204: the installed-system trace gate measures the release under test rather than the machine's history. The trace file is append-only and its writer rotates by size alone (64 MB, keeping five), so on an upgraded machine the rows a previous release wrote remain in it — 37 KB after a full day of use on a measured install, which is effectively forever. Both properties the gate asserts are properties of the software that wrote a row, so over the whole file they were asserted against rows no shipped change can alter: a release that fixed them kept failing, and because a release is refused on any failing gate, no upgraded machine could validate any release. The row set is now bounded to rows written on or after the installed release's own install date, read from the same database row that the gate runner records as install_date. A row whose timestamp cannot be read is KEPT and counted, because an unplaceable row is not proof that it predates the install; an unreadable database or an unparseable date FAILS rather than silently becoming no bound; and bounding to zero rows FAILS, because a release that traced nothing has not been measured. Proved in the ordinary suite against a row that must be dropped, one that must be kept, an undatable row, a file that bounds to nothing and a one-row control, and mutation-checked three ways. Decided 2026-08-25.
# r203: the installed-system gate tier stops reporting three properties it could no longer see. The turn-lifecycle gate located the routing call by the text self._router.route( and then scanned source lines for a frame sent before it; routing is now handed to an executor, so that pattern matched nothing and the gate took its own rewrite-required branch on a tree that does send the acknowledgement the gate exists to require. It now parses the module instead: the routing site is recognised in both the direct and the offloaded shape, a frame is placed by the line of the SEND rather than of the statement enclosing it (measuring by the enclosing statement counted the final response frame as though it preceded routing), the browser is required to carry a dispatch arm for the frame, and a module whose turn path cannot be characterised raises rather than returning an answer that reads like a defect. Its deadline case now asserts what bounds routing — a declared server routing deadline shorter than the client's pre-acknowledgement failsafe — instead of comparing that failsafe against a model request deadline it no longer covers. The install-manifest gate's audit-record case asserted over completion events alone and passed when the verifier aborted instead of completing, having examined no terminal record at all; it now requires a terminal event and requires that event to name the gap. The ROCm linkage gates failed outright on any machine without /opt/rocm, which refused every release validated on a machine that had not opted into that engine; they now ask the package database whether the engine is installed and skip, declared in scripts/data/installed-gate-expected-skips.txt, only when it is not — the engine installed with its files absent still fails. The readers added to the tier's shared shape module are proved against both shapes and mutation-checked in the ordinary suite. Decided 2026-08-24.
# r202: a fact the user asks InterGen to forget also leaves the copy the running assistant holds in memory. Facts are embedded once and the vector is kept, keyed by the words the user stored, so the fact can be ranked against a question without paying to embed it again. Nothing emptied that cache on a forget: the stored rows went, the reply said they were forgotten, and the user's own words stayed in memory as a cache key — in every conversation, for as long as the assistant kept running, including conversations the user had already ended and could no longer reach. There was no path from the store to those caches at all, because a conversation's index and the store hold no reference to each other; a weak registry is that path, and a forget now clears the text of exactly the rows it removed from every live conversation. A fact the user did not name keeps its vector, and ending a conversation still keeps the whole cache, because facts outlive conversations and re-embedding them each time would be waste. Clearing all memories empties everything, because after it no stored fact remains. The candidate list, the cache key and a forget now spell a fact one way instead of three. The record of the forget says how many in-memory copies went with the stored rows. NOTHING ON DISK CHANGES: this removes a copy held in memory, the stored row is still hidden rather than overwritten, and whether a forgotten fact's bytes must leave the database file remains the separate question scheduled after this release. Scope: the shipped daemon uses one store. In an atypical process holding multiple stores, an identical cache entry from another store may also be evicted conservatively; that costs one re-embed and does not delete or restore the other store's row.  # r201: the installed-gate tier's stale predicates are re-keyed on shape rather than on text, with no verdict weakened. (1) The privilege-boundary gate decided who execs the setuid helper with the substring '"pkexec",' in the module source. That string is in BOTH shapes — the one where the daemon execs pkexec as its own child, which NoNewPrivileges kills, and the one the current dispatch shipped where a transient user unit execs it and the daemon's NoNewPrivileges does not reach it — so the gate went on reporting a defect that had been fixed. Measured 2026-08-24 against both modules at once: substring True on the R001.1 module (boundary really broken) and True on the tree module (fixed). The question is now parsed from the dispatch's argv by a reader in tests/installed/_shape_detectors.py, proved in both directions by the ordinary suite and mutation-checked. The gate's header no longer describes the old path. (2) The start-up embedding gate matched one exact source line; it passes today only because that line is gone and would pass equally if it had been reformatted with the shape intact. It now parses for a call whose first argument comprehends over the whole self._chunks, which a batched slice is not. (3) The restart-persistence gate accepted any of six markers appearing anywhere in the module, so an unrelated json.dump would have reported the index as cached; the region is now located by parsing the index-building functions and only writes inside them count. Verdicts on both modules are unchanged by (2) and (3) — captured — so nothing was weakened to go green.  # r200: a forget now soft-deletes matching active store rows, stops those rows being selected for recall, reports the count truthfully and records that the deletion is logical (`physical=false`). At this revision, already-cached session vectors still retained the fact text; r202 clears that in-memory remainder. The database row keeps its bytes by design, pending the separate physical-erasure contract.  # r199: the turn-record tests read a row by what it is, not by where it sits. The writer emits rows of its own around a turn — one when it opens the file, a marker when the file rolls, a synthesized ending when a turn stops without one — and each of those, when it landed, moved the position of every row a test had emitted. The last time it happened a corpus file reported twenty-nine failures where nineteen were real and the other ten were its own controls, which makes a broken measurement look like a worse defect. One helper now reads the record and selects from it by phase, event or turn, and eleven test files go through it; a selection that finds nothing says what the record does hold instead of raising an index error. Four cases were reading by position and are corrected; the rest were already filtering and are converted so the next edit cannot quietly drop the filter. A probe that makes the writer emit one extra row ships beside them, so the same question can be asked again the next time the writer learns to say something. Test files only: nothing shipped changes behaviour, and the release moves because test files are inside this package's content fingerprint.  # r198: the decision tracer redacts secret-shaped content from the same definition the turn record uses. The two writers were documented as being in lockstep on which values may never be written and were not: the turn record gained a predicate for secrets that arrive as content and the tracer kept only the older key-name check, so with content capture deliberately on the same value came out redacted from one and verbatim from the other. The shapes and the redaction that applies them are now public names in the module that owns them and the tracer imports them, so the lockstep is true by construction and a shape added in one place is caught in both. The tracer's posture is otherwise unchanged: content capture stays off unless it is explicitly enabled on a non-root process, a credential-shaped key name still replaces its whole value, and non-string values are untouched.  # r197: the turn record redacts a secret it finds inside CONTENT, not only one a caller labelled as a credential. Its redaction was a key-NAME predicate, so a secret arriving inside a prompt, a command line, a tool result or a file the person asked about was written to the record verbatim and kept for up to the full retention ceiling — measured on the shipped tree with an eight-case corpus, seven of which reached the file byte-identical. A second predicate now scans every string value for named secret formats — PEM private-key blocks, URLs carrying an inline password, crypt hashes, JSON web tokens, and vendor-prefixed API tokens — and replaces each match, and only that match, with a placeholder naming the shape, so the surrounding content survives and the reader can see what kind of thing was removed. No entropy heuristic: a threshold that fired on ordinary content would put unexplained holes in a full-fidelity record while still missing structured secrets. Both directions are proved against the corpus, including eight ordinary-content cases that must survive byte-identical. Redaction happens when the record is built and the oversized-row shortening happens when it is written, so a secret carried in a row too large to write is already a placeholder by the time any prefix of it is kept; that order is asserted, not assumed. One limit is stated and tested rather than assumed away: a secret with no distinguishing shape is still written.  # r196: the automatic launch path plans a requested llama.cpp GPU layer count from the resolved model and detected video memory instead of from the hardware tier; the tier still chooses the model and an explicit numeric layer setting still wins. When video memory and model size establish a full fit, the planner requests every layer. For a known non-fit and readable layer count, it requests a bounded estimate derived by dividing the model size uniformly across the reported layers; it requests zero when that estimate leaves room for no layer or when the model is known not to fit but its layer count is unreadable. If video memory or model size is unreadable, the implementation requests every layer so a failure is loud. Sizes are read from the package-shipped models manifest as JSON, with file-size fallback; this reader does not verify the manifest's detached signature, and an unreadable projector size currently contributes zero bytes. The 1088 MiB reserve exceeds one recorded 1063.25 MiB beyond-weight allocation for the shipped 9B load at context 16384, not a proved universal maximum. These values are launch requests: tests cover planner arithmetic, real model headers and a simulated matrix, while the server's startup banner remains the authority for actual offload and a post-change affected-card load was not proved here. The installed matrix now reaches the shipped LlamaManager predicate but does not exercise the production plan composer or a real GPU load.  # r195: one conversation per conversation. The router held a single conversation for every browser tab, the console and the desktop bus together — one history, one consent record, one ingress watermark, one set of pending offers, one turn index — so two tabs were one conversation as far as the model was concerned, a "yes" typed in one could accept an offer staged in another, and an approval granted "for this conversation" stayed in force for every conversation after it, including one started by a different person at the same machine. All of it moves onto a per-conversation object; every turn names the conversation it belongs to, and on the daemon, where one router serves the browser and the desktop bus, a turn that does not name one is refused with a logged reason rather than answered from someone else's history. The browser connection's transcript and the model's prompt are now one list, so the pane and the prompt cannot drift. Both dispatch paths read the ONE consent record: the second, per-connection record is gone rather than synchronised. "New session" and "switch session" end the conversation instead of only emptying the pane. Releases 192 to 194 belong to the turn-record lane composed ahead of this one; this is 195.  # r194: comment and docstring text only, no behaviour. Three passages still described the route deadline as living on another branch and as not exercised against its producer, which stopped being true when this branch was rebased onto the composed tree and the deadline began emitting its own terminal; they now describe what the code does. The warning glyphs those passages carried are replaced with words, because public source and tests stay plain text. The release moves because shipped files and test files are inside this package's content fingerprint, not because anything executes differently.  # r193: the thread-seam proof for the turn-terminal guarantee lands as its own test file, and test files are inside this package's content fingerprint, so the fingerprint recorded at r192 was taken before that file existed. WHY THIS BRANCH MOVES THE RELEASE TWICE, stated rather than left to be noticed: a bump is the mechanical consequence of content changing after a fingerprint is recorded, so a branch that changes shipped bytes, records, and then changes them again moves twice. Nothing about r192 was wrong; it predates the added proof. Both numbers are provisional in any event — other branches cut from this base also move intergen, so whoever integrates the set re-derives the numbering across it. The tool's re-baseline mode is deliberately not used: it exists for a change to the fingerprint DEFINITION and refuses a package whose content also changed under the old definition, which is this case exactly.  # r192: the always-on turn trace becomes usable as a record. Three defects, each measured on the shipped path before it was touched. A turn handed to a worker thread lost its identity: contextvars do not cross a thread, so every row the router, the tool executor, the frontier escalation and the three honesty regenerations wrote landed unattached and could not be joined to the turn that caused them — seven such handoffs, found by parsing the file rather than reading it, where a hand read found three. A turn could also begin and never say how it ended: only the three successful exits recorded a delivery, so a crash, a cancelled client, an early refusal or the routing deadline left a turn that started and stopped mid-record. Ending a turn is now guaranteed at the one place every interface passes through, exactly once, with a second attempt kept under its own name so a call site that ends a turn twice stays findable; the routing deadline says plainly that it timed out. The row sequence number, which exists to give a replay order for rows born in the same millisecond, restarted at zero on every start, so two runs numbered their rows identically and a reader ordering by it interleaved them into one wrong timeline; the counter now continues above what the file already holds, every row names the run that wrote it, and the resume is recorded rather than inferred. Retention was overstated by a whole file — five kept files were counted and the live one was not — and a single row larger than the rotation size defeated the ceiling entirely by rotating the file away and landing whole in the fresh one; the ceiling is now derived from the constants it describes and no row may exceed a fraction of the rotation size, with anything shortened saying how large it was and how much was kept. No interface changed; the release moves because shipped code and test files are inside this package's content fingerprint.  # r191: the first-run setup offer states each model tier's download size from the signed manifest (model bytes + multimodal projector bytes; model_choice.tier_download_sizes), fail-closed with no claim when no manifest is present; Tier 1 is 1.8 GB and Tier 2 6.1 GB, not the fixed '4-5 GB' the page carried. r190: test-only correction. Three cases in the write-file guard's test file asserted that a write under /usr/lib/ is CONFIRM-tier. The shipped code hard-blocks it and has since r179 added the system_binaries category to the signed never-list manifest, whose prefixes cover the executable and library trees. The code is the stricter side and is right; the expectations were written when /usr/lib/systemd/ was sensitive-but-not-never-listed and did not follow the manifest when it grew — the same drift that had already moved /etc/ssh/sshd_config out of the same list once before. The three expectations move to the BLOCKED contract; the CONFIRM coverage is preserved on /usr/share/ paths, which are in the guard's sensitive-prefix list and carry no never-list coverage, so they remain the honest CONFIRM case. Two cases are added: one stating the never-list prefixes as their own contract, and one proving a never-listed path is refused in root context as well. Both read the refusal TEXT rather than a false success flag, because the test runner is not root and a write to /usr/lib/ would fail on filesystem permissions regardless — verified by removing the policy and confirming the message changes. The case covering the unprivileged-write backstop moves to /usr/share/ and now asserts its path classifies CONFIRM first, because the hard block had begun firing ahead of the backstop it exists to test. No shipped code changed; the release moves because test files are inside this package's content fingerprint.  # r189: the privileged runner is started as a short-lived unit through the assistant's own systemd user manager instead of as a direct child of the daemon, and the request it carries no longer travels on a command line. The daemon's unit sets NoNewPrivileges=yes, which every child inherits and which cannot be cleared; under that flag the kernel ignores pkexec's setuid bit, so pkexec started unprivileged, saw its own effective uid was not root, and refused before PolicyKit was contacted — no install could perform any privileged action through the assistant. The user manager does not carry the flag, so a unit it starts reaches the runner. No hardening directive changed: the assistant's unit file is byte-identical, and the transient unit is deliberately plain because imposing the flag on it would reproduce the defect. The PolicyKit action is unchanged and still bound to the runner's exact path, so what a person authenticates against is the same narrow, purpose-built action. Second correction in the same change: the tool name, the arguments and the human-approval token were the runner's argv words 2, 3 and 4, and a command line is readable by any local account through /proc for the life of the process; they now travel in an owner-only file created 0600 with O_EXCL, removed as it is read and on every failure path, and no path is passed at all. The runner's argv narrows to one argument and that argument is an opaque identifier of thirty-two hex characters: the shim refuses any other shape before an interpreter sees it, and the root-side dispatcher takes --request-id and derives the directory itself from the uid PolicyKit reports, verifying that the directory is a real directory owned by that user at mode 0700, then that the file is a regular file, not a symlink, owned by the calling user, mode 0600, single-linked and within a 64 KiB bound before believing its contents, and removing the file it actually read rather than the name it was given. The unprivileged side never names a location the privileged side reads, so a traversal, an absolute path or a borrowed file is not something to defend against but something that cannot be expressed. The wait for the privileged unit is bounded at both ends and an outcome that is not known is reported in those words rather than as a failure, and the approval a person gives is spent when the action is taken rather than when it is asked for, so a refused dispatch no longer costs an authentication. Third: the package-management path no longer builds a second pkexec — by the time that command builder runs it is already root inside the privileged dispatcher, so the second crossing had no PolicyKit action of its own, carried no approval token, and ran from a scrubbed environment where it could not have raised a prompt anyone could answer. The failure diagnostic gains the two components the new path depends on, each measured before it is named. The path is structurally proved through the transient unit and live NoNewPrivileges probes. No privileged action was run end to end in this change; authenticated PolicyKit execution remained an attended proof leg. Diagnostic text also changes.  # r188: the privileged-dispatch diagnostic now reports a measured cause instead of a fixed sentence — the runner path is checked on the filesystem before anything is said about it, pkexec's own stderr is carried to the user instead of being replaced, and the exit code is stated; a refusal the runner itself reported still leads. Companion documentation fix in the same release: the in-tree copy of the user unit is replaced with the unit the recipe actually installs (it described an unhardened Type=simple service that has not shipped). No interface, no data, no model artefact changed.  # r187: test-only change to the gate r186 introduced. The startup-embedding gate's budget case asserted that a budget constant exists and that construction finishes inside a bound, but the corpus it embedded cost about the same either way, so bounded and unbounded construction were indistinguishable to it and the timing half proved nothing. An added case sets about 2.2 s of embedding work against a 0.3 s budget and asserts three things together: construction finished well inside the unbounded time, the index did not complete, and at least one request was still made, since the budget must never suppress the first request or a small wiki would never embed at all. No shipped code changed; the release moves because test files are inside this package's content fingerprint and the fingerprint recorded at r186 was taken before this case existed.  # r186: a web turn is acknowledged before routing and the wiki index is embedded in bounded requests. Three defects measured against the released build. (1) Nothing was sent to the browser between 'message received' and 'routing finished'. The browser arms a 30 s whole-turn failsafe on send and disarms it only on the first server frame, so whenever routing outlived that failsafe the browser hid the thinking indicator, told the user there had been no response and force-closed the socket, while the server was still working and the answer had nowhere to go. Observed in a live session: two turns recorded a turn-start event and nothing further, the socket dropped about thirty seconds later, and each session file held exactly one message. A turn_ack frame now goes out before any routing work begins, and the server holds itself to a routing deadline (20 s) declared next to the client's 30 s failsafe and asserted to be strictly shorter than it; a turn that passes the deadline ends with a truthful message instead of silence. Time spent waiting on a person at a consent card is not charged against that deadline. The deadline bounds what the user experiences, not the worker thread, which runs on and has its result discarded. (2) The same file's failsafe would fire while a consent card was on screen on the fast path, force-closing the socket and losing the decision; the client now disarms it for the card's lifetime and refuses to fire while one is pending. (3) The installed wiki was embedded by submitting all 2,116 passages in one request to a single-slot embedding server under a 30 s client timeout, so it timed out on every boot and left an abandoned batch occupying the slot as the web server began accepting turns, with no rebuild path, leaving keyword-only matching for the life of the daemon. The corpus now goes in 32-passage requests inside a bounded startup budget, partial progress is kept, and resume_embedding() can finish a degraded index later. Retrieval semantics are unchanged: the embedding matrix is published only when every passage is embedded, so a query is never scored against a half-present corpus. No caller drives the resume path yet; its natural site is outside this change. Proof boundary: the browser/deadline behavior was exercised through unit and integration harnesses with a router blocked on demand; no real browser was driven against a genuinely starved embedding server in this change.  # r185: the owner-only permission pass now stops at the tree boundary and covers the answer cache. Five ways it reached past its own scope, each found by an independent review and each reproduced before it was changed: the mode was read with lstat and written with a path-based chmod, which follows a symbolic link, so the inode measured and the inode changed could differ and a symbolic link's own 0777 mode written to a 0644 target GRANTED owner-execute — the mode is now read from and written to one descriptor opened O_PATH | O_NOFOLLOW, which the kernel refuses to follow; a per-user tree the user had relocated with a symbolic link was walked THROUGH, re-permissioning a directory outside the home while reporting the root as skipped — a symbolic-link root is now refused before anything is listed; storage mounted inside a tree was re-permissioned on the underlying filesystem, so the walk now stops at a mount point, found by device number and, for a bind mount of a directory on the same filesystem which keeps the same device number, by the kernel's mount table; a directory the walk could not READ had its contents omitted silently while the report said clean, so an unreadable directory and an owned root that is not a directory are now named as failures; and the directory helper tightened whatever path it was given, including the root-owned system log directory a privileged daemon keeps, so it now leaves anything outside the owned trees to the platform default. The pass also runs ONCE per home rather than at every start, recorded by a marker in the state directory that names the paths it changed: re-tightening at every start silently reversed a sharing decision the user is entitled to make on their own machine, and files the product writes are created owner-only and need no pass. Owned intermediate directories are created one at a time at the final mode, closing the create-then-tighten window that mkdir(parents=True) left open for everything above the last component. Finally the answer cache is the fourth owned tree: ~/.cache/intergen/last-answer.json holds the delivered answer AND the raw model output behind it, the same class of material as a session transcript, and it was reached by none of the three mechanisms — the create path, the migration's root list and the permission gate's tree list now all resolve it from one place. The provider-configuration panel creates its directory through the same helper, because on a fresh account it can be the first creator of ~/.config/intergen and a bare mkdir landed it 0755 beside the dispatch signing key and the web-auth token.  # r184: initial owner-only state pass. Fourteen listed create sites were routed through the 0700-directory/0600-file helpers and a startup migration was added. This revision did not cover the answer cache or provider-configuration directory, and its migration could follow a symlinked root or target, cross a mount, miss unreadable contents, repeat at every start, and create parent directories before tightening them. r185 is the boundary-corrected implementation; r184's broader claims that every site was covered, symlinks were safely skipped, the pass ran once, and permissions could never widen were false at this revision.  # r183: no behaviour change: comment, docstring and test-README wording across intergen/ and intergen/tests/ now uses plain engineering terms in place of project-internal shorthand. Text only; no code, no interface, no data, no model artefact.  # r182: test-fixture wording only: the system-information formatter test used the previous release's identity string as its example, which read as a statement of the current release and would go stale at every release. It now uses a deliberately synthetic value. No shipped code changed.  # r181: no intergen code changed. intergen's content fingerprint folds its own tree; a wording-alignment pass over the same two test READMEs the r180 note describes standardized the reviewer-role terms used there. Documentation text only; no code, no interface.  # r180: no intergen code changed. intergen's content fingerprint folds its own tree, and the documentation-truth pass reworded two test-corpus READMEs in it: tests/demand_corpus/README.md now states the M8-6 requirement as a dated decision rather than a role instruction, and tests/judge_calibration/README.md names the independent annotator as ground truth. Documentation text only; no code, no interface, no data.  # r179: destructive-policy-manifest.json gains the system_binaries never-list category (decided 2026-08-16) — prefix protection for /usr/bin, /usr/sbin, /usr/lib, /usr/lib64 and the FHS symlink spellings; re-signed with the release key; a shipped-manifest test pins the entries. The manifest pair ships in this package, so the archive bytes change with it.  # r178: destructive-policy-manifest.json description/notes text corrected to state installed-system protections truthfully (detached-signature verification + root ownership; dm-verity seals live/install media only) and re-signed with the release key; path lists and policy semantics unchanged. The manifest and its .asc ship in this package, so the archive bytes change with them.  # r177: no behaviour change: two test-fixture strings neutralized in the pre-release pass — a canned hostname answer in test_scenario_responsiveness.py generalized, and a docstring's internal ledger reference in test_m7_trust_priority.py reworded. Fixture/docstring text only; no code, no interface.  # r176: no behaviour change: one section comment in intergen/web_server.py reworded from 'seamless reads' to 'read-only actions' during the pre-release register pass. Comment text only; no code, no interface, no data.  # r175: every displayed model size is on ONE convention: decimal GB of the real payload bytes. Measured at r174 against the shipped manifest, one tier-3 file displayed three different sizes (catalog 20.5 - a binary reading, hardware table 21.0 - matching neither convention, status 22.0 decimal) - a 1.5 GB spread larger than the discrepancy r173 closed. The catalog and hardware-table constants move to the decimal values of the real byte counts (1.3 / 5.6 / 22.0), the tier-table docstring and the VRAM-rationale comments follow, and the offline-status test fixture now carries the real tier-3 byte count so its expectation states a size a shipped model actually has. Display-only: no gate or free-space check consumes these values (verified by review before the change).  # r174: the offline-status test's size expectation moves to the decimal-GB convention r173 adopted (the fixture's 20 GiB of bytes renders 21.5 decimal GB) — the r173 display change was landed with its own suite run still in flight and this pin correctly caught the unmoved expectation; the test's substance (integrity NOT checked offline, the start/logs guidance) is untouched.  # r173: second review-fold, all guard/test/display level, zero serving-behaviour change. (1) A new preflight test verifies EVERY in-tree artifact+signature pair (discovered by the sibling rule) against the tree's own pinned keyring via gpgv — the class it kills was measured on this very tree: the tier-2 pin swap changed models-manifest.json without a re-sign and the BAD pair survived branch gates, a composed landing, and one independent review, corrected only by a scheduled ceremony; the test proven RED against that exact historical pair and carries a tampered-artifact positive control. (2) The refusal escape-route pin gains an author-path case (the same probes through entry_to_sample, where the gate actually fires). (3) `intergen status` daemon-down branch now prints the model size in decimal GB matching the tier table — the binary GiB labelled GB showed the same file 0.4 GB smaller.  # r172: release-review findings folded, all string/comment/guard level, zero behaviour change. (1) The tier-2 size shown to users moves 5.5 to 5.6 GB, matching the shipped payload's real 5,629,108,608 bytes (both the docstring table and the catalog display value). (2) A new guard test pins the catalog-to-manifest lockstep in the direction that degrades QUIETLY: a manifest row missing for a catalog filename caps the tier down silently at provisioning, so the suite now fails loud on that pair; proven red by removing the tier-2 row and green on the shipped pair. (3) The port-bind failure text now states the schedule's real total (155.5s) instead of a constant it does not consume. (4) A protocol-doc example payload and a license-test comment move to the shipped tier-2 filename.  # r171: review findings from the pre-landing pass, folded before the build proves the tree. (1) The literal-marker refusal in the training-set emitter advertised an escape route its own gate refuses: it told an author a gold quoting tool-call syntax could ride in 'a prose gold about the format', but a prose gold's content becomes an assistant message — exactly the position the refusal fires on — so following the advice reproduced the refusal. Measured through the real gate: user turn PASSES, tool result PASSES, prose gold REFUSED. The message and docstring now name only the two carriers the gate accepts and state the prose-gold impossibility plainly. (2) A new test binds the advice to the gate's behaviour (each advertised carrier exercised through the real gate; the wording pinned) — it fails against the prior message, proven red-first 1/3. (3) Two comment direction errors in the watchdog cooldown work corrected: the exhaustion hold is ABOVE the cooldown wait, not below, in both the loop comment and the test module docstring. No behaviour change anywhere in this release.  # r170: the tier-2 model-manifest signature is refreshed over the r168 payload swap: models-manifest.json.asc re-signed as a detached OpenPGP signature and verified against the project primary key at delivery, so the shipped pin file and its signature verify as a pair again; the manifest bytes themselves are unchanged from the r168 swap.  # r169: the training-set emitter's docstrings state WHERE their rendering claim holds. Three of them asserted, without qualification, that tool-call arguments serialised as a JSON string render the function name with every argument dropped. That is true of DIRECT template application -- what this training pipeline does, applying internvl-tool-template.jinja itself over the emitted JSONL, where the template's `arguments is mapping` guard is false for a string -- and it is NOT true of the serving engine. Measured 2026-08-13 against llama.cpp b8796 serving that same template (sha256 7f0e529032c25183..., verified identical installed, in-tree, and in two running servers' memory): llama-server parses function.arguments as JSON before applying the template, so a JSON-object string and the mapping render byte-identically -- identical <tool_call> regions (sha256 78669ee3c16d9598...) and identical prompt_tokens (87 for both, against 66 for a call carrying no parameters, which is the control proving the measurement can move). The engine states the mechanism itself: an arguments string that is not valid JSON is refused with "Failed to parse tool call arguments as JSON", and a string that parses to a scalar or an array is accepted but renders no parameter blocks. The consequence recorded on these lines is that LLMRouter.continue_after_tool_call must NOT be changed to send a bare mapping: json.dumps is what the OpenAI wire format specifies for that field, and a mapping works only because this engine is lenient about it. render_tool_flow's "Mirrors LLMRouter.continue_after_tool_call" now reads "Mirrors what it RENDERS" and says why the two Python values differ while the rendered bytes do not. The corpus-side gate is unchanged and still required, because nothing in the training path does the parsing the engine does. Also: the literal-<tool_call> refusal message and its docstring now name the escape route for a gold that legitimately QUOTES tool-call syntax -- move that text out of assistant content, into a user turn, a tool result, or a prose gold, since assistant content is the only position the template turns into a rendered row of the model's own output. Docstrings and one refusal message only; no behaviour change.  # r168: six change sets composed into one release; each note follows in landing order. [a] four measurement-instrument items for round 2. (1) A coherent reply about the WRONG subject now fails Gate A. Asked about one service, answered confidently about another, such a reply satisfies every quality dimension a judge reads because it really is coherent; what it fails is structural, so the check is an assertion, not prompt text. no_wrong_target binds the answer to the subject the turn's dispatch acted on, deriving its targets from the turn's own tool arguments, so it carries no subject list and covers a service nobody has named before the day a cell dispatches against it; argument keys that carry a verb are excluded, and a command with no subject of its own produces no assertion at all. (2) An honest enumeration of data already in hand is no longer read as corruption. The one measured false positive of the fast-path synthesis screen was a real summary of a 979-package listing, whose many short items look to a repetition detector exactly like a token loop; the synthesis lanes hold the ground truth the model was asked to phrase, so an enumeration whose items trace back to that text is honest however long it runs, while items that appear nowhere in it stay rejected. Narrow by construction: only a repetition-shaped flag can be excused, only with source text in hand, only when the reply really enumerates, and never for a text-shape gate reason. (3) Short replies with no grammatical spine are named as corruption. A reply of at most eight words carrying no verb, no number, no identifier and no terminal punctuation is not a sentence — the word-bag class that every other instrument passed because each needs either length or structural damage. Shape only, never meaning, with a script guard that leaves non-Latin output to the flood check. (4) The fabrication screen now reads clauses, so a denial or an offer is not a claim. A bare present-progressive act claim is caught, but only when it opens its own clause and that clause is neither negated nor interrogative; the same clause scope makes the module's long-documented promise true for every alternation, including the passive one that fired on the honest denial its own docstring cites. Cross-review then returned five defects in these four items, all fixed on this branch before it landed and each reproduced against the reviewed tree first: a comma-joined clause now ends the fabrication screen's clause, so a denial can no longer amnesty a claim written beside it in the same sentence (the regression against the prior release); a shell dispatch's options consume their own arguments, so an option VALUE is no longer read as the subject and a correct answer is no longer graded as a correctness failure; naming a target is a prefix relation between whole words that must cover most of the name, so ordinary English no longer satisfies a three-character stem; an enumeration item must carry information and appear in the tool output as its own token before it can trace; and the short-reply script guard defers at the same ratio the flood check acts on, so a single non-Latin letter no longer switches the check off. [b] the per-path system-prompt modifiers stop colliding with the base prompt's own rule numbering, and four measurement-instrument items land with it. (1) Every modifier hardcoded its text as rule "4." while the base prompt had grown its own fourth rule (the fencing convention), so every assembled prompt served two rules numbered 4 and the conversational path served "4, 4, 5"; the collision lived only in the assembled string, which is why no code path and no test saw it. Modifier text now lives as rule bodies with no numbers, and the numbers are derived from the base prompt's own rule count, so adding a base rule renumbers every modifier instead of requiring six strings to be edited in step. Assembled bytes are otherwise unchanged and every path stays inside its char budget. (2) A coherent answer about the wrong subject now fails the grader's Gate A, so an answer that is fluent about something else can no longer score as correct. (3) An honest enumeration of data already in hand is no longer classified as corruption by the synthesis screen. (4) A short reply with no grammatical spine is named as corruption by the semantic health check. (5) The fabrication screen reads clauses, so a denial or an offer is not read as a claim. Decided 2026-08-13: the four instrument items land in-tree with the prompt fix; the serving process in front of the running measurement batteries is not restarted by this landing. [c] the training-set emitter writes tool calls in the ONE form the chat template renders. Measured 2026-08-13 by rendering the candidate shapes through the shipped template rather than reading its docstring: the template emits <parameter=...> blocks only under its own `arguments is mapping` guard, so the two shapes this emitter produced both rendered wrong. A dispatch gold was written as a JSON blob inside the assistant's CONTENT and rendered as literal text with no <function=> block at all -- while the template's own system block instructs, in the same rendered row, that a call must be an inner <function=></function> block; and a tool_flow history call serialised its arguments as a JSON STRING and rendered as the function name with every argument dropped. Both are now a structured call with mapping, key-sorted arguments -- the same shape for both turn kinds, which is what let one of them go unnoticed. render_gold returns a message rather than a string and is renamed render_gold_message; distribution_report tells a trained dispatch from a replayed history call by position (the history call is the one followed by the tool-role result) now that both carry the same shape. New fail-closed post-condition assert_renderable_tool_calls fires inside entry_to_sample, so every path that produces a sample is gated rather than relying on a caller to remember: it refuses literal <tool_call> text in content, non-mapping arguments, and an EMPTY arguments mapping -- empty matters as much as mapping, because an empty mapping is a mapping and still renders no parameters. Three negative controls prove the gate can fail and one positive control proves it accepts the real emission. The existing tool_flow test asserted the call's NAME and stopped, which is why the string-arguments defect survived; it now asserts the arguments too. [d] the model-server manager survives a child that will not die, and its two launch-related waits are sized from measurements instead of fixed constants. Measured 2026-08-13 on a laptop with a discrete NVIDIA card on the open-source driver: a failing health check led the watchdog to stop its own model server; the child was wedged in an uninterruptible kernel teardown reached through the GPU driver's file-close path; the post-SIGKILL `wait(timeout=5)` therefore raised subprocess.TimeoutExpired past a handler that catches only OSError, and the exception escaped stop() and restart(). The first restart attempt never reached a launch at all, and the failure it reported named a five-second timeout that exists nowhere in the launch path (the wall clock reconciles exactly: 5s reap wait + the 10s stderr-pump join the finally block runs on the way out). The remaining two attempts then refused the port — it was still unbindable 98 seconds after the kill, while the whole bind budget was 11.5 seconds — and the machine sat with no language model until a person restarted the service. Three corrections: stop() REPORTS a surviving child (naming its pid) instead of raising, and waits GPU_TEARDOWN_BUDGET_S=150s after the SIGKILL, a budget bracketed by measurement (0.25s on a quiet machine, at least 98s in the incident); the port-bind schedule is derived from that same budget rather than a hand-picked attempt count, and a free port still binds on the first probe with no delay; and the flat 60-second health wait becomes startup_budget_seconds() — the 60s floor plus 30s per gigabyte of model and projector — so a larger model cannot outgrow the launch budget silently (the 2B-with-projector pair measured 3.77-6.53s to load and now gets 114s; a 20 GB model gets about 11 minutes instead of one). Proven against reality on the box that produced the incident: a real GPU-loaded server was wedged with SIGSTOP, and the watchdog killed and REPLACED it with no person involved in 28.0s, after which the new server served a real chat completion; separately the extended port wait cleared a 40-second hold in 45.5s where the shipped schedule refused the identical hold after 11.5s. The terminal "watchdog giving up" in the incident came from an installed package built before the retry-after-exhaustion fix landed, and needed no further change here. [e] two watchdog defects in the monitor loop, both found while reviewing the serving-watchdog recovery work and outside its scope. (1) The post-restart cooldown was a bare 60-second sleep nothing could interrupt, while stop() sets the stop event and joins with a 5-second timeout — so a stop landing in that window blocked for the rest of the sleep, and at the shipped cooldown it outlasted the join entirely and returned while a thread the daemon believed stopped was still resident. Measured at the base tree with the cooldown patched to 1.5s: stop() took 1.45s; after the change the same case returns in under 0.5s and a 6-second cooldown leaves no live thread behind. The wait is now the same stop-event wait the exhaustion hold twenty lines above already used. (2) The give-up message rendered its retry interval as recovery_interval // 60 minutes, so any sub-minute interval announced "retrying every 0 minutes" — observed live at interval=1 in the red run. It now renders seconds, minutes, or both; the shipped 900-second default still reads "15 minutes", pinned by a test so the wording cannot regress into seconds. Red-first at the base tree: 5 failed / 2 passed, the two passes being deliberate controls including one proving the cooldown is a real wait and not a no-op. Serving behavior is otherwise unchanged: the restart budget, the cooldown duration, the exhaustion hold and the recovery retry are all as they were. [f] tier 2 ships the fine-tuned round-3 build of Qwen3.5-9B. The build passed the ruled acceptance bar — three fine-tuned runs against three baseline runs, the gain above the instrument's measured same-day noise, ten request families moving from never-passing to always-passing with the run spread tightening 8 to 2 — where the same round's 2B and 35B fine-tunes measured no effect and are not shipped. models-manifest.json and the in-code catalog swap the tier-2 filename and pin together (the overlay is filename-keyed, so they move in lockstep or the fail-closed pin contract locks the tier out); the vision projector is unchanged. Mirror-hosted under the new filename; the vendor never serves it, so a mirror miss fails loud rather than fetching different bytes. Two tests that read the box's installed pins manifest are made hermetic with catalog-derived pins. Decided 2026-08-14. Chain clause recorded at this composed landing: r162's byte-identity claim - that the assembled training sets reproduce byte-for-byte - ends at r168, because the tool-call serialisation fix changes the emitted bytes by design while the position-based counts reproduce unchanged (517; 257/308/115); training sets assembled and models trained before r168 rode the prior serialisation.  # r167: a judge call that fails in transport escalates the turn instead of destroying the run — the transport twin of the r-landed unparseable-reply contract. Measured 2026-08-12: one judge prompt (16,157 tokens against the judge server's 8,192 context) drew HTTP 400, the raised HTTPError passed straight through apply_judge_grading, and a completed 204-conversation baseline died in its final grading phase — three consecutive firings, the cause invisible until an instrumented run captured the runner's exit code and traceback. judge_turn now retries a transport-failed call once (a transient fault usually clears) and a second failure folds a 'flag' verdict naming the failure — the turn lands in the human-read escalation subset, Layer-1 deterministic verdicts still fold, and the floor cannot end below 'flag' for an unjudged turn. Grade-neutral for every run that previously completed: only calls that raised (and killed the run) grade differently, and only toward escalation.  # r166: the deny-recovery cells' refusal-acknowledgment vocabulary is broadened to the register the gold corpus actually teaches, and the two cells now share one constant (DENY_RECOVERY_VOCAB in intergen/tests/conversations.py) so they cannot drift apart. The old 13-phrase contains_any list accepted only 6 of the corpus's own 34 deny-recovery gold replies — the eval demanded literal substrings ("need approval", "not able") that the gold's natural phrasing ("needs your approval", "wasn't able") never contains, so a reply matching the trained register graded as evasive. Measured before landing: gold acceptance 6/34 -> 34/34; against sealed eval replies, 9 of 10 previously-reddened denial recoveries now pass while the one genuinely evasive reply (a denial misreported as a lookup result) still fails — the broadened check still discriminates. Every added phrase is a denial acknowledgment on its own; the trace-backed gate_action=deny assertion remains the hard falsifier for fabricated success. Decided 2026-08-12: the assertion vocabulary moves rather than the gold — a check that fails 28 of 34 of its own gold answers measures the wrong thing — and the affected cell family re-baselines on the next baseline run rather than comparing across instruments.  # r165: risk classification for a mixed-capability tool is per ACTION end to end, and a review prompt now states the class it is actually asking about. Three measured defects, one observed live: a manage_services call with action "list" — a read — raised the approval modal, and the modal said the request changes the system. (1) The schema declared an action enum and nothing enforced it, so a value the tool does not define passed validation, matched neither the read-only nor the state-changing action list, and took the unrecognised-action default of CONFIRM; on a tool that escalates via pkexec that default is the privileged tier, so a read reached an administrator-approval prompt for `systemctl list`, a verb systemd refuses outright. BaseTool.validate_arguments now enforces every declared enum, before the dispatcher gate and before anything executes — an undefined value is an input error reported with the accepted values, not a risk put to a person. (2) manage_services gains ACTION_ALIASES (list -> list-units, and two siblings), canonicalised ahead of classification so a colloquial spelling of a read classifies and runs as that read; manage_packages already accepted "list", so the two tools had disagreed on the most basic query. The enum is now derived from AUTO_ACTIONS | CONFIRM_ACTIONS | ACTION_ALIASES, so an accepted value is a declared value. (3) The consent surfaces could not name the class at all: DispatchDecision carried no risk tier, so the zenity header was the fixed string "a system action you did not directly request" and the branded dialog's risk copy was keyed on provenance alone, asserting "It still changes your system" for reads. DispatchDecision now carries risk_tier, the dialog protocol carries it to the renderer, and origin and effect are separate sentences derived from the decision. Decided 2026-08-12: unrecognised must stay fail-closed but must not be described as understood — an unclassified tier keeps the severe wording everywhere, so a missing classification can never be what softens a prompt. State-changing actions are untouched: they still classify privileged and still always prompt.  # r164: the round-2 training bank lands in-tree beside the round-1 bank. Three lanes, each aimed at a defect the honest rounds 3-4 measured (2026-08-12): class 7 honesty contrastives (41 entries - read-only state reports, completed-action claims, and admitted failures in same-subject pairs, the counter-signal to the two regressed honesty cells), class 8 assembled multi-turn context (16 conversations of 4-6 turns - 100% of round-1's grade movement was single-turn and the multi-turn eval slice scored zero PASS in both honest rounds), class 9 long tool-output synthesis (11 entries - journal, package-history, unit-listing, boot-blame, and search outputs answered in a few faithful lines). Combined 585-entry training input emitted fail-closed and boundary-proven through all three model tiers' tokenizers; deduplicated under the qualified rule decided 2026-08-11 (0 qualified drops; all 54 over-0.85 pairs are opposite-intent or different-structure spares).
# r163: the detected hardware tier now governs the serving path — "auto" gpu_layers resolves to CPU-only serving (0 layers) on Tier-1 hardware, full offload on higher tiers; an explicit integer in config remains the last word on every tier (the 2026-07-31 user-control contract, unchanged); unknown/failed detection keeps the offload default, matching the daemon's assume-Tier-2 posture. Decided 2026-08-12: the hardware-detection mechanism exists to guarantee an adequate user experience, so its verdict governs how a model is served, not just which model is selected — the Tier-1 model is sized specifically for CPU serving, and measurement on Tier-1 integrated-GPU hardware showed Vulkan offload there is both slower than CPU (retry ladders over degenerate output) and, on one measured device class, intermittently corrupt. No probe, no audition, no fallback machinery ships — the tier verdict alone decides the default.
# r162: the round-1 training bank lands in-tree (intergen/tests/training_bank/) — the corpus must not live only in sealed evidence directories. Six behavior classes plus a retention lane: 289 imperative-dispatch entries with contrastive twins, 128 approval-flow/deny-recovery, 97 fragments/teach-then-offer/frustration, 47 retention, deduplicated to the 517-entry training input by a qualified embedding rule (over-0.85 cosine drops only identical-tool-target, matching-turn-structure pairs — bare 0.85 measurably conflates opposite-intent same-subject pairs, the exact contrasts the corpus teaches; decided 2026-08-11). Generators are deterministic and hard-fail on held-out/validation eval user texts, banned subjects, and internal implementation vocabulary in gold, so eval contamination is refused rather than trusted to review. Landing proof: the landed bank re-emitted through the landed emitter reproduces the sealed SFT corpus byte-identically (517 samples; dispatch 257 / prose 308 / dispatch-history 115). The serving system prompt is deliberately NOT stored in the bank directory — it is extracted from the shipped composer at the tree being trained, and the trainer applies the same chat template the server uses with the real tool-schema array, so training-time and serving-time bytes match by construction.
content_hash: 8bbd4af50a0a5b91
description: InterGen AI assistant — system-aware, local-first, hardware-adaptive
license: GPL-3.0-or-later
homepage: https://github.com/InterGenJLU/intergenos
tier: ai
build_style: custom
source: []
# First-party source lives in the top-level intergen/ tree (build.sh copies
# from /mnt/intergenos/intergen/). Folded into the skip-built fingerprint so
# an edit there forces a rebuild instead of being silently skipped.
source_tree:
  - intergen
dependencies:
  build: []
  host: []
  runtime:
  - python
  - llama-cpp
  - pyyaml
  - numpy
  - aiohttp
  - prompt-toolkit
  - rich
  # GUI runtime deps — ship /usr/bin/intergen-panel (GTK4/WebKit-6.0 window)
  # + the intergen@intergenos.org gnome-shell extension. The panel does
  # `import gi` (pygobject3) and embeds a WebKit-6.0 WebView (webkitgtk,
  # USE_GTK4=ON) in a GTK4 window (gtk4).
  - gtk4
  - webkitgtk
  - gnome-shell-extensions
  - pygobject3
  # zenity is the GUI consent modal the permission gate shells out to on
  # non-web surfaces (review_modal.py -> zenity --question); without it a
  # gated action on the D-Bus/CLI/voice path cannot be approved.
  - zenity
  # logrotate consumes /etc/logrotate.d/intergen-tool-dispatch, which this
  # package installs (build.sh) and intergen(1) documents as the rotation
  # mechanism for the tool-dispatch audit log. The snippet shipped from the
  # start; the consumer did not exist until logrotate was packaged, so the
  # audit log had no bound on its growth. Declared here so an install that
  # carries InterGen also carries the thing that rotates its log.
  - logrotate
verify_paths:
  - /usr/lib/python3.14/site-packages/intergen
  - /usr/lib/python3.14/site-packages/intergen/tools
  # M4 gate ground-truth (Ruling 3): the capability-claim + read-only-state gates
  # read these via Path(__file__)/data/; missing = a silently-degraded gate.
  - /usr/lib/python3.14/site-packages/intergen/data/capability-surface.json
  - /usr/lib/python3.14/site-packages/intergen/data/readonly-state-map.json
  # Secondary-AMD-GPU runtime-PM pin (desktop monitor-layout integrity on
  # multi-GPU systems; the rule file documents the measured mechanism).
  - /usr/lib/udev/rules.d/70-intergen-compute-gpu-pm.rules
  # Scoped runtime-PM grant: the "video" group may write power/control on
  # display-controller PCI devices, so the daemon can hold its serving card
  # awake while a model is on it and restore the setting afterwards.
  - /usr/lib/udev/rules.d/71-intergen-gpu-runtime-pm.rules
  - /usr/lib/python3.14/site-packages/intergen/web
  - /usr/lib/python3.14/site-packages/intergen/console
  - /usr/lib/python3.14/site-packages/intergen/panel
  - /usr/bin/intergen
  - /usr/bin/intergen-panel
  - /usr/share/gnome-shell/extensions/intergen@intergenos.org
  - /usr/share/gnome-shell/extensions/intergen@intergenos.org/schemas/gschemas.compiled
