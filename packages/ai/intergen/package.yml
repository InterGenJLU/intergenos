name: intergen
version: "0.1.0"
release: 183  # r183: no behaviour change: comment, docstring and test-README wording across intergen/ and intergen/tests/ now uses plain engineering terms in place of project-internal shorthand. Text only; no code, no interface, no data, no model artefact.  # r182: test-fixture wording only: the system-information formatter test used the previous release's identity string as its example, which read as a statement of the current release and would go stale at every release. It now uses a deliberately synthetic value. No shipped code changed.  # r181: no intergen code changed. intergen's content fingerprint folds its own tree; a wording-alignment pass over the same two test READMEs the r180 note describes standardized the reviewer-role terms used there. Documentation text only; no code, no interface.  # r180: no intergen code changed. intergen's content fingerprint folds its own tree, and the documentation-truth pass reworded two test-corpus READMEs in it: tests/demand_corpus/README.md now states the M8-6 requirement as a dated decision rather than a role instruction, and tests/judge_calibration/README.md names the independent annotator as ground truth. Documentation text only; no code, no interface, no data.  # r179: destructive-policy-manifest.json gains the system_binaries never-list category (decided 2026-08-16) — prefix protection for /usr/bin, /usr/sbin, /usr/lib, /usr/lib64 and the FHS symlink spellings; re-signed with the release key; a shipped-manifest test pins the entries. The manifest pair ships in this package, so the archive bytes change with it.  # r178: destructive-policy-manifest.json description/notes text corrected to state installed-system protections truthfully (detached-signature verification + root ownership; dm-verity seals live/install media only) and re-signed with the release key; path lists and policy semantics unchanged. The manifest and its .asc ship in this package, so the archive bytes change with them.  # r177: no behaviour change: two test-fixture strings neutralized in the pre-release pass — a canned hostname answer in test_scenario_responsiveness.py generalized, and a docstring's internal ledger reference in test_m7_trust_priority.py reworded. Fixture/docstring text only; no code, no interface.  # r176: no behaviour change: one section comment in intergen/web_server.py reworded from 'seamless reads' to 'read-only actions' during the pre-release register pass. Comment text only; no code, no interface, no data.  # r175: every displayed model size is on ONE convention: decimal GB of the real payload bytes. Measured at r174 against the shipped manifest, one tier-3 file displayed three different sizes (catalog 20.5 - a binary reading, hardware table 21.0 - matching neither convention, status 22.0 decimal) - a 1.5 GB spread larger than the discrepancy r173 closed. The catalog and hardware-table constants move to the decimal values of the real byte counts (1.3 / 5.6 / 22.0), the tier-table docstring and the VRAM-rationale comments follow, and the offline-status test fixture now carries the real tier-3 byte count so its expectation states a size a shipped model actually has. Display-only: no gate or free-space check consumes these values (verified by review before the change).  # r174: the offline-status test's size expectation moves to the decimal-GB convention r173 adopted (the fixture's 20 GiB of bytes renders 21.5 decimal GB) — the r173 display change was landed with its own suite run still in flight and this pin correctly caught the unmoved expectation; the test's substance (integrity NOT checked offline, the start/logs guidance) is untouched.  # r173: second review-fold, all guard/test/display level, zero serving-behaviour change. (1) A new preflight test verifies EVERY in-tree artifact+signature pair (discovered by the sibling rule) against the tree's own pinned keyring via gpgv — the class it kills was measured on this very tree: the tier-2 pin swap changed models-manifest.json without a re-sign and the BAD pair survived branch gates, a composed landing, and one independent review, corrected only by a scheduled ceremony; the test proven RED against that exact historical pair and carries a tampered-artifact positive control. (2) The refusal escape-route pin gains an author-path case (the same probes through entry_to_sample, where the gate actually fires). (3) `intergen status` daemon-down branch now prints the model size in decimal GB matching the tier table — the binary GiB labelled GB showed the same file 0.4 GB smaller.  # r172: release-review findings folded, all string/comment/guard level, zero behaviour change. (1) The tier-2 size shown to users moves 5.5 to 5.6 GB, matching the shipped payload's real 5,629,108,608 bytes (both the docstring table and the catalog display value). (2) A new guard test pins the catalog-to-manifest lockstep in the direction that degrades QUIETLY: a manifest row missing for a catalog filename caps the tier down silently at provisioning, so the suite now fails loud on that pair; proven red by removing the tier-2 row and green on the shipped pair. (3) The port-bind failure text now states the schedule's real total (155.5s) instead of a constant it does not consume. (4) A protocol-doc example payload and a license-test comment move to the shipped tier-2 filename.  # r171: review findings from the pre-landing pass, folded before the build proves the tree. (1) The literal-marker refusal in the training-set emitter advertised an escape route its own gate refuses: it told an author a gold quoting tool-call syntax could ride in 'a prose gold about the format', but a prose gold's content becomes an assistant message — exactly the position the refusal fires on — so following the advice reproduced the refusal. Measured through the real gate: user turn PASSES, tool result PASSES, prose gold REFUSED. The message and docstring now name only the two carriers the gate accepts and state the prose-gold impossibility plainly. (2) A new test binds the advice to the gate's behaviour (each advertised carrier exercised through the real gate; the wording pinned) — it fails against the prior message, proven red-first 1/3. (3) Two comment direction errors in the watchdog cooldown work corrected: the exhaustion hold is ABOVE the cooldown wait, not below, in both the loop comment and the test module docstring. No behaviour change anywhere in this release.  # r170: the tier-2 model-manifest signature is refreshed over the r168 payload swap: models-manifest.json.asc re-signed as a detached OpenPGP signature and verified against the project primary key at delivery, so the shipped pin file and its signature verify as a pair again; the manifest bytes themselves are unchanged from the r168 swap.  # r169: the training-set emitter's docstrings state WHERE their rendering claim holds. Three of them asserted, without qualification, that tool-call arguments serialised as a JSON string render the function name with every argument dropped. That is true of DIRECT template application -- what this training pipeline does, applying internvl-tool-template.jinja itself over the emitted JSONL, where the template's `arguments is mapping` guard is false for a string -- and it is NOT true of the serving engine. Measured 2026-08-13 against llama.cpp b8796 serving that same template (sha256 7f0e529032c25183..., verified identical installed, in-tree, and in two running servers' memory): llama-server parses function.arguments as JSON before applying the template, so a JSON-object string and the mapping render byte-identically -- identical <tool_call> regions (sha256 78669ee3c16d9598...) and identical prompt_tokens (87 for both, against 66 for a call carrying no parameters, which is the control proving the measurement can move). The engine states the mechanism itself: an arguments string that is not valid JSON is refused with "Failed to parse tool call arguments as JSON", and a string that parses to a scalar or an array is accepted but renders no parameter blocks. The consequence recorded on these lines is that LLMRouter.continue_after_tool_call must NOT be changed to send a bare mapping: json.dumps is what the OpenAI wire format specifies for that field, and a mapping works only because this engine is lenient about it. render_tool_flow's "Mirrors LLMRouter.continue_after_tool_call" now reads "Mirrors what it RENDERS" and says why the two Python values differ while the rendered bytes do not. The corpus-side gate is unchanged and still required, because nothing in the training path does the parsing the engine does. Also: the literal-<tool_call> refusal message and its docstring now name the escape route for a gold that legitimately QUOTES tool-call syntax -- move that text out of assistant content, into a user turn, a tool result, or a prose gold, since assistant content is the only position the template turns into a rendered row of the model's own output. Docstrings and one refusal message only; no behaviour change.  # r168: six change sets composed into one release; each note follows in landing order. [a] four measurement-instrument items for round 2. (1) A coherent reply about the WRONG subject now fails Gate A. Asked about one service, answered confidently about another, such a reply satisfies every quality dimension a judge reads because it really is coherent; what it fails is structural, so the check is an assertion, not prompt text. no_wrong_target binds the answer to the subject the turn's dispatch acted on, deriving its targets from the turn's own tool arguments, so it carries no subject list and covers a service nobody has named before the day a cell dispatches against it; argument keys that carry a verb are excluded, and a command with no subject of its own produces no assertion at all. (2) An honest enumeration of data already in hand is no longer read as corruption. The one measured false positive of the fast-path synthesis screen was a real summary of a 979-package listing, whose many short items look to a repetition detector exactly like a token loop; the synthesis lanes hold the ground truth the model was asked to phrase, so an enumeration whose items trace back to that text is honest however long it runs, while items that appear nowhere in it stay rejected. Narrow by construction: only a repetition-shaped flag can be excused, only with source text in hand, only when the reply really enumerates, and never for a text-shape gate reason. (3) Short replies with no grammatical spine are named as corruption. A reply of at most eight words carrying no verb, no number, no identifier and no terminal punctuation is not a sentence — the word-bag class that every other instrument passed because each needs either length or structural damage. Shape only, never meaning, with a script guard that leaves non-Latin output to the flood check. (4) The fabrication screen now reads clauses, so a denial or an offer is not a claim. A bare present-progressive act claim is caught, but only when it opens its own clause and that clause is neither negated nor interrogative; the same clause scope makes the module's long-documented promise true for every alternation, including the passive one that fired on the honest denial its own docstring cites. Cross-review then returned five defects in these four items, all fixed on this branch before it landed and each reproduced against the reviewed tree first: a comma-joined clause now ends the fabrication screen's clause, so a denial can no longer amnesty a claim written beside it in the same sentence (the regression against the prior release); a shell dispatch's options consume their own arguments, so an option VALUE is no longer read as the subject and a correct answer is no longer graded as a correctness failure; naming a target is a prefix relation between whole words that must cover most of the name, so ordinary English no longer satisfies a three-character stem; an enumeration item must carry information and appear in the tool output as its own token before it can trace; and the short-reply script guard defers at the same ratio the flood check acts on, so a single non-Latin letter no longer switches the check off. [b] the per-path system-prompt modifiers stop colliding with the base prompt's own rule numbering, and four measurement-instrument items land with it. (1) Every modifier hardcoded its text as rule "4." while the base prompt had grown its own fourth rule (the fencing convention), so every assembled prompt served two rules numbered 4 and the conversational path served "4, 4, 5"; the collision lived only in the assembled string, which is why no code path and no test saw it. Modifier text now lives as rule bodies with no numbers, and the numbers are derived from the base prompt's own rule count, so adding a base rule renumbers every modifier instead of requiring six strings to be edited in step. Assembled bytes are otherwise unchanged and every path stays inside its char budget. (2) A coherent answer about the wrong subject now fails the grader's Gate A, so an answer that is fluent about something else can no longer score as correct. (3) An honest enumeration of data already in hand is no longer classified as corruption by the synthesis screen. (4) A short reply with no grammatical spine is named as corruption by the semantic health check. (5) The fabrication screen reads clauses, so a denial or an offer is not read as a claim. Decided 2026-08-13: the four instrument items land in-tree with the prompt fix; the serving process in front of the running measurement batteries is not restarted by this landing. [c] the training-set emitter writes tool calls in the ONE form the chat template renders. Measured 2026-08-13 by rendering the candidate shapes through the shipped template rather than reading its docstring: the template emits <parameter=...> blocks only under its own `arguments is mapping` guard, so the two shapes this emitter produced both rendered wrong. A dispatch gold was written as a JSON blob inside the assistant's CONTENT and rendered as literal text with no <function=> block at all -- while the template's own system block instructs, in the same rendered row, that a call must be an inner <function=></function> block; and a tool_flow history call serialised its arguments as a JSON STRING and rendered as the function name with every argument dropped. Both are now a structured call with mapping, key-sorted arguments -- the same shape for both turn kinds, which is what let one of them go unnoticed. render_gold returns a message rather than a string and is renamed render_gold_message; distribution_report tells a trained dispatch from a replayed history call by position (the history call is the one followed by the tool-role result) now that both carry the same shape. New fail-closed post-condition assert_renderable_tool_calls fires inside entry_to_sample, so every path that produces a sample is gated rather than relying on a caller to remember: it refuses literal <tool_call> text in content, non-mapping arguments, and an EMPTY arguments mapping -- empty matters as much as mapping, because an empty mapping is a mapping and still renders no parameters. Three negative controls prove the gate can fail and one positive control proves it accepts the real emission. The existing tool_flow test asserted the call's NAME and stopped, which is why the string-arguments defect survived; it now asserts the arguments too. [d] the model-server manager survives a child that will not die, and its two launch-related waits are sized from measurements instead of fixed constants. Measured 2026-08-13 on a laptop with a discrete NVIDIA card on the open-source driver: a failing health check led the watchdog to stop its own model server; the child was wedged in an uninterruptible kernel teardown reached through the GPU driver's file-close path; the post-SIGKILL `wait(timeout=5)` therefore raised subprocess.TimeoutExpired past a handler that catches only OSError, and the exception escaped stop() and restart(). The first restart attempt never reached a launch at all, and the failure it reported named a five-second timeout that exists nowhere in the launch path (the wall clock reconciles exactly: 5s reap wait + the 10s stderr-pump join the finally block runs on the way out). The remaining two attempts then refused the port — it was still unbindable 98 seconds after the kill, while the whole bind budget was 11.5 seconds — and the machine sat with no language model until a person restarted the service. Three corrections: stop() REPORTS a surviving child (naming its pid) instead of raising, and waits GPU_TEARDOWN_BUDGET_S=150s after the SIGKILL, a budget bracketed by measurement (0.25s on a quiet machine, at least 98s in the incident); the port-bind schedule is derived from that same budget rather than a hand-picked attempt count, and a free port still binds on the first probe with no delay; and the flat 60-second health wait becomes startup_budget_seconds() — the 60s floor plus 30s per gigabyte of model and projector — so a larger model cannot outgrow the launch budget silently (the 2B-with-projector pair measured 3.77-6.53s to load and now gets 114s; a 20 GB model gets about 11 minutes instead of one). Proven against reality on the box that produced the incident: a real GPU-loaded server was wedged with SIGSTOP, and the watchdog killed and REPLACED it with no person involved in 28.0s, after which the new server served a real chat completion; separately the extended port wait cleared a 40-second hold in 45.5s where the shipped schedule refused the identical hold after 11.5s. The terminal "watchdog giving up" in the incident came from an installed package built before the retry-after-exhaustion fix landed, and needed no further change here. [e] two watchdog defects in the monitor loop, both found while reviewing the serving-watchdog recovery work and outside its scope. (1) The post-restart cooldown was a bare 60-second sleep nothing could interrupt, while stop() sets the stop event and joins with a 5-second timeout — so a stop landing in that window blocked for the rest of the sleep, and at the shipped cooldown it outlasted the join entirely and returned while a thread the daemon believed stopped was still resident. Measured at the base tree with the cooldown patched to 1.5s: stop() took 1.45s; after the change the same case returns in under 0.5s and a 6-second cooldown leaves no live thread behind. The wait is now the same stop-event wait the exhaustion hold twenty lines above already used. (2) The give-up message rendered its retry interval as recovery_interval // 60 minutes, so any sub-minute interval announced "retrying every 0 minutes" — observed live at interval=1 in the red run. It now renders seconds, minutes, or both; the shipped 900-second default still reads "15 minutes", pinned by a test so the wording cannot regress into seconds. Red-first at the base tree: 5 failed / 2 passed, the two passes being deliberate controls including one proving the cooldown is a real wait and not a no-op. Serving behavior is otherwise unchanged: the restart budget, the cooldown duration, the exhaustion hold and the recovery retry are all as they were. [f] tier 2 ships the fine-tuned round-3 build of Qwen3.5-9B. The build passed the ruled acceptance bar — three fine-tuned runs against three baseline runs, the gain above the instrument's measured same-day noise, ten request families moving from never-passing to always-passing with the run spread tightening 8 to 2 — where the same round's 2B and 35B fine-tunes measured no effect and are not shipped. models-manifest.json and the in-code catalog swap the tier-2 filename and pin together (the overlay is filename-keyed, so they move in lockstep or the fail-closed pin contract locks the tier out); the vision projector is unchanged. Mirror-hosted under the new filename; the vendor never serves it, so a mirror miss fails loud rather than fetching different bytes. Two tests that read the box's installed pins manifest are made hermetic with catalog-derived pins. Decided 2026-08-14. Chain clause recorded at this composed landing: r162's byte-identity claim - that the assembled training sets reproduce byte-for-byte - ends at r168, because the tool-call serialisation fix changes the emitted bytes by design while the position-based counts reproduce unchanged (517; 257/308/115); training sets assembled and models trained before r168 rode the prior serialisation.  # r167: a judge call that fails in transport escalates the turn instead of destroying the run — the transport twin of the r-landed unparseable-reply contract. Measured 2026-08-12: one judge prompt (16,157 tokens against the judge server's 8,192 context) drew HTTP 400, the raised HTTPError passed straight through apply_judge_grading, and a completed 204-conversation baseline died in its final grading phase — three consecutive firings, the cause invisible until an instrumented run captured the runner's exit code and traceback. judge_turn now retries a transport-failed call once (a transient fault usually clears) and a second failure folds a 'flag' verdict naming the failure — the turn lands in the human-read escalation subset, Layer-1 deterministic verdicts still fold, and the floor cannot end below 'flag' for an unjudged turn. Grade-neutral for every run that previously completed: only calls that raised (and killed the run) grade differently, and only toward escalation.  # r166: the deny-recovery cells' refusal-acknowledgment vocabulary is broadened to the register the gold corpus actually teaches, and the two cells now share one constant (DENY_RECOVERY_VOCAB in intergen/tests/conversations.py) so they cannot drift apart. The old 13-phrase contains_any list accepted only 6 of the corpus's own 34 deny-recovery gold replies — the eval demanded literal substrings ("need approval", "not able") that the gold's natural phrasing ("needs your approval", "wasn't able") never contains, so a reply matching the trained register graded as evasive. Measured before landing: gold acceptance 6/34 -> 34/34; against sealed eval replies, 9 of 10 previously-reddened denial recoveries now pass while the one genuinely evasive reply (a denial misreported as a lookup result) still fails — the broadened check still discriminates. Every added phrase is a denial acknowledgment on its own; the trace-backed gate_action=deny assertion remains the hard falsifier for fabricated success. Decided 2026-08-12: the assertion vocabulary moves rather than the gold — a check that fails 28 of 34 of its own gold answers measures the wrong thing — and the affected cell family re-baselines on the next baseline run rather than comparing across instruments.  # r165: risk classification for a mixed-capability tool is per ACTION end to end, and a review prompt now states the class it is actually asking about. Three measured defects, one observed live: a manage_services call with action "list" — a read — raised the approval modal, and the modal said the request changes the system. (1) The schema declared an action enum and nothing enforced it, so a value the tool does not define passed validation, matched neither the read-only nor the state-changing action list, and took the unrecognised-action default of CONFIRM; on a tool that escalates via pkexec that default is the privileged tier, so a read reached an administrator-approval prompt for `systemctl list`, a verb systemd refuses outright. BaseTool.validate_arguments now enforces every declared enum, before the dispatcher gate and before anything executes — an undefined value is an input error reported with the accepted values, not a risk put to a person. (2) manage_services gains ACTION_ALIASES (list -> list-units, and two siblings), canonicalised ahead of classification so a colloquial spelling of a read classifies and runs as that read; manage_packages already accepted "list", so the two tools had disagreed on the most basic query. The enum is now derived from AUTO_ACTIONS | CONFIRM_ACTIONS | ACTION_ALIASES, so an accepted value is a declared value. (3) The consent surfaces could not name the class at all: DispatchDecision carried no risk tier, so the zenity header was the fixed string "a system action you did not directly request" and the branded dialog's risk copy was keyed on provenance alone, asserting "It still changes your system" for reads. DispatchDecision now carries risk_tier, the dialog protocol carries it to the renderer, and origin and effect are separate sentences derived from the decision. Decided 2026-08-12: unrecognised must stay fail-closed but must not be described as understood — an unclassified tier keeps the severe wording everywhere, so a missing classification can never be what softens a prompt. State-changing actions are untouched: they still classify privileged and still always prompt.  # r164: the round-2 training bank lands in-tree beside the round-1 bank. Three lanes, each aimed at a defect the honest rounds 3-4 measured (2026-08-12): class 7 honesty contrastives (41 entries - read-only state reports, completed-action claims, and admitted failures in same-subject pairs, the counter-signal to the two regressed honesty cells), class 8 assembled multi-turn context (16 conversations of 4-6 turns - 100% of round-1's grade movement was single-turn and the multi-turn eval slice scored zero PASS in both honest rounds), class 9 long tool-output synthesis (11 entries - journal, package-history, unit-listing, boot-blame, and search outputs answered in a few faithful lines). Combined 585-entry training input emitted fail-closed and boundary-proven through all three model tiers' tokenizers; deduplicated under the qualified rule decided 2026-08-11 (0 qualified drops; all 54 over-0.85 pairs are opposite-intent or different-structure spares).
# r163: the detected hardware tier now governs the serving path — "auto" gpu_layers resolves to CPU-only serving (0 layers) on Tier-1 hardware, full offload on higher tiers; an explicit integer in config remains the last word on every tier (the 2026-07-31 user-control contract, unchanged); unknown/failed detection keeps the offload default, matching the daemon's assume-Tier-2 posture. Decided 2026-08-12: the hardware-detection mechanism exists to guarantee an adequate user experience, so its verdict governs how a model is served, not just which model is selected — the Tier-1 model is sized specifically for CPU serving, and measurement on Tier-1 integrated-GPU hardware showed Vulkan offload there is both slower than CPU (retry ladders over degenerate output) and, on one measured device class, intermittently corrupt. No probe, no audition, no fallback machinery ships — the tier verdict alone decides the default.
# r162: the round-1 training bank lands in-tree (intergen/tests/training_bank/) — the corpus must not live only in sealed evidence directories. Six behavior classes plus a retention lane: 289 imperative-dispatch entries with contrastive twins, 128 approval-flow/deny-recovery, 97 fragments/teach-then-offer/frustration, 47 retention, deduplicated to the 517-entry training input by a qualified embedding rule (over-0.85 cosine drops only identical-tool-target, matching-turn-structure pairs — bare 0.85 measurably conflates opposite-intent same-subject pairs, the exact contrasts the corpus teaches; decided 2026-08-11). Generators are deterministic and hard-fail on held-out/validation eval user texts, banned subjects, and internal implementation vocabulary in gold, so eval contamination is refused rather than trusted to review. Landing proof: the landed bank re-emitted through the landed emitter reproduces the sealed SFT corpus byte-identically (517 samples; dispatch 257 / prose 308 / dispatch-history 115). The serving system prompt is deliberately NOT stored in the bank directory — it is extracted from the shipped composer at the tree being trained, and the trainer applies the same chat template the server uses with the real tool-schema array, so training-time and serving-time bytes match by construction.
content_hash: 5da6748727650297
description: InterGen AI assistant — system-aware, local-first, hardware-adaptive
license: GPL-3.0-or-later
homepage: https://github.com/InterGenJLU/intergenos
tier: ai
build_style: custom
source: []
# First-party source lives in the top-level intergen/ tree (build.sh copies
# from /mnt/intergenos/intergen/). Folded into the skip-built fingerprint so
# an edit there forces a rebuild instead of being silently skipped.
source_tree:
  - intergen
dependencies:
  build: []
  host: []
  runtime:
  - python
  - llama-cpp
  - pyyaml
  - numpy
  - aiohttp
  - prompt-toolkit
  - rich
  # GUI runtime deps — ship /usr/bin/intergen-panel (GTK4/WebKit-6.0 window)
  # + the intergen@intergenos.org gnome-shell extension. The panel does
  # `import gi` (pygobject3) and embeds a WebKit-6.0 WebView (webkitgtk,
  # USE_GTK4=ON) in a GTK4 window (gtk4).
  - gtk4
  - webkitgtk
  - gnome-shell-extensions
  - pygobject3
  # zenity is the GUI consent modal the permission gate shells out to on
  # non-web surfaces (review_modal.py -> zenity --question); without it a
  # gated action on the D-Bus/CLI/voice path cannot be approved.
  - zenity
  # logrotate consumes /etc/logrotate.d/intergen-tool-dispatch, which this
  # package installs (build.sh) and intergen(1) documents as the rotation
  # mechanism for the tool-dispatch audit log. The snippet shipped from the
  # start; the consumer did not exist until logrotate was packaged, so the
  # audit log had no bound on its growth. Declared here so an install that
  # carries InterGen also carries the thing that rotates its log.
  - logrotate
verify_paths:
  - /usr/lib/python3.14/site-packages/intergen
  - /usr/lib/python3.14/site-packages/intergen/tools
  # M4 gate ground-truth (Ruling 3): the capability-claim + read-only-state gates
  # read these via Path(__file__)/data/; missing = a silently-degraded gate.
  - /usr/lib/python3.14/site-packages/intergen/data/capability-surface.json
  - /usr/lib/python3.14/site-packages/intergen/data/readonly-state-map.json
  # Secondary-AMD-GPU runtime-PM pin (desktop monitor-layout integrity on
  # multi-GPU systems; the rule file documents the measured mechanism).
  - /usr/lib/udev/rules.d/70-intergen-compute-gpu-pm.rules
  - /usr/lib/python3.14/site-packages/intergen/web
  - /usr/lib/python3.14/site-packages/intergen/console
  - /usr/lib/python3.14/site-packages/intergen/panel
  - /usr/bin/intergen
  - /usr/bin/intergen-panel
  - /usr/share/gnome-shell/extensions/intergen@intergenos.org
  - /usr/share/gnome-shell/extensions/intergen@intergenos.org/schemas/gschemas.compiled
