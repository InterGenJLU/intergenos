name: typeguard
# Upstream latest stable.
version: "4.5.2"
release: 1
description: Run-time type checking for Python functions
license: MIT
homepage: https://github.com/agronholm/typeguard
tier: ai
iso_include: false
build_style: custom
install_func: do_install
source:
- url: https://files.pythonhosted.org/packages/67/1c/dfba5c4633cafc4c701f237d2ba63b416805047fd6d96aab4cfc40969f98/typeguard-4.5.2.tar.gz
  sha256: 5a16dcac23502039299c97c8941651bc33d7ea8cc4b2f7d6bbb1b528f6eea423
dependencies:
  build:
  - setuptools
  host: []
  runtime:
  - typing-extensions
  # importlib_metadata is python_version<3.10 marker-gated (stdlib on python3.14).
verify_paths:
  - /usr/lib/python3.14/site-packages/typeguard/__init__.py
  - /usr/lib/python3.14/site-packages/typeguard/_checkers.py
