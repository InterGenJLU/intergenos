name: xformers
version: "0.0.35"
release: 1
description: Hackable and optimized transformer building blocks (attention kernels)
license: BSD-3-Clause
homepage: https://github.com/facebookresearch/xformers
tier: ai
iso_include: false  # training apparatus — mirror-only (decided 2026-07-20)
build_style: custom
install_func: do_install
# torch>=2.10 per its metadata — compatible with the 2.10.0 pin; unsloth
# requires xformers>=0.0.27.post2 on linux/x86_64 (satisfied).
# ⚠ EXECUTION-VERIFY (recorded, not assumed): (1) whether the PyPI sdist is
# submodule-complete (xformers vendors kernel deps as submodules; if the
# sdist lacks them the source moves to a github archive + Rule-5 staged
# pins — surface, don't improvise); (2) the ROCm build surface — xformers'
# fastest paths are CUDA-first; on this stack the acceptance bar is import +
# unsloth's attention path selecting a WORKING backend (aotriton/SDPA
# fallback included), measured at the proof build.
source:
- url: https://files.pythonhosted.org/packages/source/x/xformers/xformers-${version}.tar.gz
  sha256: f7fc183a58e4bf0e2ae339a18fb1b1d4a37854c0f2545b4f360fef001646ab76
dependencies:
  build:
  - pytorch
  - setuptools
  - numpy
  host: []
  runtime:
  - pytorch
  - numpy
verify_paths:
  - /usr/lib/python3.14/site-packages/xformers/__init__.py
  - /usr/lib/python3.14/site-packages/xformers/ops
