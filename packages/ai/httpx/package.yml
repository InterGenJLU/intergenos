name: httpx
# Upstream latest stable; huggingface-hub/datasets require httpx<1 (satisfied).
version: "0.28.1"
release: 1
description: Next-generation HTTP client for Python
license: BSD-3-Clause
homepage: https://github.com/encode/httpx
tier: ai
iso_include: false
build_style: custom
install_func: do_install
source:
- url: https://files.pythonhosted.org/packages/b1/df/48c586a5fe32a0f01324ee087459e112ebb7224f646c0b5023f5e79e9956/httpx-0.28.1.tar.gz
  sha256: 75e98c5f16b0f35b567856f597f06ff2270a374470a5c2392242528e3e3e42fc
dependencies:
  build:
  - hatchling
  - hatch-fancy-pypi-readme
  host: []
  runtime:
  - anyio
  - httpcore
  - idna
  - python-certifi
  # certifi resolves via the tree's python-certifi; idna via the tree's idna.
verify_paths:
  - /usr/lib/python3.14/site-packages/httpx/__init__.py
  - /usr/lib/python3.14/site-packages/httpx/_client.py
