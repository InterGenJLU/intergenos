name: mariadb
version: "11.8.6"
release: 6  # r6: NUMA memory placement is built in — -DWITH_NUMA=ON, with numactl declared as a build and runtime dependency. The recipe had it off and stated that libnuma was absent from the tree; packages/core/numactl has been present since the initial import, builds in the core-extra phase before this tier, and ships numa.h, numaif.h and libnuma.so, which is exactly what cmake/numa.cmake probes for. ON rather than AUTO so a missing dependency halts the build instead of silently producing a server without the innodb-numa-interleave setting. The server binaries change, so the release advances with them.  # r5: the duplicate systemd daemon-reload is removed from post_install; pkm's canonical systemd-daemon-reload hook owns that operation, is armed by this package's own unit payload, skips a root no manager owns, and records its own result.  # r4: deprecated licence identifiers replaced with the modern SPDX forms after reading the pinned tarball's own grants — README.md states the server is available "only under version 2 ... (I.e. Without the 'any later version' clause.)" (only), while the bundled client library's headers grant the Library GPL "version 2 of the License, or (at your option) any later version" against the LGPL 2.1 text it ships (or-later). Recipe metadata only, but the archive's .PKGINFO carries license=, so the shipped bytes change and the release advances with them. r3: runtime deps renamed to shipped namespace (F25 gate wave 2026-07-21)
content_hash: b58ce9a0b7d5ef15
description: MariaDB 11.8 LTS — GPL-2.0-only relational database server (MySQL-compatible); statically bundles fmt (MIT) via CMake ExternalProject
license: "GPL-2.0-only AND LGPL-2.1-or-later AND MIT"
homepage: https://mariadb.org/
tier: extra
build_style: cmake
install_func: do_install
source:
- url: https://archive.mariadb.org/mariadb-${version}/source/mariadb-${version}.tar.gz
  sha256: b126581a8ca89376d2a3ce63fee97c114c3e15315345e769b9d00c51e1b7d619
- url: https://github.com/fmtlib/fmt/releases/download/12.1.0/fmt-12.1.0.zip
  sha256: 695fd197fa5aff8fc67b5f2bbc110490a875cdf7a41686ac8512fb480fa8ada7
  extract: false  # cmake ExternalProject expects a zip artifact, not extracted contents
dependencies:
  build:
  - cmake
  - ninja
  - bison-core
  - flex
  - pkgconf
  - openssl
  - zlib
  - readline
  - ncurses-core
  - libxml2
  - pcre2
  - jemalloc
  - mitkrb
  - linux-pam
  - numactl      # libnuma + numa.h/numaif.h for -DWITH_NUMA=ON
  host: []
  runtime:
  - openssl
  - zlib
  - readline
  - ncurses
  - libxml2
  - pcre2
  - jemalloc
  - mitkrb
  - linux-pam
  - numactl      # mysqld links libnuma.so at runtime under WITH_NUMA=ON
verify_paths:
  - /usr/bin/mariadb
  - /usr/lib64/libmariadb.so.3
  - /usr/share/mariadb/binary-configure
