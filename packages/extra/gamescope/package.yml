name: gamescope
version: "3.16.24"
release: 2  # r2: comment wording only: the reshade shader-effect note in build.sh now uses plain engineering language. No build change.
description: SteamOS session compositing window manager (micro-compositor for gaming)
license: BSD-2-Clause
homepage: https://github.com/ValveSoftware/gamescope
tier: extra
build_style: custom
install_func: do_install
# Vendored subprojects are pinned to the exact revisions Valve ships at tag 3.16.24
# (.gitmodules gitlinks + subprojects/*.wrap). They are carried as secondary sources
# and extracted explicitly in configure() (Rule 5); the build runs --wrap-mode=nodownload
# so a missing vendor fails loudly instead of reaching the network.
