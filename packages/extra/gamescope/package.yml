silent_loss_accepted:
  - libxcb   # The flagged probes belong to the VENDORED wlroots SUBPROJECT, which
             # Valve pins minimal (backends/renderers off) because gamescope compiles
             # its own DRM-atomic + Vulkan backends in the main binary (see build.sh
             # header). xcb itself resolves YES; the sole NO is optional xcb-errors
             # diagnostics inside a subproject whose x11 backend is off by design.
             # Decided accept, 2026-07-10 (silent-loss gate, ge9b-01 burn).
  - drm-backend   # wlroots-SUBPROJECT feature (Valve-pinned off); gamescope's OWN
                  # DRM-atomic backend is compiled in the main binary and stays on.
  - x11-backend   # wlroots-SUBPROJECT feature (Valve-pinned off) — same shape.
  - xcb-errors    # wlroots-SUBPROJECT optional diagnostics — same shape. All three
                  # ride the operator's 2026-07-10 wlroots-subproject accept ruling
                  # (the gate's summary-disabled detector keys on FEATURE names,
                  # separately from the dep-tuple accept above).
  - input_emulation   # gamescope's OWN feature, DELIBERATELY disabled in build.sh —
                      # part of the recipe's documented minimal surface (header:
                      # "OpenVR, input-emulation (libei), PipeWire capture, the SDL2
                      # backend, AVIF screenshots, benchmarks and unit tests are all
                      # disabled"). Machine-readable accept of that standing intent.
verify_paths:
  - /usr/bin/gamescope
  - /usr/bin/gamescopereaper
  - /usr/share/vulkan/implicit_layer.d/VkLayer_FROG_gamescope_wsi.x86_64.json
