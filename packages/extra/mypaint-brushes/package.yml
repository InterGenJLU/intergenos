name: mypaint-brushes
# 2.x is the brush line GIMP 3.x hard-requires (meson dependency mypaint-brushes-2.0);
# the 1.3.x line ships only mypaint-brushes-1.0.pc and serves legacy libmypaint-1.x apps.
version: "2.0.2"
release: 1
description: Brush data files for applications using libmypaint
license: CC0-1.0
homepage: https://github.com/mypaint/mypaint-brushes
tier: extra
iso_include: true   # gimp (ISO, r3 curation) runtime-requires it — the closure provider missed in 633591b3 (ge9b-06 step-4.75 catch)
build_style: custom
install_func: do_install
source:
- url: https://github.com/mypaint/mypaint-brushes/releases/download/v${version}/mypaint-brushes-${version}.tar.xz
  sha256: 7984a74edef94571d872d0629b224abaa956a36f632f5c5516b33d22e49eb566
dependencies:
  build:
  - libmypaint
  host: []
  runtime:
  - libmypaint
verify_paths:
  - /usr/share/mypaint-data
