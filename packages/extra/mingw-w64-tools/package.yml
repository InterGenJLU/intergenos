name: mingw-w64-tools
version: "14.0.0"
release: 2  # r2: license: Zope-2.0 -> ZPL-2.0 — a valid SPDX identifier, so the new licence-identifier gate passes and the SBOM/mirror index carry something resolvable. .PKGINFO carries license=, so this metadata-only change still needs the bump to reach installed systems on pkm upgrade.
description: mingw-w64 host tools — the widl IDL compiler for both PE triplets (mingw-w64 toolchain, stage 7)
# Zope Public License 2.0's identifier is ZPL-2.0; 'Zope-2.0' is not one. The
# version stated by the recipe is kept as-is — moving 2.0 to 2.1 would be a
# different licence, not a spelling fix.
license: ZPL-2.0 AND LGPL-2.1-or-later AND BSD-3-Clause
homepage: https://www.mingw-w64.org/
tier: extra
# GE extra-tier wave (build plan §4). Ships <triplet>-widl, the IDL
# compiler vkd3d-proton's meson cross files reference as their
# widl-mingw-tools-fallback (cross builds cannot use wine's native widl).
# Host ELF binaries — elf_class 64 default applies. Same tarball + pin as
# mingw-w64-headers.
build_style: custom
# Mirror-only (extra-tier default, stated explicitly).
iso_include: false
source:
- url: https://downloads.sourceforge.net/project/mingw-w64/mingw-w64/mingw-w64-release/mingw-w64-v${version}.tar.bz2
  sha256: 6eaf921d9eb987d3820b364ea9775bc19b965ec81490b6fdd716526c28e1995c
dependencies:
  build: []
  host:
  - mingw-w64-binutils
  runtime: []
verify_paths:
  - /usr/bin/x86_64-w64-mingw32-widl
  - /usr/bin/i686-w64-mingw32-widl
