name: perl-archive-zip
version: "1.68"
release: 4  # r4: runtime deps renamed to shipped namespace (F25 gate wave 2026-07-21)
description: Perl module for reading and writing Zip archive files
license: Artistic-2.0
homepage: https://metacpan.org/pod/Archive::Zip
tier: extra
iso_include: true
build_style: custom
install_func: do_install
source:
- url: https://cpan.metacpan.org/authors/id/P/PH/PHRED/Archive-Zip-${version}.tar.gz
  sha256: 984e185d785baf6129c6e75f8eb44411745ac00bf6122fb1c8e822a3861ec650
dependencies:
  build:
  - perl-core
  - libarchive
  host: []
  runtime:
  - perl
verify_paths:
  - /usr/bin/crc32
  - /usr/lib/perl5/5.42/site_perl/Archive/Zip.pm
  - /usr/share/man/man3/Archive::Zip.3
