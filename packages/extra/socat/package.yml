name: socat
version: "1.8.1.3"
release: 1
description: Relays bidirectional data between two independent data channels
license: GPL-2.0-only
homepage: http://www.dest-unreach.org/socat/
tier: extra
build_style: autotools
source:
  - url: http://www.dest-unreach.org/socat/download/socat-${version}.tar.gz
    sha256: 06602ffd591e98c75b3dc1d66f0f19136cc666b0b2d95caad987d6ab2cb28097
dependencies:
  build:
    - pkgconf
    - openssl       # the OPENSSL address type (TLS client and server)
    - readline      # the READLINE address type's line editing
    - ncurses-core  # readline's terminal handling
  host: []
  runtime:
    - openssl
    - readline
    # the SHIPPED name, not the build-namespace recipe ncurses-core: the
    # published depend= entry must resolve on a user's system, where the ch8
    # twin installs it as `ncurses` via ships_as
    - ncurses
tests:
  enabled: true
  failure_policy: known_failures
  reason: "test.sh covers hundreds of address combinations; the ones using TCP, UDP, network interfaces, PTYs or external commands need networking, device nodes and helper binaries the build chroot does not have, and fail by environment. The file, pipe and exec cases run and cover the data-relay core."
verify_paths:
  - /usr/bin/socat
  - /usr/share/man/man1/socat.1
