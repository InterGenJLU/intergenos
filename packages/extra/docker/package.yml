name: docker
version: "29.5.2"
release: 2  # r2: runtime deps renamed to shipped namespace (F25 gate wave 2026-07-21)
description: Pack, ship, and run any application as a lightweight container — daemon + CLI
license: Apache-2.0
homepage: https://www.docker.com/
tier: extra
build_style: custom
install_func: do_install
iso_include: false
# v1.0 docker mandate (2026-05-28): mirror-only OCI container engine. Bundles
# the docker engine (dockerd + docker-proxy from moby/moby), the docker CLI
# (`docker` command from docker/cli), and tini-static (docker-init for
# container PID 1). All three at moby's bilaterally-tested version pins
# per Dockerfile:3,145,251,293-294.
#
# Requires `containerd` (runtime gRPC peer, /run/containerd/containerd.sock)
# which in turn requires `runc` (low-level OCI runtime). Both authored
# alongside this package as a 3-package wave.
#
# Default-state posture: docker.service + docker.socket ship DISABLED.
# Default-deny posture: do not auto-enable a root-privileged container daemon. User
# explicitly opts in via `systemctl enable --now docker.socket` after install.
# Mirror-only inclusion means the package never lands on a system without
# operator action, but the secure-default belt-and-suspenders still applies.
source:
- url: https://github.com/moby/moby/archive/refs/tags/docker-v${version}.tar.gz
  filename: moby-${version}.tar.gz
  sha256: 1235ed325d324c76f52e52beaa1dac85c92a073bf2f9fcc5bb9f67e35a668028
- url: https://github.com/docker/cli/archive/refs/tags/v${version}.tar.gz
  filename: docker-cli-${version}.tar.gz
  sha256: e5cf80d9e0b6630bb2e97decf664ad5f0c732b296b7c47030044c3a7287bbddb
- url: https://github.com/krallin/tini/archive/de40ad007797e0dcd8b7126f27bb87401d224240.tar.gz
  filename: tini-de40ad007797e0dcd8b7126f27bb87401d224240.tar.gz
  sha256: 79daf78f1107b26c0252e979038215d86a937c2dee98232d28a88c61e3e4ff2a
dependencies:
  build:
  - go            # >= 1.25.5 (moby) + >= 1.25.0 (cli); our 1.26.4 passes both
  - go-md2man     # man-page generation in moby/man + cli scripts/docs
  - pkgconf       # cgo lookup for libseccomp / libsystemd / libnftables / libapparmor
  - libseccomp    # cgo seccomp build tag
  - systemd       # libsystemd headers for journald build tag
  - nftables      # libnftables headers (with-json) for firewall backend cgo
  - btrfs-progs   # /usr/include/btrfs/* for btrfs graphdriver
  - apparmor      # libapparmor headers for apparmor build tag
  - cmake         # tini-static build
  host: []
  runtime:
  - containerd    # gRPC peer via /run/containerd/containerd.sock
  - runc          # transitively pulled by containerd, but moby's
                  # daemon/config/config_linux.go also references it as
                  # StockRuntimeName — declare explicitly
  - iptables      # exec.LookPath for DOCKER chain creation
  - iproute2      # ip + bridge for netns + bridge networking
  - util-linux  # mount + nsenter (libnetwork shells out)
  - kmod          # modprobe for kernel modules
  - lvm2          # device-mapper for the devicemapper graphdriver
tests:
  enabled: false
  reason: "docker's integration tests require a running dockerd + containerd daemon stack + privileged kernel features (real cgroups, namespaces, seccomp BPF, iptables NAT, bridge networking, overlayfs) — none of which the build chroot provides. Unit tests under daemon/, cli/, etc. partially pass but are not load-bearing for shipping the binary. Binary builds + links cleanly without tests."
verify_paths:
  - /usr/bin/dockerd
  - /usr/bin/docker
