# InterGenOS system-wide mpv defaults (/etc/mpv/mpv.conf). A user's
# ~/.config/mpv/mpv.conf overrides any line here.
#
# Hardware video decoding. mpv's own default is hwdec=no, and Celluloid, the
# shipped player, passes no options of its own, so out of the box every video
# decoded in software on machines whose cards decode H.264, HEVC, VP9 and AV1
# in hardware (measured 2026-09-20 on a two-card AMD machine: the card's video
# engine read 0 ns with the default and ~280 ms with VA-API on the same clip).
# auto-safe uses the VA-API path where the driver advertises the profile and
# falls back to software where it does not; a hard "vaapi" is deliberately not
# used because it fails on outputs that cannot hold VA surfaces (headless and
# some remote sessions).
hwdec=auto-safe
