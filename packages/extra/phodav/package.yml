name: phodav
version: "3.0"
release: 1
description: WebDAV server library with chezdav and spice-webdavd for VM folder sharing
license: LGPL-2.1-or-later
homepage: https://gitlab.gnome.org/GNOME/phodav
tier: extra
iso_include: true
build_style: custom
install_func: do_install
source:
  - url: https://download.gnome.org/sources/phodav/${version}/phodav-${version}.tar.xz
    sha256: 392ec2d06d50300dcff1ef269a2a985304e29bce3520002fca29f2edc1d138d1
dependencies:
  build:
    - meson
    - ninja
    - pkgconf
    - glib2
    - libsoup3
    - libxml2
    - avahi
  host: []
  runtime:
    - glib2
    - libsoup3
    - libxml2
    - avahi
verify_paths:
  - /usr/lib/libphodav-3.0.so.0
  - /usr/bin/chezdav
  - /usr/sbin/spice-webdavd
