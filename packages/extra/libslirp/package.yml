name: libslirp
version: "4.7.0"
release: 2
content_hash: 423961edb243385a
# iso_include: qemu (shipped) runtime-depends libslirp — it must ride the ISO,
# not sit mirror-only (ISO-closure gate finding, 2026-07-16 virtualization wave).
iso_include: true
description: General purpose TCP-IP emulator library
license: BSD-3-Clause
homepage: https://gitlab.freedesktop.org/slirp/libslirp
tier: extra
build_style: custom
install_func: do_install
source:
  - url: https://gitlab.freedesktop.org/slirp/libslirp/-/archive/v${version}/libslirp-v${version}.tar.gz
    sha256: 9398f0ec5a581d4e1cd6856b88ae83927e458d643788c3391a39e61b75db3d3b
dependencies:
  build:
    - meson
    - ninja
    - pkgconf
    - glib2
  host: []
  runtime:
    - glib2
verify_paths:
  - /usr/lib/libslirp.so.0.4.0
  - /usr/lib/pkgconfig/slirp.pc
  - /usr/include/slirp/libslirp-version.h
