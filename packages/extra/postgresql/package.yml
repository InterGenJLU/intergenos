name: postgresql
version: "18.3"
release: 2  # r2: the duplicate systemd daemon-reload is removed from post_install; pkm's canonical systemd-daemon-reload hook owns that operation, is armed by this package's own unit payload, skips a root no manager owns, and records its own result.
content_hash: cd9bfbce0f76c64c
description: PostgreSQL relational database server (default-secure config — listen 127.0.0.1, scram-sha-256 auth, deferred initdb via postgres-setup helper)
license: PostgreSQL
homepage: https://www.postgresql.org/
tier: extra
build_style: meson
install_func: do_install
source:
- url: https://ftp.postgresql.org/pub/source/v${version}/postgresql-${version}.tar.bz2
  sha256: d95663fbbf3a80f81a9d98d895266bdcb74ba274bcc04ef6d76630a72dee016f
dependencies:
  build:
  - meson
  - ninja
  - pkgconf
  - perl-core
  - bison-core
  - flex
  - openssl
  - readline
  - zlib
  - lz4
  - zstd
  - icu
  - gettext
  - libxml2
  - libxslt
  - linux-pam
  - openldap
  - mitkrb
  - llvm
  - python
  - systemd
  host: []
  runtime:
  - openssl
  - readline
  - zlib
  - lz4
  - zstd
  - icu
  - libxml2
  - libxslt
  - linux-pam
  - openldap
  - mitkrb
  - llvm
  - systemd
verify_paths:
  - /usr/bin/clusterdb
  - /usr/lib/libpq.so.5.18
  - /usr/lib/postgresql/_int.so
