name: postgresql
version: "18.3"
release: 3  # r3: the recipe now requests `-Dpltcl=enabled` and `-Dliburing=enabled` and declares tcl and liburing as build and runtime dependencies, so missing probes fail configure instead of silently disabling either feature. Compilation and the resulting PL/Tcl, linkage and io_uring behavior were not proved in this change; they ride the build cycle.  # r2: the duplicate systemd daemon-reload is removed from post_install; pkm's canonical systemd-daemon-reload hook owns that operation, is armed by this package's own unit payload, skips a root no manager owns, and records its own result.
content_hash: 09ce6f152720ec4b
description: PostgreSQL relational database server (default-secure config — listen 127.0.0.1, scram-sha-256 auth, deferred initdb via postgres-setup helper)
license: PostgreSQL
homepage: https://www.postgresql.org/
tier: extra
build_style: meson
install_func: do_install
source:
- url: https://ftp.postgresql.org/pub/source/v${version}/postgresql-${version}.tar.bz2
  sha256: d95663fbbf3a80f81a9d98d895266bdcb74ba274bcc04ef6d76630a72dee016f
dependencies:
  build:
  - meson
  - ninja
  - pkgconf
  - perl-core
  - bison-core
  - flex
  - openssl
  - readline
  - zlib
  - lz4
  - zstd
  - icu
  - gettext
  - libxml2
  - libxslt
  - linux-pam
  - openldap
  - mitkrb
  - llvm
  - python
  - systemd
  - tcl          # tcl.pc + tcl.h for -Dpltcl=enabled
  - liburing     # liburing.pc for -Dliburing=enabled
  host: []
  runtime:
  - openssl
  - readline
  - zlib
  - lz4
  - zstd
  - icu
  - libxml2
  - libxslt
  - linux-pam
  - openldap
  - mitkrb
  - llvm
  - systemd
  - tcl          # pltcl.so links libtcl8.6.so at runtime
  - liburing     # the server links liburing.so for asynchronous I/O
verify_paths:
  - /usr/bin/clusterdb
  - /usr/lib/libpq.so.5.18
  - /usr/lib/postgresql/_int.so
