# InterGenOS — PostgreSQL database server user
# Shell is /bin/bash (per build.sh) because postgres uses pg_ctl from
# interactive shell + initdb pre-setup workflows; not /sbin/nologin.
# Type Name       ID  GECOS                 Home                    Shell
g  postgres   -   -
u  postgres   -   "PostgreSQL server"   /var/lib/postgresql     /bin/bash
