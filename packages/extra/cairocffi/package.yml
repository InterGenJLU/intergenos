name: cairocffi
version: "1.7.1"
release: 1
description: cffi-based Python bindings for the cairo graphics library (icon-toolchain dep)
license: BSD-3-Clause
homepage: https://github.com/Kozea/cairocffi
tier: extra
iso_include: false
build_style: custom
install_func: do_install
source:
  - url: https://files.pythonhosted.org/packages/source/c/cairocffi/cairocffi-${version}.tar.gz
    sha256: 2e48ee864884ec4a3a34bfa8c9ab9999f688286eb714a15a43ec9d068c36557b
dependencies:
  build:
    - flit-core
  host: []
  runtime:
    # dlopens the system libcairo at import (desktop tier); binds via cffi.
    - cairo
    - cffi
verify_paths:
  - /usr/lib/python3.14/site-packages/cairocffi/__init__.py
  - /usr/lib/python3.14/site-packages/cairocffi/context.py
