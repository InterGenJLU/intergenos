name: webencodings
version: "0.5.1"
release: 1
description: WHATWG character encoding labels for Python (icon-toolchain dep)
license: BSD-3-Clause
homepage: https://github.com/gsnedders/python-webencodings
tier: extra
iso_include: false
build_style: custom
install_func: do_install
source:
  - url: https://files.pythonhosted.org/packages/source/w/webencodings/webencodings-${version}.tar.gz
