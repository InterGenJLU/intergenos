name: osinfo-db-tools
version: "1.12.0"
release: 1
description: Tools for importing and exporting the osinfo database
license: GPL-2.0-or-later
homepage: https://libosinfo.org
tier: extra
iso_include: true
build_style: custom
install_func: do_install
source:
  - url: https://releases.pagure.org/libosinfo/osinfo-db-tools-${version}.tar.xz
    sha256: f3315f675d18770f25dea8ed04b20b8fc80efb00f60c37ee5e815f9c3776e7f3
dependencies:
  build:
    - meson
    - ninja
    - pkgconf
    - glib2
    - libxml2
    - libxslt
    - libarchive
    - json-glib
    - libsoup3
  host: []
  runtime:
    - glib2
    - libxml2
    - libxslt
    - libarchive
    - json-glib
    - libsoup3
verify_paths:
  - /usr/bin/osinfo-db-import
  - /usr/bin/osinfo-db-validate
  - /usr/bin/osinfo-db-path
