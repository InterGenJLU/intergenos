name: codex
version: "1.0"
release: 7  # r7: renumbered at composition (the lane's r6 collided with the landed r6 of chain 16b). The helper pins OpenAI CLI 0.159.2 and the Linux x64 VS Code extension 26.5917.62051, each taken from the vendor's own record on the day of the pin: the CLI's dist.shasum and dist.integrity from the registry entry for that version, and the extension's SHA-256 from the downloaded asset, whose own manifest carries the same version string and the Linux x64 target.  # r6: the helper pins OpenAI CLI 0.156.0 and the Linux x64 VS Code extension 26.5917.61114, with the extension SHA-256 updated from the downloaded asset; renumbered at composition — the lane's r5 collided with the shared-helper-library r5 already on the landed tree.  # r5: write license acceptance through the shared helper library, preserving the named sudo user or explicit effective-account identity and this helper's metadata; refuse an older library with the command to update it. r4: an extension this package pins but does not end up installing is now recorded as such — the same change as the sibling download helper, for the same reason. Every path that leaves the VS Code extension absent writes one post-install action line naming the extension, the pinned version and the reason, so the package manager's operation log carries the omission. The successful line and the exit status are unchanged.  # r3: the installed manifest records the symlink this package creates as the link it is, instead of the path that link resolved to at build time — the same change as the sibling download helper, for the same reason.  # r2: The helper acceptance record names SUDO_USER when supplied, otherwise the effective account with an explicit indication that no consenting user was named. Identity is JSON-encoded before opening the record; this writer works with the existing helper library.
content_hash: 6ced7239d792dc78
description: Helper to install OpenAI Codex CLI and VS Code extension
license: GPL-3.0-or-later
payload_license: "Apache-2.0 AND LicenseRef-OpenAI-Terms-of-Use"
homepage: https://developers.openai.com/codex/
tier: extra
build_style: custom
install_func: do_install
source: []
dependencies:
  build: []
  host: []
  runtime:
  # codex sources /usr/share/igos/helpers/helper-lib.sh at the top of the
  # install-helper script; the library must be installed before it runs.
  - intergenos-helper-lib
  - nodejs
verify_paths:
  - /usr/bin/igos-install-codex
  - /usr/share/licenses/codex/LICENSE-BY-SPDX
