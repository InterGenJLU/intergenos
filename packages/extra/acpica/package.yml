name: acpica
version: "20260408"
release: 2  # r2: release-only bump. The package was rebuilt in the R001.2 cycle after the 2026-08-25 toolchain-recipe rename (m4-tmp, ncurses-tmp, glibc-tmp); the build inputs did not change, so the rebuilt archive carries the same version-release as the one the mirror already serves with different bytes, which the publish gate refuses (a changed package must strictly advance or installed systems never see it). No build change in this commit; the rebuild itself is proven by the chroot build and the mirror publish that follow.
description: ACPI Component Architecture utilities including the iasl compiler
license: GPL-2.0-only OR BSD-3-Clause
homepage: https://github.com/acpica/acpica
tier: extra
iso_include: true
build_style: custom
install_func: do_install
source:
  - url: https://github.com/acpica/acpica/releases/download/${version}/acpica-unix2-${version}.tar.gz
    sha256: 5fcef9f0d00ffaffaaa82aa49c5ea9687986e8a7bd60929e298cc99a6741ae24
dependencies:
  build:
    - flex
    - bison-core
    - m4-core
  host: []
  runtime: []
verify_paths:
  - /usr/bin/iasl
  - /usr/bin/acpidump
  - /usr/bin/acpixtract
