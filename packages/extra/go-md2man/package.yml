name: go-md2man
version: "2.0.7"
release: 1
description: Convert Markdown to man pages (roff)
license: MIT
homepage: https://github.com/cpuguy83/go-md2man
tier: extra
build_style: custom
install_func: do_install
source:
  - url: https://github.com/cpuguy83/go-md2man/archive/refs/tags/v${version}.tar.gz
    filename: go-md2man-v${version}.tar.gz
    sha256: ca3a5b57e2c01759f5a00ad2a578d034c5370fae9aa7a6c3af5648b2fc802a92
  # Pre-vendored Go module deps (loupe-style two-tarball pattern). Generated
  # via `go mod vendor` against go-md2man v2.0.7's go.mod (Go 1.26.4).
  # Single direct dep: github.com/russross/blackfriday/v2 v2.1.0.
  # Decided 2026-08-25: this URL moves to the project's own source mirror. The
  # address it used to name answered 404, so a rebuild from this recipe alone
  # could not obtain the file; the build only kept working because
  # scripts/download-sources.py falls back to the mirror when an address fails,
  # which turned an outage path into the everyday path. The mirror copy was
  # fetched and hashed on the same day and is byte-identical to the pin below,
  # so nothing about what gets built changes.
  - url: https://repo.intergenos.org/sources/current/go-md2man-${version}-go-vendor.tar.gz
    filename: go-md2man-${version}-go-vendor.tar.gz
    sha256: 8daa8416b2873fa4cc218b8133a093aeec2553602b37cccb366c9ae22356e871
dependencies:
  build:
    - go
  host: []
  runtime: []
verify_paths:
  - /usr/bin/go-md2man
  - /usr/share/licenses/go-md2man/LICENSE.md
