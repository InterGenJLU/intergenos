# /etc/rsyslog.conf — InterGenOS default. Local inputs only; no network module is loaded here.
# Site rules (for example a RELP receiver on a host that is deployed as one) live in /etc/rsyslog.d/.
# Strict defaults: an unclean configuration aborts start-up instead of running partially, and
# every network input defaults to its secure form (a plaintext RELP input must say tls="off" explicitly,
# which the tunnelled receiver configuration does, with its reason).
global(workDirectory="/var/spool/rsyslog" compatibility.defaults.secure="strict")

module(load="imuxsock" SysSock.Use="on")              # /dev/log via the journal's forwarding socket
module(load="imjournal" StateFile="imjournal.state")  # journal import; positions persist in the work directory

$FileOwner root
$FileGroup root
$FileCreateMode 0640
$DirCreateMode 0750
$Umask 0077

*.info;mail.none;authpriv.none;cron.none   -/var/log/messages
authpriv.*                                  /var/log/secure
mail.*                                     -/var/log/maillog
cron.*                                     -/var/log/cron
*.emerg                                     :omusrmsg:*

include(file="/etc/rsyslog.d/*.conf" mode="optional")
