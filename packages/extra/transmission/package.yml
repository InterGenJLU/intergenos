name: transmission
version: "4.1.1"
# release 2 (GE-01 L27): Release build replaces the RelWithDebInfo bloat —
# the PUBLISHED release-1 archive is the same 263MB debug-info build
# (on the mirror since the June refresh); mirror monotonicity demands the
# bump so pkm upgrade delivers the 49x-smaller rebuild.
release: 2
description: Fast, easy, free BitTorrent client (daemon, CLI utils, GTK4 GUI)
license: GPL-3.0-or-later
homepage: https://transmissionbt.com/
tier: extra
iso_include: true  # 2026-05-28 curation walk — Keep (see docs/extra-tier-classification.md)
build_style: custom
install_func: do_install
source:
- url: https://github.com/transmission/transmission/releases/download/${version}/transmission-${version}.tar.xz
  sha256: e743283ee03a42c4d0b08fed2bd52b554aa6c9f65b4d4d45b795c32d98762a79
dependencies:
  build:
  - cmake
  - pkgconf
  - gettext
  - intltool
  - openssl
  - curl
  - libevent
  - libpsl
  - glib2
  - glibmm
  - gtk4
  - gtkmm4
  - pangomm
  - libnotify
  - systemd
  - dbus
  - libdeflate
  - miniupnpc
  - libnatpmp
  - libdht
  host: []
  runtime:
  - openssl
  - curl
  - libevent
  - libpsl
  - glib2
  - glibmm
  - gtk4
  - gtkmm4
  - pangomm
  - libnotify
  - systemd
  - dbus
  - libdeflate
  - miniupnpc
  - libnatpmp
  - libdht
verify_paths:
  - /usr/bin/transmission-create
  - /usr/bin/transmission-daemon
  - /usr/share/transmission
