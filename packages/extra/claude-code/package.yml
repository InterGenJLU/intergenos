tier: extra
build_style: custom
install_func: do_install
source: []
source_tree:
  - packages/extra/claude-code/claude-code-helper-functions.sh
sources_extra:
  - packages/extra/claude-code/claude-code-helper-functions.sh
dependencies:
  build: []
  host: []
  runtime:
  # H-007 Phase B: claude-code sources /usr/share/igos/helpers/helper-lib.sh.
  - intergenos-helper-lib
  - nodejs
verify_paths:
  - /usr/bin/igos-install-claude-code
  - /usr/libexec/igos-install-claude-code-functions.sh
  - /usr/share/licenses/claude-code/LICENSE-BY-SPDX
