name: claude-code
version: "1.0"
release: 12  # r12: the installed manifest records the symlink this package creates as the link it is, instead of the path that link resolved to at build time. The recipe derived the target with readlink -f, so the record named a resolved absolute path while the machine holds a relative link; it now hands the link to the recording helper and lets the helper read the target.  # r11: The helper acceptance record names SUDO_USER when supplied, otherwise the effective account with an explicit indication that no consenting user was named. Identity is JSON-encoded before opening the record; this writer works with the existing helper library.  # r10: the CLI pin moves to 2.1.270 (2.1.218 could not run the current model family) and an explicit CLAUDE_CODE_INSTALL_CURRENT=1 selects the registry's current stable release under the same gates; the dependency tree is prepared without lifecycle scripts and the install refuses on a critical advisory OR a failed `npm audit signatures` check (the signature check was claimed in a comment before and never run; an unavailable advisory check used to warn and continue); the installed version is read back from the exact executable npm placed — its name read from the installed module's own manifest — and a mismatch refuses; the helper prints the selected mode and versions before the licence prompt and `--print-plan` shows them without installing; the VS Code extension pin moves to 2.1.270 linux-x64 with its sha256; the shared functions ship in /usr/libexec/igos-install-claude-code-functions.sh. r9: install output rewritten for the person at the terminal. The advisory refusal, the checksum refusal and the extension-install failure now say what happened and what the reader can do; they previously named an internal identifier, a source file inside the package manager, and the commit shape a maintainer would use. Printed text only — the advisory check, the signature check and the checksum check are unchanged. r8: neutral-language sweep of comments and printed text: decisions are recorded as "decided <date>" instead of being credited to a person or project role, development-host shorthand is replaced by a plain description, and the citations of a repository that is not published are replaced by what they were pointing at. Comments and strings only — no rule, path, flag, threshold or code path changed. The public-content scanner now carries detectors for all three classes (scripts/check-public-content.py), so the classes cannot return silently; tests/preflight/test_public_language_detectors.py proves each detector in both directions. r6: guard the ext-install capture with `|| ext_rc=$?` — under the helper's `set -e` the bare `ext_out=$(...)` assignment aborted the helper (exit 7) on extension-install failure, making the r5 diagnosis/.vsix-fallback dead code AND failing the whole package over an optional extension. r5: extension-install failure reports real output + names the pkm SUDO_USER allowlist as the root-refusal cause; r4 = decoupled pinned .vsix + sha256 gate
content_hash: a6d27a29d2781f9d
description: Helper to install a reviewed or explicitly current Anthropic Claude Code CLI and verified VS Code extension
license: GPL-3.0-or-later
payload_license: LicenseRef-Anthropic-Commercial-Terms
