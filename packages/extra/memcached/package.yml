name: memcached
version: "1.6.41"
release: 2  # r2: the duplicate systemd daemon-reload is removed from post_install; pkm's canonical systemd-daemon-reload hook owns that operation, is armed by this package's own unit payload, skips a root no manager owns, and records its own result.
content_hash: 3e61c087ea92ea3f
description: High-performance distributed in-memory KV cache (default-secure config — bind 127.0.0.1 + UDP off + TLS + seccomp + SASL build-enabled)
license: BSD-3-Clause
homepage: https://memcached.org/
tier: extra
build_style: autotools
install_func: do_install
source:
- url: http://memcached.org/files/memcached-${version}.tar.gz
  sha256: e097073c156eeff9e12655b054f446d57374cfba5c132dcdbe7fac64e728286a
dependencies:
  build:
  - openssl
  - libseccomp
  - cyrus-sasl
  - libevent
  host: []
  runtime:
  - openssl
  - libseccomp
  - cyrus-sasl
  - libevent
verify_paths:
  - /usr/bin/memcached
  - /usr/include/memcached/protocol_binary.h
  - /usr/include/memcached/xxhash.h
