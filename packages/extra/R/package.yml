name: R
version: "4.6.1"
release: 1
description: R environment for statistical computing and graphics
license: GPL-2.0-or-later
homepage: https://www.r-project.org/
tier: extra
build_style: custom
install_func: do_install
source:
  # Latest stable (Rule 12). CRAN publishes no detached checksum file for the
  # source tarball; this sha256 was computed from the fetched upstream tarball at
  # authoring time (disclosed in the delivery paste-back).
  - url: https://cran.r-project.org/src/base/R-4/R-${version}.tar.gz
    sha256: 4da6e61d2c0aac5f14a2e7e432cb5fcc269efe83da4293050ba7f03dff4e2cf4
dependencies:
  # R needs a Fortran compiler (verified present: gcc-core r4 ships
  # --enable-languages=...,fortran -> /usr/bin/gfortran + libgfortran.so.5). It
  # links readline (console), zlib/bzip2/xz/pcre2 (compression + regex), and curl
  # (download.file / package installation). X11 and Tcl/Tk are DISABLED in the
  # core build (--with-x=no --with-tcltk=no) so this carries no desktop-tier deps;
  # BLAS/LAPACK use R's bundled reference implementation (no external math lib).
  build:
    - gcc-core
    - readline
    - pcre2
    - bzip2
    - xz
    - zlib
    - curl
  host: []
  runtime:
    - readline
    - pcre2
    - bzip2
    - xz
    - zlib
    - curl
    - gcc
    - glibc
verify_paths:
  - /usr/bin/R
  - /usr/bin/Rscript
  - /usr/lib/R
