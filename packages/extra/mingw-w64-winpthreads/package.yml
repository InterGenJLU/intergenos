name: mingw-w64-winpthreads
version: "14.0.0"
release: 2  # r2: license: Zope-2.0 -> ZPL-2.0 — a valid SPDX identifier, so the new licence-identifier gate passes and the SBOM/mirror index carry something resolvable. .PKGINFO carries license=, so this metadata-only change still needs the bump to reach installed systems on pkm upgrade.
description: POSIX threads implementation for Windows, both PE triplets (mingw-w64 toolchain, stage 5)
# Zope Public License 2.0's identifier is ZPL-2.0; 'Zope-2.0' is not one. The
# version stated by the recipe is kept as-is — moving 2.0 to 2.1 would be a
# different licence, not a spelling fix.
license: ZPL-2.0 AND LGPL-2.1-or-later AND BSD-3-Clause
homepage: https://www.mingw-w64.org/
tier: extra
# GE extra-tier wave (build plan §4, RT-15 stage 5). The library behind
# the final gcc's --enable-threads=posix (DXVK documents a HARD
# requirement on the posix threads model — win32 threads fail its C++
# build; research doc alongside). Sits after crt (its own link needs crt
# resolvable) and before gcc-final (whose libstdc++ needs it installed).
# Ships libwinpthread-1.dll (PE) + COFF archives — skipped by the
# ELF-magic-keyed width audit by design. Same tarball + pin as
# mingw-w64-headers.
build_style: custom
# Mirror-only (extra-tier default, stated explicitly).
iso_include: false
source:
- url: https://downloads.sourceforge.net/project/mingw-w64/mingw-w64/mingw-w64-release/mingw-w64-v${version}.tar.bz2
  sha256: 6eaf921d9eb987d3820b364ea9775bc19b965ec81490b6fdd716526c28e1995c
dependencies:
  build: []
  host:
  - mingw-w64-crt
  - mingw-w64-gcc-bootstrap
  runtime: []
verify_paths:
  - /usr/x86_64-w64-mingw32/lib/libwinpthread.a
  - /usr/i686-w64-mingw32/lib/libwinpthread.a
  - /usr/x86_64-w64-mingw32/bin/libwinpthread-1.dll
