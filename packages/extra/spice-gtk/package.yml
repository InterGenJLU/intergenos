name: spice-gtk
version: "0.42"
release: 3  # r3: silent_loss_accepted gtk_doc (docs toolchain not shipped)
description: GTK client library for the SPICE remote display protocol
license: LGPL-2.1-or-later
homepage: https://www.spice-space.org
tier: extra
silent_loss_accepted:
  - gtk_doc   # docs generation deliberately off: gtk-doc toolchain is not in the distribution — see build.sh

iso_include: true
build_style: custom
install_func: do_install
source:
  - url: https://www.spice-space.org/download/gtk/spice-gtk-${version}.tar.xz
    sha256: 9380117f1811ad1faa1812cb6602479b6290d4a0d8cc442d44427f7f6c0e7a58
dependencies:
  build:
    - meson
    - ninja
    - pkgconf
    - python
    - python-six
    - python-pyparsing
    - spice-protocol
    - glib2
    - gtk3
    - json-glib
    - libusb
    - usbredir
    - phodav
    - pixman
    - openssl
    - opus
    - lz4
    - cyrus-sasl
    - gstreamer
    - gst-plugins-base
    - gobject-introspection
    - libcap-ng
    - polkit
    - hwdata
    - libjpeg-turbo
    - libepoxy
  host: []
  runtime:
    - spice-protocol
    - glib2
    - gtk3
    - json-glib
    - libusb
    - usbredir
    - phodav
    - pixman
    - openssl
    - opus
    - lz4
    - cyrus-sasl
    - gstreamer
    - gst-plugins-base
    - polkit
    - hwdata
    - libjpeg-turbo
    - libepoxy
    # -Dlibcap-ng=enabled links the ACL helper at runtime — qemu/libvirt/
    # virtiofsd declare it in both lists (review finding F-06, 2026-07-17).
    - libcap-ng
verify_paths:
  - /usr/lib/libspice-client-glib-2.0.so.8
  - /usr/lib/libspice-client-gtk-3.0.so.5
  - /usr/lib/girepository-1.0/SpiceClientGtk-3.0.typelib
