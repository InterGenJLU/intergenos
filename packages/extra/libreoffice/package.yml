  - zstd
  host: []
  runtime:
  - boost
  - clucene
  - curl
  - glu
  - gpgmepp
  - harfbuzz
  - icu
  - lcms2
  - libatomic_ops
  - libtiff
  - libwebp
  - libxml2
  - libxslt
  - nss
  - openssl
