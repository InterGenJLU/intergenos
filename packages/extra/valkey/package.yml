name: valkey
version: "9.0.4"
release: 2  # r2: the duplicate systemd daemon-reload is removed from post_install; pkm's canonical systemd-daemon-reload hook owns that operation, is armed by this package's own unit payload, skips a root no manager owns, and records its own result.
content_hash: 4510588a09735b8c
description: High-performance in-memory KV store (Redis-wire-compatible)
tier: extra
license: BSD-3-Clause
homepage: https://valkey.io
build_style: custom
source:
- url: https://github.com/valkey-io/valkey/archive/${version}.tar.gz
  sha256: 8d65e12cc9edb14d117b56fd33300e7b8cde2c087356de3f055d44689667670b
dependencies:
  build:
  - pkgconf
  - openssl
  host: []
  runtime:
  - openssl
verify_paths:
  - /usr/bin/valkey-benchmark
  - /etc/valkey/valkey.conf
