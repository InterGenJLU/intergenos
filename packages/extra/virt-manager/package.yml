name: virt-manager
version: "5.1.0"
release: 3  # r3: release-only bump. The package was rebuilt in the R001.2 cycle after the 2026-08-25 recipe patch landing; the build inputs did not change, so the rebuilt archive carries the same version-release as the one the mirror already serves with different bytes, which the publish gate refuses (a changed package must strictly advance or installed systems never see it). No build change in this commit; the rebuild itself is proven by the chroot build and the mirror publish that follow.  # r2: the recipe applies a GLibUnix fallback patch for the measured `GLib.unix_signal_add` startup failure, preserving the legacy name where the running glib still provides it. The pre-fix failure was measured on two installed systems; a post-patch package build and GUI launch were not recorded in this change.
content_hash: 8317f1da52c0c195
description: Desktop application for managing QEMU/KVM virtual machines
license: GPL-2.0-or-later
homepage: https://virt-manager.org
tier: extra
iso_include: true
build_style: custom
install_func: do_install
source:
  - url: https://releases.pagure.org/virt-manager/virt-manager-${version}.tar.xz
    sha256: ccfc44b6c1c0be8398beb687c675d9ea4ca1c721dfb67bd639209a7b0dec11b1
dependencies:
  build:
    - meson
    - ninja
    - pkgconf
    - python
    - docutils
    - gettext
  host: []
  runtime:
    - python
    - pygobject3
    - libvirt-python
    - libvirt-glib
    - libosinfo
    - osinfo-db
    - gtk3
    - gtk-vnc
    - spice-gtk
    - vte
    - python-requests
    - xorriso
verify_paths:
  - /usr/bin/virt-manager
  - /usr/bin/virt-install
  - /usr/share/virt-manager/virtManager/engine.py
