name: lighttpd
version: "1.4.82"
release: 2  # r2: the duplicate systemd daemon-reload is removed from post_install; pkm's canonical systemd-daemon-reload hook owns that operation, is armed by this package's own unit payload, skips a root no manager owns, and records its own result.
content_hash: 36c22c57204cc07b
description: Lightweight event-driven HTTP server (BSD-3)
tier: extra
license: BSD-3-Clause
homepage: https://www.lighttpd.net/
build_style: custom
source:
- url: https://download.lighttpd.net/lighttpd/releases-1.4.x/lighttpd-${version}.tar.xz
  sha256: abfe74391f9cbd66ab154ea07e64f194dbe7e906ef4ed47eb3b0f3b46246c962
dependencies:
  build:
  - openssl
  - pcre2
  - pkgconf
  - zlib
  host: []
  runtime:
  - openssl
  - pcre2
  - zlib
verify_paths:
  - /usr/sbin/lighttpd
  - /etc/lighttpd/lighttpd.conf
  - /usr/share/man/man8/lighttpd-angel.8
