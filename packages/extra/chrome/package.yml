name: chrome
version: "1.0"
release: 3  # r3: install output rewritten for the person at the terminal: lines that named internal machinery, internal decision codes or this project's own design rationale are replaced with plain statements of what happened and what to do about it, or removed where there was nothing to act on. Printed text only — no rule, path, flag, threshold, verification step or code path changed. tests/preflight/test_package_output_is_for_users.py holds the line.
content_hash: 082b279bc2258220
description: Helper to download and install Google Chrome
license: GPL-3.0-or-later
payload_license: LicenseRef-Google-Chrome-ToS
homepage: https://www.google.com/chrome/
tier: extra
build_style: custom
install_func: do_install
source: []
dependencies:
  build: []
  host: []
  runtime:
  # H-007: chrome sources /usr/share/igos/helpers/helper-lib.sh
  # at the top of the install-helper script. intergenos-helper-lib
  # must be installed before this helper is invoked.
  - intergenos-helper-lib
  - nodejs
verify_paths:
  - /usr/bin/igos-install-chrome
  - /usr/share/igos/helpers/keyrings/chrome-keyring.gpg
