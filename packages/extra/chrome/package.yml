name: chrome
version: "1.0"
release: 4  # r4: The helper acceptance record names SUDO_USER when supplied, otherwise the effective account with an explicit indication that no consenting user was named. Identity is JSON-encoded before opening the record; this writer works with the existing helper library.  # r3: install output rewritten for the person at the terminal: lines that named internal machinery, internal decision codes or this project's own design rationale are replaced with plain statements of what happened and what to do about it, or removed where there was nothing to act on. Printed text only — no rule, path, flag, threshold, verification step or code path changed. tests/preflight/test_package_output_is_for_users.py holds the line.
content_hash: 12461db37564de48
description: Helper to download and install Google Chrome
license: GPL-3.0-or-later
payload_license: LicenseRef-Google-Chrome-ToS
homepage: https://www.google.com/chrome/
tier: extra
build_style: custom
install_func: do_install
source: []
dependencies:
  build: []
  host: []
  runtime:
  # H-007: chrome sources /usr/share/igos/helpers/helper-lib.sh
  # at the top of the install-helper script. intergenos-helper-lib
  # must be installed before this helper is invoked.
  - intergenos-helper-lib
  - nodejs
verify_paths:
  - /usr/bin/igos-install-chrome
  - /usr/share/igos/helpers/keyrings/chrome-keyring.gpg
