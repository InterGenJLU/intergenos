name: runc
version: "1.3.5"
release: 1
description: CLI tool for spawning and running containers per the OCI specification
license: Apache-2.0
homepage: https://github.com/opencontainers/runc
tier: extra
build_style: custom
install_func: do_install
iso_include: false
# v1.0 docker mandate (2026-05-28): runc is the low-level OCI runtime that
# containerd-shim-runc-v2 shells out to spawn containers. Pinned to v1.3.5
# because that is the exact version moby/moby v29.5.2 ships in its Dockerfile
# (Dockerfile:251), and runc/containerd version coupling is exact per upstream.
# Mirror-only — most users will never install it. Authored alongside
# containerd 2.2.3 + docker 29.5.2 (moby's bilaterally-tested trio).
source:
- url: https://github.com/opencontainers/runc/releases/download/v${version}/runc.tar.xz
  sha256: ddb8745a51e572cf24e874589f0c5a3cac4853a4e06381f0e72ff6ee417f3d02
dependencies:
  build:
  - go            # >= 1.24.0 required; our 1.26.4 passes
  - go-md2man     # man-page generation
  - pkgconf       # cgo libseccomp link
  - libseccomp    # headers + library (default BUILDTAGS includes seccomp)
  host: []
  runtime:
  - libseccomp    # DT_NEEDED libseccomp.so.2
tests:
  enabled: false
  reason: "runc's testsuite requires kernel cgroup-v2 delegation, network namespace creation, working seccomp BPF + a populated /proc/self/ns/ — none of which the build chroot provides. Same environment-bounded shape as btrfs-progs / libfido2 / tpm2-tss. Binary builds and links cleanly without tests."
verify_paths:
  - /usr/sbin/runc
