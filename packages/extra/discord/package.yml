name: discord
version: "1.0"
release: 5  # r5: the supply-chain disclosure shown before the licence prompt is rewritten in plain words. The fact it conveys is unchanged and still shown in full: Discord publishes no signed repository, this installer cannot verify a signature over what it downloads, and the only protection is the HTTPS connection. What went is the internal decision codes, the comparison table against other helpers, and the sentence assessing our own discipline — none of which a person deciding whether to install Discord can act on. Printed text only; no verification step changed. r4: neutral-language sweep of comments and printed text: decisions are recorded as "decided <date>" instead of being credited to a person or project role, development-host shorthand is replaced by a plain description, and the citations of a repository that is not published are replaced by what they were pointing at. Comments and strings only — no rule, path, flag, threshold or code path changed. The public-content scanner now carries detectors for all three classes (scripts/check-public-content.py), so the classes cannot return silently; tests/preflight/test_public_language_detectors.py proves each detector in both directions.
content_hash: 1e3bdbf860485b87
description: Helper to download and install Discord
license: GPL-3.0-or-later
payload_license: LicenseRef-Discord-ToS
homepage: https://discord.com/
tier: extra
build_style: custom
install_func: do_install
source: []
dependencies:
  build: []
  host: []
  runtime:
  # H-007 Phase B: discord sources /usr/share/igos/helpers/helper-lib.sh.
  - intergenos-helper-lib
verify_paths:
  - /usr/bin/igos-install-discord
  - /usr/share/licenses/discord/LICENSE-BY-SPDX
