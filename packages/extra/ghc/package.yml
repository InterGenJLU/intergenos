dependencies:
  # ghc links libgmp (Integer arithmetic) and libtinfo (ncurses — the ghci
  # terminal), and links the system libffi into the RTS for foreign calls
  # (--with-system-libffi; headers at build time, libffi.so at runtime — see
  # build.sh wall 5). It drives the in-tree gcc as its C compiler / assembler /
  # linker at both build and runtime. perl + python run build-time scripts
  # (python also drives the Hadrian bootstrap).
  build:
    - gcc-core
    - gmp
    - libffi
    - ncurses
    - perl-core
    - python
  host: []
  runtime:
    - gmp
    - libffi
    - ncurses
    - gcc
    - glibc
verify_paths:
  - /usr/bin/ghc
  - /usr/bin/ghc-pkg
  - /usr/lib/ghc-9.14.1
