    sha256: 2fe2c3e0a07e4782530e8bf83eeda8ff6935e40d5450c1809abcdc6182c9c848
  # ---- Hadrian offline-bootstrap dependency sources (NEW pins, wall-4 re-author) ----
  # GHC's build system (Hadrian) is itself Haskell and normally builds via
  # cabal-install, which this system does not provide. The documented no-cabal
  # path is hadrian/bootstrap/bootstrap.py, which builds Hadrian from a fixed set
  # of Hackage dependency sources. bootstrap.py downloads them from Hackage by
  # default (network); for the offline chroot every input is pinned here instead
  # and fed via its `-s <sources-tarball>` route (assembled in build.sh). Each
  # dep contributes its source tarball + its revised .cabal; all 44 sha256s are
  # the upstream-published values carried in the in-tree
  # hadrian/bootstrap/plan-bootstrap-9_10_2.json (matched to the 9.10.2 seed).
  # The 23 "builtin" bootstrap deps come from the seed's own package db (no fetch).
