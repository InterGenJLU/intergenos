  # the upstream-published downloads.haskell.org/ghc/9.14.1/SHA256SUMS.
  - url: https://downloads.haskell.org/ghc/${version}/ghc-${version}-src.tar.xz
    sha256: 2a83779c9af86554a3289f2787a38d6aa83d00d136aa9f920361dd693c101e77
  # Bootstrap seed (pinned, disclosed) — ghc is written in Haskell, so building it
  # requires a prior ghc. This upstream binary distribution compiles the shipped
  # 9.14.1 from source (the in-tree rust/go bootstrap precedent; build-rules §2.5
  # pinned-source form). sha256 from downloads.haskell.org/ghc/9.10.2/SHA256SUMS.
