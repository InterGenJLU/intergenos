name: cssselect2
version: "0.9.0"
release: 1
description: CSS selector matching for Python ElementTree (icon-toolchain dep)
license: BSD-3-Clause
homepage: https://github.com/Kozea/cssselect2
tier: extra
iso_include: false
build_style: custom
install_func: do_install
source:
  - url: https://files.pythonhosted.org/packages/source/c/cssselect2/cssselect2-${version}.tar.gz
    sha256: 759aa22c216326356f65e62e791d66160a0f9c91d1424e8d8adc5e74dddfc6fb
dependencies:
  build:
    - flit-core
  host: []
  runtime:
    - tinycss2
    - webencodings
verify_paths:
  - /usr/lib/python3.14/site-packages/cssselect2/__init__.py
  - /usr/lib/python3.14/site-packages/cssselect2/compiler.py
