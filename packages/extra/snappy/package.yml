name: snappy
version: "1.2.2"
release: 2  # r2: iso_include true — shipped qemu links libsnappy.so.1 (NEEDED-closure Step 4.75, ge9b-05 mint 2026-07-18); a shipped consumer requires a shipped provider
description: Fast compression/decompression library from Google
tier: extra
iso_include: true
license: BSD-3-Clause
homepage: https://github.com/google/snappy
build_style: cmake
configure_flags:
- -DCMAKE_BUILD_TYPE=Release
- -DCMAKE_INSTALL_PREFIX=/usr
- -DCMAKE_INSTALL_LIBDIR=lib
- -DBUILD_SHARED_LIBS=ON
- -DSNAPPY_BUILD_TESTS=OFF
- -DSNAPPY_BUILD_BENCHMARKS=OFF
- -B build -G Ninja
working_dir: build
source:
- url: https://github.com/google/snappy/archive/${version}.tar.gz
  sha256: 90f74bc1fbf78a6c56b3c4a082a05103b3a56bb17bca1a27e052ea11723292dc
dependencies:
  build:
  - cmake
  - ninja
  host: []
  runtime: []
verify_paths:
  - /usr/lib/libsnappy.so.1.2.2
  - /usr/include/snappy-c.h
  - /usr/include/snappy-sinksource.h
