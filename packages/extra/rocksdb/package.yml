name: rocksdb
version: "11.1.1"
release: 2  # r2: the deprecated GPL-2.0 identifier replaced with GPL-2.0-only — the upstream README grants the GPLv2 in COPYING with no or-later election, and no source file elects one. Recipe metadata only, but the archive's .PKGINFO carries license=, so the shipped bytes change and the release advances with them.
description: Facebook/Meta RocksDB — embedded high-performance persistent KV store (LSM-tree)
license: "(Apache-2.0 OR GPL-2.0-only) AND BSD-3-Clause"
homepage: https://github.com/facebook/rocksdb
tier: extra
build_style: cmake
install_func: do_install
source:
- url: https://github.com/facebook/rocksdb/archive/refs/tags/v${version}.tar.gz
  sha256: 63f11183fe40725a0e89a9e392f2c86c94b90064f1d95f5173a02cfe40de13f7
dependencies:
  build:
  - cmake
  - ninja
  - snappy
  - gflags
  - jemalloc
  - liburing
  - zlib
  - lz4
  - zstd
  - bzip2
  host: []
  runtime:
  - snappy
  - gflags
  - jemalloc
  - liburing
  - zlib
  - lz4
  - zstd
  - bzip2
verify_paths:
  - /usr/lib/librocksdb.so.11.1.1
  - /usr/lib/pkgconfig/rocksdb.pc
  - /usr/include/rocksdb/advanced_cache.h
