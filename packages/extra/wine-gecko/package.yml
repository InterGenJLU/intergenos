name: wine-gecko
version: "2.47.4"
release: 1
description: Gecko HTML engine MSI addons for wine prefix creation (both PE widths)
license: MPL-2.0
homepage: https://wiki.winehq.org/Gecko
tier: extra
# Operator decision 1 (2026-07-02): ADD — without this package, wine's
# first prefix-creation SILENTLY fetches the gecko MSI over PLAIN HTTP
# from source.winehq.org (verified verbatim in the pinned 11.12
# dlls/appwiz.cpl/addons.c: "Download addon files over HTTP because
# Wine depends on an external library for TLS"). The exact silent-fetch
# class the posture rejects. With the MSIs at INSTALL_DATADIR/wine/gecko
# (= /usr/share/wine/gecko), addons.c's install_from_default_dir finds
# them FIRST and no network path ever fires.
#
# VERSION + SHAS ARE WINE'S OWN PINS: 2.47.4 and both sha256 values are
# the GECKO_VERSION/GECKO_SHA constants hardcoded in the pinned wine
# 11.12 addons.c (which arrived sha512-GPG-verified from WineHQ), and
# the downloaded dl.winehq.org artifacts hash byte-exact to those pins
# (verified at ingest 2026-07-02). wine's own sha_check enforces the
# same digests at consume time — a wrong artifact would be rejected and
# fall through to the network path, which is why ONLY these exact
# bytes may ship. A wine version bump that changes GECKO_VERSION bumps
# this package in lockstep (the pins live in addons.c — re-read them).
#
# BOTH widths ship: new-WoW64 wine creates 64-bit prefixes that install
# the x86_64 gecko, and 32-bit prefixes the x86 one. MSIs are consumed
# WHOLE by wine's msiexec at prefix-creation time — never executed on
# the host, never extracted at build (the builder's raw-copy branch for
# .msi sources). Rule-5 note: source[1] (the x86_64 MSI) is handled
# explicitly in do_install from the staged sources dir.
build_style: custom
install_func: do_install
iso_include: false
source:
- url: https://dl.winehq.org/wine/wine-gecko/${version}/wine-gecko-${version}-x86.msi
  sha256: 26cecc47706b091908f7f814bddb074c61beb8063318e9efc5a7f789857793d6
- url: https://dl.winehq.org/wine/wine-gecko/${version}/wine-gecko-${version}-x86_64.msi
  sha256: e590b7d988a32d6aa4cf1d8aa3aa3d33766fdd4cf4c89c2dcc2095ecb28d066f
dependencies:
  build: []
  host: []
  runtime: []
verify_paths:
  - /usr/share/wine/gecko/wine-gecko-2.47.4-x86.msi
  - /usr/share/wine/gecko/wine-gecko-2.47.4-x86_64.msi
