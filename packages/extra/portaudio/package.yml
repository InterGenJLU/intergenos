name: portaudio
version: "19.7.0"
release: 1
description: Cross-platform portable audio I/O library
license: MIT
homepage: http://www.portaudio.com/
tier: extra
iso_include: true  # 2026-05-28 curation walk — Keep (see docs/extra-tier-classification.md)
build_style: custom
install_func: do_install
source:
- url: https://files.portaudio.com/archives/pa_stable_v190700_20210406.tgz
  sha256: 47efbf42c77c19a05d22e627d42873e991ec0c1357219c0d74ce6a2948cb2def
dependencies:
  build:
  - alsa-lib
  host: []
  runtime:
  - alsa-lib
configure_flags:
- --prefix=/usr
- --disable-static
- --with-alsa
- --without-jack
- --without-oss
verify_paths:
  - /usr/lib/libportaudio.so
  - /usr/lib/pkgconfig/portaudio-2.0.pc
