name: rocm-comgr
version: "7.2.4"
release: 1
description: AMD Code Object Manager library (libamd_comgr)
license: NCSA
homepage: https://github.com/ROCm/llvm-project/tree/amd-staging/amd/comgr
tier: compute
build_style: custom
install_func: do_install

# SAME tarball as rocm-llvm (shared-source pin): builds amd/comgr only.
source:
  - url: https://github.com/ROCm/llvm-project/archive/refs/tags/rocm-${version}.tar.gz
    filename: rocm-llvm-project-${version}.tar.gz
    sha256: 526b5fe23417c41acbeb2273e470887b4593f48a297a8d9c1a1aa730d556f9fb

dependencies:
  build:
  - cmake
  - ninja
  - rocm-llvm
  - rocm-device-libs
  - zlib
  - zstd
  host: []
  runtime:
  - rocm-device-libs
  - zlib
  - zstd
verify_paths:
  - /opt/rocm/lib/libamd_comgr.so
  - /opt/rocm/include/amd_comgr/amd_comgr.h
