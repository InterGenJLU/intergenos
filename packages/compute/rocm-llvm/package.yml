name: rocm-llvm
version: "7.2.4"
release: 2  # r2: the compiler is installed where its own driver looks for the ROCm root. The AMD clang driver derives that root from the directory it runs out of — it strips a trailing "bin", then strips one more component if that one is named "llvm" (DeduceROCmPath in clang/lib/Driver/ToolChains/AMDGPU.cpp). Installed at /opt/rocm/lib/llvm, that yielded /opt/rocm/lib, which has no include/ and no lib/ under it, and the documented command `hipcc file.hip -o file` failed with "'hip/hip_runtime.h' file not found" on a machine with a complete, verified toolkit (measured 2026-09-20 on an installed R001.2 machine). The install prefix is now /opt/rocm/llvm, which yields /opt/rocm. A symlink cannot do this: the driver resolves its own path to the real directory first, which was proved by a bind-mounted shadow root compiling the same source at rc=0 while the symlinked layout failed in the same namespace. /opt/rocm/lib/llvm is kept as a compatibility symlink to ../llvm, because 26 other compute recipes and two installed files (MIOpen's config.h, MIGraphX's exported CMake targets) name the compiler under the old path; reaching the driver through that symlink deduces the correct root as well. Both shipped link targets are relative and neither begins with a UsrMerge top-level directory name, so the package manager's linkname remap leaves them alone.
content_hash: af5b47cf1ec3d482
description: AMD ROCm LLVM toolchain (amdclang, lld, compiler-rt) for GPU kernel compilation
license: Apache-2.0 WITH LLVM-exception
homepage: https://github.com/ROCm/llvm-project
tier: compute
build_style: custom
install_func: do_install

# AMD's llvm-project fork at the rocm-7.2.4 release tag. This ONE tarball
# feeds THREE packages (gcc-style shared-source pin): rocm-llvm builds
# llvm/, rocm-device-libs builds amd/device-libs/, rocm-comgr builds
# amd/comgr/ — and rocm-hip additionally extracts amd/hipcc/ from it.
# sha256 pinned 2026-07-15 (single-witness GitHub archive endpoint,
# cross-confirmed against Arch's rocm-llvm 7.2.4 packaging source pin).
source:
  - url: https://github.com/ROCm/llvm-project/archive/refs/tags/rocm-${version}.tar.gz
    filename: rocm-llvm-project-${version}.tar.gz
    sha256: 526b5fe23417c41acbeb2273e470887b4593f48a297a8d9c1a1aa730d556f9fb

dependencies:
  build:
  - cmake
  - ninja
  - python
  - zlib
  - zstd
  - libffi
  - libxml2
  host: []
  runtime:
  - zlib
  - zstd
  - libffi
  - libxml2
verify_paths:
  - /opt/rocm/llvm/bin/clang
  - /opt/rocm/llvm/bin/ld.lld
  - /opt/rocm/bin/amdclang++
  - /opt/rocm/llvm/lib/libomp.so
  - /opt/rocm/lib/llvm
