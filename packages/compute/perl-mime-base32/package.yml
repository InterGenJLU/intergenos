name: perl-mime-base32
version: "1.303"
release: 1
description: Perl module for Base32 encoding and decoding (RFC 4648 and base32hex)
license: Artistic-1.0-Perl OR GPL-1.0-or-later
homepage: https://metacpan.org/pod/MIME::Base32
tier: compute
build_style: custom
install_func: do_install
# Shipped because URI/otpauth.pm — part of the perl-uri distribution — loads
# MIME::Base32 at BEGIN, and the project's perl 5.42 does not carry it, so that
# one documented URI scheme died at load on every machine that had perl-uri.
# Pure perl; no compiler.
source:
- url: https://cpan.metacpan.org/authors/id/R/RE/REHSACK/MIME-Base32-${version}.tar.gz
  sha256: ab21fa99130e33a0aff6cdb596f647e5e565d207d634ba2ef06bdbef50424e99
dependencies:
  build:
  - perl-core
  host: []
  runtime:
  - perl
verify_paths:
  - /usr/lib/perl5/5.42/site_perl/MIME/Base32.pm
  - /usr/share/man/man3/MIME::Base32.3
