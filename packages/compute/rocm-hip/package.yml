name: rocm-hip
version: "7.2.4"
release: 2  # r2: runtime deps renamed to shipped namespace (F25 gate wave 2026-07-21)
description: HIP runtime and compiler driver for AMD GPUs (CLR/hipamd + hipcc/hipconfig)
license: MIT
homepage: https://github.com/ROCm/rocm-systems
tier: compute
build_style: custom
install_func: do_install

# TWO sources (Rule 5 — the secondary tarball is extracted explicitly in
# configure()): CLR + the HIP API headers come from the rocm-systems
# monorepo (source[0]); the hipcc/hipconfig compiler-driver utilities
# live in the llvm-project fork under amd/hipcc (source[1], the same
# shared-pin tarball rocm-llvm builds from — only amd/hipcc is extracted).
source:
  - url: https://github.com/ROCm/rocm-systems/archive/refs/tags/rocm-${version}.tar.gz
    filename: rocm-rocm-systems-${version}.tar.gz
    sha256: 817f9c136125b8d162757a18cdc25b18b1efeb8ef36a948c85e4a672fd149de5
  - url: https://github.com/ROCm/llvm-project/archive/refs/tags/rocm-${version}.tar.gz
    filename: rocm-llvm-project-${version}.tar.gz
    sha256: 526b5fe23417c41acbeb2273e470887b4593f48a297a8d9c1a1aa730d556f9fb

dependencies:
  build:
  - cmake
  - ninja
  - perl-core
  # hipamd's code generation imports CppHeaderParser at configure
  # (hipamd/src/CMakeLists.txt hard-requires it — surfaced live at the
  # first chroot build; the wave doc's pre-planned contingency).
  - python-cppheaderparser
  # hipamd/src/CMakeLists.txt:288 find_package is a hard require
  # (surfaced at retry-2; the reference distro's hip build carries it).
  - rocprofiler-register
  - rocm-llvm
  - rocm-device-libs
  - rocm-comgr
  - rocr-runtime
  - libdrm
  - mesa
  - numactl
  host: []
  runtime:
  - perl
  - rocm-llvm
  - rocm-device-libs
  - rocm-comgr
  - rocr-runtime
  - numactl
verify_paths:
  - /opt/rocm/lib/libamdhip64.so
  - /opt/rocm/bin/hipcc
  - /opt/rocm/bin/hipconfig
  - /etc/ld.so.conf.d/rocm.conf
