name: hipify
version: "7.2.4"
release: 2  # r2: runtime deps renamed to shipped namespace (F25 gate wave 2026-07-21)
description: HIPIFY — CUDA-to-HIP source translation tools (hipify-clang + hipify-perl; the CUDA-porting user's on-ramp)
license: MIT
homepage: https://github.com/ROCm/HIPIFY
tier: compute
build_style: custom
install_func: do_install

# Standalone repo at the rocm-7.2.4 tag (ruled IN for v1: the
# CUDA-porting user is squarely the differentiator's target audience).
# sha256 pinned 2026-07-17 (single-witness GitHub tag-archive endpoint,
# same caveat class as the other 7.2.4 pins). hipify-clang links the
# clang/LLVM libraries from the shipped rocm-llvm
# (find_package(Clang/LLVM CONFIG) — pinned CMakeLists:41-42);
# hipify-perl is generated alongside.
source:
  - url: https://github.com/ROCm/HIPIFY/archive/refs/tags/rocm-${version}.tar.gz
    filename: HIPIFY-rocm-${version}.tar.gz
    sha256: 3ffe18218c5bd0311e4359064da68f0a1d699bdc3b43472060d346a885bf8229

dependencies:
  build:
  - cmake
  - ninja
  - rocm-llvm
  host: []
  runtime:
  - rocm-llvm
  - perl
verify_paths:
  - /opt/rocm/bin/hipify-clang
  - /opt/rocm/bin/hipify-perl
