name: rocminfo
version: "7.2.4"
release: 2  # r2: /usr/bin symlinks for rocminfo + rocm_agent_enumerator so bare-name subprocess callers resolve them in every exec context (a service subprocess call failed silently and the GPU warp size defaulted to 64 on wave32 silicon; profile.d was rejected because it never reaches systemd services). Bumped BY HAND, decided 2026-08-13: this recipe pins an upstream tarball and ships no first-party sibling files, so bump-changed-releases.py does not track it — bytes changed at an unchanged (version,release) is exactly the shape the publish preflight refuses, and no instrument catches this class here. Any future content change to this recipe needs the same hand bump.
description: ROCm system-info reporter (rocminfo, rocm_agent_enumerator)
license: NCSA
homepage: https://github.com/ROCm/rocm-systems
tier: compute
build_style: custom
install_func: do_install

# SAME rocm-systems tarball as rocr-runtime (shared-source pin); builds
# projects/rocminfo. The DETECT half of the ruled detect-or-declare
# model: on a real box, rocminfo/rocm_agent_enumerator report the live
# gfx targets (the chroot always DECLARES — it has no GPU).
source:
  - url: https://github.com/ROCm/rocm-systems/archive/refs/tags/rocm-${version}.tar.gz
    filename: rocm-rocm-systems-${version}.tar.gz
    sha256: 817f9c136125b8d162757a18cdc25b18b1efeb8ef36a948c85e4a672fd149de5

dependencies:
  build:
  - cmake
  - rocr-runtime
  host: []
  runtime:
  - rocr-runtime
  - python
  - pciutils
verify_paths:
  - /opt/rocm/bin/rocminfo
  - /opt/rocm/bin/rocm_agent_enumerator
  - /usr/bin/rocminfo
  - /usr/bin/rocm_agent_enumerator
