name: rocsolver
version: "7.2.4"
release: 1
content_hash: 080219871086a4eb
description: ROCm dense linear algebra solvers (LAPACK-class routines on GPU)
license: BSD-2-Clause
homepage: https://github.com/ROCm/rocm-libraries
tier: compute
build_style: custom
install_func: do_install

# SAME rocm-libraries tarball (shared-source pin); builds
# projects/rocsolver from the monorepo. THE gfortran consumer that stood
# as the wave's Rule-6 FULL HALT: the pinned CMakeLists (lines 37-38)
# unconditionally selects gfortran as CMAKE_Fortran_COMPILER — resolved
# by gcc-core r4 (fortran enabled, canary-proven 2026-07-17).
# BUILD_WITH_SPARSE is explicitly ON (upstream shared-lib default is OFF
# + runtime dlopen of librocsparse; we ship rocsparse in the same wave,
# so the hard link turns an unverified runtime assumption into a
# link-time checked gate).
source:
  - url: https://github.com/ROCm/rocm-libraries/archive/refs/tags/rocm-${version}.tar.gz
    filename: rocm-rocm-libraries-${version}.tar.gz
    sha256: 50a4090b4ad18b34c375f666e5f71816cf55f89bc2175dc3eba9a7b80f65a15d

gpu_targets: "gfx1100;gfx1102;gfx1201"

dependencies:
  build:
  - cmake
  - ninja
  - rocm-cmake
  - rocm-hip
  - rocprim
  - rocblas
  - rocsparse
  - fmt
  host: []
  runtime:
  - rocm-hip
  - rocblas
  - rocsparse
verify_paths:
  - /opt/rocm/lib/librocsolver.so
  - /opt/rocm/lib/cmake/rocsolver
