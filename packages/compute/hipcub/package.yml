name: hipcub
version: "7.2.4"
release: 1
description: CUB-compatible C++ header interface over rocPRIM (HIP parallel primitives portability layer)
license: BSD-3-Clause
homepage: https://github.com/ROCm/rocm-libraries
tier: compute
build_style: custom
install_func: do_install

# SAME rocm-libraries tarball (shared-source pin); builds
# projects/hipcub from the monorepo. Header-only portability layer:
# on the AMD platform it wraps the installed rocprim package
# (ROCPRIM_FETCH_METHOD defaults to PACKAGE — pinned CMakeLists:96;
# CCCL/CUB is the CUDA-platform path only and is never touched here).
source:
  - url: https://github.com/ROCm/rocm-libraries/archive/refs/tags/rocm-${version}.tar.gz
    filename: rocm-rocm-libraries-${version}.tar.gz
    sha256: 50a4090b4ad18b34c375f666e5f71816cf55f89bc2175dc3eba9a7b80f65a15d

gpu_targets: "gfx1100;gfx1102;gfx1201"

dependencies:
  build:
  - cmake
  - ninja
  - rocm-cmake
  - rocm-hip
  - rocprim
  host: []
  runtime:
  - rocprim
verify_paths:
  - /opt/rocm/include/hipcub/hipcub.hpp
  - /opt/rocm/lib/cmake/hipcub
