name: hipfft
version: "7.2.4"
release: 1
description: HIP portability interface over rocFFT (cuFFT-compatible FFT API)
license: MIT
homepage: https://github.com/ROCm/rocm-libraries
tier: compute
build_style: custom
install_func: do_install

# SAME rocm-libraries tarball (shared-source pin); builds
# projects/hipfft from the monorepo. Thin marshalling layer over the
# installed rocfft package. Clients + HIPFFT_MPI_ENABLE stay at their
# upstream default OFF (pinned CMakeLists:56-77).
source:
  - url: https://github.com/ROCm/rocm-libraries/archive/refs/tags/rocm-${version}.tar.gz
    filename: rocm-rocm-libraries-${version}.tar.gz
    sha256: 50a4090b4ad18b34c375f666e5f71816cf55f89bc2175dc3eba9a7b80f65a15d

gpu_targets: "gfx1100;gfx1102;gfx1201"

dependencies:
  build:
  - cmake
  - ninja
  - rocm-cmake
  - rocm-hip
  - rocfft
  host: []
  runtime:
  - rocm-hip
  - rocfft
verify_paths:
  - /opt/rocm/lib/libhipfft.so
  - /opt/rocm/include/hipfft/hipfft.h
