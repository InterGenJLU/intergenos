name: rocr-runtime
version: "7.2.4"
release: 1
description: HSA Runtime API and runtime for ROCm (libhsa-runtime64, hsakmt thunk folded in)
license: NCSA
homepage: https://github.com/ROCm/rocm-systems
tier: compute
build_style: custom
install_func: do_install

# rocm-systems monorepo at the rocm-7.2.4 tag; builds projects/rocr-runtime.
# sha256 pinned 2026-07-15 and independently matched by Arch's hsa-rocr
# 7.2.4 source pin (two witnesses). The hsakmt thunk (former ROCT) is
# folded into this project since ROCm 6.3 — no separate thunk package.
source:
  - url: https://github.com/ROCm/rocm-systems/archive/refs/tags/rocm-${version}.tar.gz
    filename: rocm-rocm-systems-${version}.tar.gz
    sha256: 817f9c136125b8d162757a18cdc25b18b1efeb8ef36a948c85e4a672fd149de5

dependencies:
  build:
  - cmake
  - ninja
  - rocm-llvm
  - rocm-device-libs
  - libdrm
  - elfutils
  - numactl
  - vim
  host: []
  runtime:
  - libdrm
  - elfutils
  - numactl
verify_paths:
  - /opt/rocm/lib/libhsa-runtime64.so.1
  - /opt/rocm/include/hsa/hsa.h
