name: rocr-runtime
version: "7.2.4"
release: 2  # r2: rocprofiler-register is declared, as a build AND a runtime dependency. libhsa-runtime64.so links librocprofiler-register.so.0 — its cmake picks the profiler hook up when the package happens to be present and takes a silent else-branch when it is not, so which of the two shipped was decided by build order rather than by this recipe. Declaring the build edge makes the link deliberate; declaring the runtime edge is what puts the library on the machine, which on the R001.1 install of 2026-08-22 it was not. r1: prior release.
description: HSA Runtime API and runtime for ROCm (libhsa-runtime64, hsakmt thunk folded in)
license: NCSA
homepage: https://github.com/ROCm/rocm-systems
tier: compute
build_style: custom
install_func: do_install

# rocm-systems monorepo at the rocm-7.2.4 tag; builds projects/rocr-runtime.
# sha256 pinned 2026-07-15 and independently matched by Arch's hsa-rocr
# 7.2.4 source pin (two witnesses). The hsakmt thunk (former ROCT) is
# folded into this project since ROCm 6.3 — no separate thunk package.
source:
  - url: https://github.com/ROCm/rocm-systems/archive/refs/tags/rocm-${version}.tar.gz
    filename: rocm-rocm-systems-${version}.tar.gz
    sha256: 817f9c136125b8d162757a18cdc25b18b1efeb8ef36a948c85e4a672fd149de5

dependencies:
  build:
  - cmake
  - ninja
  - rocm-llvm
  - rocm-device-libs
  - libdrm
  - elfutils
  - numactl
  - vim
  # The profiler hook this runtime links. Its cmake takes a silent
  # else-branch when the package is absent, so an undeclared edge decides
  # by build order whether libhsa-runtime64.so ships with the hook or
  # without it. Declared, the choice is this recipe's.
  - rocprofiler-register
  host: []
  runtime:
  - libdrm
  - elfutils
  - numactl
  # libhsa-runtime64.so records librocprofiler-register.so.0 in DT_NEEDED:
  # without it, every program that loads the HSA runtime fails at the
  # dynamic linker.
  - rocprofiler-register
verify_paths:
  - /opt/rocm/lib/libhsa-runtime64.so.1
  - /opt/rocm/include/hsa/hsa.h
