name: hipblas-common
version: "7.2.4"
release: 1
description: Common headers shared by the hipBLAS API family
license: MIT
homepage: https://github.com/ROCm/rocm-libraries
tier: compute
build_style: custom
install_func: do_install

# SAME rocm-libraries tarball (shared-source pin); builds
# projects/hipblas-common — a small header+cmake-config project split
# out by upstream in the 7.x monorepo; hipblas find_packages it.
source:
  - url: https://github.com/ROCm/rocm-libraries/archive/refs/tags/rocm-${version}.tar.gz
    filename: rocm-rocm-libraries-${version}.tar.gz
    sha256: 50a4090b4ad18b34c375f666e5f71816cf55f89bc2175dc3eba9a7b80f65a15d

dependencies:
  build:
  - cmake
  - rocm-cmake
  - rocm-hip
  host: []
  runtime: []
verify_paths:
  - /opt/rocm/include/hipblas-common/hipblas-common.h
  - /opt/rocm/lib/cmake/hipblas-common/hipblas-common-config.cmake
