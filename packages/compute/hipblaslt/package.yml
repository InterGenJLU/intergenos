name: hipblaslt
version: "7.2.4"
release: 3  # r3: the declared GPU architecture list narrows from the six ruled targets to FIVE — gfx1030 is removed. This build therefore emits kernels for five architectures instead of six, so the release moves with the bytes. hipBLASLt cannot be built for RDNA2 and that is upstream's boundary: its kernels are generated by TensileLite for MFMA (gfx9) and WMMA (gfx11+) instructions, gfx1030 has neither, and the library's own supported-architecture list (cmake/tensilelite_supported_architectures.cmake in https://github.com/ROCm/rocm-libraries) refuses it at CMake configure time — measured 2026-09-18, a six-target build failed in 14 s with "Unsupported GPU target: gfx1030". Declaring six here produced no kernels for six; it produced a build that could not run. No gfx1030 user loses anything that existed: the HIP engine does not link this library (ldd on the built engine names libhipblas.so.3 and librocblas.so.5), and rocBLAS, which it does link, builds for all six. THIS BUMP WAS WRITTEN BY HAND: measured 2026-09-18, the release-bump machine does not see a gpu_targets change at all, because the field is not in content_hash.py's _BUILD_AFFECTING_YML_KEYS fold — the gap cut separately as the bump-machine work. The stated exception is held against the tree by tests/igos_build/test_the_rocm_stack_declares_one_target_list.py, which refuses both an unstated omission and an exception nobody's recipe carries. # r2: the declared GPU architecture list widens from three targets to the six ruled on 2026-09-18 — gfx1030, gfx1100, gfx1101, gfx1102, gfx1200 and gfx1201, the five consumer and workstation architectures AMD's ROCm 7.2.0 compatibility matrix names plus gfx1102 (Navi 33), which this project declares deliberately. This build therefore emits kernels for six architectures instead of three, so the release moves with the bytes. Of the six, three are proven on hardware in this project's set — gfx1201 on the workstation card, gfx1100 and gfx1102 on the reference pair — and three are gate-proven only: gfx1030, gfx1101 and gfx1200, which no machine here carries. The rationale for the list is written once, in packages/compute/llama-cpp-hip/package.yml. This bump was written by hand: measured 2026-09-18, the release-bump machine does not see a gpu_targets change at all, because the field is not in content_hash.py's _BUILD_AFFECTING_YML_KEYS fold.
content_hash: 852d227f2f31f13d
description: hipBLASLt — lightweight GEMM library with flexible epilogues (MIOpen + PyTorch-class consumer surface)
license: MIT
homepage: https://github.com/ROCm/rocm-libraries
tier: compute
build_style: custom
install_func: do_install

# SAME rocm-libraries tarball (shared-source pin); builds
# projects/hipblaslt from the monorepo (TensileLite kernel generation —
# the second Tensile-class heavy build after rocblas). Joined the wave
# as HARD dep closure: MIOpen's MIOPEN_USE_HIPBLASLT defaults ON
# (find_package(hipblaslt REQUIRED)); it is also the PyTorch-on-ROCm
# GEMM path.
#
# source[1]+[2] = nanobind v2.6.1 + its robin-map submodule, pre-staged
# for the in-tree rocisa python module (device-code generation): the
# pinned rocisa/CMakeLists.txt:21-26 FetchContent-clones nanobind at
# commit 9b3afa9d — offline-fatal; FETCHCONTENT_SOURCE_DIR_NANOBIND
# redirects it to the staged copy (CMake-native override, no patch).
# Commit archives are immutable; nanobind commit = the exact sha the
# pinned source names, robin-map commit = nanobind's ext/robin_map
# gitlink at that sha (GitHub tree API, resolved 2026-07-17). Both
# single-witness endpoint pins with in-source identity corroboration.
#
# HIPBLASLT_ENABLE_ROCROLLER=OFF (decision item, operator rules): the
# in-tree RocRoller backend is CDNA-scoped codegen (gfx90a/gfx942 CI
# surface) with FIVE FetchContent git fetches, two on MOVING refs
# (libdivide@master, spdlog@v1.x) — unpinnable per the stable-URL
# discipline and outside the declared RDNA target set. Revisit if a
# CDNA target is ever declared.
source:
  - url: https://github.com/ROCm/rocm-libraries/archive/refs/tags/rocm-${version}.tar.gz
    filename: rocm-rocm-libraries-${version}.tar.gz
    sha256: 50a4090b4ad18b34c375f666e5f71816cf55f89bc2175dc3eba9a7b80f65a15d
  - url: https://github.com/wjakob/nanobind/archive/9b3afa9dbdc23641daf26fadef7743e7127ff92f.tar.gz
    filename: nanobind-2.6.1.tar.gz
    sha256: 028b3008d3e2db84628fa343cd23b9391f866b1e3a506d1462d643bf9bed18c9
  - url: https://github.com/Tessil/robin-map/archive/188c45569cc2a5dd768077c193830b51d33a5020.tar.gz
    filename: robin-map-188c4556.tar.gz
    sha256: 2f4be670fa4f53c3261ed7af392b414a00e75591f87da0a8dd525de376430747

# THE RULED LIST, LESS ONE STATED EXCEPTION. The ruled list (Decided
# 2026-09-18) is six concrete architectures: the five consumer and workstation
# targets AMD's ROCm 7.2.0 compatibility matrix names, plus gfx1102 (Navi 33),
# which this project declares deliberately. The reasoning — the age limit, why
# gfx1102 is in, and why the math libraries rather than the compiler are what
# bounds the list — is written once, in
# packages/compute/llama-cpp-hip/package.yml. It is COPIED here rather than
# referenced because a recipe field in this format has no cross-recipe constant
# to point at; tests/igos_build/test_the_rocm_stack_declares_one_target_list.py
# is what keeps the copies identical, holds this recipe to the ruled list less
# its STATED exception, and sweeps in any new recipe that declares gfx targets.
#
# THIS RECIPE DECLARES FIVE: the ruled list WITHOUT gfx1030. hipBLASLt cannot be
# built for RDNA2, and that is upstream's boundary rather than a choice made
# here. Its kernels are generated by TensileLite for the matrix instructions —
# MFMA on gfx9 and WMMA on gfx11 and later — and gfx1030 has neither, so the
# library's own supported-architecture list
# (cmake/tensilelite_supported_architectures.cmake in
# https://github.com/ROCm/rocm-libraries) names gfx908, gfx90a, gfx942, gfx950
# and the RDNA3-and-later consumer parts and refuses anything else at CMake
# configure time. Measured 2026-09-18: a six-target build of this package
# failed in 14 s with "CMake Error ... Unsupported GPU target: gfx1030".
# Declaring six here would not produce kernels for six; it would produce a
# build that cannot run. Five, said out loud, is the honest declaration.
#
# WHAT THIS COSTS A gfx1030 USER: nothing that was ever available. The HIP
# engine does not link hipBLASLt (measured 2026-09-18 by ldd on the built
# engine: libhipblas.so.3 and librocblas.so.5, no hipblaslt), and rocBLAS —
# which it does link — builds for all six. Consumers that do call hipBLASLt on
# an RDNA2 card had no kernels from any distribution's build.
#
# Widening the list is never a one-recipe change: rocBLAS and hipBLASLt build
# their kernels first, the engine builds last.
gpu_targets: "gfx1100;gfx1101;gfx1102;gfx1200;gfx1201"

dependencies:
  build:
  - cmake
  - ninja
  - rocm-cmake
  - rocm-hip
  - rocm-llvm
  - hipblas-common
  - roctracer
  - msgpack-cxx
  - python
  - python-msgpack
  - python-joblib
  - pyyaml
  - rich
  - setuptools
  - wheel
  host: []
  runtime:
  - rocm-hip
  - roctracer
  - msgpack-cxx
verify_paths:
  - /opt/rocm/lib/libhipblaslt.so
  # TensileLite kernel library — the load-bearing artifact (same class
  # as rocblas's: a hipblaslt without kernels loads and fails at first
  # matmul).
  - /opt/rocm/lib/hipblaslt/library
