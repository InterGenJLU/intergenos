name: llama-cpp-cuda
version: "b8796"
release: 8  # r8: the architecture record is written from the builder's exported declaration (IGOS_GPU_TARGETS, present in every phase), not from the variable configure() set: each recipe phase runs in its own shell, and the first real build of the r7 form stopped in do_install with its own guard message rather than shipping an empty record. The record's content is unchanged (the declared list); no compiled output and no declared input changed. the engine installs the architectures it compiled for, so the serving selector can read them. do_install() now writes the declared CMAKE_CUDA_ARCHITECTURES list from the same CUDA_ARCHS the cmake configure consumed to /opt/llama-cpp-cuda/share/llama-cpp-cuda/gpu-targets, and verify_paths names it. Without this record the selector could only ask whether NVIDIA's proprietary driver was bound, which is a different question: CUDA 13 carries no code below Turing, so a Volta card on a perfectly good driver has neither compiled kernels nor PTX to JIT from and the engine cannot serve. The HIP variant has had the same record since its own architecture gate landed; this gives the CUDA variant the same shape at its own prefix. The expansion is guarded (${CUDA_ARCHS:?...}) so a phase that ever ran without the variable fails loudly instead of writing an EMPTY record, which the runtime reads as "unknown" and would let the engine be offered on hardware nothing proved it can serve. No compiled output and no declared input changed.  # r6: the engine carries compiled kernels for every card generation it claims. gpu_targets declared Turing and the Ampere datacentre parts as PTX, on the reasoning that the driver translates PTX at load time; that holds only while the driver is at least as new as the toolkit, and it was false on a shipped machine — measured 2026-09-17 on a compute-7.5 card with driver 580.159.04 (CUDA 13.0) against this pinned 13.3.1 toolkit, where a real sm_75 ELF ran and the same program built as sm_75 PTX failed with "the provided PTX was compiled with an unsupported toolchain". Every generation the pinned toolkit can emit is now declared -real, configure() refuses a -virtual token, and do_install() asks each staged binary through cuobjdump for the architectures it carries and refuses to seal the archive if a declared generation is missing. The payload changes: the binaries now carry kernels for twelve generations rather than four. Also in this release, the CUDA runfile is extracted with --tmpdir pointing into the build work area: without it the wrapper takes its scratch room from the build host's /tmp, an undeclared requirement that failed on a machine with a 7.7 GiB tmpfs /tmp. No declared input and no source pin changed.  # r5: spelling only — the project's license word is written the American way everywhere this project speaks in its own voice, and this recipe's own text moved with the sweep. No behaviour, no payload and no declared input changed; a gate now refuses the other spelling in new text, with every upstream name exempted by name. r4: no behaviour change: one build.sh comment about the CUDA runfile extract flag now refers to the earlier decision plainly. Comment text only.  # r3: the engine reports which build it is. Upstream derives the build number from git metadata and these recipes build from a release tarball with no .git, so cmake's build-info step stamped zero and every binary shipped so far answered --version with "version: 0 (unknown)" — the one question a user comparing two engines has to be able to ask. configure() now passes LLAMA_BUILD_NUMBER, DERIVED from this recipe's own version pin rather than written a second time, and the pin's shape is checked so a pin that stops being b<number> fails the build loudly instead of stamping something wrong. do_install() then asks the STAGED binary for its --version and refuses to seal the archive unless it reports the pinned number; it lives there rather than in check() because the CUDA variant declares tests.enabled=false and the builder skips the whole check phase for such a package, which would have left one of the three engines unasserted. The same two shell functions are carried byte for byte by all three engine recipes, the same one-shape discipline as the --list-devices patch. Verified on a real build of this recipe on an NVIDIA machine: the staged llama-cli answers "version: 8796 (unknown)". r2: --list-devices PCI-id suffix — the same byte-identical in-tree patch as the default engine (see ai/llama-cpp r5 for the full rationale and the measurement), applied fail-loud in configure() after the toolkit assembly. One-pin policy: all three engine variants print one shape so the serving-device selector reads them identically.
content_hash: 5a4e13b284f3a855
description: LLM inference engine — CUDA variant for NVIDIA GPUs (opt-in, mirror-only)
license: MIT
homepage: https://github.com/ggml-org/llama.cpp
tier: compute
build_style: custom
install_func: do_install

# SAME engine pin as packages/ai/llama-cpp and packages/compute/llama-cpp-hip
# (ruled decision 6: ALL variants ride ONE llama.cpp commit; a pin bump moves
# every variant together as its own reviewed step — this recipe inherits the
# current in-tree pin verbatim, provenance notes in the ai recipe).
source:
- url: https://github.com/ggml-org/llama.cpp/archive/fae3a28070fe4026f87bd6a544aba1b2d1896566.tar.gz
  filename: llama.cpp-${version}.tar.gz
  sha256: 78a0190da2b2ff95506844a6f917e8a0d9c3d5b9cd7303d0f4ee95319dffd9e8
# The CUDA toolkit, as a BUILD input only.
#
# nvcc is not redistributable under NVIDIA's CUDA EULA, so this entry is
# marked redistributable: false. The builder stages and sha-verifies it like
# any other pinned source, build.sh unpacks it in the runfile's own
# extract-only mode so NVIDIA's installer never runs, compiles against it, and
# scripts/build-source-archives.py refuses to place
# it in the corresponding-source archive — writing NON-REDISTRIBUTABLE.txt
# with this URL and this sha256 instead, so anyone reproducing the build can
# obtain exactly these bytes from NVIDIA.
#
# extract: false — the builder must not try to unpack it; it is a
# self-extracting installer, and build.sh drives its own extraction with the
# flags that keep it headless and keep its bundled driver out of the way.
#
# The USER never receives these bytes from us either: the runtime libraries
# reach an installed machine through the compute/cuda-toolkit download helper,
# which fetches this same file from NVIDIA on the user's own machine.
#
# sha256 taken 2026-08-04 from a download whose MD5 matched NVIDIA's published
# manifest at https://developer.download.nvidia.com/compute/cuda/13.3.1/docs/sidebar/md5sum.txt
# (7c8d3eca60ee10d2c290bdc045f88f09). The pin, the version in build.sh and the
# pin in the cuda-toolkit helper move together.
- url: https://developer.download.nvidia.com/compute/cuda/13.3.1/local_installers/cuda_13.3.1_610.43.02_linux.run
  filename: cuda_13.3.1_610.43.02_linux.run
  sha256: 9f98ec1f6c950401041d3f1308e221f0d5db8771a8e10569001b64caaee31a92
  extract: false
  redistributable: false

# DECLARED GPU targets (decision 2): the chroot has no GPU, so the target set
# is stated, never detected. NVIDIA spelling is compute capability in the
# CMAKE_CUDA_ARCHITECTURES vocabulary.
#
# EVERY GENERATION IS -real. THERE IS NO -virtual TOKEN HERE, AND configure()
# REFUSES ONE.
#
# The earlier list declared 75-virtual and 80-virtual on the reasoning that the
# driver JIT-compiles PTX, so a Turing card would work without carrying its
# kernels. That reasoning is wrong whenever the driver is older than the
# toolkit, and it was wrong on a shipped machine. Measured 2026-09-17 on a
# GeForce GTX 1650 (compute capability 7.5) running driver 580.159.04 against a
# toolkit at 13.3.1, with a five-line CUDA program built two ways from that
# toolkit:
#
#   built as a real sm_75 ELF   -> the kernel ran, the value came back
#   built as sm_75 PTX only     -> "the provided PTX was compiled with an
#                                  unsupported toolchain", the kernel did not
#                                  run, and the memory kept its fill pattern
#
# That is the same sentence the assistant's engine aborted on at every launch
# on that machine, which served on Vulkan instead for four days. A driver
# advertises the CUDA version it can translate PTX for — 580.159.04 advertises
# 13.0 — and PTX emitted by a NEWER toolkit is refused. Carrying PTX for a
# generation therefore promises a card that the promise cannot be kept for on
# any machine whose driver has not caught up with our toolkit, which is the
# normal case for a distribution that pins both.
#
# So every generation this toolkit can target is carried as compiled kernels,
# and do_install() refuses to seal the archive unless the staged binaries
# actually contain an ELF for each one.
#
# THE AGE LIMIT, stated plainly: CUDA 13 removed Maxwell, Pascal and Volta
# ("Removed support for Maxwell, Pascal, and Volta GPUs, corresponding to
# compute capabilities earlier than Turing", CUDA 13.0 release notes,
# https://docs.nvidia.com/cuda/cuda-toolkit-release-notes/index.html). The
# oldest generation this engine can be built for is therefore Turing, 7.5,
# 2018. Older NVIDIA cards are not abandoned — they serve on the Vulkan engine,
# which is the default and carries no such floor.
#
# The list is every entry `nvcc --list-gpu-arch` reports for the pinned 13.3.1
# toolkit, read from the toolkit itself on 2026-09-17:
#
#   75-real      Turing        GeForce GTX 16 / RTX 20
#   80-real      Ampere        A100 and the datacentre parts
#   86-real      Ampere        GeForce RTX 30
#   87-real      Ampere        Jetson Orin
#   88-real      Ampere        the second Orin target
#   89-real      Ada           GeForce RTX 40
#   90-real      Hopper        H100
#   100-real     Blackwell     datacentre
#   103-real     Blackwell     the second datacentre target
#   110-real     Blackwell     the third
#   120a-real    Blackwell     GeForce RTX 50. The 'a' is required: the FP4
#                              tensor-core instructions are not forwards
#                              compatible.
#   121a-real    Blackwell     the second consumer target, same reason.
#
# Carrying compiled kernels for all of them costs archive size, and that cost is
# stated in the release note rather than discovered later.
gpu_targets: "75-real;80-real;86-real;87-real;88-real;89-real;90-real;100-real;103-real;110-real;120a-real;121a-real"

dependencies:
  build:
  - cmake
  # llama.cpp's common/ links OpenSSL (verified in the configure output at this
  # pin: "OpenSSL found: 3.6.1"). The ai-tier recipe declares curl instead,
  # which is vestigial there — LLAMA_CURL was removed at r3 and the shipped
  # binary links no libcurl. Declaring what this build actually uses.
  - openssl
  # configure() merges the extracted CUDA component trees into one toolkit root
  # with rsync — the per-component include/lib64 symlinks repeat and must be
  # replaced rather than followed, which cp does not do.
  - rsync
  # The host compiler nvcc drives is the chroot's own toolchain, implicit here
  # exactly as it is for the sibling engine recipes. nvcc 13.3.1 accepts GNU
  # 15.2.0 with no override flag — measured at this pin, so the 2026-06-11
  # design record's planned gcc-15 noexcept patch is not carried.
  host: []
  runtime:
  # The CUDA runtime libraries this engine links (libcudart, libcublas,
  # libcublasLt and their dependencies) live at /opt/cuda, put there by the
  # cuda-toolkit download helper. Declaring the dependency gets the helper
  # onto the machine; the post-install hook below states the one command that
  # actually fetches the toolkit, because pkm never accepts a vendor license
  # on the user's behalf and so never runs a download helper unprompted.
  - cuda-toolkit
  # libcuda.so.1 — the CUDA driver API — comes from the driver, not the
  # toolkit. Without it the engine cannot open a device at all.
  - nvidia

tests:
  enabled: false
  reason: "llama.cpp's CUDA test set requires a CUDA device: the build chroot has no GPU, no /dev/nvidia* nodes and no driver, so every device-side test fails on environment rather than on correctness. This is the second rung of the tests ladder rather than the first because the failures are not selectable — the whole set is device-side, so there is no runnable subset for a known-failures policy to keep exercising, and a policy that expects every test to fail records nothing a real regression could disturb. Accordingly build.sh also passes LLAMA_BUILD_TESTS=OFF: a test binary that can never run here is not worth about 4.7 GiB of statically-linked CUDA kernels to compile and then discard. The build's own proof is that the CUDA backend compiles for every declared architecture and that the resulting binaries link against the toolkit; device-side behaviour is proven on real NVIDIA hardware, where the CUDA-versus-Vulkan measurement for this engine is taken. The nvidia, docker and runc recipes carry the same environment-bounded disposition; the two sibling llama.cpp recipes (packages/ai/llama-cpp and packages/compute/llama-cpp-hip) declare no tests block at all, which is a weaker statement than this one, not the same one."

verify_paths:
  - /opt/llama-cpp-cuda/bin/llama-server
  - /opt/llama-cpp-cuda/bin/llama-cli
  # The benchmark tool is how a user confirms this engine is worth its opt-in
  # on their own card, and it is the instrument the project's own
  # CUDA-versus-Vulkan comparison uses. A build that dropped it would leave
  # the claim unverifiable on the machine that matters.
  - /opt/llama-cpp-cuda/bin/llama-bench
  # The architectures this build compiled for, written by do_install from the
  # gpu_targets above. The serving selector reads it to decide whether this
  # engine has code the machine's card can execute; a build that shipped
  # without it leaves that question unanswerable at run time.
  - /opt/llama-cpp-cuda/share/llama-cpp-cuda/gpu-targets
