name: hipsolver
version: "7.2.4"
release: 1
description: HIP portability interface over rocSOLVER (cuSOLVER-compatible dense + sparse solver API)
license: MIT
homepage: https://github.com/ROCm/rocm-libraries
tier: compute
build_style: custom
install_func: do_install

# SAME rocm-libraries tarball (shared-source pin); builds
# projects/hipsolver from the monorepo. BUILD_WITH_SPARSE=OFF — the
# upstream default; in hipsolver (unlike rocsolver) ON additionally
# hard-requires SuiteSparse at configure (find_package(CHOLMOD
# REQUIRED), library/src/CMakeLists.txt:163-167), which the tree
# deliberately does not ship. OFF still links rocblas + rocsolver as
# REQUIRED — dense + Rf fully link-checked; the Sp routes use runtime
# dlopen by design (see build.sh). BUILD_FORTRAN_BINDINGS keeps its
# upstream UNIX default ON (gfortran available since gcc-core r4).
# RUNTIME RESIDUAL (named, not silent): the hipsolverSp routes dlopen
# librocsparse.so (shipped — those routes work) and the cholesky/QR
# routes additionally dlopen libcholmod.so at runtime
# (library/src/amd_detail/dlopen/cholmod.cpp — packaging metadata in the
# pinned CMakeLists:248-252 mirrors this). No SuiteSparse package exists
# in the tree yet; those specific routes fail loudly at runtime until it
# lands. Tracked as a wave decision item.
source:
  - url: https://github.com/ROCm/rocm-libraries/archive/refs/tags/rocm-${version}.tar.gz
    filename: rocm-rocm-libraries-${version}.tar.gz
    sha256: 50a4090b4ad18b34c375f666e5f71816cf55f89bc2175dc3eba9a7b80f65a15d

gpu_targets: "gfx1100;gfx1102;gfx1201"

dependencies:
  build:
  - cmake
  - ninja
  - rocm-cmake
  - rocm-hip
  - rocblas
  - rocsolver
  - rocsparse
  host: []
  runtime:
  - rocm-hip
  - rocblas
  - rocsolver
  - rocsparse
verify_paths:
  - /opt/rocm/lib/libhipsolver.so
  - /opt/rocm/lib/cmake/hipsolver
