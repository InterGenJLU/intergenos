name: rocsparse
version: "7.2.4"
release: 3  # r3: the declared GPU architecture list widens from three targets to the six ruled on 2026-09-18 — gfx1030, gfx1100, gfx1101, gfx1102, gfx1200 and gfx1201, the five consumer and workstation architectures AMD's ROCm 7.2.0 compatibility matrix names plus gfx1102 (Navi 33), which this project declares deliberately. This build therefore emits kernels for six architectures instead of three, so the release moves with the bytes. Of the six, three are proven on hardware in this project's set — gfx1201 on the workstation card, gfx1100 and gfx1102 on the reference pair — and three are gate-proven only: gfx1030, gfx1101 and gfx1200, which no machine here carries. The rationale for the list is written once, in packages/compute/llama-cpp-hip/package.yml. This bump was written by hand: measured 2026-09-18, the release-bump machine does not see a gpu_targets change at all, because the field is not in content_hash.py's _BUILD_AFFECTING_YML_KEYS fold.  # r2: roctracer is declared, as a build AND a runtime dependency. librocsparse.so links libroctx64.so.4 — the annotation library roctracer ships — and nothing declared it, so on the R001.1 install of 2026-08-22 that library was absent and every consumer of the sparse linear-algebra library, the inference engine included, failed at the dynamic linker. r1: prior release.
content_hash: 9c609ae245503fa5
description: ROCm sparse linear algebra library (BLAS for sparse matrices on GPU)
license: MIT
homepage: https://github.com/ROCm/rocm-libraries
tier: compute
build_style: custom
install_func: do_install

# SAME rocm-libraries tarball (shared-source pin); builds
# projects/rocsparse from the monorepo. BUILD_WITH_ROCBLAS keeps its
# upstream default ON (pinned CMakeLists:89 — dense-block routines reuse
# the installed rocblas), so rocblas is a real build+runtime edge.
source:
  - url: https://github.com/ROCm/rocm-libraries/archive/refs/tags/rocm-${version}.tar.gz
    filename: rocm-rocm-libraries-${version}.tar.gz
    sha256: 50a4090b4ad18b34c375f666e5f71816cf55f89bc2175dc3eba9a7b80f65a15d

# THE ONE RULED LIST — written identically in every ROCm recipe in this tree
# (Decided 2026-09-18). Six concrete architectures: the five consumer and
# workstation targets AMD's ROCm 7.2.0 compatibility matrix names, plus gfx1102
# (Navi 33), which this project declares deliberately. The reasoning — the age
# limit, why gfx1102 is in, and why the math libraries rather than the compiler
# are what bounds the list — is written once, in
# packages/compute/llama-cpp-hip/package.yml. It is COPIED here rather than
# referenced because a recipe field in this format has no cross-recipe constant
# to point at; tests/igos_build/test_the_rocm_stack_declares_one_target_list.py
# is what keeps the copies byte-identical, and it sweeps in any new recipe that
# declares gfx targets. Widening the list is never a one-recipe change: rocBLAS
# and hipBLASLt build their kernels first, the engine builds last.
gpu_targets: "gfx1030;gfx1100;gfx1101;gfx1102;gfx1200;gfx1201"

dependencies:
  build:
  - cmake
  - ninja
  - rocm-cmake
  - rocm-hip
  - rocprim
  - rocblas
  # The marker/annotation library this one links against.
  - roctracer
  host: []
  runtime:
  - rocm-hip
  - rocblas
  # librocsparse.so records libroctx64.so.4 in DT_NEEDED, and roctracer is
  # the package that ships it.
  - roctracer
verify_paths:
  - /opt/rocm/lib/librocsparse.so
  - /opt/rocm/lib/cmake/rocsparse
