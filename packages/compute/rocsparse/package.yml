name: rocsparse
version: "7.2.4"
release: 2  # r2: roctracer is declared, as a build AND a runtime dependency. librocsparse.so links libroctx64.so.4 — the annotation library roctracer ships — and nothing declared it, so on the R001.1 install of 2026-08-22 that library was absent and every consumer of the sparse linear-algebra library, the inference engine included, failed at the dynamic linker. r1: prior release.
description: ROCm sparse linear algebra library (BLAS for sparse matrices on GPU)
license: MIT
homepage: https://github.com/ROCm/rocm-libraries
tier: compute
build_style: custom
install_func: do_install

# SAME rocm-libraries tarball (shared-source pin); builds
# projects/rocsparse from the monorepo. BUILD_WITH_ROCBLAS keeps its
# upstream default ON (pinned CMakeLists:89 — dense-block routines reuse
# the installed rocblas), so rocblas is a real build+runtime edge.
source:
  - url: https://github.com/ROCm/rocm-libraries/archive/refs/tags/rocm-${version}.tar.gz
    filename: rocm-rocm-libraries-${version}.tar.gz
    sha256: 50a4090b4ad18b34c375f666e5f71816cf55f89bc2175dc3eba9a7b80f65a15d

gpu_targets: "gfx1100;gfx1102;gfx1201"

dependencies:
  build:
  - cmake
  - ninja
  - rocm-cmake
  - rocm-hip
  - rocprim
  - rocblas
  # The marker/annotation library this one links against.
  - roctracer
  host: []
  runtime:
  - rocm-hip
  - rocblas
  # librocsparse.so records libroctx64.so.4 in DT_NEEDED, and roctracer is
  # the package that ships it.
  - roctracer
verify_paths:
  - /opt/rocm/lib/librocsparse.so
  - /opt/rocm/lib/cmake/rocsparse
