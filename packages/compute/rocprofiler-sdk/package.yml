name: rocprofiler-sdk
version: "7.2.4"
release: 1
content_hash: e3a73e367ef7f81c
description: ROCm profiling SDK + rocprofv3 CLI (GPU kernel/counter profiling — the tuning surface for our own inference)
license: MIT
homepage: https://github.com/ROCm/rocm-systems
tier: compute
build_style: custom
install_func: do_install

# SAME rocm-systems tarball (shared-source pin); builds
# projects/rocprofiler-sdk from the monorepo. Links libelf (core
# elfutils) + libdw (elfutils-libdw — core elfutils is LFS-exact and
# ships libelf ONLY) for unwinding/symbolization; collects
# counters through the aqlprofile library at runtime. rocDecode/rocJPEG
# probes are optional media-tracing hooks — absent by design (no such
# packages in the tree; named residual, not silent).
#
# HERMETICITY: the tag archive drops the external/ submodule gitlinks and
# configure would git-fetch them. The 8 vendored submodules below are
# commit-addressed archives at the exact gitlink shas recorded on the
# rocm-7.2.4 tag (recovered via the GitHub contents API — tag archives
# omit gitlink hashes). Each is extracted into external/<name>/ in
# configure(); the checkout helper (cmake/rocprofiler_utilities.cmake)
# returns early when <dir>/<TEST_FILE> exists, so no git runs. Single-
# witness pins (GitHub archive + our sha256; no distro ships these exact
# commit archives to witness bytes — same caveat class as the 7.2.4 tag
# pins). glog/pybind11/ghc-filesystem submodules are NOT staged: their
# ROCPROFILER_BUILD_* options are flipped OFF and the system
# packages (glog, pybind11; std::filesystem for GHC_FS) satisfy the
# else-branch find_package(... REQUIRED). sqlite3 gate is OFF-default
# (system SQLite3). otf2 is real in-tree content (external/otf2/
# CMakeLists.txt) but that CMakeLists FetchContent-DOWNLOADS the otf2
# source tarball at configure time — a URL fetch, not a gitlink, so the
# submodule sweep missed it. The tarball is declared below (sha256 =
# upstream's own OTF2_URL_HASH pin — dual-witnessed) and staged via
# FETCHCONTENT_SOURCE_DIR_OTF2-SOURCE in configure(); no network runs.
# fmt IS vendored, at the tag's own gitlink pin (0bffed89, fmt 10.1
# era): ~10 source files call fmt::join with only fmt/format.h — legal
# there, moved to fmt/ranges.h in fmt 11+, so system fmt breaks the
# compile. The tag was only ever CI-built against the vendored pin;
# upstream develop fixed the includes but migrated deps wholesale (not
# backportable to this tag). Vendored fmt is internal/static — the
# package neither builds against nor runtime-needs system fmt. GCC-15
# missing-<cstdint> defects in the pinned vendored trees are carried as
# tracked patches (yaml-cpp emitterutils, elfio elf_types).
