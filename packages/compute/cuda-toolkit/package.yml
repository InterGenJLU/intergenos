name: cuda-toolkit
version: "13.3.1"
release: 6  # r6: the helper writes this package's release into the footprint manifest it leaves for the package manager (a release stamp after the library's commit, atomic). The package manager fills a missing release with 1 when it merges the manifest into the package record; measured on a fresh R001.2 install 2026-09-03, the toolkit installed at release 5 was recorded at release 1, `pkm list upgradable` offered a same-version upgrade forever, and taking it deleted the toolkit. Stamping the release in the helper closes that on every package-manager release, including the one on the installed image. The build refuses a helper whose release differs from package.yml. tests/pkm/test_cuda_helper_records_its_release.py runs the real helper library and the stamp against a scratch manifest.  # r5: the helper declares IGOS_HELPER_ELF_CLASS=mixed before recording the toolkit's files. Measured on the pinned 13.3.1 runfile laid into /opt/cuda on the reference laptop (2026-09-02): 11 of its 506 ELF objects are 32-bit (compute-sanitizer/x86, target/linux-desktop-glibc_2_11_3-x86), and the recorder's default 64-bit contract refused the first of them, aborting the record with 8,973 files on disk and none tracked. NVIDIA ships both widths on purpose; the manifest now records that. tests/pkm/test_cuda_helper_declares_mixed_widths.py runs the real helper library both ways.  # r4: the license answer is read from the terminal the person is at (/dev/tty) whenever standard input is not a terminal, and when there is no terminal at all the helper says so, prints the command to run, and exits 4 (a failure, not a declined license). Under the package manager standard input is the package manager's; reading it took the answer from a pipe, or read end-of-file as a refusal, and neither is a person reading NVIDIA's terms. tests/pkm/test_cuda_helper_asks_the_terminal.py runs the real script to that decision.  # r3: install output rewritten for the person at the terminal: lines that named internal machinery, internal decision codes or this project's own design rationale are replaced with plain statements of what happened and what to do about it, or removed where there was nothing to act on. Printed text only — no rule, path, flag, threshold, verification step or code path changed. tests/preflight/test_package_output_is_for_users.py holds the line. r2: pre-landing correction, before r1 ever reached a mirror. The install helper's header and its pre-download banner said NVIDIA's runfile is "extracted, never executed". The runfile is a self-extracting shell archive, so unpacking it does run its outer wrapper — in extract-only mode, after the sha256 check. What is never run is NVIDIA's installer inside it. A reader who took the old wording at face value and then read the script would have found it contradicted, which is the kind of small untruth that costs more than it saves. The acceptance-record paragraph in the shipped document also now says that the record names its version, so a later toolkit version asks for consent again. No behaviour change: the same flags, the same hash gate, the same footprint. r1: introduction — the download helper for the NVIDIA CUDA toolkit.
content_hash: 7f86c328501a48b1
description: Helper to download and install the NVIDIA CUDA toolkit into /opt/cuda
license: GPL-3.0-or-later
payload_license: LicenseRef-NVIDIA-CUDA-EULA
homepage: https://developer.nvidia.com/cuda-toolkit
tier: compute
build_style: custom
install_func: do_install
# No upstream source. This package's ARCHIVE contains only first-party
# InterGenOS content: the install helper and its documentation. Not one byte
# of NVIDIA's toolkit is built into it, published to the mirror, or bundled
# into a source archive.
#
# WHY A HELPER AND NOT A NORMAL PACKAGE. `nvcc` is not redistributable under
# NVIDIA's CUDA EULA (only a listed subset — the runtime libraries — carries
# redistribution rights, and then only when bundled with an application).
# A mirror package carrying the toolkit would be redistribution. The project
# already has the pattern for proprietary payloads it may not carry: the
# download helper (chrome, vscode, claude-code). pkm routes any package whose
# .PKGINFO declares `payload_license` through the consent pause and then runs
# /usr/bin/igos-install-<name>, which fetches the vendor's own bytes on the
# user's own machine and records every deposited file in a footprint manifest
# so `pkm files/verify/remove` see the real install.
#
# Decided 2026-08-04: where a vendor's terms do not clearly permit
# redistribution, the answer is the download-helper pattern, never a narrower
# reading of the terms. The helper's fetch is sha256-pinned, so the bytes are
# as strongly identified as any tarball the build stages.
source: []
dependencies:
  build: []
  host: []
  runtime:
  # The helper sources /usr/share/igos/helpers/helper-lib.sh for footprint
  # recording; it must be installed before the helper runs.
  - intergenos-helper-lib
  - wget          # the download (same fetcher the other helpers use)
  - coreutils     # sha256sum — the pin check that gates everything after it
  - rsync         # component-tree merge into /opt/cuda (preserves symlinks)
  - pciutils      # lspci — the "is there an NVIDIA GPU here" advisory
  # The toolkit is useless without a driver, and the driver is what provides
  # libcuda.so.1 (the CUDA driver API) that everything CUDA links. This is a
  # true runtime edge, and nvidia's own requires_pci_vendor gate keeps it off
  # non-NVIDIA hardware in Forge's install-set selection.
  - nvidia
verify_paths:
  - /usr/bin/igos-install-cuda-toolkit
  - /usr/share/doc/cuda-toolkit/CUDA-TOOLKIT.md
