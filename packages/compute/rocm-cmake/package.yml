name: rocm-cmake
version: "7.2.4"
release: 1
description: ROCm CMake build tools (ROCmCMakeBuildTools modules)
license: MIT
homepage: https://github.com/ROCm/rocm-cmake
tier: compute
build_style: custom
install_func: do_install

# GitHub archive of the rocm-7.2.4 tag (single-witness: the archive
# endpoint — same provenance class as the ROCm monorepo pins).
source:
  - url: https://github.com/ROCm/rocm-cmake/archive/refs/tags/rocm-${version}.tar.gz
    filename: rocm-cmake-${version}.tar.gz
    sha256: e7a28cb4baf8afbc21204d37e132dae7e12b2d980a2600948fe35cc4d8ac8087

dependencies:
  build:
  - cmake
  host: []
  runtime: []
verify_paths:
  - /opt/rocm/share/rocmcmakebuildtools/cmake/ROCMSetupVersion.cmake
  - /opt/rocm/share/rocmcmakebuildtools/cmake/ROCmCMakeBuildToolsConfig.cmake
