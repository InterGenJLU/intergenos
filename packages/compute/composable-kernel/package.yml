name: composable-kernel
version: "7.2.4"
release: 2  # r2: parallelization detection — jobs cap derived from MemAvailable (4 GB/job), fixed -j8 becomes the no-meminfo fallback
description: Composable Kernel — performance-portable GPU operator templates + device operation libraries (MIOpen backend)
license: MIT
homepage: https://github.com/ROCm/rocm-libraries
tier: compute
build_style: custom
install_func: do_install

# SAME rocm-libraries tarball (shared-source pin); builds
# projects/composablekernel from the monorepo (cmake package name:
# composable_kernel). FULL library build — MIOPEN_REQ_LIBS_ONLY stays
# OFF per the v1 full-platform ruling (the device_*_operations set is
# the direct-HIP-developer surface, not just MIOpen's subset). Heaviest
# class-F compile: device instances for the three declared targets.
# Requires OpenMP (rocm-llvm's libomp, landed with the compute pass) and
# Python3 at build.
source:
  - url: https://github.com/ROCm/rocm-libraries/archive/refs/tags/rocm-${version}.tar.gz
    filename: rocm-rocm-libraries-${version}.tar.gz
    sha256: 50a4090b4ad18b34c375f666e5f71816cf55f89bc2175dc3eba9a7b80f65a15d

gpu_targets: "gfx1100;gfx1102;gfx1201"

dependencies:
  build:
  - cmake
  - ninja
  - rocm-cmake
  - rocm-hip
  - rocm-llvm
  - python
  host: []
  runtime:
  - rocm-hip
verify_paths:
  - /opt/rocm/lib/cmake/composable_kernel
  - /opt/rocm/include/ck
