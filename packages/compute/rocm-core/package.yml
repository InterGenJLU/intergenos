name: rocm-core
version: "7.2.4"
release: 2  # r2: the toolkit's own programs answer by name. /opt/rocm/bin holds about 450 programs and is on no default PATH, so rocm-smi, amd-smi, rocgdb, rocprofv3 and hipify-perl all returned "command not found" on a machine that had just installed 10.1 GiB of ROCm to get them (measured 2026-09-20 on an installed R001.2 machine). This package owns the /opt/rocm layout, so it ships /etc/profile.d/rocm.sh, which APPENDS /opt/rocm/bin to PATH — appends, because llama-bench, llama-cli and llama-server exist under both /opt/rocm/bin and /usr/bin and prepending would silently change which inference engine a person gets by typing llama-cli. The four /usr/bin symlinks shipped by rocm-hip and rocminfo are unchanged and still serve every non-login process. Bumped BY HAND: this recipe pins an upstream tarball and ships no first-party sibling files, so bump-changed-releases.py does not enumerate it.
description: ROCm platform base metadata (version header, .info/version, librocm-core path helper)
license: MIT
homepage: https://github.com/ROCm/rocm-core
tier: compute
build_style: custom
install_func: do_install

# The ROCm platform's base metadata component. AMD's binary distribution
# ships it as the package every ROCm component depends on; consumers
# read its artifacts directly — rccl compiles against
# <rocm-core/rocm_version.h> (hip_rocm_version_info.h:42) and its
# configure auto-detect reads /opt/rocm/.info/version. Shipping the real
# upstream component closes the whole artifact class instead of patching
# consumers one at a time (a from-source ROCm platform still owes the
# platform contract AMD's packages establish). sha256 pinned 2026-07-17
# (single-witness GitHub tag-archive endpoint, same caveat class as the
# other 7.2.4 pins; content-swept: small CXX lib + generated headers, no
# network reach at build).
source:
  - url: https://github.com/ROCm/rocm-core/archive/refs/tags/rocm-${version}.tar.gz
    filename: rocm-core-rocm-${version}.tar.gz
    sha256: 32dab2f00e22fb5462beffae03cc642403925d22a42662e15ac0f68d8e885dea

dependencies:
  build:
    - cmake
    - ninja
  host: []
  runtime: []
verify_paths:
  - /opt/rocm/include/rocm-core/rocm_version.h
  - /opt/rocm/.info/version
  # the PATH drop-in: without it the toolkit's ~450 programs answer only by full path
  - /etc/profile.d/rocm.sh
