name: rocwmma
version: "7.2.4"
release: 3  # r3: the declared GPU architecture list narrows from the six ruled targets to FIVE — gfx1030 is removed. This build therefore emits kernels for five architectures instead of six, so the release moves with the bytes. rocWMMA wraps the wave matrix multiply-accumulate instruction, which arrived with RDNA3; RDNA2 does not have it, so this header library's own supported-architecture list (README in https://github.com/ROCm/rocm-libraries) starts at gfx11 on the consumer side and there is no gfx1030 code path upstream to build. The HIP engine's declaration is unaffected and stays at six: the engine compiles for all six targets with -DGGML_HIP_ROCWMMA_FATTN=ON — measured 2026-09-18, the six-target build's own device-code gate read "llama-server carries: gfx1030 gfx1100 gfx1101 gfx1102 gfx1200 gfx1201". THIS BUMP WAS WRITTEN BY HAND: measured 2026-09-18, the release-bump machine does not see a gpu_targets change at all, because the field is not in content_hash.py's _BUILD_AFFECTING_YML_KEYS fold — the gap cut separately as the bump-machine work. The stated exception is held against the tree by tests/igos_build/test_the_rocm_stack_declares_one_target_list.py, which refuses both an unstated omission and an exception nobody's recipe carries. # r2: the declared GPU architecture list widens from three targets to the six ruled on 2026-09-18 — gfx1030, gfx1100, gfx1101, gfx1102, gfx1200 and gfx1201, the five consumer and workstation architectures AMD's ROCm 7.2.0 compatibility matrix names plus gfx1102 (Navi 33), which this project declares deliberately. This build therefore emits kernels for six architectures instead of three, so the release moves with the bytes. Of the six, three are proven on hardware in this project's set — gfx1201 on the workstation card, gfx1100 and gfx1102 on the reference pair — and three are gate-proven only: gfx1030, gfx1101 and gfx1200, which no machine here carries. The rationale for the list is written once, in packages/compute/llama-cpp-hip/package.yml. This bump was written by hand: measured 2026-09-18, the release-bump machine does not see a gpu_targets change at all, because the field is not in content_hash.py's _BUILD_AFFECTING_YML_KEYS fold.
description: Wave Matrix Multiply-Accumulate C++ headers (flash-attention build dep)
license: MIT
homepage: https://github.com/ROCm/rocm-libraries
tier: compute
build_style: custom
install_func: do_install

# SAME rocm-libraries tarball (shared-source pin); builds
# projects/rocwmma from the monorepo (the standalone rocWMMA repo is the
# legacy location — one pin serves the whole library set).
source:
  - url: https://github.com/ROCm/rocm-libraries/archive/refs/tags/rocm-${version}.tar.gz
    filename: rocm-rocm-libraries-${version}.tar.gz
    sha256: 50a4090b4ad18b34c375f666e5f71816cf55f89bc2175dc3eba9a7b80f65a15d

# THE RULED LIST, LESS ONE STATED EXCEPTION. The ruled list (Decided
# 2026-09-18) is six concrete architectures: the five consumer and workstation
# targets AMD's ROCm 7.2.0 compatibility matrix names, plus gfx1102 (Navi 33),
# which this project declares deliberately. The reasoning — the age limit, why
# gfx1102 is in, and why the math libraries rather than the compiler are what
# bounds the list — is written once, in
# packages/compute/llama-cpp-hip/package.yml. It is COPIED here rather than
# referenced because a recipe field in this format has no cross-recipe constant
# to point at; tests/igos_build/test_the_rocm_stack_declares_one_target_list.py
# is what keeps the copies identical, holds this recipe to the ruled list less
# its STATED exception, and sweeps in any new recipe that declares gfx targets.
#
# THIS RECIPE DECLARES FIVE: the ruled list WITHOUT gfx1030. rocWMMA is a
# wave matrix multiply-accumulate header library, and the instruction it wraps
# is WMMA, which arrived with RDNA3. RDNA2 does not have it, so rocWMMA's own
# supported-architecture list (README in
# https://github.com/ROCm/rocm-libraries) starts at gfx11 on the consumer side
# — there is no gfx1030 code path upstream to build.
#
# WHAT THIS COSTS A gfx1030 USER: nothing measured. The HIP engine's optional
# rocWMMA flash-attention path is a COMPILE-time option, and the engine
# compiles for all six targets with -DGGML_HIP_ROCWMMA_FATTN=ON — measured
# 2026-09-18, the six-target build's own device-code gate read "llama-server
# carries: gfx1030 gfx1100 gfx1101 gfx1102 gfx1200 gfx1201". The engine's
# declaration therefore stays at six; only this header package's own list
# narrows.
#
# Widening the list is never a one-recipe change: rocBLAS and hipBLASLt build
# their kernels first, the engine builds last.
gpu_targets: "gfx1100;gfx1101;gfx1102;gfx1200;gfx1201"

dependencies:
  build:
  - cmake
  - ninja
  - rocm-cmake
  - rocm-hip
  host: []
  runtime: []
verify_paths:
  - /opt/rocm/include/rocwmma/rocwmma.hpp
