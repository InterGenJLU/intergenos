name: rocprim
version: "7.2.4"
release: 1
description: ROCm parallel primitives C++ header library (build-dep of the math library set)
license: MIT
homepage: https://github.com/ROCm/rocm-libraries
tier: compute
build_style: custom
install_func: do_install

# SAME rocm-libraries tarball (shared-source pin); builds
# projects/rocprim from the monorepo. Header-only foundation of the
# math-library classes: hipcub/rocthrust wrap it, rocsparse/rocsolver
# consume it directly (find_package(rocprim REQUIRED) in each pinned
# CMakeLists).
source:
  - url: https://github.com/ROCm/rocm-libraries/archive/refs/tags/rocm-${version}.tar.gz
    filename: rocm-rocm-libraries-${version}.tar.gz
    sha256: 50a4090b4ad18b34c375f666e5f71816cf55f89bc2175dc3eba9a7b80f65a15d

gpu_targets: "gfx1100;gfx1102;gfx1201"

dependencies:
  build:
  - cmake
  - ninja
  - rocm-cmake
  - rocm-hip
  host: []
  runtime: []
verify_paths:
  - /opt/rocm/include/rocprim/rocprim.hpp
  - /opt/rocm/lib/cmake/rocprim
