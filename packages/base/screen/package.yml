name: screen
version: "5.0.1"
release: 4  # r4: the terminal multiplexer ships unprivileged. Upstream's install rule sets mode 4755 on the versioned binary; do_install now clears it and halts if it is still set. The setuid bit bought two things here and neither is still needed: this build has no utmp support (upstream's --enable-utmp defaults to no, this recipe never passed it, and the shipped binary references no utmp API symbol), and the global socket directory /run/screen, which required privilege to create and to use, is no longer configured — sockets live in each user's own $HOME/.screen, upstream's default. Detach, reattach and multiple sessions per user were exercised unprivileged before the change; sharing one session between two different accounts required the setuid binary and goes with it. The declared privileged-program inventory loses its entry in the same commit.  # r3: runtime deps renamed to shipped namespace (F25 gate wave 2026-07-21)
description: GNU Screen terminal multiplexer
license: GPL-3.0-or-later
homepage: https://www.gnu.org/software/screen/
tier: base
build_style: custom
install_func: do_install

source:
  - url: https://ftpmirror.gnu.org/screen/screen-${version}.tar.gz
    sha256: 2dae36f4db379ffcd14b691596ba6ec18ac3a9e22bc47ac239789ab58409869d

dependencies:
  build:
    - linux-pam
  host: []
  runtime:
    - linux-pam
    - ncurses
verify_paths:
  - /usr/bin/screen
  - /usr/bin/screen-5.0.1
  - /usr/share/screen
