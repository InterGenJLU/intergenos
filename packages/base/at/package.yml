name: at
version: "3.2.5"
release: 6  # r6: post_install no longer enables atd. That enable was reverted by the install-time systemctl preset-all on every fresh install but survived on any machine where this package was later reinstalled or upgraded, because nothing re-runs that pass after a package operation — so two systems from the same medium held different defaults. The default is now written in the preset files only, and is off, which is what a fresh install already shipped. The spool .SEQ line became an if-block in the same change: with the enable removed it was the last statement in the hook, and under set -e a test-and-chain whose test is false returns non-zero, which was measured failing the hook on a system with no .SEQ file yet. The ownership and mode repair above it is unchanged.  # r5: post_install creates-or-corrects the spool (install -d -m1770 -o atd -g atd /var/spool/atjobs + /var/spool/atspool, .SEQ chown when present) — the sealed archive ships no spool paths and archive deployment strips uid/gid, so the spool landed root:root on installed systems (measured on the ge9b-12 installed system) and atd could not write its own spool. r4 (hook-contract wave): pam.d/atd moved post_install -> do_install (owned payload)
content_hash: 2660f6250d2432f6
description: Job scheduling commands (at, batch, atq, atrm)
license: GPL-2.0-or-later
tier: base
# Decided 2026-09-16: this package is published to the mirror but is not part of
# the shipped install set. Two job schedulers were shipping side by side, each
# with its own privileged programs, for one function. The tree's own usage
# settles which one stays: the shipped backup tool declares the other scheduler
# as the system's crontab provider and looks for its command at startup, while
# nothing outside this package's own files calls `at`, `atd`, `atq` or `batch`.
# Narrowing this package's privilege instead is not available: the daemon must
# run submitted jobs as other users and the submission program must write the
# spool as the invoking user, so stripping the bits would ship a package that is
# present and broken — the failure class this project refuses.
#
# tier and iso_include are independent axes (docs/package-tiers.md): the tier
# still states what this package IS, an end-user command-line utility, and
# iso_include states how it is delivered — from the mirror, on request, rather
# than on every machine. A user who wants it installs it in one command and
# gets the same archive; the shipped set loses two setuid programs it had no
# caller for. The declared privileged-program inventory loses both entries in
# the same commit, so a build that ships them again fails the seal instead of
# matching a stale declaration.
iso_include: false
build_style: custom
install_func: do_install

source:
  - url: https://anduin.linuxfromscratch.org/BLFS/at/at_${version}.orig.tar.gz
    sha256: bb066b389d7c9bb9d84a35738032b85c30cba7d949f758192adc72c9477fd3b8

dependencies:
  build:
    - exim
    - linux-pam
  host: []
  runtime:
    - exim

tests:
  enabled: true
  failure_policy: known_failures
  reason: "tests need a running atd daemon, sendmail delivery, and PAM stack — none available in offline build chroot"
verify_paths:
  - /etc/pam.d/atd
  - /usr/bin/at
  - /usr/sbin/atd
  - /usr/lib/systemd/system/atd.service
