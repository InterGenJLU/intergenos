name: fcron
version: "3.4.0"
release: 12  # r12: ships /etc/cron.README. The four /etc/cron.{hourly,daily,weekly,monthly} directories this package installs are read by fcron, and fcron.service ships disabled with no socket and no D-Bus activation — so a script dropped into any of them never runs and nothing on the machine said so. The README states that, names the unit, gives the one command that changes it, states each directory's schedule for after it is on, and points at the preset file where the ship-disabled decision is recorded with its reasoning. The decision itself is unchanged and is not this package's to make. Payload only; mode 644, shipped through the package's files/ overlay, and listed in verify_paths.  # r11: the recipe corrects the three independent conditions that prevented an ordinary user from running fcrontab: authorization-file ownership, PAM file placement, and the setuid program's owner. The corrected shape was exercised after manual application to an existing system; a freshly built package and image were not proved in this change.  # r10: post_install no longer enables fcron, for the same reason and with the same measured history as at: reverted at install, surviving on any machine that later upgraded the package. The default is now written in the preset files only, and is off, which is what a fresh install already shipped. The binary ownership, setuid and setgid repair and the spool ownership work are unchanged.  # r9: fcronsighup's group and setuid mode are restored on an installed system. The archive carries root:fcron 4710, but unpacking happens before the fcron group exists, so the group ownership was lost and the setuid bit went with it; the existing hook correction is extended to this binary.  # r8: ships /usr/bin/crontab as a symlink to fcrontab — fcron is the only periodic scheduler here and applications look for the standard command name (timeshift checks for it at startup and refuses to run when it is missing); the BLFS-recommended compatibility link, same binary and same permissions. r7: spool ownership restored on the live system — archive deployment strips uid/gid, so /var/spool/fcron landed root:root 755 (measured on the ge9b-12 installed system) and fcrontab's setgid-fcron grant could not write user tabs; post_install now asserts fcron:fcron 770 and do_install stages the same 770 so archive metadata and on-disk state agree. r6 (hook-contract wave): run-parts + cron.* dirs + systab.orig moved post_install -> do_install (owned payload)
content_hash: e663614517844f19
description: Periodical command scheduler
license: GPL-2.0-or-later
homepage: http://fcron.free.fr/
tier: base
build_style: custom
install_func: do_install

source:
  - url: http://fcron.free.fr/archives/fcron-${version}.src.tar.gz
    sha256: f4e7fc553cdd70ff4b3b6ac9138b3b7cffab9198b8c266d97af0a87506e0e1b5

dependencies:
  build:
  - linux-pam
  - vim
  host: []
  runtime:
  - linux-pam
verify_paths:
  - /usr/bin/run-parts
  - /usr/bin/crontab
  - /usr/bin/fcronsighup
  - /var/spool/fcron/systab.orig
  - /etc/cron.daily
  - /usr/sbin/fcron
  - /usr/bin/fcrondyn
  - /usr/share/doc/fcron-3.4.0
  - /etc/pam.d/fcron
  - /etc/pam.d/fcrontab
  - /etc/fcron.allow
  - /etc/fcron.deny
  - /etc/cron.README
