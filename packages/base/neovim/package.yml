name: neovim
version: "0.12.3"
release: 1
description: Hyperextensible Vim-based text editor
license: Apache-2.0
homepage: https://neovim.io/
tier: base
build_style: custom
# Bundled-deps build (upstream USE_BUNDLED=ON default). Neovim's two-stage
# CMake build (cmake.deps/ then the main tree) statically links its own pinned
# dependency set. Rather than packaging the 8+ libraries Neovim wants at
# upstream-pinned versions (libuv 1.52.1, luajit @fbb36bb, luv, lpeg,
# unibilium, utf8proc, tree-sitter 0.26.7 + 6 grammar parsers — only libuj/
# luajit/lua exist in the tree, and at different versions than Neovim pins),
# we stage those exact tarballs and let cmake.deps build them. On Linux,
# gettext/libiconv are NOT bundled (USE_BUNDLED_GETTEXT/LIBICONV=OFF) so the
# system gettext (core tier) is used; wasmtime is OFF (ENABLE_WASMTIME=OFF).
#
# Each bundled tarball is staged into ${IGOS_SOURCES} under a distinct
# `filename:` and copied by build.sh into the matching DEPS_DOWNLOAD_DIR/<dir>/
# subdir under the exact upstream basename, so CMake ExternalProject's URL_HASH
# verification matches the pre-staged file and never hits the network (the
# offline-build discipline). Versions/sha256 are lifted verbatim from
# cmake.deps/deps.txt of the pinned 0.12.3 source.
source:
  - url: https://github.com/neovim/neovim/archive/v${version}/neovim-${version}.tar.gz
    sha256: 36a6c66bfbba5d96fa512110aecddb981148a4d013b5ecd01a42877c49855a41

