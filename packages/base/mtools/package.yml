name: mtools
version: "4.0.49"
release: 1
description: Utilities to access MS-DOS FAT filesystems without mounting them
license: GPL-3.0-or-later
homepage: https://www.gnu.org/software/mtools/
tier: base
build_style: autotools

source:
  - url: https://ftp.gnu.org/gnu/mtools/mtools-${version}.tar.gz
    sha256: 10cd1111da87bf2400a380c1639a6cba8bfb937a24f9c51f5f88d393ae5f6f76

dependencies:
  build: []
  host: []
  runtime: []

configure_flags:
  - "--prefix=/usr"

verify_paths:
  - /usr/bin/mcopy
  - /usr/bin/mmd
  - /usr/bin/mformat
