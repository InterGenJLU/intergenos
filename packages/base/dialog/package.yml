name: dialog
version: "1.3-20260107"
release: 2  # r2: runtime deps renamed to shipped namespace (F25 gate wave 2026-07-21)
description: Display dialog boxes from shell scripts (libdialog + dialog binary)
license: LGPL-2.1-or-later
homepage: https://invisible-island.net/dialog/
tier: base
build_style: custom
install_func: do_install
# T0-3 sub-cluster 1 — installer TUI runtime dep. installer/frontend/tui.py:64
# probes for `dialog` or `whiptail`; we standardize on dialog (richer widget set
# and the only one with libdialog shared lib for embedding). Configure flags
# mirror Debian's cdialog package (dialog upstream maintainer = Thomas Dickey =
# original Debian packager, so the flag set is canonical).
#
# 2026-05-22 evening CST: tier promoted core→base per BASE_CLI canonical-rule
# in validate-package-tiers.py. dialog is a CLI utility (libdialog + dialog
# binary), not a foundational system library; tier:base is correct per
# Rule 1 (tier reflects what the package IS).
source:
- url: https://invisible-island.net/archives/dialog/dialog-${version}.tgz
  sha256: 78b3dd18d95e50f0be8f9b9c1e7cffe28c9bf1cdf20d5b3ef17279c4da35c5b5
dependencies:
  build:
    - ncurses-core      # ncursesw — wide-char ncurses for UTF-8 TUI
  host: []
  runtime:
    - ncurses
verify_paths:
  # Upstream dialog installs only the versioned shared library
  # (libdialog.so.15.0.0); no unversioned `.so` symlink. Verify the
  # versioned file directly — it's what dialog(1) loads at runtime.
  # If we ever want to link other packages against -ldialog, we'd add
  # a do_install ln -sf to create the dev-facing symlink and could
  # then verify .so here. Surfaced 2026-05-24 by pre-squashfs-audit.
  - /usr/bin/dialog
  - /usr/lib/libdialog.so.15.0.0
  - /usr/include/dialog.h
